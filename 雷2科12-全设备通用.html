<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{max-width:1060px;margin:20px auto;padding:0 16px;background:#f6f8fa;font-size:16px;}
.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 1px 5px #0002;}
.q-title{font-size:17px;font-weight:bold;margin-bottom:16px;line-height:1.6;}
.opt{margin:9px 0;padding:7px;border-radius:5px;cursor:pointer;}
.opt:hover{background:#f2f6fa;}
.opt input{margin-right:7px;transform:scale(1.1);}
.ans-wrap{margin-top:18px;padding:12px;background:#eaf4ff;border-radius:8px;display:none;}
.ans-txt{margin-top:6px;line-height:1.6;color:#222;}
.btns{margin:15px 0;display:flex;gap:8px;flex-wrap:wrap;}
button{padding:8px 14px;border:none;border-radius:7px;background:#2772dd;color:#fff;font-size:15px;cursor:pointer;}
button:active{background:#1f62bd;}
.info{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;color:#333;align-items:center;}
input[type="number"]{padding:7px;width:70px;font-size:15px;border:1px solid #aaa;border-radius:5px;}

.opt{display:block;padding:13px;border:1px solid #dfe5ed;line-height:1.6;}
.opt.selected{border-color:#2772dd;background:#edf4ff;}
.opt.correct{border-color:#219653;background:#eaf8ef;}
.opt.incorrect{border-color:#d64545;background:#fff0f0;}
button:disabled{opacity:.45;cursor:default;}
button.secondary{background:#5b677a;}
.hint{color:#596579;font-size:14px;line-height:1.7;}
#result{font-weight:bold;margin-bottom:8px;}
#storageStatus{margin-top:14px;}

/* iPhone / Android tablet adaptive layout */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;}
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{width:100%;max-width:1100px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:20px 18px;padding: max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));line-height:1.65;}

button{min-height:48px;padding:11px 16px;font-size:16px;line-height:1.4;touch-action:manipulation;}

.q-title{font-size:20px;line-height:1.85;overflow-wrap:anywhere;}

.hint{font-size:15px;overflow-wrap:anywhere;}
.btns{gap:10px;}
.main-actions{position:sticky;bottom:0;z-index:5;margin:20px 0 0;padding:12px 0;background:#fff;border-top:1px solid #dfe5ed;padding-bottom:max(12px,env(safe-area-inset-bottom));}

@media(hover:hover) and (pointer:fine){.opt:hover{box-shadow:0 0 0 1px #2772dd;}}

@media(max-width:599px){
 body{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));}

}

}

#analysisTxt{white-space:pre-wrap;}#figureBox img{display:block;max-width:100%;height:auto;margin:18px auto;border:1px solid #dde3ec;border-radius:6px;}

<body>
<div class="card">
    <h2>2026冲刺标准卷二 · 科一科二</h2><p class="hint">雷2 PDF题库完整版 · 判断40题 / 单选90题 / 多选35题 · 电脑、手机、平板通用</p>
    <p class="hint">计分规则：判断、单选每题 0.5 分，多选每题 1 分；错选、少选、多选均不得分。满分 100 分，未提交的多选题暂不计分。</p>
    <div class="info">
        <div><b>得分：<span id="score">0</span> / <span id="scoreMax">100</span> 分</b></div>
        <div>已判分：<span id="gradedCount">0</span> / <span id="gradableCount">165</span></div>
        <div>题号跳转：<input id="goto" type="number" min="1" max="165" step="1" inputmode="numeric" enterkeyhint="go" aria-label="跳转到原题号"><button onclick="goJump()">跳转</button></div>
        <div>当前：<span id="cur">1</span> / <span id="total">0</span></div>

    <div class="btns"><button id="allBtn" onclick="setMode('all')">全部题目</button><button id="wrongBtn" onclick="setMode('wrong')">刷错题（0）</button><button id="removeBtn" class="secondary" onclick="removeWrong()">移出错题本</button></div>
    <p class="hint" id="modeHint"></p><p class="hint" id="answerHint" aria-live="polite"></p>

<script>
// 科一科二：全国导游基础知识 + 地方导游基础知识 押题卷一 1‑165题
const questions = [{"no":1,"type":"judge","q":"根据《中华人民共和国宪法》的规定，人民法院和人民检察院依法独立行使审判权、检察权，不受宪法和法律的约束。","opt":["A.对","B.错"],"ans":"B","analysis":"法治原则还具体体现为人民法院和人民检察院依法独立行使审判权、检察权等制度安排。“依法”即依照宪法和法律，独立行使职权不等于不受宪法和法律的约束。","figures":[]},{"no":2,"type":"judge","q":"《旅游法》的立法目的是为保障旅游者和旅游经营者的合法权益，规范旅游市场秩序，规划和合理利用旅游资源，促进旅游业持续健康发展，制定本法。","opt":["A.对","B.错"],"ans":"B","analysis":"为保障旅游者和旅游经营者的合法权益，规范旅游市场秩序，保护和合理利用旅游资源，促进旅游业持续健康发展，制定本法。错在“规划和合理利用旅游资源”，故本题错误。","figures":[]},{"no":3,"type":"judge","q":"根据《民法典》规定，代理人需要转委托第三人代理的，不需要取得被代理人的同意或者追认。","opt":["A.对","B.错"],"ans":"B","analysis":"《民法典》第169条，代理人需要转委托第三人代理的，应当取得被代理人的同意或者追认。","figures":[]},{"no":4,"type":"judge","q":"《旅行社条例》规定，旅行社违反合同约定，中止对旅游者提供旅游服务的，应当负担旅游者在被中止旅游服务期间所订的同等级别的住宿、用餐、交通等必要费用，并向旅游者支付因此造成的直接经济损失30%的违约金。","opt":["A.对","B.错"],"ans":"B","analysis":"旅行社违反合同约定，中止对旅游者提供住宿、用餐、交通等旅游服务的，应当负担旅游者在被中止旅游服务期间所订的同等级别的住宿、用餐、交通等必要费用，并向旅游者支付旅游费用总额30%的违约金。错在“直接经济损失30%”，故本题说法错误。","figures":[]},{"no":5,"type":"judge","q":"《导游管理办法》规定，导游服务星级根据星级评价指标通过全国旅游监管服务信息系统自动生成，并根据导游执业情况每年更新一次。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。《导游管理办法》第30条规定，导游服务星级评价是对导游服务水平的综合评价，星级评价指标由技能水平、学习培训经历、从业年限、奖惩情况、执业经历和社会评价等构成。导游服务星级根据星级评价指标通过全国旅游监管服务信息系统自动生成，并根据导游执业情况每年度更新1次。","figures":[]},{"no":6,"type":"judge","q":"尚未完全丧失辨认或者控制能力的精神病人、智力残疾人违反治安管理的，应当给予处罚，但是可以从轻或者减轻处罚。","opt":["A.对","B.错"],"ans":"A","analysis":"依据第13条，不能辨认或者不能控制自己行为时违反治安管理的不予处罚，责令监护人加强看护管理和治疗；尚未完全丧失辨认或者控制能力的精神病人、智力残疾人违反治安管理的，应当给予处罚，但是可以从轻或者减轻处罚。题干表述与法条一致。","figures":[]},{"no":7,"type":"judge","q":"根据《旅游投诉处理办法》第6条的规定，对由下级旅游投诉处理机构管辖的投诉，上级旅游投诉处理机构认为必要时，可以直接处理或者指定其他下级旅游投诉处理机构管辖。","opt":["A.对","B.错"],"ans":"A","analysis":"《旅游投诉处理办法》第6条规定：“对由下级旅游投诉处理机构管辖的投诉，上级旅游投诉处理机构认为必要时，可以直接处理或者指定其他下级旅游投诉处理机构管辖。”","figures":[]},{"no":8,"type":"judge","q":"《旅游安全管理办法》规定，根据旅游突发事件的性质、危害程度、可控性以及造成或者可能造成的影响，旅游突发事件一般分为重大、较大、一般和轻微四级。","opt":["A.对","B.错"],"ans":"B","analysis":"根据旅游突发事件的性质、危害程度、可控性以及造成或者可能造成的影响，旅游突发事件一般分为特别重大、重大、较大和一般四级。","figures":[]},{"no":9,"type":"judge","q":"从业人员发现直接危及人身财产安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。","opt":["A.对","B.错"],"ans":"B","analysis":"从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。此处错误在“财产安全”。","figures":[]},{"no":10,"type":"judge","q":"根据《国内水路运输管理规定》规定，水路运输经营者不得出租、出借水路运输经营许可证件，或转让水路运输经营资格。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，题目中遗漏了“以其他形式非法”二字，导致表述不准确。《国内水路运输管理规定》第21条规定：“水路运输经营者不得出租、出借水路运输经营许可证件，或者以其他形式非法转让水路运输经营资格。”法规禁止的是“非法转让”，若通过合法程序（如企业并购、资质审批）进行的转让，则不在禁止之列。强调“非法”是为了区分正当商业行为与规避监管的挂靠、倒卖资质等违法行为。","figures":[]},{"no":11,"type":"judge","q":"根据《中华人民共和国民用航空法》的规定，任何旨在免除本法规定的承运人责任或者降低本法规定的赔偿责任限额的条款，均属无效；此种条款的无效，不影响整个航空运输合同的效力。","opt":["A.对","B.错"],"ans":"A","analysis":"第138条，任何旨在免除本法规定的承运人责任或者降低本法规定的赔偿责任限额的条款，均属无效；但是，此种条款的无效，不影响整个航空运输合同的效力。该表述与法条原文一致，故正确。","figures":[]},{"no":12,"type":"judge","q":"根据《风景名胜区条例》,国家级风景名胜区申请,由省级人民政府提出申请,经国务院组织论证并批准公布。","opt":["A.对","B.错"],"ans":"B","analysis":"《风景名胜区条例》第十条:设立国家级风景名胜区,由省、自治区、直辖市人民政府提出申请,国务院林业草原主管部门会同国务院自然资源、生态环境、住房城乡建设、文物等有关部门组织论证,提出审查意见,报国务院批准公布。国家级风景名胜区的设立必须经过国务院林业草原主管部门会同多部门组织论证、提出审查意见这一法定程序,不是国务院组织论证批准公布,故判断为错。","figures":[]},{"no":13,"type":"judge","q":"根据《自然保护区条例》规定,自然保护区划分为核心保护区和缓冲控制区,实行分区管控。","opt":["A.对","B.错"],"ans":"B","analysis":"《自然保护区条例》第十六条:自然保护区划分为核心保护区和一般控制区,实行分区管控。核心保护区以外的区域划为一般控制区。该表述中“缓冲控制区”错误，应该是“一般控制区”,故判断为错","figures":[]},{"no":14,"type":"judge","q":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。习近平新时代中国特色社会主义思想明确：中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。题干表述与教材一致，故","figures":[]},{"no":15,"type":"judge","q":"二十届四中全会的核心成果是审议通过“十五五”规划纲要。","opt":["A.对","B.错"],"ans":"B","analysis":"全会最重要的成果是审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。","figures":[]},{"no":16,"type":"judge","q":"中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和镰刀。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。错在“镰刀”，应为“齿轮”。《国徽法》第2条规定，中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和齿轮。","figures":[]},{"no":17,"type":"judge","q":"2026世界人工智能大会暨人工智能全球治理高级别会议即将举行之际，新一代模型KimiK3于7月16日发布，参数规模达2.8万亿。这是目前全球参数最大的开源模型，标志着我国人工智能模型发展迈出新的一步。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":18,"type":"judge","q":"2026年8月1日，《中华人民共和国民族团结进步促进法》正式施行。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“2026年7月1日”。2026年7月1日，《中华人民共和国民族团结进步促进法》正式施行，该法除序言外，设总则、构筑共有精神家园、促进交往交流交融、推动共同繁荣发展、保障与监督、法律责任、附则共7章，总计65条。民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律。这是30多年来中央政治局会议研究的第一部法律案；这是30多年来第一部设置序言的法律；首次将习近平总书记关于加强和改进民族工作的重要思想写入法律；首次从法理层面阐释铸牢中华民族共同体意识、推进中华民族共同体建设等核心概念；首次在法律中明确新时代党的民族工作格局。","figures":[]},{"no":19,"type":"judge","q":"2026国际电路与系统研讨会5月25日在上海举行，华为公司董事、半导体业务部总裁何庭波在题为《半导体新路径探索与实践》的主旨演讲中，正式发表“韬（τ）定律”。这是中国在全球半导体领域首次提出指导产业发展的新原则。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":20,"type":"judge","q":"9月23日，2026年中国农民丰收节全国主场活动在湖北省襄阳市枣阳市举办，活动以“丰收开新局实干促振兴”为主题。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":21,"type":"judge","q":"《中华人民共和国旅游法》的实施成为导游职业规范的重要标志，表明我国导游队伍的建设有了法律保障。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。《导游人员管理条例》的实施成为导游职业规范的重要标志，表明我国导游队伍的建设有了法律保障。","figures":[]},{"no":22,"type":"judge","q":"2016年7月1日，全国旅游监管服务平台全面启用，标志着我国旅游市场监管加快向信息化、智能化转变。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。2018年7月1日，全国旅游监管服务平台全面启用，标志着我国旅游市场监管加快向信息化、智能化转变","figures":[]},{"no":23,"type":"judge","q":"雷大大旅行社安排导游老王为团队旅游提供服务的，不得要求导游老王垫付或向导游老王收取任何费用（ ）。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。旅行社安排导游为团队旅游提供服务的，不得要求导游垫付或向导游收取任何费用；旅行社临时聘用导游为旅游者提供服务的，应当全额向导游支付规定的导游服务费用。","figures":[]},{"no":24,"type":"judge","q":"在大型娱乐场所，地陪要时刻提醒旅游者紧跟团队，密切关注旅游者的动向以及周围环境，提前了解出口位置，以便在意外情况发生时能够迅速带领旅游者撤离。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。在大型娱乐场所，地陪要时刻提醒旅游者紧跟团队，密切关注旅游者的动向以及周围环境，提前了解出口位置，以便在意外情况发生时能够迅速带领旅游者撤离。","figures":[]},{"no":25,"type":"judge","q":"如果在餐厅用餐菜品中有异物，地陪要向餐厅反映并立即换菜，并要求餐厅负责人出面赔礼道歉。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。针对旅游者在用餐中出现的问题和要求，如菜品中有异物（头发、虫子等），地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿。","figures":[]},{"no":26,"type":"judge","q":"在海外当地导游私自增加或减少旅游项目，领队老王首先应进行劝说；如劝说无效，可向接待社反映，必要时向国内组团社反映。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":27,"type":"judge","q":"当导游与游客观点不同时，只要不涉及大原则问题，导游不要立即反驳否定，要学会包容，求同存异。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":28,"type":"judge","q":"在规模较大或内容丰富的景区，导游一般采用突出重点法进行讲解。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。在规模较大或内容丰富的景区，导游可按一定脉络顺序分块讲解，采用分段讲解法。","figures":[]},{"no":29,"type":"judge","q":"为了保证乘机顺利，出发前一天，导游老王应通过微信、短信等向旅游者发送乘机注意事项，重点确认证件、机场名称、航班号及起飞时间等关键信息。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":30,"type":"judge","q":"潜水、跳伞、攀岩、蹦极、探险、赛马、赛车等属于高风险的活动项目，不含在个人旅游意外保险的范围内，需另行购买特定险种。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":31,"type":"judge","q":"雷大大旅行社统一订餐时，导游老王提前1小时再次确认用餐人数、比例、餐标、特殊要求及餐厅繁忙程度等信息，合理处理用餐事宜。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。旅行社统一订餐时，导游应提前2小时再次确认用餐人数、比例、餐标、特殊要求及餐厅繁忙程度等信息，合理处理用餐事宜。","figures":[]},{"no":32,"type":"judge","q":"导游带团时遵循“最后上车、最先下车”原则。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。导游带团乘坐交通工具时，应遵循“最后上车、最先下车”原则。","figures":[]},{"no":33,"type":"judge","q":"全团旅游者提出书面申请并签字更换文娱活动，导游同意即可。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。全团游客提出更换时：与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。","figures":[]},{"no":34,"type":"judge","q":"个别旅游者旅游期间坚持更换景点，导游老王应向游客耐心解释，不能随意更换。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。旅游者要求更换或取消计划内的游览项目·凡是计划内的游览项目，一般应该不折不扣地按计划进行。·全团统一提出时：请示接待社计调部门，请其与组团社联系，组团社同意后方可更换或取消。·个别旅游者提出时：向旅游者耐心解释，不能随意更换。","figures":[]},{"no":35,"type":"judge","q":"依据24小时内降水量来划分暴雨等级，特大暴雨是指24小时内，降雨在250毫米及以上。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":36,"type":"judge","q":"导游带领游客遭遇炸雷时，应找一块地势低洼处蹲下，尽量降低重心和减少人体与地面的接触面积，双脚并拢，双手捂住耳朵，避免雷声伤害听力。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":37,"type":"judge","q":"通常是身份较高但未持外交护照的人员，或是已卸任的外国党政军高级官员及知名人士颁发礼遇签证。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":38,"type":"judge","q":"赴香港旅行，需持港澳通行证及车票，提前120分钟至联检大厅通关。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。赴香港旅行，需持港澳通行证及车票，提前90分钟至联检大厅通关。","figures":[]},{"no":39,"type":"judge","q":"因天气、突发事件等非航空公司原因致始发地出港延误或取消，雷大大航空公司应按规定免费提供餐食。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。非航空公司原因：因天气、突发事件等非航空公司原因致始发地出港延误或取消，协助安排食宿，费用旅客自理。","figures":[]},{"no":40,"type":"judge","q":"乘坐飞机，头等舱可以携带2件手提行李，而公务舱和经济舱只能携带1件手提行李。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。乘坐飞机，头等舱、公务舱可以携带2件手提行李，而经济舱只能携带1件手提行李。","figures":[]},{"no":41,"type":"single","q":"6月13日，2026年文化和自然遗产日主场城市活动在湖北武汉举行，2026年文化和自然遗产日的主题是（ ）。","opt":["A.保护文物传承文明","B.文物属于人民服务人民","C.让文物活起来","D.弘扬中华优秀传统文化"],"ans":"B","analysis":"6月13日，2026年文化和自然遗产日主场城市活动在湖北武汉举行，2026年文化和自然遗产日的主题是“文物属于人民服务人民”。","figures":[]},{"no":42,"type":"single","q":"根据《中华人民共和国宪法》的规定，我国人民行使国家权力的机关是（ ）。","opt":["A.国务院及地方各级人民政府","B.全国人民代表大会和地方各级人民代表大会","C.中国人民政治协商会议","D.各级人民法院和人民检察院"],"ans":"B","analysis":"宪法第2条第1款规定“中华人民共和国的一切权力属于人民”，其制度实现形式中的代议民主是指：人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。\nA项错误，国务院及地方各级人民政府属于国家行政机关，不是行使国家权力的机关；C项错误，中国人民政治协商会议是爱国统一战线组织，是中国共产党领导的多党合作和政治协商制度的重要组织形式，不是国家权力机关；\nD项错误，各级人民法院和人民检察院是审判机关和检察机关，不属于国家权力机关。","figures":[]},{"no":43,"type":"single","q":"依据《中华人民共和国宪法》，既是公民基本权利，也是公民基本义务的是（ ）。","opt":["A.服兵役","B.受教育","C.纳税","D.休息"],"ans":"B","analysis":"根据《宪法》对公民基本权利和义务的规定，受教育权和劳动权既是公民基本权利，也是公民基本义务。","figures":[]},{"no":44,"type":"single","q":"根据《旅游法》的规定，安排导游为旅游者提供服务的，应当在包价旅游合同中载明（ ）。","opt":["A.导游星级评价信息","B.导游信用信息","C.导游服务费用","D.导游服务特点"],"ans":"C","analysis":"《旅游法》第60条，规定安排导游为旅游者提供服务的，应当在包价旅游合同中载明导游服务费用。","figures":[]},{"no":45,"type":"single","q":"《旅游法》规定（ ）建立健全旅游综合协调机制，对旅游业发展进行综合协调。","opt":["A.国家","B.文化与旅游部","C.国务院","D.各级人民政府"],"ans":"C","analysis":"国务院建立健全旅游综合协调机制，对旅游业发展进行综合协调。","figures":[]},{"no":46,"type":"single","q":"《中华人民共和国旅游法》规定，各级（ ）应当组织对本级政府编制的旅游发展规划的执行情况进行评估，并向社会公布。","opt":["A.人民政府","B.旅游行业组织","C.规划主管部门","D.旅游主管部门"],"ans":"A","analysis":"《旅游法》第22条规定，各级人民政府应当组织对本级政府编制的旅游发展规划的执行情况进行评估，并向社会公布。","figures":[]},{"no":47,"type":"single","q":"根据《旅游法》的规定，因未达到约定人数不能出团的，组团社经征得（ ），可以委托其他旅行社履行合同。","opt":["A.多数旅游者的同意","B.全体旅游者同意","C.旅游者授权","D.旅游者书面同意"],"ans":"D","analysis":"《旅游法》第63条规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同。","figures":[]},{"no":48,"type":"single","q":"依据《民法典》，限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认。但是，可以独立实施纯获利益的民事法律行为或者与其智力、（ ）相适应的民事法律行为。","opt":["A.精神健康状况","B.身体健康状况","C.身体和精神健康状况","D.身体或者精神健康状况"],"ans":"A","analysis":"《民法典》第22条规定，不能完全辨认自己行为的成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；但是，可以独立实施纯获利益的民事法律行为或者与其智力、精神健康状况相适应的民事法律行为。","figures":[]},{"no":49,"type":"single","q":"当事人自知道或者应当知道撤销事由之日起（ ）内没有行使撤销权的，撤销权消灭。","opt":["A.3个月","B.6个月","C.1年","D.5年"],"ans":"C","analysis":"当事人自知道或者应当知道撤销事由之日起1年内、重大误解的当事人自知道或者应当知道撤销事由之日起90日内没有行使撤销权，撤销权消灭。","figures":[]},{"no":50,"type":"single","q":"《民法典》规定，民事主体有证据证明行为人正在实施或者即将实施侵害其人格权的违法行为，不及时制止将使其合法权益受到难以弥补的损害的，有权依法向（ ）申请采取责令行为人停止有关行为的措施。","opt":["A.公安机关","B.居委会","C.人民法院","D.仲裁委员会"],"ans":"C","analysis":"《民法典》第997条规定，民事主体有证据证明行为人正在实施或者即将实施侵害其人格权的违法行为，不及时制止将使其合法权益受到难以弥补的损害的，有权依法向人民法院申请采取责令行为人停止有关行为的措施。","figures":[]},{"no":51,"type":"single","q":"有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，（ ）。","opt":["A.从本人财产中支付赔偿费用，不足部分由监护人赔偿","B.由监护人赔偿，不足部分从本人财产中支付","C.从本人财产中支付赔偿费用，监护人不承担赔偿责任","D.由监护人赔偿，本人不支付赔偿费用"],"ans":"A","analysis":"《民法典》侵权责任编第1188条第2款规定，有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从本人财产中支付赔偿费用；不足部分，由监护人赔偿。","figures":[]},{"no":52,"type":"single","q":"根据《民法典》的规定，不论加害人主观上是否有过错，只要其行为与损害后果之间存在因果关系，就应承担民事责任，此处适用的归责原则是（ ）。","opt":["A.公平责任原则","B.过错责任原则","C.过错推定责任原则","D.无过错责任"],"ans":"D","analysis":"无过错责任原则指不论加害人主观上是否有过错，只要其行为与损害后果之间存在因果关系，就应承担民事责任的归责原则。","figures":[]},{"no":53,"type":"single","q":"根据《民法典》的规定，以下关于支付违约金的描述，正确的是（ ）。","opt":["A.因为合同标的物不同，所以当事人无法约定一方违约时应当向对方支付的违约金的具体金额","B.当事人仅可以约定因违约产生的损失赔偿额的计算方法","C.约定的违约金过分高于造成的损失的，当事人可以请求人民法院予以适当减少","D.当事人就迟延履行约定违约金的，违约方支付违约金后，无须履行债务"],"ans":"C","analysis":"《民法典》585条规定，当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，当事人可以请求人民法院或者仲裁机构予以增加；约定的违约金过分高于造成的损失的，当事人可以请求人民法院或者仲裁机构予以适当减少。当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。","figures":[]},{"no":54,"type":"single","q":"根据《民法典》的规定，以下关于精神损害赔偿的责任承担，正确的是（ ）。","opt":["A.侵害自然人人身权益造成严重精神损害的，被侵权人可以选择对方承担精神损害赔偿或人身损害赔偿","B.因故意侵害自然人具有人身意义的特定物造成精神损害的，被侵权人有权请求精神损害赔偿","C.因重大过失侵害自然人具有人身意义的特定物造成精神损害的，被侵权人有权请求精神损害赔偿","D.侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿"],"ans":"D","analysis":"《民法典》第1183条，侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿。因故意或者重大过失侵害自然人具有人身意义的特定物造成严重精神损害的，被侵权人有权请求精神损害赔偿。“侵害自然人人身权益造成严重精神损害的……”，此种情况下，被侵权人可以要求对方在承担人身损害赔偿的基础上再承担精神损害赔偿；“因故意侵害自然人具有……精神损害赔偿”“因重大过失侵害自然人具有……精神损害赔偿”两个选项，需要“严重”精神损害，才可以请求赔偿。","figures":[]},{"no":55,"type":"single","q":"《民法典》规定，采用格式条款订立合同的，提供格式条款的一方应当遵循（ ）确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款。","opt":["A.平等原则","B.公平原则","C.诚实信用原则","D.自愿原则"],"ans":"B","analysis":"《民法典》第496条规定，采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款。","figures":[]},{"no":56,"type":"single","q":"《旅行社条例实施细则》规定，设立社应当加强对分社和服务网点的管理，对服务网点实行统一管理、统一财务、统一招徕和（ ）的服务规范。","opt":["A.统一人事","B.统一经费","C.统一咨询","D.统一接待"],"ans":"C","analysis":"旅行社应当加强对服务网点的管理，实行统一管理、统一财务、统一招徕和统一咨询的服务规范。","figures":[]},{"no":57,"type":"single","q":"导游发现旅行社以“不合理低价游”组织旅游活动的，应该向当地（ ）举报。","opt":["A.依法成立的旅游行业组织","B.公安部门","C.市场监督管理部门","D.旅游行政管理部门"],"ans":"D","analysis":"“不合理低价游”属于旅游行政管理部门管辖范围。","figures":[]},{"no":58,"type":"single","q":"下列关于申请补发旅行社业务经营许可证及副本的说法，正确的是（ ）。","opt":["A.可以向原许可的旅游行政管理部门申请","B.应当通过县级以上旅游行政管理部门网站，刊登损毁或者遗失作废声明","C.应当向所在地旅游行政管理部门申请","D.应当向原许可的旅游行政管理部门申请"],"ans":"D","analysis":"《旅行社条例实施细则》第11条规定，旅行社因业务经营需要，可以向原许可的旅游行政管理部门申请核发旅行社业务经营许可证副本。旅行社业务经营许可证及副本，由国务院旅游行政主管部门制定统一样式，国务院旅游行政主管部门和省级旅游行政管理部门分别印制。旅行社业务经营许可证及副本损毁或者遗失的，旅行社应当向原许可的旅游行政管理部门申请换发或者补发。申请补发旅行社业务经营许可证及副本的，旅行社应当通过本省、自治区、直辖市范围内公开发行的报刊，或者省级以上旅游行政管理部门网站，刊登损毁或者遗失作废声明。","figures":[]},{"no":59,"type":"single","q":"导游张某带团前往某景区，途中遭遇洪水危及旅游者人身、财产安全。对此，旅行社及其导游张某应当采取必要的处置措施，并依据《旅行社条例》及时报告（ ）。","opt":["A.旅游行政管理部门","B.事故发生地人民政府","C.安全生产监督管理部门","D.旅行社所在地人民政府"],"ans":"A","analysis":"《旅行社条例》第39条规定，旅行社对可能危及旅游者人身、财产安全的事项，应当向旅游者作出真实的说明和明确的警示，并采取防止危害发生的必要措施。发生危及旅游者人身安全的情形的，旅行社及其委派的导游人员、领队人员应当采取必要的处置措施并及时报告旅游行政管理部门；在境外发生的，还应当及时报告中华人民共和国驻该国使领馆、相关驻外机构、当地警方。","figures":[]},{"no":60,"type":"single","q":"在线旅游经营者未依法取得旅行社业务经营许可开展相关业务的，依照《中华人民共和国旅游法》第95条的规定，由（ ）文化和旅游主管部门责令改正，没收违法所得，并处1万元以上10万元以下罚款。","opt":["A.县级","B.县级以上","C.所在地","D.省级"],"ans":"B","analysis":"《在线旅游经营服务管理暂行规定》第32条规定，在线旅游经营者未依法取得旅行社业务经营许可开展相关业务的，依照《旅游法》第95条的规定，由县级以上文化和旅游主管部门责令改正，没收违法所得，并处1万元以上10万元以下罚款。","figures":[]},{"no":61,"type":"single","q":"《文化和旅游市场信用管理规定》规定，认定部门应当自作出准予信用修复决定之日起（ ），解除对失信主体的相关管理措施。","opt":["A.5个工作日内","B.7个工作日内","C.10个工作日内","D.15个工作日内"],"ans":"A","analysis":"《文化和旅游市场信用管理规定》第27条规定，认定部门应当自作出准予信用修复决定之日起5个工作日内，解除对失信主体的相关管理措施。","figures":[]},{"no":62,"type":"single","q":"某旅行社组团到香港旅游，但是在出发日前一天，发现整团签证时间有误，于是告知旅游者解除旅游合同。根据《旅行社服务质量赔偿标准》规定，旅行社应当赔偿旅游者旅游费用总额的（ ）违约金。","opt":["A.5%","B.10%","C.15%","D.20%"],"ans":"C","analysis":"出境旅游（含赴台游）应提前30日（不含30日）通知旅游者，否则应向旅游者全额退还预付旅游费用，并按规定向旅游者支付违约金：出发前3日至 1日，支付旅游费用总额15%的违约金。","figures":[]},{"no":63,"type":"single","q":"根据《导游管理办法》的规定，旅游行业组织、旅行社为导游证申请人申请取得导游证隐瞒有关情况或者提供虚假材料，由县级以上旅游主管部门责令改正，并可以处（ ）罚款。","opt":["A.1000以下","B.3000元以下","C.5000元以下","D.2000元以上1万元以下"],"ans":"C","analysis":"《导游管理办法》第36条，旅游行业组织、旅行社为导游证申请人申请取得导游证隐瞒有关情况或者提供虚假材料，由县级以上旅游主管部门责令改正，并可以处5000元以下罚款。","figures":[]},{"no":64,"type":"single","q":"《导游管理办法》规定，导游为旅游者提供服务应当接受（ ），但另有规定的除外。","opt":["A.旅行社委派","B.旅游主管部门委派","C.旅游者自主选择","D.旅游行业组织委派"],"ans":"A","analysis":"《导游管理办法》第19条规定，导游为旅游者提供服务应当接受旅行社委派，但另有规定的除外。","figures":[]},{"no":65,"type":"single","q":"根据《导游人员管理条例》规定，导游人员对旅游行政部门的行政行为不服时，导游可以（ ）。","opt":["A.向上一级旅游行政机关申请复议","B.提请仲裁机构仲裁","C.向旅游执法机构申请调解","D.向作出行政处罚的旅游行政机关申请复议"],"ans":"A","analysis":"导游人员对旅游行政部门下列行政行为不服时，导游可以申请复议——有权向上一级旅游行政机关申请复议，有权向人民法院提起诉讼：对罚款、吊销导游证、责令改正、暂扣导游证等行政处罚不服；认为符合法定条件申领导游资格证书和导游证，旅游行政部门拒绝颁发或不予答复；认为旅游行政部门违法要求导游人员履行义务；认为旅游行政部门侵犯导游人员人身权、财产权；法律、法规规定可以提起行政诉讼或者可以申请复议的其他具体行政行为","figures":[]},{"no":66,"type":"single","q":"《导游管理办法》规定，导游证的有效期为（ ）。导游需要在导游证有效期届满后继续执业的，应当在有效期限届满前（ ）内，通过全国旅游监管服务信息系统向所在地旅游主管部门提出申请。","opt":["A.3年，1个月","B.5年，3个月","C.3年，3个月","D.2年，6个月"],"ans":"C","analysis":"《导游管理办法》第13条，导游证的有效期为3年。导游需要在导游证有效期届满后继续执业的，应当在有效期限届满前3个月内，通过全国旅游监管服务信息系统向所在地旅游主管部门提出申请。","figures":[]},{"no":67,"type":"single","q":"导游从事领队服务须具有两年以上旅游从业经历，这里的从业经历是指（ ）。","opt":["A.导游从业","B.旅行社管理","C.旅行社业务经营、管理或者导游等相关","D.旅行社业务经营"],"ans":"C","analysis":"旅行社为组织旅游者出境旅游委派的领队，应当具备下列条件：（1）取得导游证；（2）具有大专以上学历；（3）取得相关语言水平测试等级证书或通过外语语种导游资格考试，旅行社委派的领队，应当掌握相关旅游目的地国家（地区）语言或者英语，但为赴港澳台地区旅游委派的领队除外；（4）具有2年以上旅行社业务经营、管理或者导游等相关从业经历；（5）与委派其从事领队业务的取得出境旅游业务经营许可的旅行社订立劳动合同。","figures":[]},{"no":68,"type":"single","q":"《导游人员管理条例》规定，具有（ ）学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游人员资格考试。","opt":["A.高等专业学校、大专院校或者以上","B.高级中学、高等专业学校或者以上","C.高级中学、中等专业学校或者以上","D.初级中学、中等专业学校或者以上"],"ans":"C","analysis":"国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：中华人民共和国公民；具有高级中学、中等专业学校或者以上学历；身体健康；具有适应导游需要的基本知识和语言表达能力。","figures":[]},{"no":69,"type":"single","q":"《导游人员管理条例》规定，导游人员在引导旅游者旅行、游览过程中，应当就可能发生危及旅游者人身、财物安全的情况，向旅游者作出（ ），并按照旅行社的要求采取防止危害发生的措施。","opt":["A.真实说明","B.明确警示","C.真实说明和明确警示","D.真实说明或明确警示"],"ans":"C","analysis":"《导游人员管理条例》第14条规定，导游人员在引导旅游者旅行、游览过程中，应当就可能发生危及旅游者人身、财物安全的情况，向旅游者作出真实说明和明确警示，并按照旅行社的要求采取防止危害发生的措施。","figures":[]},{"no":70,"type":"single","q":"依据《中华人民共和国消费者权益保护法实施条例》，经营者决定停业或者迁移服务场所的，应当提前（ ）在经营场所、网站、网店首页等醒目位置公告经营者有效联系方式等信息。","opt":["A.15日","B.30日","C.45日","D.60日"],"ans":"B","analysis":"经营者决定停业或者迁移服务场所的，应当提前30日在其经营场所、网站、网店首页等的醒目位置公告经营者的有效联系方式等信息。（第21条）","figures":[]},{"no":71,"type":"single","q":"依据《中华人民共和国消费者权益保护法实施条例》，对于侵害众多消费者合法权益的行为，下列哪一主体可以向人民法院提起诉讼（ ）。","opt":["A.县级消费者协会","B.中国消费者协会以及省、自治区、直辖市设立的消费者协会","C.市场监督管理所","D.普通消费者个人"],"ans":"B","analysis":"A项错误：有权提起该类诉讼的仅限中国消费者协会和省（自治区、直辖市）设立的消费者协会，县级消费者协会无权提起。\nC项错误：市场监督管理所属于行政机关，不能作为该类诉讼的起诉主体。\nD项错误：普通消费者个人只能就自身合法权益提起民事诉讼，不能针对侵害众多消费者合法权益的行为提起该类诉讼。","figures":[]},{"no":72,"type":"single","q":"《国家旅游局关于不文明行为记录管理暂行办法》规定，“旅游不文明行为记录”信息实行动态管理。旅游不文明行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限（ ）。","opt":["A.6个月至1年","B.1年至3年","C.2年至4年","D.3年至5年"],"ans":"B","analysis":"《办法》第9条规定，“旅游不文明行为记录”信息保存期限为1-5年，实行动态管理。①行为当事人违反刑法的，信息保存期限为3-5年；②行为当事人受到行政处罚或法院判决承担责任的，信息保存期限为2-4年；③行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限为1-3年。","figures":[]},{"no":73,"type":"single","q":"根据《旅游法》第94条的规定，旅游者与旅游经营者发生纠纷，旅游者一方人数众多并有共同请求的，可以（ ）参加协商、调解、仲裁、诉讼活动。","opt":["A.推选代表人","B.由旅游投诉处理机构指定代理人","C.由人民法院指定代表人","D.由旅游经营者选定代表"],"ans":"A","analysis":"《旅游法》第94条规定：“旅游者与旅游经营者发生纠纷，旅游者一方人数众多并有共同请求的，可以推选代表人参加协商、调解、仲裁、诉讼活动。”代表人由旅游者一方自行推选，而非由旅游投诉处理机构、人民法院指定或者旅游经营者选定。","figures":[]},{"no":74,"type":"single","q":"根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级、二级、三级和四级，其中三级标示的颜色是（ ）。","opt":["A.红色","B.黄色","C.橙色","D.蓝色"],"ans":"B","analysis":"根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色和蓝色标示。","figures":[]},{"no":75,"type":"single","q":"发布突发事件三级、四级警报后，县级以上地方各级人民政府应当根据即将发生的突发事件的特点和可能造成的危害，采取下列（ ）措施。","opt":["A.启动应急预案","B.责令应急救援队伍、负有特定职责的人员进入待命状态","C.加强对重要基础设施的安全保卫","D.维护社会治安"],"ans":"A","analysis":"其余三项属于突发事件一级、二级警报应采取的措施。","figures":[]},{"no":76,"type":"single","q":"根据《旅游安全管理办法》规定，旅游主管部门在接到旅游经营者的报告后，应当向同级人民政府和上级旅游主管部门报告。一般旅游突发事件上报至（ ）。","opt":["A.市级旅游主管部门","B.省级旅游主管部门","C.文化和旅游部","D.设区的市级旅游主管部门"],"ans":"D","analysis":"旅游突发事件处置结束后，发生地旅游主管部门应当及时查明突发事件的发生经过和原因，总结突发事件应急处置工作的经验教训，制定改进措施，并在30日内按照下列程序提交总结报告：（1）一般旅游突发事件向设区的市级旅游主管部门提交；（2）较大旅游突发事件逐级向省级旅游主管部门提交；（3）重大和特别重大旅游突发事件逐级向文化和旅游部提交。","figures":[]},{"no":77,"type":"single","q":"根据《出境入境管理法》规定，中国公民有下列（ ）情形不准出境。","opt":["A.持有效出境入境证件","B.拒绝接受边防检查的","C.属于重大刑事案件目击证人","D.因非法出境被其他国家或者地区遣返，已满不准出境规定年限的"],"ans":"B","analysis":"《出境入境管理法》第12条规定，中国公民有下列情形之一的，不准出境：（1）未持有效出境入境证件或者拒绝、逃避接受边防检查的；（2）被判处刑罚尚未执行完毕或者属于刑事案件被告人、犯罪嫌疑人的；（3）有未了结的民事案件，人民法院决定不准出境的；（4）因妨害国（边）境管理受到刑事处罚或者因非法出境、非法居留、非法就业被其他国家或者地区遣返，未满不准出境规定年限的；（5）可能危害国家安全和利益，国务院有关主管部门决定不准出境；（6）法律、行政法规规定不准出境的其他情形。因此，正确选项是B。","figures":[]},{"no":78,"type":"single","q":"《食品安全法》规定，生产不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付（ ）的赔偿金。","opt":["A.支付价款3倍","B.价款3倍和损失10倍","C.损失10倍","D.价款10倍或者损失3倍"],"ans":"D","analysis":"《食品安全法》第148条规定，生产不符合食品安全标准的食品或者经营明知是不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付价款10倍或者损失3倍的赔偿金。","figures":[]},{"no":79,"type":"single","q":"（ ），游艺娱乐场所设置的电子游戏机不得向未成年人提供。","opt":["A.除公休日外","B.除寒暑假外","C.除国家法定节假日外","D.除公休日和国家法定节假日外"],"ans":"C","analysis":"《娱乐场所管理条例》第23条规定，歌舞娱乐场所不得接纳未成年人。除国家法定节假日外，游艺娱乐场所设置的电子游戏机不得向未成年人提供。","figures":[]},{"no":80,"type":"single","q":"《中华人民共和国食品安全法》规定，医疗机构发现其接收的病人属于食源性疾病病人或者疑似病人的，应当按照规定及时将相关信息向所在地县级人民政府卫生行政部门报告。县级人民政府卫生行政部门认为与食品安全有关的，应当及时通报（ ）。","opt":["A.县级人民政府","B.上级食品安全监督管理部门","C.同级食品安全监督管理部门","D.县级人民政府质量监督管理部门"],"ans":"C","analysis":"《食品安全法》第104条规定，医疗机构发现其接收的病人属于食源性疾病病人或者疑似病人的，应当按照规定及时将相关信息向所在地县级人民政府卫生行政部门报告。县级人民政府卫生行政部门认为与食品安全有关的，应当及时通报同级食品安全监督管理部门。","figures":[]},{"no":81,"type":"single","q":"根据《风景名胜区条例》，施工单位在施工过程中对周围景物、林草植被造成破坏的，由风景名胜区管理机构责令停止违法行为、限期恢复原状或者采取其他补救措施，并处（ ）的罚款。","opt":["A.1万元以上5万元以下","B.2万元以上10万元以下","C.5万元以上20万元以下","D.10万元以上50万元以下"],"ans":"B","analysis":"《风景名胜区条例》第四十六条：违反本条例的规定，施工单位在施工过程中，对周围景物、水体、林草植被、野生动物资源和地形地貌造成破坏的，由风景名胜区管理机构责令停止违法行为、限期恢复原状或者采取其他补救措施，并处2万元以上10万元以下的罚款；逾期未恢复原状或者采取有效措施的，由风景名胜区管理机构责令停止施工。","figures":[]},{"no":82,"type":"single","q":"根据《自然保护区条例》规定,自然保护区由（ ）批准设立。","opt":["A.县级以上地方人民政府","B.省级林业草原主管部门","C.国务院或者省、自治区、直辖市人民政府","D.国务院林业草原主管部门"],"ans":"C","analysis":"《自然保护区条例》第二条:本条例所称自然保护区,是指由国务院或者省、自治区、直辖市人民政府批准设立,以保护典型的自然生态系统、珍稀濒危野生动植物物种的天然集中分布区、有特殊意义的自然遗迹等为主要目的,实现自然资源科学保护和合理利用的特定陆地和海洋区域。\nA项错误,县级以上地方人民政府没有批准设立自然保护区的权限,批准设立主体限于国务院和省、自治区、直辖市人民政府,依据条例第二条。\nB项错误,林业草原主管部门承担的是自然保护区的监督管理职责,不是批准设立主体,依据条例第六条。\nC项正确,与条例规定完全一致。\nD项错误,国务院林业草原主管部门负责全国自然保护区的监督管理,也不是批准设立主体,依据条例第六条。","figures":[]},{"no":83,"type":"single","q":"在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以（ ）推进中华民族伟大复兴","opt":["A.中国特色社会主义现代化","B.马克思主义","C.马克思主义中国化","D.中国式现代化"],"ans":"D","analysis":"中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","figures":[]},{"no":84,"type":"single","q":"《港区国安法》规定，下列（ ）情形的，对有关犯罪行为人、犯罪嫌疑人、被告人可以从轻、减轻处罚；犯罪较轻的，可以免除处罚。","opt":["A.提供重要线索侦破本案件的","B.揭发他人犯罪行为的","C.自动投案，如实供述自己的罪行的","D.在犯罪过程中，被动放弃犯罪"],"ans":"C","analysis":"第33条规定。正确的说法是：“揭发他人犯罪行为，查证属实，或者提供重要线索得以侦破其他案件的”。","figures":[]},{"no":85,"type":"single","q":"《英烈法》规定，国务院有关部门、军队有关部门和地方人民政府应当关心英雄烈士遗属的生活情况，（ ）走访慰问英雄烈士遗属。","opt":["A.每年","B.每季度","C.每半年","D.每年定期"],"ans":"D","analysis":"国务院有关部门、军队有关部门和地方人民政府应当关心英雄烈士遗属的生活情况，每年定期走访慰问英雄烈士遗属。","figures":[]},{"no":86,"type":"single","q":"依据文化和旅游部《旅游强国建设“十五五”规划》，推动旅游业高质量发展，要以推进文旅深度融合为（ ）。","opt":["A.主题","B.主线","C.抓手","D.保障"],"ans":"B","analysis":"文档原文：坚持旅游为民，以推动高质量发展为主题，以推进文旅深度融合为主线，统筹政府与市场、供给与需求、保护与开发、国内与国际、发展与安全。\nA项错误，规划明确的主题是“推动高质量发展”，而非文旅深度融合，故A错误。\nB项正确，以推进文旅深度融合为主线，符合规划原文，故B正确。\nC项错误，抓手非规划表述，故C错误。\nD项错误，保障非规划表述，故D错误。","figures":[]},{"no":87,"type":"single","q":"世界上第一次大规模的、有组织的、纯粹以商业为目的的旅游活动是（ ）。","opt":["A.莱斯特到拉夫巴勒的禁酒大会","B.利物浦之行","C.苏格兰之行","D.莱斯特到巴黎之行"],"ans":"B","analysis":"1845，组织350人从莱斯特到利物浦团体消遣性旅游（为期一周），是世界上第一次大规模的、有组织的、纯粹以商业为目的的旅游活动。","figures":[]},{"no":88,"type":"single","q":"（ ）年，上海商业储备银行总经理陈光甫在银行内部创设旅游部。","opt":["A.1923","B.1925","C.1927","D.1929"],"ans":"A","analysis":"1923年8月：上海商业储备银行总经理陈光甫在银行内部创设旅游部。","figures":[]},{"no":89,"type":"single","q":"下列选项中，不属于导游服务未来发展趋势的一项是（ ）。","opt":["A.导游服务内容专业化","B.导游服务手段科技化","C.导游服务方法多样化","D.导游服务需求标准化"],"ans":"D","analysis":"导游服务未来发展趋势：导游服务内容专业化；导游服务手段科技化；导游服务方法多样化；导游服务需求个性化。","figures":[]},{"no":90,"type":"single","q":"导游人员协调左右的纽带作用主要体现在（ ）。","opt":["A.将旅游者的意见、要求、建议及投诉传递至旅行社和旅游行政管理部门","B.既代表旅行社利益，又维护旅游者合法权益","C.联络和安排旅行社与饭店、餐馆、景区、交通、商店、娱乐场所等单位","D.向中外游客介绍中国文化，展示中国魅力"],"ans":"C","analysis":"第一联络员：协调旅行社与饭店、餐馆、景区、交通、商店、娱乐场所等单位，在各旅游单位之间起着重要的协调作用；中心位置：各旅游单位的相互协作是生活服务得以顺利进行的重要保障，对提高旅游质量至关重要，导游处在各项旅游服务协调的中心位置，责任重大且作用显著。","figures":[]},{"no":91,"type":"single","q":"下列晋升导游等级的描述，正确的选项是（ ）。","opt":["A.初级、中级导游在获得下列表彰奖励3年内，可以通过激励晋升的方式申请晋升一个导游等级","B.多次获得或者同时获得多项表彰奖励的，只晋升2次导游等级","C.省级文化和旅游主管部门组织的省级导游大赛一、二、三等奖，可申请激励晋升","D.省级以上劳动模范、五一劳动奖章、青年岗位能手、三八红旗手、巾帼建功标兵，可申请激励晋升"],"ans":"D","analysis":"初级、中级导游在获得下列表彰奖励2年内，可以通过激励晋升的方式申请晋升一个导游等级。多次获得或者同时获得多项表彰奖励的，只晋升1次导游等级：①国务院文化和旅游主管部门组织的全国导游大赛一、二、三等奖；②省级文化和旅游主管部门组织的省级导游大赛一等奖；③省级以上劳动模范、五一劳动奖章、青年岗位能手、三八红旗手、巾帼建功标兵；④国务院文化和旅游主管部门认定的其他符合激励晋升的情况。","figures":[]},{"no":92,"type":"single","q":"（ ）是旅游行业服务理念的高度提炼和概括。","opt":["A.秉承契约，用心服务","B.富强民主，文明和谐","C.恪守道德，爱岗敬业","D.游客为本，服务至诚"],"ans":"D","analysis":"“游客为本，服务至诚”作为旅游行业的服务理念，也是对改革开放以来业已形成的旅游行业服务理念的高度提炼和概括。","figures":[]},{"no":93,"type":"single","q":"在社会主义核心价值观中，国家层面的价值目标是（ ）。","opt":["A.富强、民主、文明、和谐","B.自由、平等、公正、法治","C.爱国、敬业、诚信、友善","D.游客为本，服务至诚"],"ans":"A","analysis":"党的十八大提出，倡导：富强、民主、文明、和谐（国家层面的价值目标）；倡导自由、平等、公正、法治（社会层面的价值取向）；倡导爱国、敬业、诚信、友善（公民个人层面的价值准则），积极培育和践行社会主义核心价值观。","figures":[]},{"no":94,"type":"single","q":"在TPO原则中，O代表（ ）。","opt":["A.时间","B.地点","C.场合","D.氛围"],"ans":"C","analysis":"遵循TPO原则：Time（时间）、Place（地点）、Occasion（场合）","figures":[]},{"no":95,"type":"single","q":"地陪导游每天带团前，应至少提前（ ）分钟抵达集合地点。","opt":["A.10","B.15","C.20","D.30"],"ans":"A","analysis":"提前到达：地陪应提前10分钟到达约定集合点。","figures":[]},{"no":96,"type":"single","q":"若旅游团先前往饭店，核对和商定旅游日程应在（ ）。","opt":["A.前往饭店的行车途中","B.饭店大厅","C.饭店单独的会议室","D.机场大厅"],"ans":"B","analysis":"若旅游团先前往饭店，则可在旅游团入住后进行，地点宜在公共场所，如饭店大厅等","figures":[]},{"no":97,"type":"single","q":"进入酒店以后，入境旅游团应由（ ）负责分发房卡。","opt":["A.领队","B.团长","C.全陪","D.地陪"],"ans":"A","analysis":"拿到房卡后，全陪要协助领队根据准备好的分房名单分发房卡。","figures":[]},{"no":98,"type":"single","q":"来自法国的游客卢女士要乘坐14:00的飞机从武汉飞往广州，地陪导游老王最晚（ ）之前，抵达机场。","opt":["A.11:00","B.12:00","C.12:30","D.13:00"],"ans":"B","analysis":"乘出境航班提前3小时或按照航空公司规定的时间；乘国内航班提前2小时；乘火车、轮船提前1小时。","figures":[]},{"no":99,"type":"single","q":"下列内容中，（ ）不属于地陪导游后续工作范畴的。","opt":["A.接团小结","B.处理遗留问题","C.与全陪结账","D.提交物品"],"ans":"C","analysis":"与全陪结账，是送站服务，不是后续服务。","figures":[]},{"no":100,"type":"single","q":"在带团过程中，全陪老王应走在旅游团的（ ）。","opt":["A.最前方","B.中间","C.最后","D.与地陪并排的位置"],"ans":"C","analysis":"主动殿后，随时清点人数及时发现未跟上团队的旅游者，避免其走失。（强调动作目的）","figures":[]},{"no":101,"type":"single","q":"导游在发车前应当提醒游客全程系好安全带，对不听劝导、坚持不使用安全带的，导游应该（ ）。","opt":["A.将客人驱赶下车，拒绝继续服务","B.在安全前提下，与司机共同劝导","C.让客人签字，一旦出事后果自负","D.报告旅行社，解除旅游合同"],"ans":"B","analysis":"劝导义务：对不听劝导、坚持不使用安全带的，在车辆安全停靠的前提下，导游与驾驶员共同做好劝导服务。","figures":[]},{"no":102,"type":"single","q":"“雷峰如老衲，保俶如美人”这句话采用的修辞方式是（ ）。","opt":["A.比喻","B.比拟","C.夸张","D.引用"],"ans":"A","analysis":"比喻（明喻）：“雷峰如老衲，保俶如美人”，将西湖边的雷峰塔和保俶塔形容得既凝练简明，又生动传神。","figures":[]},{"no":103,"type":"single","q":"用于肯定、请求、感叹、祝愿、赞扬、期待等情感表达，一般采用（ ）。","opt":["A.高升调","B.低降调","C.平直调","D.曲折调"],"ans":"B","analysis":"低降调：常用于肯定、请求、感叹、祝愿、赞扬、期待等情感表达。句子前半部分音调高，后半部分明显降低。例如“按时完成任务，这次团队协作值得称赞！”（体现肯定、赞许之意）","figures":[]},{"no":104,"type":"single","q":"在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，让游客仿佛看到荷花在湖中绽放的美景，这段话导游采用（ ）。","opt":["A.情感手势语","B.指示手势语","C.象形手势语","D.再现手势语"],"ans":"C","analysis":"象形手势语：导游模拟人或事物形状、动作的手势语，能给旅游者留下生动印象，但避免机械模仿和过多表演痕迹。例如：在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，让游客仿佛看到荷花在湖中绽放的美景","figures":[]},{"no":105,"type":"single","q":"导游老王在讲解时抛出感兴趣的问题，故意不马上作答，激发旅游者急于知晓答案的欲望，这是（ ）的运用。","opt":["A.虚实结合法","B.触景生情法","C.画龙点睛法","D.制造悬念法"],"ans":"D","analysis":"制造悬念法：导游在讲解时抛出感兴趣的问题，故意不马上作答，激发旅游者急于知晓答案的欲望，从而活跃气氛、激发游兴，使讲解效果更佳。","figures":[]},{"no":106,"type":"single","q":"导游运用（ ）介绍北京天坛祈年殿时讲到：内围四根“龙井柱”象征四季，中围十二根“金柱”象征十二个月，外围十二根“檐柱”象征十二个时辰，中层和外层相加二十四根象征二十四节气，三层总共二十八根象征二十八星宿，加上柱顶端八根铜柱共三十六根，象征三十六天罡。","opt":["A.问答法","B.妙用数字法","C.画龙点睛法","D.触景生情法"],"ans":"B","analysis":"妙用数字法是借用数字说明景观内容的讲解方法。数字能让讲解更清晰、准确、有说服力。如介绍北京天坛祈年殿：“祈年殿殿内柱子数目按天象设立，内围四根‘龙井柱’象征四季，中围十二根‘金柱’象征十二个月，外围十二根‘檐柱’象征十二个时辰，中层和外层相加二十四根象征二十四节气，三层总共二十八根象征二十八星宿，加上柱顶端八根铜柱共三十六根，象征三十六天罡。”","figures":[]},{"no":107,"type":"single","q":"接待残障游客，应该做到（ ）。","opt":["A.发自内心的尊重，尽量为残障旅游者多拍照","B.导游在方便的时候，可以私下打听游客其残疾原因","C.勿对残障者表现出过分关注，尤其不应过度关注其残疾部位","D.在服务程度上，务必要越细致越尽力的位游客服务，不必考虑适度因素"],"ans":"C","analysis":"尊重第一：发自内心的尊重是建立良好互动关系的前提，未经同意，不可随意对残障旅游者拍照。不多问：相处过程中，避免表现得过于好奇。若残障旅游者未主动提及，导游不应擅自打听其残疾原因。不多看：勿对残障者表现出过分关注，尤其不应过度关注其残疾部位在服务姿态上，营造“残障旅游者亦为正常旅游者”的氛围；在服务程度上，务必把握好“适时恰当”这个度。","figures":[]},{"no":108,"type":"single","q":"导游在带团过程中，提醒游客事项错误的内容是（ ）。","opt":["A.不食用存在安全隐患的野菜、野果和不洁食品","B.不直接饮用野外雪水、溪水、泉水、河水、湖水","C.注意饮食卫生，做好用餐安全、适量点餐、杜绝浪费等提示","D.可以在街边小摊品尝当地特色美食"],"ans":"D","analysis":"（1）不食用存在安全隐患的野菜、野果和不洁食品；（2）不直接饮用野外雪水、溪水、泉水、河水、湖水；（3）注意饮食卫生，做好用餐安全、适量点餐、杜绝浪费等提示；（4）严防游客食物中毒。","figures":[]},{"no":109,"type":"single","q":"导游老王带团行程紧凑时，对于含餐团队，应在抵达餐厅前（ ）联系负责人，在保持菜肴热度的前提下提前上菜，减少旅游者等待。","opt":["A.10分钟","B.15分钟","C.20分钟","D.30分钟"],"ans":"B","analysis":"适当提前上菜时间行程紧凑时，含餐团队抵达餐厅前15分钟联系负责人，在保持菜肴热度的前提下提前上菜，减少旅游者等待。","figures":[]},{"no":110,"type":"single","q":"导游带领游客旅行过程中，操作不当的事项是（ ）。","opt":["A.告知游客禁止违规携带火种和易燃易爆物品进入旅游景区","B.告知游客乘坐交通工具时一旦发生火灾，寻找最近的门窗第一时间逃生","C.告知游客遇到火灾时沉着、冷静，不贪恋财物、迅速乘坐电梯逃离","D.告知游客了解火灾逃生路线图，正确选择逃生路线"],"ans":"C","analysis":"告知游客禁止违规携带火种和易燃易爆物品进入旅游景区；告知游客乘坐交通工具时一旦发生火灾，寻找最近的门窗第一时间逃生；遇到火灾时沉着、冷静，迅速正确逃生，不贪恋财物、不乘坐电梯、不盲目跳楼；告知游客了解火灾逃生路线图，正确选择逃生路线。","figures":[]},{"no":111,"type":"single","q":"登山旅游过程中，导游操作正确的是（ ）。","opt":["A.尽量少带水和食物以及其它重量物品，避免爬山负重过大","B.雷雨来时尽量攀登高峰，避免在山脚下遭遇泥石流或者山体滑坡","C.登山迷路时应保持冷静，切勿盲目走动，可就近选择视野开阔处等待救援","D.关节疾病患者、心脑血管疾病患者如果身体特征平稳，可以参加高山登山活动"],"ans":"C","analysis":"必备物品：携带足量饮用水、高热量食物、基础急救药品及防晒用品；雷雨来时切勿攀登高峰，不要扶铁栏杆和在大树下避雨，以防雷击。迷路时应保持冷静，及时报警，保持通讯设备电力充足，切勿盲目走动，可就近选择视野开阔处等待救援;登山属高强度耗氧运动，关节疾病患者、心脑血管疾病患者、体质衰弱的老年人及平时缺乏锻炼者均不宜前往高山景区。","figures":[]},{"no":112,"type":"single","q":"因为雷大大旅行社原因导致行程变更的处理，导游老王应该（ ）。","opt":["A.导游立即向游客如实说明情况，尊重游客意见","B.诚恳向旅游者道歉，并告知后续弥补措施，充分征求旅游者意见","C.起因是旅行社原因，因此导游无需再向旅行社汇报","D.根据旅行社意见处理后续行程，无需与游客商议"],"ans":"B","analysis":"导游立即向旅行社如实说明情况，听取处理意见；诚恳向旅游者道歉，并告知后续弥补措施，充分征求旅游者意见；对旅游者进行适当补偿，包括精神补偿和物质补偿，如提供更周到的导游服务、适当加菜或赠送纪念品等。","figures":[]},{"no":113,"type":"single","q":"根据《出境旅游领队服务规范》，领队应不迟于（ ）与参团旅游者/联系人联系，再次提醒注意事项。","opt":["A.出团前1日","B.出团前3日","C.出团前7日","D.出团当天"],"ans":"A","analysis":"根据《出境旅游领队服务规范》，领队应不迟于出团前1日与参团旅游者/联系人联系，再次提醒注意事项并请旅游者回复确认。","figures":[]},{"no":114,"type":"single","q":"关于换餐的要求，导游处理正确的选项是（ ）。","opt":["A.若旅游者在用餐3小时之前提出换餐，导游必须不折不扣的满足要求","B.导游劝说后，旅游者坚持换餐，导游明确告知费用自理，退还原餐费","C.若旅游者在用餐3小时之内才提出换餐，视情况而定","D.如果无法换餐，导游报请接待社，让接待社与组团社协商"],"ans":"C","analysis":"1.用餐3小时前提出换餐的处理：·尽量与餐厅联系，事先向游客讲清楚如能换妥差价由旅游者自理，询问餐厅能否提供相应服务；·若计划中的供餐单位不具备供应西餐或风味餐的能力，可考虑更换餐厅。2.接近用餐时间或到餐厅后提出换餐的处理：·视情况而定，若该餐厅有该项服务则协助解决；·如果情况复杂且餐厅没有此项服务，一般不应接受此类要求，但应向旅游者做好解释工作。若旅游者仍坚持换餐，可建议其到零点餐厅自己点菜或单独用餐，并告知其费用自理，原餐费根据旅游合同约定处理。","figures":[]},{"no":115,"type":"single","q":"在旅游过程中，游客有正当理由退团，导游应该（ ）。","opt":["A.将剩余费用退还给游客","B.产生的费用由旅游者和旅行社各承担一半","C.告知旅游者提出书面退团申请并签字","D.经导游同意，报旅行社备案"],"ans":"C","analysis":"合理退团要求：处理流程：①旅游者提出书面退团申请并签字；②报旅行社同意；③导游协助办理；费用处理方式：①产生的费用由旅游者自理；②未使用费用按旅游合同约定处理。","figures":[]},{"no":116,"type":"single","q":"游客卢女士行李丢失以后，导游老王处理得当的选项是（ ）。","opt":["A.立即报警","B.与承运人保持联络，督促承运人查找丢失行李","C.主动为游客购买生活必需品","D.告知旅游者索赔条款，请游客自行向承运人或者保险公司索赔"],"ans":"B","analysis":"查明丢失行李或行李损坏的运输区间，协助旅游者办理报失或报损登记手续；将旅游者后续旅游行程安排告知承运人，同时在旅游过程中，应与承运人保持联系与沟通，督促承运人及时查找丢失行李；若非运输期间丢失行李的，参照“丢失证件或物品”处理；在查找丢失行李期间，协助旅游者购置生活必需品，提示其保留发票等购货凭证，并协助旅游者处理索赔事宜；可以确认责任者的，协助旅游者向责任方索赔，并办理相关事宜；难以确认责任者的，协助旅游者开具有关证明，以便向保险公司申请办理理赔事宜，并视情况向有关部门报告。","figures":[]},{"no":117,"type":"single","q":"发现游客有溺水情况，作为导游应该（ ）。","opt":["A.立即跳入水中进行营救","B.如果不会游泳，可以在岸边鼓励溺水者坚持","C.如果身边有竹竿、绳子、救生圈等救人工具，就利用这些工具开展施救","D.如果导游会游泳，应从正面采用侧泳或仰泳方式将其拖带上岸"],"ans":"C","analysis":"（1）大声呼救：一边观察溺水者和周边环境的情况，一边大声呼救，争取更多人来帮忙（2）工具施救：不会游泳者，切忌直接下水拉拽溺水者，以防被溺水者拉入水中。如果身边有竹竿、绳子、救生圈等救人工具，就利用这些工具开展施救（3）下水施救：若没有可借助的施救工具，而导游或其他施救者懂水性、能游泳，可考虑开展下水救助。·施救者应先快速脱掉外衣裤，以防被溺水者扯住衣物而无法脱身；·接近溺水者后，施救者应设法从溺水者背后抱住或拉住其腋窝，采用侧泳或仰泳方式将其拖带上岸。","figures":[]},{"no":118,"type":"single","q":"下列自然状况中，（ ）预示上游可能发生泥石流了。","opt":["A.河床中正常流水断流并伴有较多的柴草树木，沟谷内传来类似火车轰鸣声","B.山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象","C.地面忽然出现上下晃动，然后再左右晃动","D.海水异常退去时，大量鱼虾等海生动物留在浅滩"],"ans":"A","analysis":"泥石流前兆：若观察到河（沟）床中正常流水断流或水流突然增大并伴有较多的柴草树木，听到沟谷内传来类似火车轰鸣声或闷雷声，这表明沟谷上游可能已发生山洪泥石流。","figures":[]},{"no":119,"type":"single","q":"外国人来中国旅游（ ）人及以上可以申请团体旅游签证。","opt":["A.9","B.10","C.11","D.20"],"ans":"A","analysis":"外国人来中国旅游时，需向中国驻外使、领馆申请旅游签证（L字签证），该签证属于普通签证范畴。若9人及以上组团来中国旅游，则可申请团体旅游签证。","figures":[]},{"no":120,"type":"single","q":"台湾居民往来大陆通行证分为（ ）两种类型。","opt":["A.5年有效和1个月一次有效","B.5年有效和6个月一次有效","C.10年有效和6个月一次有效","D.5年有效和3个月一次有效"],"ans":"D","analysis":"台湾居民来往大陆通行证分为5年有效和3个月一次有效两种类型。","figures":[]},{"no":121,"type":"single","q":"下列物品中，可以出境的是（ ）。","opt":["A.伪造的货币及伪造的有价证券","B.动物、植物（均含标本）及其种子和繁殖材料","C.珍贵文物","D.各种武器、仿真武器、弹药及爆炸物品"],"ans":"B","analysis":"（1）列入禁止入境范围的所有物品；（2）内容涉及国家秘密的手稿、印刷品、胶卷、照片、唱片、影片、录音带、录像带、激光视盘、计算机存储介质及其他物品；（3）珍贵文物及其他禁止出境的文物；（4）濒危的和珍贵的动物、植物（均含标本）及其种子和繁殖材料","figures":[]},{"no":122,"type":"single","q":"国内头等舱的英文代码为（ ）。","opt":["A.D","B.C","C.F","D.Y"],"ans":"C","analysis":"国内客票头等舱F。","figures":[]},{"no":123,"type":"single","q":"关于使用便携式电子设备描述正确的选项是（ ）。","opt":["A.禁止在航空器上使用发射功率在160mW（含）以上、Wi·Fi工作频率不在2.4GHz波段的便携式电子设备","B.滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用笔记本电脑、平板电脑","C.滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用心脏起搏器、助听器","D.智能手机、电子书、视频播放器不在限制范围，可以自由使用"],"ans":"B","analysis":"禁止在航空器上使用发射功率在100mW（含）以上、Wi·Fi工作频率不在2.4GHz波段的便携式电子设备，如无发射功率标识的手机、卫星电话、移动Wi·Fi、对讲机、无人机遥控平台、遥控玩具和其他带遥控装置的便携式电子设备；在滑行、起飞爬升和下降着陆等飞行关键阶段禁止使用，但在非飞行关键阶段允许使用的便携式电子设备，包括持续正压呼吸机（CPAP）、笔记本电脑、平板电脑等；关闭蜂窝通信功能，选择飞行模式后可在航空器上全程使用的单手可握持的小型便携式电子设备，如智能手机、电子书、视频播放器、游戏机等。但在飞行关键阶段不得连接耳机、充电口等外围设备，不得使用语音通信；允许在航空器上全程使用的电子设备，包括心脏起搏器、助听器","figures":[]},{"no":124,"type":"single","q":"关于购买火车票的规定正确的是（ ）。","opt":["A.7周岁（含）-14周岁可以购买儿童优惠票","B.每名持票成人可免费携1名未满6周岁且不占座儿童","C.一名成人携带2名身高不足1.2米的儿童，两名儿童都需要买儿童票","D.非实名制列车14周岁以上购买全价票"],"ans":"B","analysis":"实名制列车6周岁（含）-14周岁购买儿童优惠票·每名持票成人可免费携带1名未满 6周岁且不占座儿童；14周岁以上购买全价票·超员需购儿童优惠票非实名制列车身高1.2米（含）-1.5米购买儿童优惠票·每名持票成人可免费携带1名身高不足 1.2米且不占座儿童；身高超1.5米购买全价票·超员需购儿童优惠票","figures":[]},{"no":125,"type":"single","q":"禁止随身携带但是可以托运的物品是（ ）。","opt":["A.鞭炮","B.打火机一个","C.强硫酸","D.手术刀"],"ans":"D","analysis":"禁止随身携带但可托运：手术刀/刨刀/铣刀等。","figures":[]},{"no":126,"type":"single","q":"水烧开了，折合华氏度是（ ）。","opt":["A.126","B.178","C.198","D.212"],"ans":"D","analysis":"华氏度=摄氏度×9÷5+32，100度水，212华氏度。","figures":[]},{"no":127,"type":"single","q":"关于时区描述正确的一项是（ ）。","opt":["A.以北京时间为准，“+”表示比北京时间晚，“-”表示比北京时间早","B.北京位于东8区，我们国家横跨5个时区，有5个时间标准","C.经过格林尼治天文台的零度为标准线，从西经7度半到东经7度半为中区","D.伦敦位于欧洲，比中国晚了7个小时"],"ans":"C","analysis":"中国幅员辽阔，东西横跨经度64度，跨5个时区（从东5区到东9区），为方便起见以北京时间作为标准时间；北京0时与世界主要城市的时差表，“+”表示比北京时间早，“-”表示比北京时间晚；以经过格林尼治天文台的零度为标准线，从西经7度半到东经7度半为中区（称为0时区）；伦敦位于欧洲，比中国晚了8个小时。","figures":[]},{"no":128,"type":"single","q":"一件LV的衣服价格为5万元，按照原税率13%计算，税收机关要收取2%的手续费用，最后可以退税到手（ ）元。","opt":["A.1500","B.3000","C.4500","D.6000"],"ans":"C","analysis":"基准退税率：·原税率13%→退税率11%，实退金额=物品金额×（退税率-2%手续费），所以实际到手4500元.","figures":[]},{"no":129,"type":"single","q":"下列险种中，（ ）是强制保险。","opt":["A.旅行社责任险","B.航空旅客意外伤害保险","C.旅游意外保险","D.铁路意外伤害保险"],"ans":"A","analysis":"保险期限：旅行社责任险为强制性保险，保险期限为1年。","figures":[]},{"no":130,"type":"single","q":"世界上发行最早的信用卡是（ ）。","opt":["A.维萨卡","B.大莱卡","C.万事达卡","D.运通卡"],"ans":"B","analysis":"大莱卡（DinnersClubCard）：为世界上发行最早的信用卡，由大莱卡国际有限公司统一管理。","figures":[]},{"no":131,"type":"multi","q":"《宪法》规定，以下关于公民财产权的描述，正确的是（ ）。","opt":["A.公民的私有财产不受侵犯","B.国家依照法律规定保护公民的私有财产权","C.国家依照法律规定保护公民的继承权","D.国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收并补偿","E.国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行无偿征用"],"ans":"BCD","analysis":"公民的合法的私有财产不受侵犯；国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿。其余选项描述正确。","figures":[]},{"no":132,"type":"multi","q":"《旅游法》规定，旅游业发展应当遵循（ ）相统一的原则。","opt":["A.社会效益","B.文化效益","C.经济效益","D.生态效益","E.环境效益"],"ans":"ACD","analysis":"《旅游法》第4条，旅游业发展应当遵循社会效益、经济效益和生态效益相统一的原则。","figures":[]},{"no":133,"type":"multi","q":"根据《旅游法》的规定，旅游者有下列（ ）情形之一的，旅行社可以解除合同。","opt":["A.身体突发严重疾病，无法继续旅行","B.携带危害公共安全物品的","C.从事违法或者违反社会公德的活动的","D.在行程中有旅游不文明行为，且不听劝阻","E.法律规定的其他情形"],"ans":"CE","analysis":"《旅游法》第66条规定，旅游者有下列情形之一的，旅行社可以解除合同：（1）患有传染病等疾病，可能危害其他旅游者健康和安全的；（2）携带危害公共安全的物品且不同意交有关部门处理的；（3）从事违法或者违反社会公德的活动的；（4）从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；（5）法律规定的其他情形。“身体突发严重……”不在情形内;“携带危害……”表述太过绝对；“在行程中有旅游不文明行为，且不听劝阻”表述错误，是“从事严重影响其他旅游者权益的活动”。","figures":[]},{"no":134,"type":"multi","q":"无民事行为能力人或者限制民事行为能力人在教育机构学习、生活期间受到人身损害的，下列表述正确的是（ ）。","opt":["A.无民事行为能力人受到人身损害的，教育机构应当承担侵权责任","B.受到教育机构以外的第三人人身损害的，由第三人承担侵权责任","C.受到第三人人身损害的，教育机构未尽到管理职责的，承担相应的连带责任","D.受到第三人人身损害的，教育机构承担补充责任后，无权向第三人追偿","E.限制民事行为能力人受到人身损害的，教育机构应当承担侵权责任"],"ans":"AB","analysis":"《民法典》第1199条规定，无民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间受到人身损害的，幼儿园、学校或者其他教育机构应当承担侵权责任；但是，能够证明尽到教育、管理职责的，不承担侵权责任。第1200条规定，限制民事行为能力人在学校或者其他教育机构学习、生活期间受到人身损害，学校或者其他教育机构未尽到教育、管理职责的，应当承担侵权责任。第1201条规定，无民事行为能力人或者限制民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间，受到幼儿园、学校或者其他教育机构以外的第三人人身损害的，由第三人承担侵权责任；幼儿园、学校或者其他教育机构未尽到管理职责的，承担相应的补充责任。幼儿园、学校或者其他教育机构承担补充责任后，可以向第三人追偿。","figures":[]},{"no":135,"type":"multi","q":"根据《旅行社条例》规定，以下关于旅行社设立分社和服务网点的相关规定中，正确的是（ ）。","opt":["A.服务网点以旅行社的名义开展旅游接待业务","B.每设立1个经营国内旅游业务和入境旅游业务的分社，增存5万元质量保证金","C.设立分社和服务网点要在办理登记之日起5个工作日内向各自所在地的旅游行政管理部门备案","D.分社设立不受地域限制","E.设立社在其所在地的省外设立服务网点的，由其省外分社设立"],"ans":"BD","analysis":"服务网点不能从事旅游接待业务；“5个工作日”错误，设立分社和服务网点要在办理登记之日起3个工作日内向各自所在地的旅游行政管理部门备案；设立社在其所在地的省、自治区、直辖市行政区划外设立分社的，可以在该分社所在地设区的市的行政区划内设立服务网点。分社不得设立服务网点。","figures":[]},{"no":136,"type":"multi","q":"某旅行社在旅游旺季临时聘用导游王某，但未向其支付导游服务费用。对此，依据《中华人民共和国旅游法》，由旅游主管部门（ ）。","opt":["A.责令改正","B.没收违法所得","C.责令停业整顿","D.并处5000元以上5万元以下的罚款","E.情节严重的，责令停业整顿或者吊销旅行社业务经营许可证"],"ans":"ABDE","analysis":"《旅游法》第96条规定，旅行社未向临时聘用的导游支付导游服务费用或要求导游垫付或者向导游收取费用的，由旅游主管部门责令改正，没收违法所得，并处5000元以上5万元以下罚款；情节严重的，责令停业整顿或者吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处2000元以上2万元以下罚款。","figures":[]},{"no":137,"type":"multi","q":"导游人员调整或者变更接待计划的条件包括（ ）。","opt":["A.在引导旅游者旅行、游览过程中","B.遇到可能危及旅游者人身、财产安全的紧急情形","C.征得多数旅游者的同意","D.征得所有旅游者的同意","E.立即报告旅行社"],"ans":"ACE","analysis":"《导游人员管理条例》第13条规定，导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。","figures":[]},{"no":138,"type":"multi","q":"依据《导游人员管理条例》，以下人员可以参加导游人员资格考试的是（ ）。","opt":["A.定居海外的华侨","B.18周岁以上的我国在校大学生","C.患有高血压的公司员工小李","D.可用手语交流的高中毕业的聋哑人小孙","E.未满16周岁的某高中毕业生"],"ans":"ABCE","analysis":"国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：中华人民共和国公民；具有高级中学、中等专业学校或者以上学历；身体健康；具有适应导游需要的基本知识和语言表达能力。注意：华侨是具有中华人民共和国国籍。","figures":[]},{"no":139,"type":"multi","q":"依据《中华人民共和国消费者权益保护法实施条例》，经营者处理敏感个人信息，应当遵守法律、行政法规的规定。下列属于条例列明的敏感个人信息的有（ ）。","opt":["A.宗教信仰","B.医疗健康信息","C.日常消费记录","D.不满14周岁未成年人的个人信息","E.行踪轨迹"],"ans":"ABDE","analysis":"经营者处理包含消费者的生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息以及不满14周岁未成年人的个人信息等敏感个人信息的，应当符合有关法律、行政法规的规定。（第23条）C项错误：日常消费记录不属于条例列举的敏感个人信息范围，属于普通个人信息，该项具有较强的迷惑性。","figures":[]},{"no":140,"type":"multi","q":"《旅游法》规定，旅游者与旅游经营者发生纠纷，可以通过下列（ ）途径解决。","opt":["A.双方协商","B.向旅游投诉受理机构申请调解","C.向消费者协会申请调解","D.根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁","E.对处理结果不服的，可以向文化和旅游主管部门申请行政复议"],"ans":"ABCD","analysis":"《中华人民共和国旅游法》第九十二条旅游者与旅游经营者发生纠纷，可以通过下列途径解决：（一）双方协商；（二）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（三）根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（四）向人民法院提起诉讼。\nA项正确，双方协商属于法定纠纷解决途径。\nB项正确，向旅游投诉受理机构申请调解属于法定纠纷解决途径。\nC项正确，向消费者协会申请调解属于法定纠纷解决途径。\nD项正确，依据仲裁协议提请仲裁机构仲裁属于法定纠纷解决途径。\nE项错误，行政复议是针对行政机关行政行为不服的救济方式，不属于本条规定旅游者和旅游经营者之间民事纠纷的解决途径。","figures":[]},{"no":141,"type":"multi","q":"《旅游安全管理办法》规定，旅行社组织出境旅游，应当制作安全信息卡。安全信息卡应当包括（ ）等信息。","opt":["A.旅游者姓名","B.籍贯","C.身份证号码","D.紧急情况下的联系人","E.紧急情况下的联系方式"],"ans":"ADE","analysis":"《旅游安全管理办法》第12条规定，旅行社组织出境旅游，应当制作安全信息卡。安全信息卡应当包括旅游者姓名、出境证件号码和国籍，以及紧急情况下的联系人、联系方式等信息，使用中文和目的地官方语言（或者英文）填写。旅行社应当将安全信息卡交由旅游者随身携带，并告知其自行填写血型、过敏药物和重大疾病等信息。“籍贯”应为“国籍”；“身份证号码”应为“出境证件号码”。","figures":[]},{"no":142,"type":"multi","q":"旅游经营者或者旅游辅助服务者为旅游者代管的行李物品损毁、灭失，旅游者请求赔偿损失的，人民法院应予支持，但下列（ ）情形除外。","opt":["A.损失是由于意外事件造成的","B.损失是由于旅游者的过错造成的","C.损失是由于旅游者未听从旅游经营者提示，未将现金随身携带造成的","D.损失是由于不可抗力造成的","E.损失是由于行李放在旅游大巴车上被盗造成的"],"ans":"ABCD","analysis":"旅游经营者或者旅游辅助服务者为旅游者代管的行李物品损毁、灭失，旅游者请求赔偿损失的，人民法院应予支持，但下列情形除外：（1）损失是由于旅游者未听从旅游经营者或者旅游辅助服务者的事先声明或者提示，未将现金、有价证券、贵重物品由其随身携带而造成的；（2）损失是由于不可抗力、意外事件造成的；（3）损失是由于旅游者的过错造成的；（4）损失是由于物品的自然属性造成的。选项“损失是由于行李放在旅游大巴车上被盗造成的”，旅游大巴车属于旅游经营者的履行辅助人，旅游经营者需要承担旅游者的损失赔偿。","figures":[]},{"no":143,"type":"multi","q":"根据《文物保护法》规定，下列文物受国家法律保护（ ）。","opt":["A.具有历史、艺术、科学价值的古文化遗址","B.与重大历史事件有关的近现代重要史迹、实物、代表性建筑","C.历史上各时代珍贵的艺术品、工艺美术品","D.历史上各时代的文献资料","E.反映历史上各时代、各民族社会制度、社会生产和社会生活的代表性实物"],"ans":"ABCE","analysis":"《文物保护法》第2条列举了受国家保护的文物范围。正确选项为A、B、C、E。\nA项正确：对应第2条第1项“具有历史、艺术、科学价值的古文化遗址、古墓葬、古建筑、石窟寺和古石刻、古壁画”\nB项正确：对应第2条第2项“与重大历史事件、革命运动或者著名人物有关的以及具有重要纪念意义、教育意义或者史料价值的近代现代重要史迹、实物、代表性建筑”\nC项正确：对应第2条第3项“历史上各时代珍贵的艺术品、工艺美术品”\nD项错误：法律规定保护的是“历史上各时代重要的文献资料、手稿和图书资料等”，并非所有文献资料\nE项正确：对应第2条第5项“反映历史上各时代、各民族社会制度、社会生产、社会生活的代表性实物”。","figures":[]},{"no":144,"type":"multi","q":"根据《风景名胜区条例》,下列属于风景名胜区内条例明确禁止开展的活动有（ ）。","opt":["A.开山、采石、开矿、开荒、修坟立碑","B.在景物或者设施上刻划、涂污","C.改变水资源、水环境自然状态的活动","D.修建储存腐蚀性物品的设施","E.乱扔垃圾"],"ans":"ABDE","analysis":"《风景名胜区条例》第二十六条：在风景名胜区内禁止进行下列活动：（一）开山、采石、开矿、开荒、修坟立碑等破坏景观、植被和地形地貌的活动；（二）修建储存爆炸性、易燃性、放射性、毒害性、腐蚀性物品的设施；（三）在景物或者设施上刻划、涂污；（四）乱扔垃圾。故答案为ABDE。第二十九条规定，改变水资源、水环境自然状态的活动属于经审核批准后方可开展，并非条例直接禁止的活动。故C选项错误。","figures":[]},{"no":145,"type":"multi","q":"依据习近平新时代中国特色社会主义思想相关理论，下列属于“四个自信”内容的有（ ）。","opt":["A.理论自信","B.民族自信","C.道路自信","D.制度自信","E.文化自信"],"ans":"ACDE","analysis":"我们要坚持对马克思主义的坚定信仰、对中国特色社会主义的坚定信念，坚定道路自信、理论自信、制度自信、文化自信，以更加积极的历史担当和创造精神为发展马克思主义作出新的贡献。ACDE项正确，属于“四个自信”的组成内容。\nB项错误，民族自信不属于“四个自信”的组成内容。","figures":[]},{"no":146,"type":"multi","q":"党的二十大报告指出，十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是（ ），二是（ ），三是（ ），实现第一个百年奋斗目标。","opt":["A.迎来中国共产党成立一百周年","B.中国特色社会主义进入新时代","C.完成脱贫攻坚、全面建成小康社会的历史任务","D.初步建成社会主义现代化国家","E.创立新时代中国特色社会主义思想"],"ans":"ABC","analysis":"《党的二十大报告》指出：“十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是迎来中国共产党成立一百周年，二是中国特色社会主义进入新时代，三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。”因此，正确选项是ABC。","figures":[]},{"no":147,"type":"multi","q":"《英烈法》规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。英雄烈士的（ ）受法律保护。","opt":["A.事迹","B.姓名","C.肖像","D.名誉","E.荣誉"],"ans":"BCDE","analysis":"《英烈法》第22条规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。国家从行政、民事、刑事等方面全面加强对英雄烈士的保护。注意区分“事迹和精神”与“姓名、肖像、名誉和荣誉”。","figures":[]},{"no":148,"type":"multi","q":"下列选项中，对于导游人员仪表礼仪描述正确的是（ ）。","opt":["A.为了保持良好形象，导游可以在带团中施浓妆","B.带团前忌吃葱、蒜、韭菜等易留异味的食物","C.衣物应无褶皱、污渍、破损，领口、袖口保持干净","D.避免低胸、露脐、超短裙等过度暴露的服饰","E.头发被吹乱后，应及时梳理，可当众梳头，以免失礼"],"ans":"BCD","analysis":"女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆或补妆；带团前忌吃葱、蒜、韭菜等易留异味的食物；衣物应无褶皱、污渍、破损，领口、袖口保持干净；避免低胸、露脐、超短裙等过度暴露的服饰；头发被吹乱后，应及时梳理，不可当众梳头，以免失礼。","figures":[]},{"no":149,"type":"multi","q":"地陪导游在落实接待计划时，应该包括（ ）。","opt":["A.核对日程安排","B.旅游团及成员的特殊要求与注意事项","C.与全陪联系","D.落实接待车辆","E.了解不熟悉的参观游览点"],"ans":"ACDE","analysis":"B项是熟悉接待计划而不是落实接待计划，其他选项正确。","figures":[]},{"no":150,"type":"multi","q":"旅游团抵达后，地陪导游服务的内容有（ ）。","opt":["A.致欢迎词","B.迎接旅游团","C.核实团队信息","D.集中清点行李","E.行程介绍"],"ans":"BCD","analysis":"旅游团抵达后的服务：持证上岗；迎接旅游团；核实团队信息；集中清点行李；集合登车。","figures":[]},{"no":151,"type":"multi","q":"地陪带团返程途中，需要完成（ ）等工作任务。","opt":["A.回顾当天活动","B.沿途风光导游","C.宣布次日活动安排","D.随时清点人数","E.将游客送回房间"],"ans":"ABC","analysis":"返程途中：回顾当天活动；沿途风光导游；宣布次日活动安排。","figures":[]},{"no":152,"type":"multi","q":"全陪为游客提供途中服务的内容包括（ ）。","opt":["A.协助旅游者登机（车、船）","B.与旅游者多交流","C.照顾患病旅游者","D.注意旅游者人身和财物安全","E.负责联系即将到达站的酒店"],"ans":"ABCD","analysis":"途中服务：协助旅游者登机（车、船）；与旅游者多交流；照顾患病旅游者；注意旅游者人身和财物安全；处理突发问题（问题响应与协同解决）；联络协调上下站（行程衔接与沟通桥梁）。","figures":[]},{"no":153,"type":"multi","q":"领队带领游客文明出行，在登机或出入口岸时应该（ ）。","opt":["A.提醒游客提前办理检票、安检、托运行李等手续，不携带违禁物品","B.组织游客依序候机（车、船），并优先安排老人、未成年人、孕妇、残障人士","C.提醒游客不抢座、不占位，座位让给老人、孕妇、残障人士和带婴幼儿的游客","D.主动配合机场、车站、港口以及安检、边防（移民局）、海关的检查和指挥","E.避免不文雅的举止，不无限制索要免费餐饮"],"ans":"ABCD","analysis":"E项不是登机或者出入口岸，而是乘坐交通工具时应该遵守的，所以E不对，其余选项正确。","figures":[]},{"no":154,"type":"multi","q":"下列对于导游劝慰游客所用方法，正确的是（ ）。","opt":["A.通过摆事实、讲道理、分清利弊得失，层层分析推进，这是正面引导法","B.采用旁敲侧击的劝慰方法，即侧面“兜圈子”，也称简介引导法","C.采用含蓄隐晦的动作或声音暗示旅游者接受劝告的方法是间接暗示法","D.主动给出双方都能接受的解决方案，叫替代方案法","E.提出要求时，导游有条件地答应，而实际上该条件基本无法满足，叫做婉转拒绝法"],"ans":"AC","analysis":"劝慰的技巧：正面引导法：问题出现后，导游通过摆事实、讲道理、分清利弊得失，层层分析推进，直至说服旅游者；侧面迂回法：事情发生后，导游不直接对旅游者进行劝慰，而是采用旁敲侧击的劝慰方法，即侧面迂回法，也称“兜圈子”；间接暗示法：发现问题时，导游既不直接明说，也不从侧面劝告，而是采用含蓄隐晦的动作或声音暗示旅游者接受劝告的方法。","figures":[]},{"no":155,"type":"multi","q":"导游带领商务团旅行的时候，应该（ ）。","opt":["A.突出专业性，在穿着上保持专业的职业形象","B.掌握常用商务礼仪，景点游览宜少而精","C.导游在接待安排中应提供快速高效的服务","D.把握灵活性，谁是准备应对旅游行程的变更","E.不该看的不看，不该问的不问，不该听的不听"],"ans":"ACD","analysis":"B选项后半句是老年团的带团方式；E选项是政务团带团的要求，其余都对。","figures":[]},{"no":156,"type":"multi","q":"旅游者要求亲友随团，导游应该（ ）。","opt":["A.在条件允许（如车上有空位）且不影响其他人的情况下，可满足旅游者要求","B.事先要征得领队和旅游团其他成员的同意","C.导游协助旅游者办理入团手续，并交付各种费用","D.对随团活动的亲友应特殊照顾","E.如果不缴纳费用就直接随团活动，导游直接令其下车"],"ans":"ABC","analysis":"旅游者要求亲友随团的处理1.条件允许时：在条件允许（如车上有空位）且不影响其他人的情况下，可满足旅游者要求，但事先要征得领队和旅游团其他成员的同意；2.协助办理：手续导游协助旅游者办理入团手续，并交付各种费用；3.热情服务：导游对随团活动的亲友应热心服务，一视同仁，并根据情况给予照顾；4.解释规定：如果旅游者亲友不办理手续、不交纳费用就直接随团活动，导游应有礼貌地向；旅游者及其亲友解释旅行社的有关规定，并做好解释工作。","figures":[]},{"no":157,"type":"multi","q":"旅游途中旅游者晕动病发作，导游应（ ）。","opt":["A.提醒旅游者可通过听音乐、赏远处风光等转移注意力","B.协调换至平稳位置，通风透气呼吸新鲜空气","C.涂抹风油精、清凉油于太阳穴等处提神","D.备食品袋、塑料袋、纸巾或毛巾，方便清理个人卫生","E.症状严重时，乘坐客车可请司机尽快停车，让旅游者下车缓解"],"ans":"ABCDE","analysis":"本题说法全部正确，全选。","figures":[]},{"no":158,"type":"multi","q":"当旅游者出现不当行为时，导游应（ ）。","opt":["A.应立即制止，不回避、不躲闪","B.装作没有看到，事不关己","C.严肃冷静地指出行为不当之处，提醒继续该行为的严重后果","D.立即向组团社汇报","E.若旅游者不听劝阻，及时汇报给旅行社，必要时汇报给相关主管部门，配合调查"],"ans":"ACE","analysis":"1.立即制止不当行为：发现不当行为，导游应立即制止，不回避、不躲闪2.指出问题所在：严肃冷静地指出行为不当之处，区分问题性质，提醒继续该行为的严重后果3.及时报告相关部门：若旅游者不听劝阻，导游应及时汇报给旅行社，并在协助下汇报给相关主管部门，配合调查","figures":[]},{"no":159,"type":"multi","q":"旅游过程中，因客观原因导致行程变更，导游应该（ ）。","opt":["A.第一时间将现场情况汇报给旅行社","B.将旅行社的处理建议准确、清晰地告知旅游者","C.由于是客观原因，无需过多提供情绪安抚","D.提醒各方协同做好变更后的信息通知工作","E.对旅游者进行适当补偿，包括精神补偿和物质补偿"],"ans":"ABD","analysis":"C项错误，需要安抚旅游者情绪，提供更细致的服务，如及时沟通信息、提供替代方案等；\nE项为：旅行社原因导致的变更，采用的处理方式。其余选项描述正确。","figures":[]},{"no":160,"type":"multi","q":"如果旅游者遭遇治安事故，导游老王应该（ ）。","opt":["A.迅速采取措施保护旅游者的人身和财产安全","B.在确保旅游者安全的同时，找机会拨打110报警，","C.提醒司机做好安全配合","D.做好旅游者的情绪安抚工作","E.及时向旅行社汇报情况，协助有关方面做好善后处理"],"ans":"ABDE","analysis":"1.立即采取保护措施：事故发生后，导游应迅速采取措施保护旅游者的人身和财产安全2.马上报警求助：在确保旅游者安全的同时，找机会拨打110报警，民警到达后积极配合调查并取得报案证明3.安抚旅游者情绪：做好旅游者的情绪安抚工作，并协助他们向警方查询案件信息及进展情况4.做好善后工作：及时向旅行社汇报情况，协助有关方面做好善后处理","figures":[]},{"no":161,"type":"multi","q":"为防止食物中毒事故，导游可采取以下措施：（ ）。","opt":["A.选择卫生可靠的餐厅用餐","B.每餐对食品进行留样","C.提醒旅游者勿食街边小摊食物","D.用餐时若发现菜肴、饮料不卫生立即报告旅行社","E.不吃隔夜、生冷食物及野生果实"],"ans":"ACE","analysis":"1.选择卫生可靠的餐厅用餐：安排或建议旅行社安排有卫生保障的餐厅，避免无证经营场所2.做好安全饮食提示：提醒旅游者勿食街边小摊食物，购买包装食品时查看生产日期和保质期，不吃隔夜、生冷食物及野生果实3.及时处理饮食变质问题：用餐时若发现菜肴、饮料不卫生或存在过期、变质、异味等情况，立即让餐厅撤下并采取补救措施，同时留意旅游者用餐后的状况。","figures":[]},{"no":162,"type":"multi","q":"一旦发生地震被压埋后，科学自救的要点包括（ ）。","opt":["A.保持冷静，有计划地逐步清除压在身上的物体，努力挣脱束缚","B.大声疾呼，让救援人员尽快发现自己","C.立即捂住口鼻和头部，有效过滤灰尘，防止灰尘呛闷引发窒息","D.避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为","E.一旦发现救援信号或有利时机，及时通过喊话、敲击等方式发出求救信号"],"ans":"ACDE","analysis":"（1）积极尝试挣脱：若不幸被压埋，但手部或其他身体部位仍有活动能力，应保持冷静，有计划地逐步清除压在身上的物体，努力挣脱束缚（2）保障呼吸与生存空间：当无法完全脱困时，要着重挪开头部、胸部周围的杂物，腾出足够空间，保证呼吸顺畅。如有湿毛巾、衣物或其他布料等可用，应立即捂住口鼻和头部，有效过滤灰尘，防止灰尘呛闷引发窒息，同时也能对头部提供一定保护，减轻坠落物对头部的冲击（3）稳定生存环境：利用身边的砖块、木板等坚固物品，对残垣断壁进行支撑，以扩大和稳定生存空间，降低周围物体进一步坍塌的风险，为长时间等待救援提供相对安全的环境（4）保持冷静与合理自救：被压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力。避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为，应合理分配体力，尽可能延长生存时间。要时刻留意外界动静，一旦发现救援信号或有利时机，及时通过喊话、敲击（如敲击管道、墙体等能够产生声响的物体）、使用通信工具（如手机）等方式发出求救信号，提高被救援的概率","figures":[]},{"no":163,"type":"multi","q":"发生海啸落入水中后，自救的技巧包括（ ）。","opt":["A.尽快脱掉外衣，否则吸水变重","B.保持冷静，避免举手、挣扎","C.尽快开始游泳，避免沉没","D.不饮用海水","E.尽量抓住身边大的漂浮物增加浮力"],"ans":"BDE","analysis":"保持冷静，避免举手、挣扎；尽量减少活动，漂浮水面随波漂流；尽量抓住身边大的漂浮物增加浮力；不要脱掉衣物（即使吸水变重）；尽量避免游泳；不饮用海水（即使口渴难忍）；尽量向其他落水者靠拢。","figures":[]},{"no":164,"type":"multi","q":"关于航空公司退票和变更描述正确的选项是（ ）。","opt":["A.承运人或代理人退票费不超客票实际售价","B.承运人原因改期或签转不收变更费","C.旅客非自愿退票依具体条款可能收费","D.航班取消/延误等航司责任变更费全免","E.特殊事件遵守客票限定条件通常收费"],"ans":"ABD","analysis":"承运人或代理人按运输总条件、客票使用条件办理，退票费不超客票实际售价，特价机票并非全都不退改签；承运人原因改期或签转：承运人或代理人应在有可利用座位或签转承运人同意时，免费为旅客改期或签转，不收变更费非承运人原因客票变更：按运输总条件、客票使用条件处理依具体条款可能收费非自愿退票：承运人或代理人不收退票费；航班取消/延误等航司责任全免（变更费）；航司原因或特殊事件，全免（退票费）。","figures":[]},{"no":165,"type":"multi","q":"为了确保游客滑雪的安全，作为导游应该提醒旅游者（ ）。","opt":["A.身着颜色与雪面白色有较大反差的滑雪服","B.如果是初学者选择平缓宽敞的初级场地","C.不在拥挤滑雪道上低速滑行","D.保持与其他滑雪者的安全距离","E.选择保暖性能好的滑雪服，佩戴手套、帽子等保暖物品"],"ans":"ABDE","analysis":"C选项错误，不在拥挤滑雪道上高速滑行。其余选项描述正确。","figures":[]}];


const STORAGE_KEY = 'guide-exam-lei2-ke12-2026-v1';
const byNo = new Map(questions.map(q=>[q.no,q]));
let idx=0, mode='all', pool=questions.map(q=>q.no), records={}, wrongSet=new Set();
const el=id=>document.getElementById(id);
function normalized(values){return [...new Set(values)].sort().join('');}
function current(){return byNo.get(pool[idx]);}
function persist(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,currentNo:pool[idx]??null,mode,pool,records,wrong:[...wrongSet]}));
        el('storageStatus').textContent='已自动保存到本机浏览器。请使用同一浏览器打开此文件；清理浏览器数据会删除记录。';
    }catch(e){el('storageStatus').textContent='浏览器未能保存记录，请检查是否禁用了本地存储。当前页面仍可正常答题。';}
}
function restore(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const s=JSON.parse(raw);
        if(s.version!==2)throw new Error('version');
        for(const q of questions){
            const r=s.records?.[q.no];
            if(!r||!Array.isArray(r.selected))continue;
            const selected=[...new Set(r.selected.filter(v=>q.opt.some(o=>o[0]===v)))];
            if(q.type!=='multi'&&selected.length>1)continue;
            records[q.no]={selected,submitted:r.submitted===true&&selected.length>0};
        }
        wrongSet=new Set((Array.isArray(s.wrong)?s.wrong:[]).filter(n=>byNo.has(n)));
        mode=s.mode==='wrong'?'wrong':'all';
        pool=mode==='wrong'?[...new Set((Array.isArray(s.pool)?s.pool:[]).filter(n=>byNo.has(n)&&wrongSet.has(n)))]:questions.map(q=>q.no);
        if(mode==='wrong'&&!pool.length)pool=[...wrongSet];
        idx=Math.max(0,pool.indexOf(s.currentNo));
    }catch(e){el('storageStatus').textContent='原保存记录无法读取，本次从头开始。';}
}
function questionPoints(item){return item.type==='multi'?1:0.5;}
function scoreSummary(){
 let score=0,max=0,answered=0,count=0;
 for(const item of questions){
  if(!item.ans)continue;
  const points=questionPoints(item);max+=points;count++;
  const record=records[item.no];if(!record?.submitted)continue;
  answered++;
  if(normalized(record.selected)===normalized(item.ans.split('')))score+=points;
 }
 return {score,max,answered,count};
}
function render(){
    const summary=scoreSummary();
    el('score').textContent=summary.score;el('scoreMax').textContent=summary.max;
    el('gradedCount').textContent=summary.answered;el('gradableCount').textContent=summary.count;
    const item=current();
    let right=0,wrong=0;
    for(const q of questions){const r=records[q.no];if(r?.submitted){normalized(r.selected)===normalized(q.ans.split(''))?right++:wrong++;}}
    el('r').textContent=right;el('w').textContent=wrong;
    el('cur').textContent=pool.length?idx+1:0;el('total').textContent=pool.length;
    el('wrongBtn').textContent='刷错题（'+wrongSet.size+'）';
    el('allBtn').disabled=mode==='all';el('wrongBtn').disabled=mode==='wrong';
    el('modeHint').textContent=(mode==='wrong'?'错题练习':'全部题目')+' · 已判分 '+(right+wrong)+' / '+questions.length+' 题。错题答对仍保留，可手动移出。跳转填写原题号。';
    el('prevBtn').disabled=!pool.length||idx===0;el('nextBtn').disabled=!pool.length||idx===pool.length-1;
    el('removeBtn').disabled=!item||!wrongSet.has(item.no);
    el('optBox').replaceChildren();el('ansDiv').style.display='none';
    el('submitBtn').hidden=!item||item.type!=='multi';
    if(!item){el('q').textContent='错题本为空，继续做题后，答错的题会自动加入。';el('answerHint').textContent='点击“全部题目”继续练习。';return;}
    const r=records[item.no]||{selected:[],submitted:false};
    el('q').textContent='【'+item.no+' · '+({judge:'判断题',single:'单选题',multi:'多选题'}[item.type])+'】'+item.q;
    el('answerHint').textContent=item.type!=='multi'?'选择后立即判断对错并显示解析。':'选好后点击“提交答案”，才会判断对错并显示解析。';
    el('submitBtn').disabled=r.submitted||!r.selected.length;
    for(const o of item.opt){
        const val=o[0],label=document.createElement('label'),input=document.createElement('input');
        label.className='opt';input.type=item.type==='multi'?'checkbox':'radio';input.name='answer';input.value=val;input.checked=r.selected.includes(val);
        if(input.checked)label.classList.add('selected');
        if(r.submitted&&item.ans.includes(val))label.classList.add('correct');
        if(r.submitted&&input.checked&&!item.ans.includes(val))label.classList.add('incorrect');
        input.addEventListener('change',save);label.append(input,document.createTextNode(o));el('optBox').append(label);
    }
    if(r.submitted){
        const ok=normalized(r.selected)===normalized(item.ans.split(''));
        el('ansDiv').style.display='block';el('result').textContent=ok?'✅ 回答正确':'❌ 回答错误';el('result').style.color=ok?'#18733b':'#c23232';
        el('stdAns').textContent=item.opt.filter(o=>item.ans.includes(o[0])).join('；');el('analysisTxt').textContent=item.analysis;
        const box=el('figureBox');box.replaceChildren();
        for(const [i,src] of (item.figures||[]).entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题解析补充图 '+(i+1);img.loading='lazy';box.append(img);}
    }
}
function save(){
    const item=current();if(!item)return;
    records[item.no]={selected:Array.from(el('optBox').querySelectorAll('input:checked'),n=>n.value),submitted:false};
    if(item.type!=='multi')submitAnswer();else{persist();render();}
}
function submitAnswer(){
    const item=current(),r=item&&records[item.no];if(!r?.selected.length)return;
    r.submitted=true;
    if(normalized(r.selected)!==normalized(item.ans.split('')))wrongSet.add(item.no);
    persist();render();
}
function prev(){if(idx>0){idx--;persist();render();}}
function next(){if(idx<pool.length-1){idx++;persist();render();}}
function clearSel(){const item=current();if(!item)return;records[item.no]={selected:[],submitted:false};persist();render();}
function goJump(){
    const n=Number(el('goto').value),pos=pool.indexOf(n);
    if(pos<0){el('answerHint').textContent=mode==='wrong'?'请填写当前错题本中的原题号。':'请输入 1 至 '+questions.length+' 的整数题号。';return;}
    idx=pos;persist();render();
}
function setMode(value){
    const no=current()?.no;mode=value;pool=mode==='wrong'?questions.filter(q=>wrongSet.has(q.no)).map(q=>q.no):questions.map(q=>q.no);
    idx=Math.max(0,pool.indexOf(no));persist();render();
}
function removeWrong(){
    const item=current();if(!item)return;wrongSet.delete(item.no);
    if(mode==='wrong'){pool=pool.filter(n=>n!==item.no);idx=Math.max(0,Math.min(idx,pool.length-1));}
    persist();render();
}
el('goto').addEventListener('keydown',e=>{if(e.key==='Enter')goJump();});

function progressSnapshot(){return {version:2,currentNo:pool[idx]??null,mode,pool:[...pool],records:JSON.parse(JSON.stringify(records)),wrong:[...wrongSet]};}
function backupPayload(){return {format:'guide-exam-progress',backupVersion:1,examId:STORAGE_KEY,exportedAt:new Date().toISOString(),questionCount:questions.length,state:progressSnapshot()};}
function validateBackup(data){
    if(!data||data.format!=='guide-exam-progress'||data.backupVersion!==1)throw new Error('这不是支持的刷题进度文件。');
    if(data.examId!==STORAGE_KEY||data.questionCount!==questions.length)throw new Error('这份进度不属于当前题库，请在对应题库中导入。');
    const s=data.state;
    if(!s||s.version!==2||!['all','wrong'].includes(s.mode)||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.pool)||!Array.isArray(s.wrong))throw new Error('进度文件内容不完整或已损坏。');
    const validNumbers=a=>a.every(n=>Number.isInteger(n)&&byNo.has(n))&&new Set(a).size===a.length;
    if(!validNumbers(s.pool)||!validNumbers(s.wrong))throw new Error('进度文件包含无效题号。');
    if(s.mode==='all'&&(s.pool.length!==questions.length||s.pool.some((n,i)=>n!==questions[i].no)))throw new Error('全部题目的顺序不正确。');
    if(s.mode==='wrong'&&s.pool.some(n=>!s.wrong.includes(n)))throw new Error('错题列表不一致。');
    if(s.pool.length?!s.pool.includes(s.currentNo):s.currentNo!==null)throw new Error('当前题号无效。');
    for(const [no,r] of Object.entries(s.records)){
        const q=byNo.get(Number(no));
        if(!q||String(q.no)!==no||!r||!Array.isArray(r.selected)||typeof r.submitted!=='boolean'||r.selected.some(v=>typeof v!=='string'||!q.opt.some(o=>o[0]===v))||new Set(r.selected).size!==r.selected.length||(q.type!=='multi'&&r.selected.length>1)||(r.submitted&&!r.selected.length))throw new Error('作答记录格式不正确。');
    }
    return JSON.parse(JSON.stringify(s));
}
function exportProgress(){
    try{
        const payload=backupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='雷2科一科二-做题进度-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        el('transferStatus').textContent='已请求下载进度文件。苹果手机请查看 Safari 下载列表或“文件”中的下载项，再把 JSON 文件传到另一设备。';
    }catch(e){el('transferStatus').textContent='导出失败：'+e.message;}
}
function applyBackup(data){
    const s=validateBackup(data);
    // Write successfully before changing the current session, so a storage failure preserves it.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    records={};wrongSet=new Set();idx=0;mode='all';pool=questions.map(q=>q.no);restore();render();
}
async function importProgressFile(event){
    const input=event.target,file=input.files?.[0];if(!file)return;
    try{
        if(file.size>5*1024*1024)throw new Error('文件过大，请选择导出的 JSON 进度文件，不要选择 HTML 题库。');
        const data=JSON.parse((await file.text()).replace(/^\uFEFF/,'')),s=validateBackup(data);
        const answered=Object.values(s.records).filter(r=>r.submitted).length;
        if(!confirm('即将导入：已判分 '+answered+' 题，错题 '+s.wrong.length+' 题。\n这会替换本设备当前题库的进度。建议先导出当前进度备份。\n确定导入吗？')){el('transferStatus').textContent='已取消导入，原进度保留。';return;}
        applyBackup(data);el('transferStatus').textContent='导入成功！已恢复作答、错题及所在题目，后续会继续自动保存到本设备。';
    }catch(e){el('transferStatus').textContent='导入失败，原进度保留：'+e.message;}
    finally{input.value='';}
}
el('progressFile').addEventListener('change',importProgressFile);

restore();render();
</script>
</body>
</html>
