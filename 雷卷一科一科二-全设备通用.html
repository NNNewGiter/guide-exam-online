<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{max-width:1060px;margin:20px auto;padding:0 16px;background:#f6f8fa;font-size:16px;}
.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 1px 5px #0002;}
.q-title{font-size:17px;font-weight:bold;margin-bottom:16px;line-height:1.6;}
.opt{margin:9px 0;padding:7px;border-radius:5px;cursor:pointer;}
.opt:hover{background:#f2f6fa;}
.opt input{margin-right:7px;transform:scale(1.1);}
.ans-wrap{margin-top:18px;padding:12px;background:#eaf4ff;border-radius:8px;display:none;}
.ans-txt{margin-top:6px;line-height:1.6;color:#222;}
.btns{margin:15px 0;display:flex;gap:8px;flex-wrap:wrap;}
button{padding:8px 14px;border:none;border-radius:7px;background:#2772dd;color:#fff;font-size:15px;cursor:pointer;}
button:active{background:#1f62bd;}
.info{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;color:#333;align-items:center;}
input[type="number"]{padding:7px;width:70px;font-size:15px;border:1px solid #aaa;border-radius:5px;}

.opt{display:block;padding:13px;border:1px solid #dfe5ed;line-height:1.6;}
.opt.selected{border-color:#2772dd;background:#edf4ff;}
.opt.correct{border-color:#219653;background:#eaf8ef;}
.opt.incorrect{border-color:#d64545;background:#fff0f0;}
button:disabled{opacity:.45;cursor:default;}
button.secondary{background:#5b677a;}
.hint{color:#596579;font-size:14px;line-height:1.7;}
#result{font-weight:bold;margin-bottom:8px;}
#storageStatus{margin-top:14px;}
@media(max-width:600px){body{margin:12px auto;padding:0 10px}.card{padding:16px}h2{font-size:21px}.btns button{flex:1;min-width:100px}}

/* iPhone / Android tablet adaptive layout */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;}
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{width:100%;max-width:1100px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:20px 18px;padding: max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));line-height:1.65;}
.card{min-width:0;padding:24px;}
h2{font-size:clamp(20px,2.7vw,28px);line-height:1.5;margin:0 0 20px;overflow-wrap:anywhere;}
.info{gap:10px 18px;align-items:center;}
.info>div,.info>span{min-width:0;}
button{min-height:48px;padding:11px 16px;font-size:16px;line-height:1.4;touch-action:manipulation;}
button:focus-visible,input:focus-visible{outline:3px solid #945700;outline-offset:3px;}
button[hidden]{display:none!important;}
input[type="number"]{min-height:48px;width:82px;max-width:100%;font-size:16px;vertical-align:middle;}
input[type="radio"],input[type="checkbox"]{width:21px;height:21px;min-width:21px;margin:3px 10px 0 0;transform:none;vertical-align:top;accent-color:#2772dd;}
.opt{min-height:52px;padding:14px;margin:12px 0;font-size:18px;line-height:1.75;overflow-wrap:anywhere;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.q-title{font-size:20px;line-height:1.85;overflow-wrap:anywhere;}
.ans-wrap{font-size:17px;line-height:1.85;padding:16px;overflow-wrap:anywhere;}
.hint{font-size:15px;overflow-wrap:anywhere;}
.btns{gap:10px;}
.main-actions{position:sticky;bottom:0;z-index:5;margin:20px 0 0;padding:12px 0;background:#fff;border-top:1px solid #dfe5ed;padding-bottom:max(12px,env(safe-area-inset-bottom));}
.main-actions button{flex:1;min-width:110px;}
@media(hover:hover) and (pointer:fine){.opt:hover{box-shadow:0 0 0 1px #2772dd;}}
@media(hover:none){.opt:hover{background:transparent;}.opt.selected:hover{background:#edf4ff;}.opt.correct:hover{background:#eaf8ef;}.opt.incorrect:hover{background:#fff0f0;}}
@media(max-width:599px){
 body{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));}
 .card{padding:16px 12px;border-radius:12px;}
 .info{gap:10px;font-size:15px;}
 .info>div:first-child{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
 .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
 .btns button{min-width:0;width:100%;padding:11px 8px;}
 #removeBtn{grid-column:1 / -1;}
 .q-title{font-size:18px;line-height:1.85;}
 .opt{font-size:17px;padding:13px 10px;}
 .ans-wrap{font-size:16px;}
 .main-actions{gap:8px;}
}
@media(min-width:600px) and (max-width:1199px){
 body{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));}
 .card{padding:28px;}
 .btns button{min-width:140px;}
 .opt{padding:17px 18px;}
}
@media(max-height:500px) and (orientation:landscape){.main-actions{position:static;display:flex;flex-wrap:wrap;}.main-actions button{flex:1;min-width:100px;}}

#analysisTxt{white-space:pre-wrap;}#figureBox img{display:block;max-width:100%;height:auto;margin:18px auto;border:1px solid #dde3ec;border-radius:6px;}
.transfer-panel{margin-top:22px;padding:16px;border:1px solid #dfe5ed;border-radius:10px;background:#f8faff;}.transfer-panel p{margin:8px 0;}.transfer-panel .btns{margin:12px 0;}
</style>
</head>
<body>
<div class="card">
    <h2>2026冲刺标准卷一 · 科一科二</h2><p class="hint">雷卷一 · 完整题库 · 判断40题 / 单选90题 / 多选35题 · 电脑、手机、平板通用</p>
    <div class="info">
        <div>题号跳转：<input id="goto" type="number" min="1" max="165" step="1" inputmode="numeric" enterkeyhint="go" aria-label="跳转到原题号"><button onclick="goJump()">跳转</button></div>
        <div>当前：<span id="cur">1</span> / <span id="total">0</span></div>
        <div>✅答对：<span id="r">0</span></div>
        <div>❌答错：<span id="w">0</span></div>
    </div>


    <div class="btns"><button id="allBtn" onclick="setMode('all')">全部题目</button><button id="wrongBtn" onclick="setMode('wrong')">刷错题（0）</button><button id="removeBtn" class="secondary" onclick="removeWrong()">移出错题本</button></div>
    <p class="hint" id="modeHint"></p><p class="hint" id="answerHint" aria-live="polite"></p>
    <div>
        <div class="q-title" id="q"></div>
        <div id="optBox"></div>
        <div class="ans-wrap" id="ansDiv">
            <div id="result" role="status"></div>
            <div><b>参考答案：</b><span id="stdAns"></span></div>
            <div class="ans-txt"><b>解析：</b><span id="analysisTxt"></span></div><div id="figureBox"></div>
        </div>
    </div>
    <div class="btns main-actions" aria-label="答题操作">
        <button id="prevBtn" onclick="prev()">上一题</button>

        <button id="submitBtn" onclick="submitAnswer()">提交答案</button>
        <button onclick="clearSel()">清除选择</button>
    </div>
<section class="transfer-panel" aria-label="进度备份与转移"><b>电脑 / 手机进度转移</b><p class="hint">在做题设备上导出 JSON 文件，传到另一台设备后导入。导入将替换该设备的现有进度，建议先导出备份；这不是自动同步。</p><div class="btns"><button onclick="exportProgress()">导出进度</button><button onclick="el('progressFile').click()">导入进度</button></div><input id="progressFile" type="file" accept=".json,application/json" hidden><p id="transferStatus" class="hint" role="status" aria-live="polite"></p></section>

<script>
// 科一科二：全国导游基础知识 + 地方导游基础知识 押题卷一 1‑165题
const questions = [{"no":1,"type":"judge","q":"2026年是“十五五”开局之年，国家统筹推进水网、新型电网、算力网、新一代通信网、城市地下管网、物流网等“六张网”建设。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":2,"type":"judge","q":"平陆运河于9月16日建成通航，这是新中国成立以来我国第一条国家层面统筹建设的通江达海运河工程。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。平陆运河于9月16日建成通航，这是新中国成立以来我国第一条国家层面统筹建设的通江达海运河工程。这条国内通航等级最高的运河，按内河Ⅰ级标准建设，可通航5000吨级船舶。","figures":[]},{"no":3,"type":"judge","q":"第二艘国产大型邮轮“爱达•魔都号”于3月20日在上海出坞，邮轮总吨位达到14.19万吨。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“爱达•花城号”。第二艘国产大型邮轮“爱达•花城号”计划于3月20日在上海出坞。“爱达•花城号”邮轮总吨位达到14.19万吨。与首艘国产大型邮轮“爱达•魔都号”相比，“爱达•花城号”邮轮在设计和建造上进行了诸多改进。","figures":[]},{"no":4,"type":"judge","q":"由C919执飞的国航CA723航班于8月12日15时许从北京首都国际机场起飞，前往蒙古国首都乌兰巴托，这是C919首次执飞国际商业航班。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":5,"type":"judge","q":"根据《中华人民共和国宪法》的规定，全国人民代表大会是最高国家权力机关；全国人民代表大会和县级以上地方各级人民代表大会均设立常务委员会，作为常设机关。","opt":["A.对","B.错"],"ans":"A","analysis":"全国人民代表大会是最高国家权力机关，全国人民代表大会和县级以上地方各级人民代表大会设立常务委员会作为常设机关。","figures":[]},{"no":6,"type":"judge","q":"《旅游法》规定，旅游者数量可能达到最大承载量时，景区应当提前公告，并同时向当地人民政府报告。","opt":["A.对","B.错"],"ans":"A","analysis":"旅游者数量可能达到最大承载量时，景区应当提前公告并同时向当地人民政府报告。","figures":[]},{"no":7,"type":"judge","q":"消费争议需要进行鉴定、检测，消费者与经营者无法协商确定鉴定机构的，应当由经营者寻找第三方机构。","opt":["A.对","B.错"],"ans":"B","analysis":"双方无法协商一致时，受理投诉的市场监督管理部门或者其他有关行政部门可以指定鉴定、检测机构，并非应当由经营者自行寻找，说法错误。","figures":[]},{"no":8,"type":"judge","q":"根据《旅游安全管理办法》的规定，发布二级风险提示的，应当停止组团或者带团前往风险区域；已在风险区域的，应当调整或者中止行程。","opt":["A.对","B.错"],"ans":"A","analysis":"根据《旅游安全管理办法》规定，风险提示发布后，旅行社应当根据风险级别采取相应措施：二级风险的，停止组团或者带团前往风险区域；已在风险区域的，调整或者中止行程。故本题说法正确。","figures":[]},{"no":9,"type":"judge","q":"《旅行社条例》规定，旅行社取得经营许可满2年，且未因侵害旅游者合法权益受到行政机关罚款处罚的，可以申请经营出境旅游业务。","opt":["A.对","B.错"],"ans":"B","analysis":"《旅行社条例》第8条规定，旅行社取得经营许可满2年，且未因侵害旅游者合法权益受到行政机关罚款以上处罚的，可以申请经营出境旅游业务。故本题说法错误。","figures":[]},{"no":10,"type":"judge","q":"《旅游法》规定，旅行社不得出租、出借旅行社业务经营许可证，或者以其他形式转让旅行社业务经营许可。","opt":["A.对","B.错"],"ans":"B","analysis":"旅行社业务经营许可证可以依法转让，但不能非法转让。","figures":[]},{"no":11,"type":"judge","q":"根据《旅行社责任保险管理办法》，旅游活动中发生意外事故，旅行社依法应当承担赔偿责任的，由旅行社责任保险负责赔偿。","opt":["A.对","B.错"],"ans":"A","analysis":"依据《旅行社责任保险管理办法》，旅行社从事旅游业务经营活动，无论入境旅游、出境旅游还是国内旅游，都必须投保旅行社责任保险。旅游活动中发生意外事故，属于旅行社依法应当承担赔偿责任情形的，由旅行社责任保险在责任限额内予以赔偿。故本题说法正确。","figures":[]},{"no":12,"type":"judge","q":"根据《中华人民共和国民用航空法》的规定，航空运输的诉讼时效期间为2年，自民用航空器到达目的地点、应当到达目的地点或者运输终止之日起计算。","opt":["A.对","B.错"],"ans":"A","analysis":"第143条，航空运输的诉讼时效期间为二年，自民用航空器到达目的地点、应当到达目的地点或者运输终止之日起计算。该表述与法条原文一致，故正确。","figures":[]},{"no":13,"type":"judge","q":"国歌不得用于或者变相用于商标、广告，不得作为公共场所的背景音乐等。","opt":["A.对","B.错"],"ans":"A","analysis":"《国歌法》规定，国歌不得用于或者变相用于商标、商业广告，不得在私人丧事活动等不适宜的场合使用，不得作为公共场所的背景音乐等。故本题说法正确。","figures":[]},{"no":14,"type":"judge","q":"根据《大型群众性活动安全管理条例》，大型群众性活动包括每场次预计参加人数达到1000人以上的体育比赛活动。","opt":["A.对","B.错"],"ans":"A","analysis":"《大型群众性活动安全管理条例》规定，大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到1000人以上的活动，包括体育比赛活动，演唱会、音乐会等文艺演出，展览、展销，游园、灯会、庙会、花会、焰火晚会，人才招聘会、现场开奖的彩票销售等活动。故本题说法正确。","figures":[]},{"no":15,"type":"judge","q":"根据《风景名胜区条例》，风景名胜区是指具有观赏、文化或者科学价值，自然景观、人文景观比较集中，环境优美，可供人们游览或者进行科学、文化活动的区域。","opt":["A.对","B.错"],"ans":"A","analysis":"该表述与条例第二条对风景名胜区的法定定义完全一致,故判断为对。","figures":[]},{"no":16,"type":"judge","q":"根据《自然保护区条例》的规定，县级以上地方人民政府自然资源主管部门负责本行政区域内自然保护区的监督管理工作。","opt":["A.对","B.错"],"ans":"B","analysis":"《自然保护区条例》第六条：县级以上地方人民政府林业草原主管部门负责本行政区域内自然保护区的监督管理工作。县级以上地方人民政府其他有关部门在各自职责范围内负责自然保护区的有关监督管理工作。本行政区域内自然保护区的监督管理由县级以上地方人民政府林业草原主管部门负责,不是自然资源主管部门,故判断为错。","figures":[]},{"no":17,"type":"judge","q":"依据习近平新时代中国特色社会主义思想相关理论，建设一支听党指挥、能打胜仗、作风优良的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。","opt":["A.对","B.错"],"ans":"A","analysis":"坚持党对人民军队的绝对领导。建设一支听党指挥、能打胜仗、作风优良的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。题干表述与文档原文相符，故本题正确。","figures":[]},{"no":18,"type":"judge","q":"新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是全党全国人民为实现中华民族伟大复兴而奋斗的根本保证。","opt":["A.对","B.错"],"ans":"B","analysis":"错在“实现中华民族伟大复兴而奋斗的根本保证”，正确的表述是“行动指南”。新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。","figures":[]},{"no":19,"type":"judge","q":"学校应当每日升挂国旗，有条件的幼儿园参照学校的规定升挂国旗。","opt":["A.对","B.错"],"ans":"B","analysis":"本题表述不准确。学校除寒假、暑假和休息日外，应当每日升挂国旗。有条件的幼儿园参照学校的规定升挂国旗。","figures":[]},{"no":20,"type":"judge","q":"《关于推动在线旅游市场高质量发展的意见》提出，要加快建设网络强国、数字中国。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。意见中明确提到“贯彻落实党中央关于加快建设网络强国、数字中国决策部署”。","figures":[]},{"no":21,"type":"judge","q":"世界上首次环球旅游是1855年从莱斯特到巴黎的旅游。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。1872首次环球旅行。","figures":[]},{"no":22,"type":"judge","q":"导游服务质量是衡量旅游服务质量高低的敏感标志。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。导游服务质量是衡量旅游服务质量高低的敏感标志。","figures":[]},{"no":23,"type":"judge","q":"文化和旅游部组织特级导游等级考核，原则上采取论文答辩形式，每3年开展一次。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。文化和旅游部组织特级导游等级考核，原则上采取论文答辩形式，每4年开展一次。","figures":[]},{"no":24,"type":"judge","q":"旅游者人数超过10人时应持导游旗，少于10人时可以不持导游旗。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。旅游者人数超过10人时应持导游旗，少于10人时可根据现场情况决定是否持导游旗。","figures":[]},{"no":25,"type":"judge","q":"“导游专座”应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。\"导游专座\"应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置；为了保证安全，地陪应当坐在导游专座上。","figures":[]},{"no":26,"type":"judge","q":"如发生旅游者在境外滞留不归的事件，领队应当及时向地接社和中国驻所在国使领馆报告，寻求帮助。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。如发生旅游者在境外滞留不归的事件，领队应当及时向组团社和中国驻所在国使领馆报告，寻求帮助","figures":[]},{"no":27,"type":"judge","q":"导游老王讲解时音量应以每位旅游者都能听清为宜，如有需要，可借助扩音器辅助讲解。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。音量应以每位旅游者都能听清为宜，如有需要，可借助扩音器辅助讲解。","figures":[]},{"no":28,"type":"judge","q":"苏州是著名的江南水乡，老城内至今保持着“水陆并行、河街相邻”的双棋盘格局，被意大利旅行家马可·波罗称为“东方的威尼斯”。这种比较属于同类相似类比。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。苏州是著名的江南水乡，被称为\"东方的威尼斯\"，这种将性质相似的事物进行比较的方式属于同类相似类比。","figures":[]},{"no":29,"type":"judge","q":"除另有规定外，我国所有船舶船上每人至少应配备1件救生衣，并应至少为每位值班人员配备一件救生衣。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。除另有规定外，我国所有船舶，船上每人至少应配备1件救生衣；应至少为每位值班人员配备一件救生衣。","figures":[]},{"no":30,"type":"judge","q":"第一印象效应即首因效应，导游老王可利用首因效应，在初次接触旅游者时留下好印象，为后续工作打下基础。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。第一印象效应即首因效应，导游可利用首因效应，在初次接触旅游者时留下好印象，为后续工作打下基础。","figures":[]},{"no":31,"type":"judge","q":"全陪导游老王带领游客乘坐高铁，在检票口排队安检时，应尽量靠后，安排团队负责人在队伍最前面照看成员。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。全陪导游带领游客乘坐高铁，在检票口排队安检时，导游应尽量靠前，安排团队负责人在队伍末尾照看成员。","figures":[]},{"no":32,"type":"judge","q":"当旅游者卢女士提出需求后，导游老王可暂时不予正面答复，搁置一段时间，待其需求欲消退后达到拒绝的目的。这是正面回绝法的应用。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。拖延时间法：当旅游者提出需求后，导游可暂时不予正面答复，搁置一段时间，等旅游者的需求欲消退后，达到拒绝的目的。","figures":[]},{"no":33,"type":"judge","q":"面对游客卢女士临到饭点才提出的特殊餐饮要求，导游老王应该婉转地拒绝。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。面对旅游者临时提出的特殊餐饮需求，导游应立刻联系餐馆，尽力安排。若原餐馆无法满足要求，需另寻其他餐馆或协助旅游者自行解决。","figures":[]},{"no":34,"type":"judge","q":"全团统一要求更改景点时，导游老王需第一时间将情况上报接待社，由接待社负责与组团社进行沟通协调，征得组团社的同意。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。全团统一提出时：请示接待社计调部门，请其与组团社联系，组团社同意后方可更换或取消。","figures":[]},{"no":35,"type":"judge","q":"遭遇火灾时，若楼道出现浓烟，应尽快找毛巾沾湿并捂住口鼻，直立快速奔跑出浓烟，离开现场。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。若楼道出现浓烟，应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走。","figures":[]},{"no":36,"type":"judge","q":"当风雨渐渐减小并变成间歇性降雨，直到风力减弱、云层升高、雨势渐停，才是台风真正离开的标志。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":37,"type":"judge","q":"海啸到达前，船只听到预警应迅速驶回港口，此时港口相较于深海更为安全。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。海啸在海港中会引发巨大落差和湍流，十分危险。船主应在海啸到达前，将船只驶向开阔海面，此时深海区相较于海岸更为安全。","figures":[]},{"no":38,"type":"judge","q":"购买联程或来回程机票的旅客卢女士订妥座位后，如在联程或回程地停留超过72小时，需在航班离站前一天中午12点前办理座位再证实手续。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。购买联程或来回程机票的旅客订妥座位后，在联程或回程地停留超72小时，需在航班离站前两天中午12点前办理座位再证实手续。","figures":[]},{"no":39,"type":"judge","q":"中国民航局对旅客携带充电宝作出规定：头等舱旅客可以携带2个充电宝，而经济舱旅客只能携带1个充电宝，且额定功率不能超过160Wh。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。每名旅客携带总数不得超过2个。","figures":[]},{"no":40,"type":"judge","q":"所有火车票无论网上还是现场都仅允许改签一次。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[]},{"no":41,"type":"single","q":"2026年7月25日，在韩国釜山举行的第48届世界遗产大会上，由中国申报的“景德镇手工瓷业遗存”项目经世界遗产委员会审议，成功列入《世界遗产名录》，成为中国第（ ）项世界遗产。","opt":["A.59项","B.60项","C.61项","D.62项"],"ans":"C","analysis":"2026年7月25日，在韩国釜山举行的第48届世界遗产大会上，由中国申报的“景德镇手工瓷业遗存”项目经世界遗产委员会审议，成功列入《世界遗产名录》，成为中国第61项世界遗产。","figures":[]},{"no":42,"type":"single","q":"我国宪法规定，公民有集会、游行的自由。这一规定体现了公民的（ ）。","opt":["A.人身自由权","B.政治权利","C.政治自由","D.监督权"],"ans":"C","analysis":"政治自由的内容包括：公民有言论、出版、结社、集会、游行、示威的自由。","figures":[]},{"no":43,"type":"single","q":"根据《中华人民共和国宪法》的规定，农村集体经济组织实行的经营体制是（ ）。","opt":["A.家庭承包经营为基础、统分结合的双层经营体制","B.集体统一经营体制","C.个人承包经营体制","D.股份制经营体制"],"ans":"A","analysis":"农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制（第8条）。国家保护城乡集体经济组织的合法权益，鼓励、指导和帮助集体经济发展。\nB项错误，宪法第8条规定的经营体制是“家庭承包经营为基础、统分结合的双层经营体制”，而非集体统一经营；\nC项错误，“个人承包经营”不是宪法规定的表述；\nD项错误，“股份制经营”不是宪法对农村集体经济组织经营体制的规定。","figures":[]},{"no":44,"type":"single","q":"依据《旅游法》，旅游者卢女士欲将包价旅游合同中自身的权利义务转让给雷先生，旅行社没有正当理由不得拒绝，由此增加的费用由卢女士和雷先生承担。该转让行为应当发生在旅游行程（ ）。","opt":["A.开始前","B.过程中","C.开始前或过程中","D.开始前和过程中"],"ans":"A","analysis":"《旅游法》第64条规定，旅游行程开始前，旅游者可以将包价旅游合同中自身的权利义务转让给第三人，旅行社没有正当理由的不得拒绝，因此增加的费用由旅游者和第三人承担。","figures":[]},{"no":45,"type":"single","q":"《旅游法》规定，将不同景区的门票或者同一景区内不同游览场所的门票合并出售的，合并后的价格不得高于各单项门票的价格之和，且旅游者有权选择购买其中的单项票。该规定保障了旅游者的（ ）。","opt":["A.自主选择权","B.知悉真情权","C.优惠权","D.公平交易权"],"ans":"A","analysis":"《旅游法》第9条，旅游者有权自主选择旅游产品和服务，有权拒绝旅游经营者的强制交易行为。","figures":[]},{"no":46,"type":"single","q":"《旅游法》规定，国家鼓励各类市场主体在有效保护旅游资源的前提下，依法（ ）旅游资源。","opt":["A.合法利用","B.规划开发","C.合理利用","D.适度开发"],"ans":"C","analysis":"国家鼓励各类市场主体在有效保护旅游资源的前提下，依法合理利用旅游资源。","figures":[]},{"no":47,"type":"single","q":"旅游行程中解除合同的，旅行社应当协助旅游者返回（ ）。","opt":["A.出发地或者旅游者指定的合理地点","B.常住地或者旅行社指定的合理地点","C.常住地或者旅游者指定的合理地点","D.出发地或者旅行社指定的合理地点"],"ans":"A","analysis":"《旅游法》第68条规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。","figures":[]},{"no":48,"type":"single","q":"年仅14周岁且已取得导游资格证的刘某，属于（ ）。","opt":["A.无民事行为能力人","B.限制民事行为能力人","C.视为完全民事行为能力人","D.完全民事行为能力人"],"ans":"B","analysis":"8周岁以上的未成年人、不能完全辨认自己行为的成年人为限制民事行为能力人。","figures":[]},{"no":49,"type":"single","q":"相对人可以催告无民事行为能力人或者限制民事行为能力人的法定代理人自收到通知之日起（ ）内予以追认。","opt":["A.15个工作日","B.15日","C.30个工作日","D.30日"],"ans":"D","analysis":"相对人可以催告法定代理人自收到通知之日起30日内予以追认。","figures":[]},{"no":50,"type":"single","q":"《民法典》规定，当事人一方因第三人的原因造成违约的，（ ）承担违约责任。","opt":["A.第三人","B.当事人一方","C.当事人一方和第三人按份","D.当事人一方或第三人"],"ans":"B","analysis":"《民法典》第593条规定，当事人一方因第三人的原因造成违约的，应当依法向对方承担违约责任。此处“应当依法向对方”所指的是“当事人一方”。","figures":[]},{"no":51,"type":"single","q":"根据《民法典》的规定，以对话方式作出的意思表示，（ ）生效。","opt":["A.到达相对人时","B.相对人确认后","C.相对人知道其内容时","D.表示完成时"],"ans":"C","analysis":"以对话方式作出的意思表示，相对人知道其内容时生效。以非对话方式作出的意思表示，到达相对人时生效。","figures":[]},{"no":52,"type":"single","q":"无民事行为能力人造成他人损害，监护人将监护职责委托给他人的，（ ）。","opt":["A.监护人应当承担侵权责任；受托人有过错的，承担连带责任","B.受托人承担相应的责任","C.受托人应当承担侵权责任；监护人有过错的，承担相应的责任","D.监护人应当承担侵权责任；受托人有过错的，承担相应的责任"],"ans":"D","analysis":"《民法典》第1189条规定，无民事行为能力人、限制民事行为能力人造成他人损害，监护人将监护职责委托给他人的，监护人应当承担侵权责任；受托人有过错的，承担相应的责任。","figures":[]},{"no":53,"type":"single","q":"导游老王在执行带团任务过程中，未对游客卢女士进行充分的安全警示，致其人身遭受意外伤害。根据《民法典》，该侵权责任应由委派老王的雷大大旅行社承担。此种情形下，雷大大旅行社承担的责任属于（ ）。","opt":["A.自己责任","B.替代责任","C.补充责任","D.连带责任"],"ans":"B","analysis":"如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员，其侵权责任还是要由管理人、组织者或者雇主承担。这种侵权责任形态就是替代责任。","figures":[]},{"no":54,"type":"single","q":"《民法典》规定，当事人因防止损失扩大而支出的合理费用，由（ ）负担。","opt":["A.采取措施的当事人","B.双方分担","C.违约方","D.划分责任后视具体情况"],"ans":"C","analysis":"《民法典》第591条第2款规定，当事人因防止损失扩大而支出的合理费用，由违约方负担。","figures":[]},{"no":55,"type":"single","q":"根据《民法典》的规定，受害人和行为人对损害的发生都没有过错的，依照法律的规定由双方分担损失。此处适用的归责原则是（ ）。","opt":["A.过错推定责任原则","B.过错责任原则","C.公平责任原则","D.无过错责任"],"ans":"C","analysis":"公平责任原则指在当事人双方对损害的发生均无过错，法律又无特别规定适用无过错责任原则的情况下，由人民法院根据公平观念，责令加害人对受害人给予适当补偿，由当事人合理分担损失的一种归责原则。","figures":[]},{"no":56,"type":"single","q":"《旅行社条例》规定，申请经营出境旅游业务的，受理申请的旅游主管部门应当自受理申请之日起（ ）个工作日内作出许可或者不予许可的决定。","opt":["A.7","B.10","C.20","D.30"],"ans":"C","analysis":"《旅行社条例》第9条规定，申请经营出境旅游业务的，应当向国务院旅游行政主管部门或者其委托的省、自治区、直辖市旅游行政管理部门提出申请，受理申请的旅游行政管理部门应当自受理申请之日起20个工作日内作出许可或者不予许可的决定。","figures":[]},{"no":57,"type":"single","q":"《旅行社条例》规定，下列关于旅行社设立的服务网点的说法，正确的是（ ）。","opt":["A.具有法人资格","B.在其所在地的省、自治区、直辖市行政区划内设立服务网点","C.实行统一人事、财务、招徕、咨询服务规范","D.在设立社所在地的设区的市的行政区划内设立"],"ans":"B","analysis":"服务网点没有法人资格；旅行社应当加强对服务网点的管理，实行统一管理、统一财务、统一招徕和统一咨询的服务规范；设立社可以在其所在地的省、自治区、直辖市行政区划内设立服务网点。可以在该分社所在地设区的市的行政区划内设立服务网点。","figures":[]},{"no":58,"type":"single","q":"《旅行社条例》规定，旅行社自交纳或者补足服务质量保证金之日起（ ）内未因侵害旅游者合法权益受到行政机关罚款以上处罚的，旅游行政管理部门应当将旅游服务质量保证金的缴存数额降低50%，并向社会公告。","opt":["A.1年","B.2年","C.3年","D.5年"],"ans":"C","analysis":"旅行社自交纳或者补足质量保证金之日起3年内未因侵害旅游者合法权益受到行政机关罚款以上处罚的，旅游行政管理部门应当将旅游服务质量保证金的缴存数额降低50%，并向社会公告。","figures":[]},{"no":59,"type":"single","q":"根据《旅行社条例》的规定，旅行社被吊销旅行社业务经营许可的，其（ ）在旅行社业务经营许可被吊销之日起5年内不得担任任何旅行社的主要负责人。","opt":["A.直接责任人","B.涉事的工作人员","C.有关管理人员","D.主要负责人"],"ans":"D","analysis":"《旅行社条例》第64条规定，旅行社被吊销旅行社业务经营许可的，其主要负责人在旅行社业务经营许可被吊销之日起5年内不得担任任何旅行社的主要负责人。","figures":[]},{"no":60,"type":"single","q":"《文化和旅游市场信用管理规定》规定，对严重失信主体、轻微失信主体实施信用管理措施的期限分别为（ ）。法律法规另有规定的，从其规定。","opt":["A.5年，3年","B.4年，2年","C.3年，1年","D.2年，6个月"],"ans":"C","analysis":"第21条规定，对严重失信主体实施信用管理措施的期限为3年，对轻微失信主体实施信用管理措施的期限为1年。法律法规另有规定的，从其规定。","figures":[]},{"no":61,"type":"single","q":"《文化和旅游市场信用管理规定》规定，失信主体信息应当按照（ ）原则，通过全国文化和旅游市场信用管理系统等渠道公开。","opt":["A.“谁管理、谁公开”","B.“谁认定、谁公开”","C.“谁负责、谁公开”","D.“谁制定、谁公开”"],"ans":"B","analysis":"第23条规定，失信主体信息应当按照“谁认定、谁公开”原则通过全国文化和旅游市场信用管理系统等渠道公开。法律法规另有规定的，从其规定。","figures":[]},{"no":62,"type":"single","q":"在线旅游经营者违反有关规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门责令改正，给予警告，可以并处（ ）罚款。","opt":["A.1万元以上3万元以下","B.3万元以下","C.1万元","D.3万元"],"ans":"B","analysis":"《在线旅游经营服务管理暂行规定》第36条规定，在线旅游经营者违反本规定第18条规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门责令改正，给予警告，可并处3万元以下罚款。","figures":[]},{"no":63,"type":"single","q":"依据《导游人员管理条例》，导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者（ ）的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。","opt":["A.财产安全或者人身安全","B.财产安全和人身安全","C.人身安全","D.财产安全"],"ans":"C","analysis":"导游人员在引导旅游者旅行、游览过程中，遇有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待计划，但是应当立即报告旅行社。注意：考点中涉及到的几处仅有“人身安全”的情形要注意总结","figures":[]},{"no":64,"type":"single","q":"《导游人员管理条例》规定，导游人员应当不断提高（ ）。","opt":["A.服务水平","B.职业道德修养","C.导游证等级","D.自身业务素质和职业技能"],"ans":"D","analysis":"《导游人员管理条例》第7条规定，导游人员应当不断提高自身业务素质和职业技能。","figures":[]},{"no":65,"type":"single","q":"根据《导游人员管理条例》的规定，导游人员资格证书由（ ）颁发。","opt":["A.国务院旅游行政部门","B.县级以上旅游行政部门","C.国务院旅游行政部门或其委托的县级以上人民政府旅游行政部门","D.国务院旅游行政部门或其委托的省、自治区、直辖市人民政府旅游行政部门"],"ans":"D","analysis":"根据《导游人员管理条例》的规定，导游人员资格证书由国务院旅游行政部门或者国务院旅游行政部门委托省、自治区、直辖市人民政府旅游行政部门颁发。","figures":[]},{"no":66,"type":"single","q":"依据《导游管理办法》，导游应当自（ ）情形发生之日起10个工作日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息。","opt":["A.在旅游行业组织取消注册后，在3个月内与旅行社订立劳动合同","B.与旅行社订立的劳动合同解除后，在3个月后与其他旅行社订立劳动合同","C.户籍所在地发生变化","D.工作单位联系方式发生变化"],"ans":"A","analysis":"《导游管理办法》第15条规定，导游应当自下列情形发生之日起10个工作日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息：姓名、身份证号、导游等级和语种等信息发生变化的；与旅行社订立的劳动合同解除、终止或者在旅游行业组织取消注册后，在3个月内与其他旅行社订立劳动合同或者在其他旅游行业组织注册的；经常执业地区发生变化的；其他导游身份信息发生变化的。","figures":[]},{"no":67,"type":"single","q":"依据《中华人民共和国旅游法》，从事领队业务应当具有相应学历；依据《旅行社条例实施细则》，相应学历是指（ ）。","opt":["A.中专学历","B.高中学历","C.大学学历","D.大专以上学历"],"ans":"D","analysis":"旅行社为组织旅游者出境旅游委派的领队，应当具备下列条件：取得导游证；具有大专以上学历；取得相关语言水平测试等级证书或通过外语语种导游资格考试，旅行社委派的领队，应当掌握相关旅游目的地国家（地区）语言或者英语，但为赴港澳台地区旅游委派的领队除外；具有2年以上旅行社业务经营、管理或者导游等相关从业经历；与委派其从事领队业务的取得出境旅游业务经营许可的旅行社订立劳动合同。赴台旅游领队还应当符合《大陆居民赴台湾地区旅游管理办法》规定的要求。","figures":[]},{"no":68,"type":"single","q":"导游老王将其导游证出借给朋友小雷，为其进入景区提供便利。依据《导游管理办法》，应由旅游主管部门责令改正，并可以处（ ）罚款。","opt":["A.2000元以上1万元以下","B.1000元以上2万元以下","C.2000元以上2万元以下","D.1000元以上1万元以下"],"ans":"A","analysis":"《导游管理办法》第35条规定，导游涂改、倒卖、出租、出借导游人员资格证、导游证，以其他形式非法转让导游执业许可，或者擅自委托他人代为提供导游服务，由县级以上旅游主管部门责令改正，并可以处2000元以上1万元以下罚款。","figures":[]},{"no":69,"type":"single","q":"《导游人员管理条例》第21条规定，导游人员进行导游活动时未佩戴导游证的，由旅游行政部门责令改正；拒不改正的，处（ ）以下的罚款。","opt":["A.500元","B.1000元","C.2000元","D.3000元"],"ans":"A","analysis":"《导游人员管理条例》第21条规定，导游人员进行导游活动时未佩戴导游证的，由旅游行政部门责令改正；拒不改正的，处500元以下的罚款。","figures":[]},{"no":70,"type":"single","q":"根据《消费者权益保护法》的规定，下列情形中，消费者有权自收到商品之日起7日内退货且无需说明理由的是（ ）。","opt":["A.消费者从某电商平台购买的家用电器","B.消费者从科技市场购买的电脑","C.消费者在药店购买的保健品","D.消费者在某商场购买的大衣"],"ans":"A","analysis":"《消费者权益保护法》第25条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起7日内退货，且无需说明理由。","figures":[]},{"no":71,"type":"single","q":"依据《国家旅游局关于旅游不文明行为记录管理暂行办法》，下列关于不文明行为当事人的信息中，属于“旅游不文明行为记录”信息内容的是（ ）。","opt":["A.动态管理","B.户籍所在地","C.工作单位","D.户籍省份"],"ans":"D","analysis":"“旅游不文明行为记录”信息内容包括：（1）不文明行为当事人的姓名、性别、户籍省份；（2）不文明行为的具体表现、不文明行为所造成的影响和后果；（3）对不文明行为的记录期限。","figures":[]},{"no":72,"type":"single","q":"旅游投诉处理机构受理旅游投诉后，对于情况复杂的投诉，应当填写（ ），连同有关投诉材料副本一并送达被投诉人。","opt":["A.《旅游投诉立案表》","B.《旅游投诉处理通知书》","C.《旅游投诉受理通知书》","D.《旅游投诉转办函》"],"ans":"B","analysis":"《旅游投诉处理办法》第十六条旅游投诉处理机构受理旅游投诉后，应当按照以下方式进行处理：（一）对于事实清楚的，应当立即调解并记录情况；（二）对于情况复杂的，应当填写《旅游投诉处理通知书》，与有关投诉材料副本一并送达被投诉人。","figures":[]},{"no":73,"type":"single","q":"《突发事件应对法》规定，突发事件发生后，实施应急处置措施的主体是（ ）。","opt":["A.有关部门","B.人民政府","C.应急救援队伍","D.社会力量"],"ans":"B","analysis":"突发事件发生后，履行统一领导职责或者组织处置突发事件的人民政府应当针对其性质、特点和危害程度，立即组织有关部门，调动应急救援队伍和社会力量，依照本章的规定和有关法律、法规、规章的规定采取应急处置措施。","figures":[]},{"no":74,"type":"single","q":"造成或者可能造成人员死亡（含失踪）30人以上或者重伤（ ）以上的，构成特别重大旅游突发事件。","opt":["A.30人","B.50人","C.100人","D.150人"],"ans":"C","analysis":"特别重大旅游突发事件包括下列情形：造成或者可能造成人员死亡（含失踪）30人以上或者重伤100人以上；旅游者500人以上滞留超过24小时，并对当地生产生活秩序造成严重影响；其他在境内外产生特别重大影响，并对旅游者人身、财产安全造成特别重大威胁的事件。","figures":[]},{"no":75,"type":"single","q":"依据《旅行社责任保险管理办法》的规定，旅行社投保旅行社责任保险，由旅行社与保险公司协商确定责任赔偿限额，但每人人身伤亡责任限额不得低于（ ）。","opt":["A.10万元","B.20万元","C.30万元","D.40万元"],"ans":"B","analysis":"依据《旅行社责任保险管理办法》的规定，责任限额可以根据旅行社业务经营范围、经营规模、风险管控能力、当地经济社会发展水平和旅行社自身需要，由旅行社与保险公司协商确定，但每人人身伤亡责任限额不得低于20万元。","figures":[]},{"no":76,"type":"single","q":"《出入境管理法》规定，中国公民出境入境，应当依法申请办理护照或者（ ）。","opt":["A.身份证明","B.签证","C.其他出境证明文件","D.其他旅行证件"],"ans":"D","analysis":"《出入境管理法》第9条规定，中国公民出境入境，应当依法申请办理护照或者其他旅行证件。","figures":[]},{"no":77,"type":"single","q":"根据《娱乐场所管理条例》，下列地点中可以设立娱乐场所的是（ ）。","opt":["A.居民住宅区周围","B.车站、机场等人群密集的场所","C.建筑物地下一层","D.居民楼等建筑物内"],"ans":"C","analysis":"娱乐场所不得设在下列地点：居民楼、博物馆、图书馆和被核定为文物保护单位的建筑物内；居民住宅区和学校、医院、机关周围；车站、机场等人群密集的场所；建筑物地下一层以下；与危险化学品仓库毗连的区域。","figures":[]},{"no":78,"type":"single","q":"《食品安全法》第14条规定，国家建立食品安全（ ）制度，对食源性疾病、食品污染及食品中的有害因素进行监测。","opt":["A.风险监测","B.风险预估","C.风险评估","D.风险监控"],"ans":"A","analysis":"《食品安全法》第14条规定，国家建立食品安全风险监测制度，对食源性疾病、食品污染及食品中的有害因素进行监测。","figures":[]},{"no":79,"type":"single","q":"经批准开业的旅馆，如有歇业、转业、合并、迁移、改变名称等情况，应当在工商行政管理部门办理变更登记后（ ）内，向当地的县、市公安局、公安分局备案。","opt":["A.3日","B.5日","C.3个工作日","D.5个工作日"],"ans":"A","analysis":"经批准开业的旅馆，如有歇业、转业、合并、迁移、改变名称等情况，应当在工商行政管理部门办理变更登记后3日内，向当地的县、市公安局、公安分局备案。","figures":[]},{"no":80,"type":"single","q":"根据《风景名胜区条例》的规定，风景名胜区总体规划的规划期一般为（ ）。","opt":["A.10年","B.15年","C.20年","D.25年"],"ans":"C","analysis":"《风景名胜区条例》第十四条：风景名胜区应当自设立之日起2年内编制完成总体规划。总体规划的规划期一般为20年。","figures":[]},{"no":81,"type":"single","q":"根据《博物馆条例》，国家（ ）主管部门负责全国博物馆的监督管理工作。","opt":["A.文化","B.建设","C.文物","D.旅游"],"ans":"C","analysis":"国家文物主管部门负责全国博物馆监督管理工作，县级以上地方人民政府文物主管部门负责本行政区域的博物馆监督管理工作。","figures":[]},{"no":82,"type":"single","q":"中国特色社会主义最本质的特征是（ ）。","opt":["A.人民代表大会制度","B.以人为本","C.中国共产党领导","D.民主集中制"],"ans":"C","analysis":"全面加强党的领导，明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。","figures":[]},{"no":83,"type":"single","q":"《港区国安法》规定，犯颠覆国家政权罪的，对积极参加的，处（ ）。","opt":["A.3年以上5年以下有期徒刑","B.3年以上10年以下有期徒刑","C.5年以上10年以下有期徒刑","D.5年以上15年以下有期徒刑"],"ans":"B","analysis":"《港区国安法》第22条规定，任何人组织、策划、实施或者参与实施以下以武力、威胁使用武力或者其他非法手段旨在颠覆国家政权行为之一的，即属犯罪：推翻、破坏中华人民共和国宪法所确立的中华人民共和国根本制度；推翻中华人民共和国中央政权机关或者香港特别行政区政权机关；严重干扰、阻挠、破坏中华人民共和国中央政权机关或者香港特别行政区政权机关依法履行职能；攻击、破坏香港特别行政区政权机关履职场所及其设施，致使其无法正常履行职能。犯前款罪，对首要分子或者罪行重大的，处无期徒刑或者10年以上有期徒刑；对积极参加的，处3年以上10年以下有期徒刑；对其他参加的，处3年以下有期徒刑、拘役或者管制。","figures":[]},{"no":84,"type":"single","q":"国家建立了侵害英雄烈士名誉、荣誉的公益诉讼制度，即在英雄烈士没有近亲属，或者近亲属不提起诉讼的情况下，（ ）可以提起诉讼，以保护英雄烈士的合法权益。","opt":["A.英雄烈士生前所属单位","B.法律援助志愿者","C.英烈保护机构","D.检察机关"],"ans":"D","analysis":"《英烈法》第25条规定，对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为，英雄烈士的近亲属可以依法向人民法院提起诉讼。英雄烈士没有近亲属或者近亲属不提起诉讼的，检察机关依法对侵害英雄烈士的姓名、肖像、名誉、荣誉，损害社会公共利益的行为向人民法院提起诉讼。","figures":[]},{"no":85,"type":"single","q":"依据文化和旅游部《旅游强国建设“十五五”规划》，到2030年，我国旅游业发展的总体目标是（ ）。","opt":["A.旅游业高质量发展取得明显成效，现代旅游业体系更加完善，旅游强国建设取得显著进展","B.现代旅游业体系基本建成，旅游及相关产业增加值占国内生产总值比重显著提升","C.旅游强国建设取得决定性进展，现代旅游业体系全面成熟","D.全面建成旅游强国，旅游业国际竞争力和影响力全球领先"],"ans":"A","analysis":"到2030年，旅游业高质量发展取得明显成效，现代旅游业体系更加完善，旅游强国建设取得显著进展。旅游业的支柱产业地位更加稳固，旅游业拉动内需、促进就业、活跃市场的作用进一步发挥，旅游及相关产业增加值占国内生产总值比重稳步提升。\nA项正确，与规划原文对2030年发展目标的表述完全一致，故A正确。\nB项错误，规划对2030年的定位是“旅游强国建设取得显著进展”，而非“现代旅游业体系基本建成”，且原文为“增加值占国内生产总值比重稳步提升”，非“显著提升”，故B错误。\nC项错误，“取得决定性进展”“现代旅游业体系全面成熟”均非规划原文表述，故C错误。\nD项错误，“全面建成旅游强国”不是2030年的目标定位，故D错误。","figures":[]},{"no":86,"type":"single","q":"《关于推动在线旅游市场高质量发展的意见》强调，要深入发展的领域是（ ）。","opt":["A.实体经济","B.智慧旅游","C.传统文化","D.传统旅游业"],"ans":"B","analysis":"以推动高质量发展为主题，以深化供给侧结构性改革为主线，以满足人民日益增长的美好生活需要为根本目的，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用，用好各项纾困政策，调动市场积极因素，大力发展数字经济，深入发展智慧旅游，提升常态化监管水平，支持在线旅游平台经营者在引领发展、创造就业中大显身手。坚守安全底线，加强行业自律，推动在线旅游市场高质量发展。","figures":[]},{"no":87,"type":"single","q":"被公认为世界上第一次商业性旅游活动、近代旅游活动开端标志的是（ ）。","opt":["A.1841年禁酒大会","B.1845年利物浦之行","C.1845年托马斯库克旅行社成立","D.1846年苏格兰之行"],"ans":"A","analysis":"1841世界上第一次商业性旅游活动包租火车组织570人从莱斯特到拉夫巴勒参加禁酒大会；每人支付往返票价一先令被公认为世界上第一次商业性旅游活动；近代旅游活动开端的标志。","figures":[]},{"no":88,"type":"single","q":"1949年11月，新中国第一家旅行社（ ）在厦门成立。","opt":["A.中国旅行社","B.华侨服务社","C.中国国际旅行社","D.中国青年旅行社"],"ans":"B","analysis":"1949年11月：新中国第一家旅行社“华侨服务社”在厦门营业，新中国第一批导游同步诞生","figures":[]},{"no":89,"type":"single","q":"1983年10月，国家旅游局确定以东汉青铜器（ ）作为中国旅游业的图形标志。","opt":["A.曾侯乙编钟","B.四羊方尊","C.后母戊鼎","D.马踏飞燕"],"ans":"D","analysis":"1983年10月，国家旅游局确定以东汉青铜器“马踏飞燕”作为中国旅游业的图形标志。","figures":[]},{"no":90,"type":"single","q":"（ ）原则是导游服务的核心，以满足游客正当需求为出发点。","opt":["A.规范化服务","B.平等待客","C.游客为本","D.维护旅游者合法权益"],"ans":"C","analysis":"游客为本原则是导游服务的核心，以满足游客正当需求为出发点。","figures":[]},{"no":91,"type":"single","q":"导游服务质量的高低对于旅游产品和旅行社形象的传播具有至关重要的作用，这是（ ）作用的体现。","opt":["A.标志作用","B.反馈作用","C.扩散作用","D.纽带作用"],"ans":"C","analysis":"导游服务质量的高低对于旅游产品和旅行社形象的传播具有至关重要的作用，这是扩散作用的体现。","figures":[]},{"no":92,"type":"single","q":"在中华人民共和国境内从事导游活动，必须取得（ ）。","opt":["A.导游证","B.导游资格证","C.领队证","D.普通话证"],"ans":"A","analysis":"在中华人民共和国境内从事导游活动，必须取得导游证。","figures":[]},{"no":93,"type":"single","q":"下列选项中，关于初级导游晋升中级导游，描述正确的一项是（ ）。","opt":["A.必须具有高中以上学历","B.取得初级导游必须满2年","C.2年内带团记录不得少于30次或者120天","D.初级导游可以在获得表彰奖励（符合要求）3年内，通过申请获得中级"],"ans":"B","analysis":"必须具有大专以上学历；2年内带团记录不得少于25次或者90天；初级导游可以在获得表彰奖励（符合要求）2年内，通过申请获得中级","figures":[]},{"no":94,"type":"single","q":"（ ）在导游工作集体中处于中心地位，起着主导作用。","opt":["A.地陪","B.全陪","C.领队","D.团长"],"ans":"B","analysis":"全陪在导游工作集体中处于中心地位，起着主导作用。","figures":[]},{"no":95,"type":"single","q":"从卫生角度考虑，交谈的最佳距离为（ ）。","opt":["A.1米","B.1.3米","C.2米","D.3.7米"],"ans":"B","analysis":"从卫生角度考虑，交谈的最佳距离为1.3米","figures":[]},{"no":96,"type":"single","q":"若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动，地陪应（ ）。","opt":["A.耐心劝阻","B.置之不理","C.明确拒绝","D.主动协助"],"ans":"C","analysis":"若旅游者欲观看不健康的文娱节目或参与不正常的夜生活活动，地陪应明确拒绝。","figures":[]},{"no":97,"type":"single","q":"地陪老王接团前，通常与司机商定提前（ ）到达见面地点。","opt":["A.20分钟","B.30分钟","C.40分钟","D.60分钟"],"ans":"B","analysis":"地陪应接团前与司机联系，商定接头时间和地点（通常提前30分钟到达见面地点）。","figures":[]},{"no":98,"type":"single","q":"下列选项中，属于地陪在旅游团即将抵达前的业务安排的是（ ）。","opt":["A.穿着大方得体的服装去迎接客人","B.提前熟悉用餐餐厅的具体情况","C.集中清点行李","D.确认旅游团抵达的时间和地点"],"ans":"D","analysis":"旅游团即将抵达前的业务安排：确认旅游团抵达的时间和地点；与旅游车司机对接；再次核实旅游团抵达的时间。","figures":[]},{"no":99,"type":"single","q":"地陪导游老王待旅游者上车坐稳后，首先（ ）。","opt":["A.检查行李架上的物品是否稳固","B.礼貌地清点人数","C.提醒旅游者坐稳系好安全带","D.致欢迎词"],"ans":"A","analysis":"待旅游者坐稳后，地陪应先检查行李架上的物品是否稳固，再礼貌地清点人数，最后请司机开车，并再次提醒旅游者坐稳系好安全带","figures":[]},{"no":100,"type":"single","q":"（ ）不是地陪离店服务的服务内容。","opt":["A.提醒注意事项","B.办理退房手续","C.集合登车","D.致欢送词"],"ans":"D","analysis":"地陪离店服务的服务内容：提醒注意事项；办理退房手续；集合登车。","figures":[]},{"no":101,"type":"single","q":"全陪导游老王接待入境团时，应在接团（ ）与首站接待社取得联系，了解接待工作的详细安排情况。","opt":["A.前一日","B.当天","C.到达交通工具所在地时","D.接到旅游团队后"],"ans":"A","analysis":"全陪应在接团前一日与首站接待社取得联系，了解接待工作详细安排情况。","figures":[]},{"no":102,"type":"single","q":"导游讲解的理想语速为每分钟（ ）字左右。","opt":["A.150","B.180","C.200","D.250"],"ans":"C","analysis":"导游讲解中理想语速为每分钟200字左右，过快会使旅游者听不清，过慢则容易让人乏味。","figures":[]},{"no":103,"type":"single","q":"“大明湖里的荷花亭亭玉立，在微风中悄然起舞”，这句话采用了（ ）的修辞方式。","opt":["A.夸张","B.比喻","C.比拟","D.引用"],"ans":"C","analysis":"拟人：将景物赋予人的特征与情感，使其更具生命力和亲和力。例如：“大明湖里的荷花亭亭玉立，在微风中悄然起舞”，荷花为物，修饰以“亭亭玉立”“悄然起舞”后，就有了人的美丽，贴切形象。","figures":[]},{"no":104,"type":"single","q":"目光语中表示尊重、谦逊、期待、盼望、哀求等含义的是（ ）。","opt":["A.仰视","B.正视","C.俯视","D.斜视"],"ans":"A","analysis":"仰视视线朝上，表尊重、谦逊、期待、盼望、哀求等","figures":[]},{"no":105,"type":"single","q":"介绍城市或景点的地理、历史、人物、布局等内容时，适用（ ）进行讲解。","opt":["A.突出重点法","B.触景生情法","C.分段讲解法","D.概述法"],"ans":"D","analysis":"综合概述法，又称“概况讲解”，是指导游在旅游者初到城市或景点前，利用车上沿途讲解时间或在景区大型导览图前停留的时间，对城市或景点的地理、历史、人物、布局等进行概括性介绍，使旅游者快速了解旅游目的地的大致情况。","figures":[]},{"no":106,"type":"single","q":"导游老王先抛出问题，稍作停顿后主动解释，不需要游客参与的讲解方法是（ ）。","opt":["A.我问客答","B.自问自答","C.客问我答","D.客问客答"],"ans":"B","analysis":"自问自答导游先抛出问题，稍作停顿后主动解释，目的在于吸引注意力、激发游兴，适用于难度较大或旅游者难以回答的问题。","figures":[]},{"no":107,"type":"single","q":"如果地陪不住饭店，（ ）要负起全责，照顾好旅游团的安全和生活。","opt":["A.领队","B.全陪","C.团长","D.酒店"],"ans":"B","analysis":"如果地陪不住饭店，全陪要负起全责，照顾好旅游团的安全和生活。","figures":[]},{"no":108,"type":"single","q":"导游老王在为老年人安排行程计划时，操作正确的是（ ）。","opt":["A.景点游览宜多而精","B.参游项目宜量力而行，不宜过多使用激将法","C.适当安排夜间游览","D.游览中适当增加休息频次"],"ans":"D","analysis":"景点游览宜少而精；增加休息频次：在游览中增加休息次数，多安排上卫生间的机会；不宜安排夜间游览，避免老年人过度疲劳；参游项目宜量力而行：导游不宜用激将法刺激老年人参加挑战性项目。","figures":[]},{"no":109,"type":"single","q":"当发生接待纠纷时，导游处理不正确的选项是（ ）。","opt":["A.遵循旅游合同，防止矛盾扩大化","B.引导旅游者情绪，坚决维护旅游者利益","C.做好书面记录，保存书证、物证、电子数据等证据","D.按旅行社要求采取必要的措施"],"ans":"B","analysis":"遵循旅游合同，防止矛盾扩大化，处理问题讲求有理、有利、有节，稳定旅游者情绪，引导旅游者理性维权；做好书面记录，保存书证、物证、电子数据等证据；及时向旅行社报告，反映接待纠纷的详细情况，并按旅行社要求采取必要的措施；尽量保障后续旅游行程的执行，维护旅游者和旅行社的合法权益。","figures":[]},{"no":110,"type":"single","q":"旅游者卢女士在境外丢失证件或物品时，导游老王应该协助（ ）。","opt":["A.旅游者到当地旅行社开具遗失证明","B.向当地警方报失，开具丢失证明","C.办理相应离境手续","D.持遗失证明向保险公司理赔"],"ans":"D","analysis":"当地旅行社开具丢失证明→领队协助旅游者：①向当地警方报失；②开具物品遗失证明（用途：-离境时海关查验；-向保险公司申请理赔）","figures":[]},{"no":111,"type":"single","q":"下列选项中，属于地陪导游与全陪导游工作不同的是（ ）。","opt":["A.旅游接待工作","B.维护安全","C.处理问题","D.宣传、调研工作"],"ans":"D","analysis":"宣传、调研工作是全陪特有的工作，地陪工作中没有此项。故选D。","figures":[]},{"no":112,"type":"single","q":"导游在带（ ）时，应遵循“三不说”原则：不多说、不错说、不乱说，确保信息的准确性和严肃性。","opt":["A.老年团","B.商务团","C.政务团","D.亲子团"],"ans":"C","analysis":"讲解是政务接待中导游的主要任务。政务团的讲解要求“精”“要”。导游应遵循“三不说”原则：不多说、不错说、不乱说，确保信息的准确性和严肃性。","figures":[]},{"no":113,"type":"single","q":"对于游客卢女士提出更换饭店的要求，导游老王应该予以满足的情形是（ ）。","opt":["A.客房清洁不达标或设施出现损坏","B.饭店无法提供可调换楼层和朝向的客房","C.景观房或高楼层房间需求不能满足时","D.确认旅行社实际安排的饭店低于合同约定标准时"],"ans":"D","analysis":"A、B、C三项属于旅游者要求调换房间的情形；\nD项旅行社实际安排的饭店低于合同约定标准，按照规定可以调换饭店。","figures":[]},{"no":114,"type":"single","q":"面对个别旅游者购买文物古玩的需求，导游操作正确的是（ ）。","opt":["A.告知旅游者在购买文物古玩时务必妥善保管好发票","B.提醒旅游者在路边摊购买文物古玩时，注意甄别","C.注意去掉古玩上的火漆印，否则不好出关","D.若发现个别旅游者存在走私文物等可疑行为，导游要耐心劝阻"],"ans":"A","analysis":"提醒旅游者避免在路边摊购买文物古玩，而是建议其前往当地正规的文物商店进行选购，降低购买到赝品的风险，保障旅游者的消费权益;告知旅游者在购买文物古玩时务必妥善保管好发票，并注意保留古玩上的火漆印，作为鉴定凭证，以便在通过海关查验等环节时能够顺利出示相关证明，避免麻烦;若发现个别旅游者存在走私文物等可疑行为，导游必须立即向有关部门报告，确保旅游者的购买行为合法合规，防止违法违规情况的发生，维护旅游市场的正常秩序与国家文物安全。","figures":[]},{"no":115,"type":"single","q":"为了避免游客晕车，导游操作正确的选项是（ ）。","opt":["A.如果乘坐游船，游客应坐在最前排的舱位","B.尽量吃饱，避免空腹低血糖","C.不应阅读，应看近处快速移动景物","D.乘坐交通工具前30分钟，服用抗晕药物减轻症状"],"ans":"D","analysis":"避免晕车的正确做法包括：注意休息、避免过度疲劳；饮食清淡、不喝酒、不吃高蛋白高脂食品，且不过饱；乘坐旅游客车前排、游船中间靠后舱位、飞机机舱前部；乘坐期间闭目养神，避免长时间阅读或看近处快速移动景物；乘坐交通工具前30分钟服用抗晕药物减轻症状。故选D。","figures":[]},{"no":116,"type":"single","q":"如果导游在境内发现游客走失，操作错误的一项是（ ）。","opt":["A.及时向旅行社报告","B.全陪安排旅游者随行亲朋/团队代表共同寻找，地陪带团继续旅游","C.立即向走失地公安机关报案","D.联系景区、住宿经营者等可能有线索的接待者"],"ans":"C","analysis":"①走失24小时未找到：立即向走失地公安机关报案；②特殊人群（老年人/未成年人/残疾人）：立即报警。","figures":[]},{"no":117,"type":"single","q":"对于连续驾驶行程超过（ ）公里的旅游线路，雷大大旅行社应安排驾驶员中途休息。","opt":["A.300","B.400","C.500","D.600"],"ans":"B","analysis":"对于连续驾驶超过4小时或连续行程超过400公里的旅游线路，旅行社应安排驾驶员中途休息或增配一名驾驶员。","figures":[]},{"no":118,"type":"single","q":"旅游期间遭遇泥石流，导游带领游客撤离的正确方式是（ ）。","opt":["A.迅速顺着山坡向下奔跑","B.现将游客集中起来，避免撤离时走散","C.迅速向两侧逃生，即与泥石流垂直方向奔跑","D.迅速找到大树，攀爬到树上躲避"],"ans":"C","analysis":"不要攀爬到树上躲避；一旦发现有泥石流或山体滑坡迹象时，切勿与其同向奔跑，而应迅速向两侧逃生，即逃跑方向要与泥石流或山体滑坡方向成垂直方向，并且不要停留在凹坡处，要尽可能加快逃跑速度。","figures":[]},{"no":119,"type":"single","q":"一名17周岁的中国公民，其护照有效期为（ ）。","opt":["A.2年","B.5年","C.8年","D.10年"],"ans":"D","analysis":"《护照法》规定，我国公民未满16周岁护照有效期为5年，16周岁以上的为10年，取消延期。","figures":[]},{"no":120,"type":"single","q":"截至2025年6月，中国已对美国、俄罗斯、英国等55国实施（ ）过境免签政策。","opt":["A.72小时","B.144小时","C.192小时","D.240小时"],"ans":"D","analysis":"截至2025年6月，中国已对美国、俄罗斯、英国等55国实施240小时过境免签政策。","figures":[]},{"no":121,"type":"single","q":"中国国际航空公司的标志是（ ）。","opt":["A.凤凰","B.飞翔的燕子","C.木棉花与飞机尾翼","D.高飞的白鹭"],"ans":"A","analysis":"中国国际航空公司：凤凰。集中体现在“中国红凤凰体VIP”上：（1）造型以简洁舞动的线条展现凤凰姿态，同时是英文“VIP”（尊贵客人）的艺术变形；（2）寓意：以凤凰之姿打造完美航程、传递平安吉祥，引领行业发展","figures":[]},{"no":122,"type":"single","q":"按照铁路规定，开车前24—48小时退票的旅客，按票价（ ）计算收取退票费。","opt":["A.5%","B.10%","C.20%","D.不收"],"ans":"B","analysis":"开车前8天（含8天）以上退票的，不收退票费；开车前48小时以上的，按票价5%计；开车前24-48小时的，按票价10%计；不足24小时的按票价20%计。","figures":[]},{"no":123,"type":"single","q":"车次前冠有“Y”字母的列车是（ ）。","opt":["A.临时旅客列车","B.郊游旅客列车","C.旅游列车","D.临时约定通行列车"],"ans":"C","analysis":"Y字头——旅游列车","figures":[]},{"no":124,"type":"single","q":"国际航班的值机柜台一般在飞机起飞前（ ）分钟关闭。","opt":["A.20","B.30","C.40","D.60"],"ans":"C","analysis":"国内航班一般离站前30分钟，国际航班前40分钟值机柜台关闭，具体以航空公司和机场规定为准。","figures":[]},{"no":125,"type":"single","q":"海拔在（ ）米以上时，就会出现高原反应的症状。","opt":["A.2500","B.2700","C.3000","D.3200"],"ans":"A","analysis":"海拔标准:高于2500米。","figures":[]},{"no":126,"type":"single","q":"服用（ ）对抗高原反应没有作用。","opt":["A.红景天","B.高原康","C.藿香正气水","D.高原安"],"ans":"C","analysis":"提前服用抗高反药（红景天/高原康/高原安）。","figures":[]},{"no":127,"type":"single","q":"如果在水上发生险情，可以拨打水上遇险电话（ ）。","opt":["A.12315","B.12308","C.12395","D.12123"],"ans":"C","analysis":"出现险情立即拨打全国水上遇险电话12395。","figures":[]},{"no":128,"type":"single","q":"下列对游客浸泡温泉时注意事项的描述，正确的一项是（ ）。","opt":["A.高血压、心脑血管疾病患者禁止泡温泉","B.空腹或过饱游客泡温泉时间要少于20分钟","C.热毛巾敷面，避免自由基损伤皮肤","D.入水前温泉水擦拭身体适应，出水缓慢起身"],"ans":"D","analysis":"高血压/心脑血管疾病患者：规则服药或医生允许后浸泡，每次≤20分钟；敷面膜/冷毛巾敷面+闭眼冥想深呼吸（防自由基损伤皮肤，缓身心压力）；空腹或过饱不宜入浴（防头晕、呕吐、消化不良、疲倦）；入水前温泉水擦拭身体适应，出水缓慢起身（防血管异常收缩/血压下降导致头晕跌倒）。","figures":[]},{"no":129,"type":"single","q":"在中国境内，（ ）可以直接兑换成人民币。","opt":["A.马来西亚林吉特","B.菲律宾比索","C.越南盾","D.朝鲜元"],"ans":"B","analysis":"在中国境内，以下国家和地区的现钞可兑换成人民币：美元、欧元、英镑、日元、澳大利亚元、加拿大元、瑞士法郎、丹麦克朗、挪威克朗、瑞典克朗、新加坡元、港币、俄罗斯卢布、新西兰元、菲律宾比索、泰国铢、韩元、澳门元和新台币等。","figures":[]},{"no":130,"type":"single","q":"下列城市中，比北京更早迎来新一天的是（ ）。","opt":["A.堪培拉","B.伦敦","C.莫斯科","D.纽约"],"ans":"A","analysis":"北京位于东八区，而堪培拉位于东10区。所以堪培拉更早。","figures":[]},{"no":131,"type":"multi","q":"根据《宪法》对公民监督权的规定，对于任何国家机关和国家工作人员的违法失职行为，公民有提出（ ）的权利。","opt":["A.批评","B.申诉","C.控告","D.建议","E.检举"],"ans":"BCE","analysis":"公民对于任何国家机关和国家工作人员，有提出批评和建议的权利；对于任何国家机关和国家工作人员的违法失职行为，有向有关国家机关提出申诉、控告或者检举的权利，但是不得捏造或者歪曲事实进行诬告陷害。注意：批评和建议无门槛；申诉、控告或者检举需要在“违法失职行为”时才可以。","figures":[]},{"no":132,"type":"multi","q":"根据《旅游法》的规定，订立包价旅游合同时，雷大大旅行社应当告知旅游者的事项包括（ ）。","opt":["A.旅游者不适合参加旅游活动的情形","B.旅游活动中的安全注意事项","C.旅游者依法可以减免责任的信息","D.依照中国法律旅游者不宜参加的活动","E.旅游活动中旅游者的权利和义务"],"ans":"ABD","analysis":"《旅游法》第62条规定，订立包价旅游合同时，旅行社应当向旅游者告知下列事项：旅游者不适合参加旅游活动的情形；旅游活动中的安全注意事项；旅行社依法可以减免责任的信息；旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌，依照中国法律不宜参加的活动等；法律、法规规定的其他应当告知的事项。在包价旅游合同履行中，遇有前款规定事项的，旅行社也应当告知旅游者。“旅游活动中旅游者的权利和义务”不在此情形。","figures":[]},{"no":133,"type":"multi","q":"根据《民法典》的规定，下列关于动物园动物致人损害责任的说法，正确的是（ ）。","opt":["A.饲养动物致人损害，仅动物饲养人承担侵权责任","B.能够证明损害是因被侵权人重大过失造成的，可以不承担责任","C.因未对动物采取安全措施造成他人损害的，动物饲养人或者管理人应当承担侵权责任","D.禁止饲养危险动物致人损害，动物饲养人或者管理人应当承担侵权责任","E.动物园动物致人损害，动物园均应承担侵权责任"],"ans":"CD","analysis":"《民法典》第1245条规定，饲养的动物造成他人损害的，动物饲养人或者管理人应当承担侵权责任；但是，能够证明损害是因被侵权人故意或者重大过失造成的，可以不承担或者减轻责任。第1248条，动物园的动物造成他人损害的，动物园应当承担侵权责任，但能够证明尽到管理职责的，不承担责任。","figures":[]},{"no":134,"type":"multi","q":"根据《旅行社条例》的规定，旅游服务质量保证金的使用情形包括（ ）。","opt":["A.旅行社违反旅游合同约定，侵害旅游者合法权益，经旅游行政管理部门查证属实的","B.垫付旅游者人身财产安全遇有危险时的紧急救援费用","C.发生不可抗力造成旅游者滞留的食宿费用","D.在旅游过程中，旅游者人身安全遇有危险时用于垫付紧急救援费用的","E.人民法院判决、裁定认定旅行社损害旅游者权益但旅行社拒绝或无力赔偿的"],"ans":"ADE","analysis":"使用质量保证金的情形：旅游行政管理部门：（1）旅行社违反旅游合同约定，侵害旅游者合法权益，经旅游行政管理部门查证属实的；（2）旅行社因解散、破产或者其他原因造成旅游者预交旅游费用损失的；（3）在旅游过程中，旅游者人身安全遇有危险时用于垫付紧急救援费用的；司法机关：人民法院判决、裁定及其他生效法律文书认定旅行社损害旅游者合法权益，旅行社拒绝或无力赔偿的，人民法院可以从旅行社的质量保证金账户上划拨赔偿款。B选项错误，旅游服务质量保证金垫付的是旅游者人身安全遇有危险时的紧急救援费用的。C选项错误，发生不可抗力造成旅游者滞留的食宿费用由旅游者自己承担。","figures":[]},{"no":135,"type":"multi","q":"依据《中华人民共和国旅游法》，旅行社可以行使解除合同权的情形包括：旅游者（ ）。","opt":["A.患有传染病等疾病，可能危害其他旅游者健康和安全的","B.未按行程约定时间准时到达集合地点的","C.从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的","D.从事违规或者违反社会公德的活动的","E.携带超过容量规定的日用品与相关部门发生冲突的"],"ans":"AC","analysis":"《旅游法》第66条规定，旅游者有下列情形之一的，旅行社可以解除合同：（一）患有传染病等疾病，可能危害其他旅游者健康和安全的；（二）携带危害公共安全的物品且不同意交有关部门处理的；（三）从事违法或者违反社会公德的活动的；（四）从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；（五）法律规定的其他情形。旅行社可以解除合同的情形可以总结为：旅游者有重大过错或者瑕疵。BE两个选项虽然是旅游者的原因造成的，但所造成后果的严重程度不足以到旅行社可以解除合同。D选项表述错误，应为“从事违法”。","figures":[]},{"no":136,"type":"multi","q":"依据《在线旅游经营服务管理暂行规定》，平台经营者发现（ ）的，应当立即采取必要的救助和处置措施，并依法及时向县级以上文化和旅游主管部门报告。","opt":["A.平台内经营者未经许可经营旅行社业务","B.经营服务过程中发生旅游安全事故的","C.提供的旅游产品存在缺陷，危及旅游者财产安全","D.出现法律、法规禁止交易的产品或者服务的；","E.提供的旅游产品存在缺陷，危及旅游者人身安全"],"ans":"ABCDE","analysis":"平台经营者发现以下情况，应当立即采取必要的救助和处置措施，并依法及时向县级以上文化和旅游主管部门报告：（1）提供的旅游产品或者服务存在缺陷，危及旅游者人身、财产安全的；（2）经营服务过程中发生突发事件或者旅游安全事故的；（3）平台内经营者未经许可经营旅行社业务的；（4）出现法律、法规禁止交易的产品或者服务的；（5）其他应当报告的事项。","figures":[]},{"no":137,"type":"multi","q":"依据《导游管理办法》，下列关于不予核发导游证情形的表述，正确的是（ ）。","opt":["A.限制民事行为能力的","B.无民事行为能力的","C.因过失犯罪以外受过刑事处罚的","D.被吊销导游证之日起已逾3年的","E.患有甲类、乙类传染性疾病的"],"ans":"ABCE","analysis":"《导游管理办法》第12条规定，具有下列情形的，不予核发导游证：（1）无民事行为能力或者限制民事行为能力的；（2）患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；（3）受过刑事处罚的，过失犯罪的除外；（4）被吊销导游证之日起未逾3年的。","figures":[]},{"no":138,"type":"multi","q":"根据《治安管理处罚法》的规定，关于治安管理处罚的种类，下列说法正确的有（ ）。","opt":["A.警告属于申诫罚，是最轻的治安管理处罚","B.罚款属于财产罚，适用范围较为广泛","C.行政拘留属于人身自由罚，期限为1日以上15日以下","D.吊销公安机关发放的许可证件属于资格罚","E.对违反治安管理的外国人，只能附加适用驱逐出境，不能适用限期出境"],"ans":"ABCD","analysis":"A项正确：警告属于申诫罚，以书面方式作出，适用于情节轻微的违法行为。\nB项正确：罚款属于财产罚，适用范围最广。\nC项正确：行政拘留属于人身自由罚，是最严厉的治安管理处罚，期限为1日以上15日以下。\nD项正确：吊销公安机关发放的许可证件属于资格罚，剥夺违法者从事特定活动的资格。\nE项错误：对违反治安管理的外国人，可以附加适用限期出境或者驱逐出境，两者均可适用，并非只能驱逐出境。","figures":[]},{"no":139,"type":"multi","q":"依据《旅游安全管理办法》，风险提示信息应当包括（ ）、注意事项、应采取的措施等内容。","opt":["A.风险类别","B.提示级别","C.可能影响的区域","D.起始时间","E.发布机关"],"ans":"ABCDE","analysis":"风险提示信息，应当包括风险类别、提示级别、可能影响的区域、起始时间、注意事项、应采取的措施和发布机关等内容。","figures":[]},{"no":140,"type":"multi","q":"根据《旅游安全管理办法》的规定，旅游经营者的安全义务包括（ ）。","opt":["A.安全防范、管理和保障义务","B.建立旅游目的地安全风险提示制度的义务","C.安全救助、处置和报告义务","D.安全说明或警示义务","E.统计分析本行政区域内发生旅游安全事故情况的义务"],"ans":"ACD","analysis":"《旅游法》第77条规定，国家建立旅游目的地安全风险提示制度。故B项错误；县级以上地方各级旅游主管部门应当定期统计分析本行政区域内发生旅游突发事件的情况。故E项错误。","figures":[]},{"no":141,"type":"multi","q":"根据《中华人民共和国民用航空法》的规定，旅客、行李或者货物在航空运输中因延误造成损失，承运人不承担赔偿责任的情形有（ ）。","opt":["A.承运人证明其为了避免损失的发生已经采取一切合理措施","B.损失主要是由旅客个人疏忽造成的","C.承运人证明在客观情况下不可能采取合理措施避免损失","D.旅客没有购买航班延误保险","E.承运人的受雇人、代理人为了避免损失的发生已经采取一切合理处置手段"],"ans":"ACE","analysis":"第132条 旅客、行李或者货物在航空运输中因延误造成的损失，承运人应当承担责任；但是，承运人证明本人或者其受雇人、代理人为了避免损失的发生，已经采取一切合理措施或者不可能采取此种措施的，不承担责任。\nA项正确，承运人证明已经采取一切合理措施避免损失发生的，不承担责任。\nB项错误，损失主要由旅客个人疏忽造成，不是法定免责事由。\nC项正确，客观情况下不可能采取合理措施避免损失的，承运人不承担责任。\nD项错误，是否购买航班延误保险与承运人免责无关。\nE项正确，承运人的受雇人、代理人为了避免损失的发生已经穷尽一切合理处置手段的，承运人不承担责任。","figures":[]},{"no":142,"type":"multi","q":"《中华人民共和国食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，为防止或者减轻社会危害，应当采取的措施包括（ ）。","opt":["A.封存被污染的食品相关产品，并责令清洗消毒","B.封存确认导致食品安全事故的食品及其原料，并立即进行检验","C.对疑似被污染的食品及其原料，责令食品生产经营者召回或者停止经营","D.开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员","E.做好信息发布工作，并对可能产生的危害加以解释、说明"],"ans":"ADE","analysis":"《食品安全法》第105条规定，县级以上人民政府食品安全监督管理部门接到食品安全事故的报告后，应当立即会同同级卫生行政、农业行政等部门进行调查处理，并采取下列措施，防止或者减轻社会危害：开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员；封存可能导致食品安全事故的食品及其原料，并立即进行检验；对确认属于被污染的食品及其原料，责令食品生产经营者依照本法第63条的规定召回或者停止经营；封存被污染的食品相关产品，并责令进行清洗消毒；做好信息发布工作，依法对食品安全事故及其处理情况进行发布，并对可能产生的危害加以解释、说明。选项C，只有对确认属于被污染的食品及原料，才可以召回或者停止经营。选项B错误，“可能导致”就要被封存并检验。","figures":[]},{"no":143,"type":"multi","q":"根据《自然保护区条例》的规定，下列可以列为国家级自然保护区的有（ ）。","opt":["A.涉及国家海洋权益的自然保护区","B.其他自然保护区","C.在国内外有典型意义的自然保护区","D.在科学上有重大国际影响的自然保护区","E.有特殊科学研究价值的自然保护区"],"ans":"ACDE","analysis":"《自然保护区条例》第十二条：自然保护区分为国家级自然保护区和省级自然保护区。在国内外有典型意义、在科学上有重大国际影响或者有特殊科学研究价值的自然保护区,以及涉及国家海洋权益的自然保护区,列为国家级自然保护区。其他自然保护区列为省级自然保护区。故ACDE项正确。\nB项错误,其他自然保护区列为省级自然保护区,而不是国家级。","figures":[]},{"no":144,"type":"multi","q":"依据习近平新时代中国特色社会主义思想相关理论，关于中国特色社会主义事业总体布局与战略布局，下列说法正确的有（ ）。","opt":["A.中国特色社会主义事业战略布局是“五位一体”","B.全面建设小康社会属于“四个全面”战略布局内容","C.“五位一体”包含生态文明建设","D.经济建设不属于“五位一体”总体布局范畴","E.全面从严治党是“四个全面”战略布局组成部分"],"ans":"CE","analysis":"明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面。\nA项错误，“五位一体”是总体布局，“四个全面”才是战略布局，二者概念混淆。\nB项错误，“四个全面”战略布局的最新表述为全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党，不包含“全面建设小康社会”，小康社会已经实现。\nC项正确，“五位一体”包含经济建设、政治建设、文化建设、社会建设、生态文明建设。\nD项错误，经济建设是“五位一体”总体布局的首要组成部分。\nE项正确，全面从严治党属于“四个全面”战略布局的组成部分。","figures":[]},{"no":145,"type":"multi","q":"依据习近平新时代中国特色社会主义思想相关理论，要始终保持马克思主义的蓬勃生机和旺盛活力，必须坚持把马克思主义基本原理同（ ）相结合。","opt":["A.新时代党的建设总要求","B.中国具体实际","C.总体国家安全观","D.中华优秀传统文化","E.新发展理念"],"ans":"BD","analysis":"只有把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持运用辩证唯物主义和历史唯物主义，才能正确回答时代和实践提出的重大问题，才能始终保持马克思主义的蓬勃生机和旺盛活力。\nA项错误，新时代党的建设总要求属于“十个明确”内容，不属于“两个结合”范畴。\nB项正确，马克思主义基本原理同中国具体实际相结合，是原文“两个结合”的内容。\nC项错误，总体国家安全观是“十四个坚持”的内容，不属于“两个结合”。\nD项正确，同中华优秀传统文化相结合，是原文“两个结合”的内容。\nE项错误，新发展理念是“十个明确”“十四个坚持”中提到的发展理念，不属于“两个结合”。","figures":[]},{"no":146,"type":"multi","q":"下列主体中，属于《宪法》保护的特定主体的是（ ）。","opt":["A.妇女","B.教师","C.儿童","D.老人","E.华侨"],"ans":"ACDE","analysis":"教师不是《宪法》保护的特殊主体。","figures":[]},{"no":147,"type":"multi","q":"《英烈保护法》明确了英雄烈士的保护范围，包括（ ）。","opt":["A.为国牺牲的烈士","B.为新中国建设牺牲的英雄","C.为民族作出牺牲和贡献的革命先行者","D.健在的时代先锋模范","E.当代健在的英雄战士"],"ans":"ABC","analysis":"《英烈法》第2条规定，国家和人民永远尊崇、铭记英雄烈士为国家、人民和民族作出的牺牲和贡献。近代以来，为了争取民族独立和人民解放，实现国家富强和人民幸福，促进世界和平和人类进步而毕生奋斗、英勇献身的英雄烈士，功勋彪炳史册，精神永垂不朽。需要说明的是，《英烈法》保护的英雄烈士都是已经牺牲、去世的。健在的英雄模范人物与本法保护的英雄烈士的精神是一脉相承的，对他们的褒奖、保护，适用《国家勋章和国家荣誉称号法》等相关法律法规，不适用本法。","figures":[]},{"no":148,"type":"multi","q":"导游服务的特点有（ ）。","opt":["A.工作独立性强","B.脑体高度结合","C.客观情况复杂","D.文化交流频繁","E.服务水平体现"],"ans":"ABCD","analysis":"导游服务的特点：工作独立性强；脑体高度结合；客观情况复杂；文化交流频繁。","figures":[]},{"no":149,"type":"multi","q":"按照业务范围，我国导游分为（ ）。","opt":["A.专职导游","B.外语导游","C.全陪","D.领队","E.地陪"],"ans":"CDE","analysis":"按照业务范围，我国导游分为地陪导游、全陪导游和领队。","figures":[]},{"no":150,"type":"multi","q":"带领游客赴景点途中的服务包括（ ）。","opt":["A.宣布当日活动日程","B.提醒游览中的注意事项","C.沿途风光导游","D.讲解游览线路","E.组织途中活动"],"ans":"ACE","analysis":"赴景点途中的服务：宣布当日活动日程；沿途风光导游；组织途中活动；景点概况介绍。","figures":[]},{"no":151,"type":"multi","q":"对于地陪导游提供的餐饮服务，描述正确的选项有（ ）。","opt":["A.提前落实用餐","B.用餐过程中，地陪应巡视旅游团用餐情况1-2次","C.如菜品中有异物，要求餐厅负责人出面赔礼道歉","D.涉及口味咸淡、酸辣等口味问题，要及时向餐厅反映并立即换菜","E.用餐结束后，地陪应严格按照团队人数、用餐标准签字确认"],"ans":"AB","analysis":"提前落实用餐;用餐过程中，地陪应巡视旅游团用餐情况1—2次；针对旅游者在用餐中出现的问题和要求，如菜品中有异物（头发、虫子等），地陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿；口味问题协调：涉及口味咸淡、酸辣等口味问题，地陪要及时与餐厅协调处理，并在后续餐饮安排中加以注意；用餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量等核实餐厅开列的账单，直接付款或在结算单上签字。","figures":[]},{"no":152,"type":"multi","q":"首次沿途服务的内容包括（ ）。","opt":["A.致欢迎辞","B.行程介绍","C.沿途导游","D.核对商定日程","E.核实团队信息"],"ans":"ABC","analysis":"首次沿途服务的内容包括：致欢迎辞；行程介绍；沿途导游。","figures":[]},{"no":153,"type":"multi","q":"全陪通常为游客提供的抵站服务包括（ ）。","opt":["A.介绍服务行程","B.带领旅游团出站","C.向地陪通报情况","D.清点行李、集合登车","E.处理突发事件"],"ans":"BCD","analysis":"抵站服务包括：带领旅游团出站；向地陪通报情况；清点行李、集合登车。","figures":[]},{"no":154,"type":"multi","q":"下列选项中，符合领队带领游客文明游览要求的是（ ）。","opt":["A.导游领队宜将文明旅游的内容融合在讲解词中，进行提醒和告知","B.领队应提醒游客遵守游览场所规则，依序文明游览","C.游览区域对游客着装有要求的，领队应在出发前向游客说明","D.领队应提醒游客摄影摄像时先后有序，不妨碍他人","E.领队应提示游客爱护公物、保护文物，不攀登骑跨或胡写乱画"],"ans":"ABDE","analysis":"（1）导游领队宜将文明旅游的内容融合在讲解词中，进行提醒和告知。（2）导游领队应提醒游客遵守游览场所规则，依序文明游览。（3）在自然环境中游览时，导游领队应提示游客爱护环境、不攀折花草、不惊吓伤害动物，不进入未开放区域。（4）观赏人文景观时，导游领队应提示游客爱护公物、保护文物，不攀登骑跨或胡写乱画。（5）在参观博物馆、教堂等室内场所时，导游领队应提示游客保持安静，根据场馆要求规范使用摄影摄像设备。不随意触摸展品。（6）游览区域对游客着装有要求的（如教堂、寺庙、博物馆、皇宫等），导游领队应提前一天向游客说明，提醒准备。（7）导游领队应提醒游客摄影摄像时先后有序，不妨碍他人。如需拍摄他人肖像或与他人合影，应征得同意。","figures":[]},{"no":155,"type":"multi","q":"下列选项中，对于虚实结合法描述正确的有（ ）。","opt":["A.“虚”包括民间故事、神话传说","B.“实”指景观的具体形象、真实历史","C.以“虚”为主，“实”为“虚”服务，烘托情节","D.虚实有机结合、自然连贯，不能生搬硬套","E.注意内容选择，“实”要“精”要“活”"],"ans":"ABD","analysis":"“虚”包括民间故事、神话传说等，“实”指景观的具体形象、真实历史等。（1）虚实有机结合、自然连贯，不能生搬硬套；（2）以“实”为主，“虚”为“实”服务，烘托情节；（3）注意内容选择，“实”要从眼前景物中选，“虚”要“精”要“活”。","figures":[]},{"no":156,"type":"multi","q":"地陪在与全陪合作过程中，应该遵循的原则有（ ）。","opt":["A.找准个人定位，把握自身职责","B.以地陪为中心，全陪协助地陪","C.尽量减少与全陪接触，独立完成带团任务","D.给予对方尊重，建立友情关系","E.善于相互学习，营造积极氛围"],"ans":"ADE","analysis":"找准个人定位，把握自身职责；给予对方尊重，建立友情关系；善于相互学习，营造积极氛围。","figures":[]},{"no":157,"type":"multi","q":"下列选项中，导游应该劝阻旅游者自由活动的情形有（ ）。","opt":["A.旅游团即将离开本地","B.景区游客不多，环境较好，游客提出自由活动","C.旅游者提出单独划船或去非游泳区“游泳”的要求","D.旅游者单独骑自行车去人生地不熟、车水马龙的街头游玩","E.旅游者去不对外开放的地区、机构参观游览的要求"],"ans":"ACDE","analysis":"应劝阻旅游者自由活动的几种情况1.旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误机（车、船）。2.身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3.单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4.游河（湖、海）时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5.要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","figures":[]},{"no":158,"type":"multi","q":"旅游者出现下列情形之一的，导游应立即向雷大大旅行社报告（ ）。","opt":["A.旅游者中途需要暂时离团的","B.患有传染病等疾病，可能危害其他旅游者健康和安全的","C.携带危害公共安全的物品且不同意交有关部门处理的","D.从事违法或违反公序良俗活动的","E.法律规定的需要报告的其他情形"],"ans":"BCDE","analysis":"旅游者出现下列情形之一的，导游应立即向旅行社报告：（1）患有传染病等疾病，可能危害其他旅游者健康和安全的；（2）携带危害公共安全的物品且不同意交有关部门处理的；（3）从事违法或违反公序良俗活动的；（4）从事严重影响其他旅游者权益的活动，且不听劝阻、不能制止的；（5）法律规定的其他情形。","figures":[]},{"no":159,"type":"multi","q":"如果导游老王预计可能发生误机（车、船）事故，他应该（ ）。","opt":["A.及时向旅行社汇报","B.开展应急联动操作","C.做好对下一站的通知","D.做好旅游者安抚工作","E.立刻改签交通工具，尽量确保游客正常离开"],"ans":"ABD","analysis":"将成事故的应急处理：在赶往机场（车站、码头）途中遇高速严重堵车、旅游车抛锚等突发情况时，导游若预计延误，需提前应急：（1）及时向旅行社汇报：发现可能延误，即刻向旅行社负责人说明情况并保持联系。（2）开展应急联动操作：通过旅行社联系机场、车站、码头等，告知旅游者人数、迟到原因及预计抵达时间，询问能否等候；导游也可通过软件关注航班等信息。（3）灵活制定应对措施：依承运方反馈和现场交通状况，与旅行社商定应对措施，如高铁改签、航班更改等。（4）做好旅游者安抚工作：处理过程中，导游保持冷静，随时向旅游者通报进展和补救措施，安抚情绪并告知需协助事项。","figures":[]},{"no":160,"type":"multi","q":"旅游者被毒虫蜇伤后，导游老王应（ ）。","opt":["A.提醒旅游者尽快离开事发点","B.记下事发地环境及毒虫样貌","C.提醒旅游者快速挤压或按摩伤口","D.若被蜜蜂等刺伤，先检查并拔除毒刺，有条件尽量用酸性溶液清洗","E.如出现头晕、呼吸困难，应尽快送医或拨打急救电话"],"ans":"ABE","analysis":"提醒旅游者尽快离开事发点，防止再次被咬；记下事发地环境及毒虫样貌；被蜜蜂等刺伤，先检查并拔除毒刺，用洁净清水冲洗伤口，有条件用肥皂水冲洗；提醒旅游者勿挤压或按摩伤口；如出现头晕、呼吸困难，应尽快送医或拨打急救电话。","figures":[]},{"no":161,"type":"multi","q":"为防止食物中毒事故发生，导游老王应该（ ）。","opt":["A.选择卫生可靠的餐厅用餐","B.提醒旅游者少吃街边小摊食物，少量品尝即可","C.购买包装食品时查看生产日期和保质期","D.不吃隔夜、生冷食物及野生果实","E.若发现餐厅菜肴、饮料不卫生，立即停止进食，并带领游客前往医院观察"],"ans":"ACD","analysis":"1.选择卫生可靠的餐厅用餐：安排或建议旅行社安排有卫生保障的餐厅，避免无证经营场所。2.做好安全饮食提示：提醒旅游者勿食街边小摊食物，购买包装食品时查看生产日期和保质期，不吃隔夜、生冷食物及野生果实。3.及时处理饮食变质问题：用餐时若发现菜肴、饮料不卫生或存在过期、变质、异味等情况，立即让餐厅撤下并采取补救措施，同时留意旅游者用餐后的状况。","figures":[]},{"no":162,"type":"multi","q":"发生地震时，室内避震正确的方式有（ ）。","opt":["A.身处单层房屋和楼房的一、二层，条件允许，应迅速撤离至室外安全区域","B.若身处楼房高层，身体状况不适合撤离，则应“就近躲避”","C.靠近玻璃门窗躲避，待地震停止后，击碎玻璃逃生","D.选择小开间区域、立柱旁边、内承重墙的墙根、墙角躲避","E.若处于排椅、床等旁边，可选择趴下、伏而待定或侧卧躺下等姿势"],"ans":"ABDE","analysis":"C选项，务必避开吊灯、电扇等悬挂物，以及玻璃门窗、橱窗、高大不稳或摆放易碎品的货架等可能发生物体倒塌或坠落的危险区域。其他选项描述正确。","figures":[]},{"no":163,"type":"multi","q":"洪水到来时，导游老王应该（ ）。","opt":["A.等待救援过程中，尽量找机会下水，想办法远离洪水","B.迅速组织游客转移到附近高处","C.若无法脱困时，迅速与救援部门取得联系，准确报告所在方位和险情","D.切勿接近或触碰电线杆、高压线铁塔，远离有电线掉落的水域","E.安抚客人情绪，保持冷静"],"ans":"BCDE","analysis":"这是洪水来临时的首要原则。应迅速组织大家转移到附近高处，像山坡、高地、坚固的高层建筑等场所暂避;若发现无法凭借自身力量脱困时，要迅速与救援部门取得联系，准确报告所在方位和险情;切勿接近或触碰电线杆、高压线铁塔，远离有电线掉落的水域，以防触电;也不要轻易下水，洪水水流湍急且水下情况复杂，可能存在暗流、旋涡、尖锐物体等危险因素，极易让人失去平衡遭受伤害。","figures":[]},{"no":164,"type":"multi","q":"关于购买飞机机票的价格，描述正确的选项有（ ）。","opt":["A.12周岁及以上年龄旅客需要购买全价票","B.2至12周岁旅客需要购买全价票价格的50%的机票","C.即使成人折扣价低于全价票的50%，2至12周岁旅客也不可以购买成人折扣票","D.不满2周岁旅客，票价为成年人正常票价的10%，占座","E.1位成年人可以购买2张成年人正常票价的10%的儿童票，并占座"],"ans":"AB","analysis":"成人票12周岁及以上全价票提供标准座位；儿童票2至12周岁基准价：全价票的50%·例外规则：若成人票折扣价低于全价50%，可订成人折扣票；婴儿票不满2周岁：成人正常票价的10%不单独占座，需占座则购买儿童票多人携带规则：1名成人限带1名婴儿。","figures":[]},{"no":165,"type":"multi","q":"下列度量衡换算正确的选项是（ ）。","opt":["A.1米=3英尺","B.1斤=20两","C.1金衡盎司=155.5克拉","D.1亩=666.67平方米","E.1立方米=1000000立方厘米"],"ans":"CDE","analysis":"1米=3尺=3.2808英尺；1千克=20两；1金衡盎司=155.5克拉；1亩=666.67平方米；1立方米=1000000立方厘米。","figures":[]}];

    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const s=JSON.parse(raw);
        if(s.version!==2)throw new Error('version');
        for(const q of questions){
            const r=s.records?.[q.no];
            if(!r||!Array.isArray(r.selected))continue;
            const selected=[...new Set(r.selected.filter(v=>q.opt.some(o=>o[0]===v)))];
            if(q.type!=='multi'&&selected.length>1)continue;
            records[q.no]={selected,submitted:r.submitted===true&&selected.length>0};
        }
        wrongSet=new Set((Array.isArray(s.wrong)?s.wrong:[]).filter(n=>byNo.has(n)));
        mode=s.mode==='wrong'?'wrong':'all';
        pool=mode==='wrong'?[...new Set((Array.isArray(s.pool)?s.pool:[]).filter(n=>byNo.has(n)&&wrongSet.has(n)))]:questions.map(q=>q.no);
        if(mode==='wrong'&&!pool.length)pool=[...wrongSet];
        idx=Math.max(0,pool.indexOf(s.currentNo));
    }catch(e){el('storageStatus').textContent='原保存记录无法读取，本次从头开始。';}
}
function render(){
    const item=current();
    let right=0,wrong=0;
    for(const q of questions){const r=records[q.no];if(r?.submitted){normalized(r.selected)===normalized(q.ans.split(''))?right++:wrong++;}}
    el('r').textContent=right;el('w').textContent=wrong;
    el('cur').textContent=pool.length?idx+1:0;el('total').textContent=pool.length;
    el('wrongBtn').textContent='刷错题（'+wrongSet.size+'）';
    el('allBtn').disabled=mode==='all';el('wrongBtn').disabled=mode==='wrong';
    el('modeHint').textContent=(mode==='wrong'?'错题练习':'全部题目')+' · 已判分 '+(right+wrong)+' / '+questions.length+' 题。错题答对仍保留，可手动移出。跳转填写原题号。';
    el('prevBtn').disabled=!pool.length||idx===0;el('nextBtn').disabled=!pool.length||idx===pool.length-1;
    el('removeBtn').disabled=!item||!wrongSet.has(item.no);
    el('optBox').replaceChildren();el('ansDiv').style.display='none';
    el('submitBtn').hidden=!item||item.type!=='multi';
    if(!item){el('q').textContent='错题本为空，继续做题后，答错的题会自动加入。';el('answerHint').textContent='点击“全部题目”继续练习。';return;}
    const r=records[item.no]||{selected:[],submitted:false};
    el('q').textContent='【'+item.no+' · '+({judge:'判断题',single:'单选题',multi:'多选题'}[item.type])+'】'+item.q;
    el('answerHint').textContent=item.type!=='multi'?'选择后立即判断对错并显示解析。':'选好后点击“提交答案”，才会判断对错并显示解析。';
    el('submitBtn').disabled=r.submitted||!r.selected.length;
    for(const o of item.opt){
        const val=o[0],label=document.createElement('label'),input=document.createElement('input');
        label.className='opt';input.type=item.type==='multi'?'checkbox':'radio';input.name='answer';input.value=val;input.checked=r.selected.includes(val);
        if(input.checked)label.classList.add('selected');
        if(r.submitted&&item.ans.includes(val))label.classList.add('correct');
        if(r.submitted&&input.checked&&!item.ans.includes(val))label.classList.add('incorrect');
        input.addEventListener('change',save);label.append(input,document.createTextNode(o));el('optBox').append(label);
    }
    if(r.submitted){
        const ok=normalized(r.selected)===normalized(item.ans.split(''));
        el('ansDiv').style.display='block';el('result').textContent=ok?'✅ 回答正确':'❌ 回答错误';el('result').style.color=ok?'#18733b':'#c23232';
        el('stdAns').textContent=item.opt.filter(o=>item.ans.includes(o[0])).join('；');el('analysisTxt').textContent=item.analysis;
        const box=el('figureBox');box.replaceChildren();
        for(const [i,src] of (item.figures||[]).entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题解析补充图 '+(i+1);img.loading='lazy';box.append(img);}
    }
}
function save(){
    const item=current();if(!item)return;
    records[item.no]={selected:Array.from(el('optBox').querySelectorAll('input:checked'),n=>n.value),submitted:false};
    if(item.type!=='multi')submitAnswer();else{persist();render();}
}
function submitAnswer(){
    const item=current(),r=item&&records[item.no];if(!r?.selected.length)return;
    r.submitted=true;
    if(normalized(r.selected)!==normalized(item.ans.split('')))wrongSet.add(item.no);
    persist();render();
}
function prev(){if(idx>0){idx--;persist();render();}}
function next(){if(idx<pool.length-1){idx++;persist();render();}}
function clearSel(){const item=current();if(!item)return;records[item.no]={selected:[],submitted:false};persist();render();}
function goJump(){
    const n=Number(el('goto').value),pos=pool.indexOf(n);
    if(pos<0){el('answerHint').textContent=mode==='wrong'?'请填写当前错题本中的原题号。':'请输入 1 至 '+questions.length+' 的整数题号。';return;}
    idx=pos;persist();render();
}
function setMode(value){
    const no=current()?.no;mode=value;pool=mode==='wrong'?questions.filter(q=>wrongSet.has(q.no)).map(q=>q.no):questions.map(q=>q.no);
    idx=Math.max(0,pool.indexOf(no));persist();render();
}
function removeWrong(){
    const item=current();if(!item)return;wrongSet.delete(item.no);
    if(mode==='wrong'){pool=pool.filter(n=>n!==item.no);idx=Math.max(0,Math.min(idx,pool.length-1));}
    persist();render();
}
el('goto').addEventListener('keydown',e=>{if(e.key==='Enter')goJump();});

function progressSnapshot(){return {version:2,currentNo:pool[idx]??null,mode,pool:[...pool],records:JSON.parse(JSON.stringify(records)),wrong:[...wrongSet]};}
function backupPayload(){return {format:'guide-exam-progress',backupVersion:1,examId:STORAGE_KEY,exportedAt:new Date().toISOString(),questionCount:questions.length,state:progressSnapshot()};}
function validateBackup(data){
    if(!data||data.format!=='guide-exam-progress'||data.backupVersion!==1)throw new Error('这不是支持的刷题进度文件。');
    if(data.examId!==STORAGE_KEY||data.questionCount!==questions.length)throw new Error('这份进度不属于当前题库，请在对应题库中导入。');
    const s=data.state;
    if(!s||s.version!==2||!['all','wrong'].includes(s.mode)||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.pool)||!Array.isArray(s.wrong))throw new Error('进度文件内容不完整或已损坏。');
    const validNumbers=a=>a.every(n=>Number.isInteger(n)&&byNo.has(n))&&new Set(a).size===a.length;
    if(!validNumbers(s.pool)||!validNumbers(s.wrong))throw new Error('进度文件包含无效题号。');
    if(s.mode==='all'&&(s.pool.length!==questions.length||s.pool.some((n,i)=>n!==questions[i].no)))throw new Error('全部题目的顺序不正确。');
    if(s.mode==='wrong'&&s.pool.some(n=>!s.wrong.includes(n)))throw new Error('错题列表不一致。');
    if(s.pool.length?!s.pool.includes(s.currentNo):s.currentNo!==null)throw new Error('当前题号无效。');
    for(const [no,r] of Object.entries(s.records)){
        const q=byNo.get(Number(no));
        if(!q||String(q.no)!==no||!r||!Array.isArray(r.selected)||typeof r.submitted!=='boolean'||r.selected.some(v=>typeof v!=='string'||!q.opt.some(o=>o[0]===v))||new Set(r.selected).size!==r.selected.length||(q.type!=='multi'&&r.selected.length>1)||(r.submitted&&!r.selected.length))throw new Error('作答记录格式不正确。');
    }
    return JSON.parse(JSON.stringify(s));
}
function exportProgress(){
    try{
        const payload=backupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='雷卷一科一科二-做题进度-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        el('transferStatus').textContent='已请求下载进度文件。苹果手机请查看 Safari 下载列表或“文件”中的下载项，再把 JSON 文件传到另一设备。';
    }catch(e){el('transferStatus').textContent='导出失败：'+e.message;}
}
function applyBackup(data){
    const s=validateBackup(data);
    // Write successfully before changing the current session, so a storage failure preserves it.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    records={};wrongSet=new Set();idx=0;mode='all';pool=questions.map(q=>q.no);restore();render();
}
async function importProgressFile(event){
    const input=event.target,file=input.files?.[0];if(!file)return;
    try{
        if(file.size>5*1024*1024)throw new Error('文件过大，请选择导出的 JSON 进度文件，不要选择 HTML 题库。');
        const data=JSON.parse((await file.text()).replace(/^\uFEFF/,'')),s=validateBackup(data);
        const answered=Object.values(s.records).filter(r=>r.submitted).length;
        if(!confirm('即将导入：已判分 '+answered+' 题，错题 '+s.wrong.length+' 题。\n这会替换本设备当前题库的进度。建议先导出当前进度备份。\n确定导入吗？')){el('transferStatus').textContent='已取消导入，原进度保留。';return;}
        applyBackup(data);el('transferStatus').textContent='导入成功！已恢复作答、错题及所在题目，后续会继续自动保存到本设备。';
    }catch(e){el('transferStatus').textContent='导入失败，原进度保留：'+e.message;}
    finally{input.value='';}
}
el('progressFile').addEventListener('change',importProgressFile);

restore();render();
</script>
</body>
</html>
