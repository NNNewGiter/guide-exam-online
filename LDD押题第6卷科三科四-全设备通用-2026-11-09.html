<div class="card">

        <div>题号跳转：<input id="goto" type="number" min="1" max="165" step="1" inputmode="numeric" enterkeyhint="go" aria-label="跳转到原题号"><button onclick="goJump()">跳转</button></div>

<script>

const questions = [{"no":1,"type":"judge","q":"生态旅游的核心特征是通过传感器网络实时采集景区环境、客流等数据。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，通过传感器网络实时采集景区环境、客流等数据是智慧旅游的特征，不是生态旅游的核心特征。生态旅游是指以可持续发展为理念，以保护生态环境为前提，以统筹人与自然和谐为准则，并依托良好的自然生态环境和独特的人文生态系统，采取生态友好方式开展的生态体验、生态教育、生态认知并获得身心愉悦的旅游方式。","figures":[],"questionImages":[]},{"no":2,"type":"judge","q":"丹霞地貌因为在福建武夷山的丹霞山发现而被命名。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，丹霞地貌是在广东仁化县的丹霞山发现而被命名的（不是福建武夷山）。丹霞地貌：由中国学者于1928年在广东丹霞山正式命名，是唯一以我国地名命名、被国际地貌学会专门设立工作组独立研究的地貌类型。","figures":[],"questionImages":[]},{"no":3,"type":"judge","q":"江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广陵琴派、南京金陵琴派等重要的地方性音乐流派。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广陵琴派、南京金陵琴派等重要的地方性音乐流派。","figures":[],"questionImages":[]},{"no":4,"type":"judge","q":"仰韶文化居民种植水稻，使用黑陶，修建干栏式建筑。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，种植粟、使用彩陶、修建半地穴式建筑的是仰韶文化（河姆渡文化种植水稻、使用黑陶、修建干栏式建筑）。代表性文化有北方黄河流域的仰韶文化和南方长江流域的河姆渡文化，距今7000~5000年。","figures":[],"questionImages":[]},{"no":5,"type":"judge","q":"鱼尾狮坐落于新加坡河畔，高8米，是新加坡的标志。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。鱼尾狮坐落于新加坡河畔，高8米，是新加坡的标志。","figures":[],"questionImages":[]},{"no":6,"type":"judge","q":"相传春秋战国时期，上海曾经是楚国春申君黄歇的封邑，故上海别称为“申”。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。上海，简称“沪”，别称“虫”。相传春秋战国时期，上海曾经是楚国春申君黄歇的封邑，故上海别称为“虫”。","figures":[],"questionImages":[]},{"no":7,"type":"judge","q":"山西因居太行山之东而得名，又因地处黄河之西，古称河东。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“居太行山之西”“地处黄河之东，古称河东”。山西因居太行山之西而得名，又因地处黄河之东，古称河东。简称“晋”，春秋战国之交，韩、赵、魏三分晋国，又称“三晋”。","figures":[],"questionImages":[]},{"no":8,"type":"judge","q":"南朝祖冲之在世界上首次将圆周率精确到小数点后第7位。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。南朝祖冲之在世界上首次将圆周率精确到小数点后第7位，其子祖曜提出了计算球体体积的祖曜原理。26版教材改动说明：“祖曜”更正为“祖曜”。","figures":[],"questionImages":[]},{"no":9,"type":"judge","q":"新加坡是继纽约、伦敦、日本东京之后的第四大国际金融中心。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，新加坡是继纽约、伦敦、中国香港之后的第四大国际金融中心（不是日本东京之后），也是亚洲重要的航运和服务中心。","figures":[],"questionImages":[]},{"no":10,"type":"judge","q":"1891年，重庆成为中国最早对外开放的内陆通商口岸之一。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。1891年，重庆成为中国最早对外开放的内陆通商口岸之一。","figures":[],"questionImages":[]},{"no":11,"type":"judge","q":"后母戊鼎是迄今世界上发现的最大的青铜器，其重达832.84公斤。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。商朝代表性器物是高达133厘米、重达832.84公斤的后母戊鼎，是迄今世界上发现的最大的青铜器。","figures":[],"questionImages":[]},{"no":12,"type":"judge","q":"联合国旅游组织（UN Tourism）是联合国系统的政府间国际组织，总部设在法国巴黎。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，联合国旅游组织总部设在西班牙马德里（不是法国巴黎）。联合国旅游组织（UN Tourism）是联合国系统的政府间国际组织，总部位于西班牙马德里。26版教材改动说明：“世界旅游组织（UNWTO）”改为“联合国旅游组织”，补充2024年更名、世界旅游日、新视觉标识和口号；会员口径更新为160个正式会员国、6个准成员、2个观察员。","figures":[],"questionImages":[]},{"no":13,"type":"judge","q":"贵州全省建成公路桥梁超2.8万座，被称为“世界桥梁博物馆”。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。贵州全省建成公路桥梁超2.8万座，被称为“世界桥梁博物馆”。","figures":[],"questionImages":[]},{"no":14,"type":"judge","q":"一二·九运动标志着中国人民抗日救亡民主运动新高潮的到来。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。二·九运动揭露了日本吞并华北进而独占中国的阴谋，打击了国民党的妥协退让政策，极大地促进了中华民族的觉醒，标志着中国人民抗日救亡民主运动新高潮的到来。","figures":[],"questionImages":[]},{"no":15,"type":"judge","q":"大本钟是法国巴黎的标志性建筑。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，大本钟是英国伦敦（不是法国巴黎）的标志性建筑之一。主要景点有白金汉宫、唐宁街10号、议会大厦、大英博物馆、圣保罗教堂、威斯敏斯特教堂、伦敦塔、伦敦塔桥、大本钟、温莎城堡、格林尼治天文台、中国城、海德公园等。","figures":[],"questionImages":[]},{"no":16,"type":"judge","q":"富士山海拔3776米，是日本最高峰，被尊称为“圣岳”。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。富士山是日本的最高峰，海拔3776米，被日本人尊称为“圣岳”，是世界著名火山及风景游览区，成为日本的象征。","figures":[],"questionImages":[]},{"no":17,"type":"judge","q":"党的七大以“团结的大会、胜利的大会”载入史册。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。七大以“团结的大会、胜利的大会”载入史册。党的七大于1945年4月23日至6月11日在延安举行，确定“以马克思列宁主义的理论与中国革命的实践之统一的思 想——毛泽东思想，作为自己一切工作的指针”。","figures":[],"questionImages":[]},{"no":18,"type":"judge","q":"刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北地区第一个革命根据地——陕甘边革命根据地。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"解析本题说法正确。刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北地区第一个革命根据地——陕甘边革命根据地。","figures":[],"questionImages":[]},{"no":19,"type":"judge","q":"《九章算术》标志着我国古典数学体系基本形成，其成书年代是西汉。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"解析本题说法错误，《九章算术》成书于东汉（不是西汉）。东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代数学体系基本形成。","figures":[],"questionImages":[]},{"no":20,"type":"judge","q":"吉林省查干湖多年来形成了独具渔猎特色的查干湖文化，查干湖冬捕已传承数千年。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":21,"type":"judge","q":"我国探月工程命名为“嫦娥工程”，于2004年启动。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。2004年我国启动探月工程，命名为“嫦娥工程”。已实现多次月球探测，其中嫦娥五号带回月壤1731克，嫦娥六号带回人类首份月背样品1935.3克。","figures":[],"questionImages":[]},{"no":22,"type":"judge","q":"辽宁是我国东北老工业基地核心省份，是全国重要的装备制造、石化冶金、船舶海工产业基地。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。辽宁省是我国东北老工业基地核心省份，是全国重要的装备制造、石化冶金、船舶海工产业基地。","figures":[],"questionImages":[]},{"no":23,"type":"judge","q":"按照题材划分，中国画可分为人物画、山水画和花鸟画等类型。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。如果按照题材划分，中国画可分为人物画、山水画和花鸟画等类型，有工笔、写意、水墨、勾勒等多种技法，注重神似不重形似，大多数作品用笔、墨、纸、砚绘制而成，加上题诗和装裱，构成充满诗情画意的精美艺术品。","figures":[],"questionImages":[]},{"no":24,"type":"judge","q":"北京从辽代到清末建造了许多宏伟的宫廷建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。北京有870年的建都史，从辽代到清末，北京建造了许多宏伟的宫廷建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。","figures":[],"questionImages":[]},{"no":25,"type":"judge","q":"作为中国南北气候分界线的秦岭山脉横贯陕西全省东西。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。作为中国南北气候分界线的秦岭山脉横贯全省东西。","figures":[],"questionImages":[]},{"no":26,"type":"judge","q":"安徽清康熙六年（1667年）设安徽布政使司，取辖区内“安庆”“六安”两地首字，正式定名为“安徽”。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“取“安庆”“徽州”两地首字”。清康熙六年（1667年）设安徽布政使司，取辖区内“安庆”“徽州”两地首字，正式定名为“安徽”。","figures":[],"questionImages":[]},{"no":27,"type":"judge","q":"1970年7月成昆铁路竣工运营，基本改写了蜀道难的历史。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。1970年7月成昆铁路竣工运营，基本改写了蜀道难的历史。","figures":[],"questionImages":[]},{"no":28,"type":"judge","q":"1624年荷兰殖民者侵占台湾南部，1626年西班牙殖民者入侵台湾北部，1642年荷兰取代西班牙占领台湾北部。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。1624年荷兰殖民者侵占台湾南部，1626年西班牙殖民者入侵台湾北部，1642年荷兰取代西班牙占领台湾北部。","figures":[],"questionImages":[]},{"no":29,"type":"judge","q":"被誉为“天下第一行书”的书法作品是《祭侄文稿》。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，被誉为“天下第一行书”的是王羲之的《兰亭集序》（不是《祭侄文稿》）。行书以东晋王羲之成就最高，人称“书圣”，代表作《兰亭集序》被誉为“天下第一行书”。","figures":[],"questionImages":[]},{"no":30,"type":"judge","q":"德天瀑布是我国水流量最大的瀑布。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，我国水流量最大的瀑布是壶口瀑布（不是德天瀑布）。德天瀑布是亚洲第一大跨国瀑布。","figures":[],"questionImages":[]},{"no":31,"type":"judge","q":"北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷，效率大幅提升。","figures":[],"questionImages":[]},{"no":32,"type":"judge","q":"在法国，接受礼物要当面打开，否则是无礼的表现。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。接受礼物时要当面打开，否则是无礼的表现。","figures":[],"questionImages":[]},{"no":33,"type":"judge","q":"西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、布拉马普特拉河、湄公河等河流的上源都在这里。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、布拉马普特拉河、湄公河等河流的上源都在这里。","figures":[],"questionImages":[]},{"no":34,"type":"judge","q":"新疆全年日照时间平均2600～3400小时，居全国第2位，为特色优势农产品种植提供了良好的自然条件。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。新疆全年日照时间平均 2600～3400 小时，居全国第2位，为特色优势农产品种植提供了良好的自然条件。","figures":[],"questionImages":[]},{"no":35,"type":"judge","q":"南宋宋慈著《洗冤录》，是中国第一部法医学专著。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。南宋宋慈著《洗冤录》，是中国第一部法医学专著。","figures":[],"questionImages":[]},{"no":36,"type":"judge","q":"云南最高峰是位于玉龙雪山的扇子陡。（ ）","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“梅里雪山最高峰卡瓦格博峰，海拔6740米，是云南最高山峰”。梅里雪山最高峰卡瓦格博峰海拔6740米，是云南最高山峰。","figures":[],"questionImages":[]},{"no":37,"type":"judge","q":"福建共有10个项目入选《联合国教科文组织非遗名录》（名册），是全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省份。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。福建共有10个项目入选《联合国教科文组织非遗名录》（名册），是全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省份。","figures":[],"questionImages":[]},{"no":38,"type":"judge","q":"“三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。","figures":[],"questionImages":[]},{"no":39,"type":"judge","q":"新界中部的大帽山（957米）是香港第一高峰。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。新界中部的大帽山（957米）是香港第一高峰。","figures":[],"questionImages":[]},{"no":40,"type":"judge","q":"12世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，蒙古族的名字由此而来，象征着“永恒之火”。（ ）","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。12世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，蒙古族的名字由此而来，象征着“永恒之火”。","figures":[],"questionImages":[]},{"no":41,"type":"single","q":"嫦娥六号带回的人类首份月背样品重（ ）。","opt":["A.1731克","B.1935.3克","C.2000克","D.1500克"],"ans":"B","analysis":"1731克是嫦娥五号带回的月壤重量，A项错误。嫦娥六号带回人类首份月背样品，重1935.3克。","figures":[],"questionImages":[]},{"no":42,"type":"single","q":"拙政园请吴门画派的代表人物（ ）为其设计蓝图。","opt":["A.仇英","B.沈周","C.文徽明","D.唐寅"],"ans":"C","analysis":"王献臣曾请吴门画派的代表人物文徽明为其设计蓝图，形成以水为主、疏朗平淡、近乎自然的风景。","figures":[],"questionImages":[]},{"no":43,"type":"single","q":"1852年，（ ）受命在湘组建湘军，镇压太平天国。","opt":["A.左宗棠","B.曾国藩","C.李鸿章","D.张之洞"],"ans":"B","analysis":"1852年, 曾国藩受命在湘组建湘军, 镇压太平天国。左宗棠为湘军重要将领但非组建者, 李鸿章组建淮军, 张之洞为洋务派代表, 1852年组建湘军者为曾国藩。","figures":[],"questionImages":[]},{"no":44,"type":"single","q":"标志着新民主主义革命伟大开端的是（ ）。","opt":["A.五四运动","B.中国共产党成立","C.南昌起义","D.辛亥革命"],"ans":"A","analysis":"五四运动是近代中国革命史上具有划时代意义的事件，标志着新民主主义革命的伟大开端。","figures":[],"questionImages":[]},{"no":45,"type":"single","q":"我国支派最多的佛教宗派是（ ）。","opt":["A.律宗","B.禅宗","C.净土宗","D.密宗"],"ans":"B","analysis":"禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影响最广泛的宗派。","figures":[],"questionImages":[]},{"no":46,"type":"single","q":"1227年蒙古灭西夏后，设（ ），始有宁夏之名。","opt":["A.宁夏府","B.西夏路","C.灵州路","D.宁夏路"],"ans":"D","analysis":"解析简称“宁”，首府银川市。1227年蒙古灭西夏后，设宁夏路，始有宁夏之名。","figures":[],"questionImages":[]},{"no":47,"type":"single","q":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称（ ）。","opt":["A.澳门鱼行醉龙醒狮大会","B.澳门醉龙巡游","C.澳门鲜鱼行庙会","D.澳门龙舟醉会"],"ans":"A","analysis":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称澳门鱼行醉龙醒狮大会。","figures":[],"questionImages":[]},{"no":48,"type":"single","q":"壮族地区产量居全国首位的作物是（ ）。","opt":["A.橡胶","B.剑麻","C.香蕉","D.甘蔗"],"ans":"D","analysis":"壮族地区甘蔗产量居全国首位，南珠、三七、蛤是壮族地区最负盛名的特产。","figures":[],"questionImages":[]},{"no":49,"type":"single","q":"“布达拉”是梵语音译，又译作“普陀”，原指（ ）所居之岛。","opt":["A.文殊菩萨","B.释迦牟尼佛","C.观世音菩萨","D.阿弥陀佛"],"ans":"C","analysis":"布达拉宫位于西藏拉萨市的红山上，“布达拉”是梵语音译，又译作“普陀”，原指观世音菩萨所居之岛。","figures":[],"questionImages":[]},{"no":50,"type":"single","q":"1914年在巴拿马国际博览会上一举夺得金奖的是天津的（ ）。","opt":["A.“泥人张”彩塑","B.杨柳青年画","C.“魏记”风筝","D.天津地毯"],"ans":"C","analysis":"1914年，“魏记”风筝在巴拿马国际博览会上一举夺得金奖。“泥人张”彩塑、杨柳青年画、天津地毯同为天津名产，但1914年获巴拿马国际博览会金奖者为“魏记”风筝。","figures":[],"questionImages":[]},{"no":51,"type":"single","q":"唐朝出现了专门掌握绳墨绘制图样和施工的（ ）。","opt":["A.都料匠","B.梓人","C.鲁班","D.瓦匠"],"ans":"A","analysis":"唐朝在建筑技术方面，出现了木构架设计的标准，木构件的比例形式逐步趋向定型化，并出现了专门掌握绳墨绘制图样和施工的都料匠。","figures":[],"questionImages":[]},{"no":52,"type":"single","q":"主桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，“横竖”都是世界第一的贵州大桥是（ ）。","opt":["A.北盘江大桥","B.坝陵河大桥","C.鸭池河大桥","D.花江峡谷大桥"],"ans":"D","analysis":"花江峡谷大桥全长2890米，主桥跨径1420米，桥面至水面垂直高度626.01米，主桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，被称为“横竖”都是世界第一。一、桥梁高度居世界第一，被称为“横竖”都是世界第一。北盘江大桥、坝陵河大桥、鸭池河大桥均为贵州著名桥梁，但“横竖都是世界第一”者为花江峡谷大桥。","figures":[],"questionImages":[]},{"no":53,"type":"single","q":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从（ ）到荷兰鹿特丹港的国际化铁路交通干线。","opt":["A.山东省青岛市","B.辽宁省大连市","C.江苏省连云港市","D.上海市"],"ans":"C","analysis":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从江苏省连云港市到荷兰鹿特丹港的国际化铁路交通干线，国内由陇海铁路和兰新铁路组成，全长10900公里。新亚欧大陆桥东起江苏连云港，西抵荷兰鹿特丹，青岛、大连、上海均非其起点。\n\n题源校对：C、D 项据解析版补齐。","figures":[],"questionImages":[]},{"no":54,"type":"single","q":"全国唯一的畲族自治县——景宁畲族自治县位于浙江省（）。","opt":["A.温州市","B.衢州市","C.丽水市","D.杭州市"],"ans":"C","analysis":"浙江省丽水市设有全国唯一的畲族自治县——景宁畲族自治县，畲民自称“山哈”，意为山里的客人。景宁畲族自治县隶属于丽水市，非温州、衢州、杭州所辖。","figures":[],"questionImages":[]},{"no":55,"type":"single","q":"中国最早的马克思主义传播者是（ ）。","opt":["A.鲁迅","B.陈独秀","C.李大钊","D.毛泽东"],"ans":"C","analysis":"李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","figures":[],"questionImages":[]},{"no":56,"type":"single","q":"上海民族民间文化以（ ）为根、移民文化为脉、海派文化为魂。","opt":["A.徽文化","B.荆楚文化","C.齐鲁文化","D.江南文化（吴越文化）"],"ans":"D","analysis":"上海民族民间文化以江南文化（吴越文化）为根、移民文化为脉、海派文化为魂，兼具吴越传统与中西交融特质，开放包容、精致务实。上海民族民间文化以江南文化（吴越文化）为根，徽文化、齐鲁文化、荆楚文化均非上海文化之根。","figures":[],"questionImages":[]},{"no":57,"type":"single","q":"继北京之后，全国第二个拥有双4F机场的城市是（ ）。","opt":["A.上海","B.广州","C.成都","D.深圳"],"ans":"C","analysis":"成都市是继北京之后全国第二个拥有双4F机场的城市。","figures":[],"questionImages":[]},{"no":58,"type":"single","q":"隋开皇九年（589年）将荆州江夏郡改称（ ），后来鄂州又成为治所，今湖北简称鄂即源于此。","opt":["A.荆州","B.江夏","C.鄂州","D.武昌"],"ans":"C","analysis":"隋开皇九年（589年）将荆州江夏郡改称鄂州，治江夏，后来鄂州又成为治所，今湖北简称鄂即源于此。荆州、江夏为隋代以前的郡名，武昌为今湖北城市，湖北简称“鄂”源于隋代改称鄂州。","figures":[],"questionImages":[]},{"no":59,"type":"single","q":"土家人把是否善于（ ）作为衡量女子才德的标准。","opt":["A.唱山歌","B.哭嫁","C.织锦","D.摆手舞"],"ans":"B","analysis":"女子在出嫁前7~20天开始哭，哭嫁歌有“女哭娘”“姐哭妹”“骂媒人”等。开始是轻歌唱，越接近嫁期越悲伤。土家人把是否善于哭嫁作为衡量女子才德的标准。唱山歌、织锦均为土家族传统技艺，摆手舞为土家族传统舞蹈，土家人把是否善于哭嫁作为衡量女子才德的标准。","figures":[],"questionImages":[]},{"no":60,"type":"single","q":"绍兴加饭酒距今已有（ ）多年的酿造历史。","opt":["A.1000","B.1500","C.2300","D.3000"],"ans":"C","analysis":"解析古称“山阴甜酒”“越酒”，距今已有2300多年的酿造历史。具有色泽橙黄清澈、香气芬芳浓郁、滋味鲜甜醇厚、越陈越香、久藏不坏的特点。","figures":[],"questionImages":[]},{"no":61,"type":"single","q":"世界上海拔最高的湖泊是（ ）。","opt":["A.色林错","B.青海湖","C.纳木错","D.扎日南木错"],"ans":"C","analysis":"纳木错也是世界上海拔最高的湖泊。色林错、扎日南木错均为西藏大湖，青海湖为我国最大的内陆咸水湖，但世界上海拔最高的湖泊为纳木错。","figures":[],"questionImages":[]},{"no":62,"type":"single","q":"湖北土家族把丧事当作喜事办的独特丧葬习俗是（ ）。","opt":["A.哭嫁","B.赶年","C.舍巴日","D.跳丧"],"ans":"D","analysis":"湖北土家族风情除了独具特色的服饰和美食外，特别值得一提的是“跳丧”的习俗。是把丧事当作喜事办的独特丧葬习俗。哭嫁为土家族婚俗，赶年为土家族年俗，舍巴日为土家族祭祀节庆，“跳丧”才是其独特丧葬习俗。","figures":[],"questionImages":[]},{"no":63,"type":"single","q":"国民党一大事实上确立的三大政策是（ ）。","opt":["A.联俄、联共、联蒋","B.联俄、联共、扶助农工","C.民族、民权、民生","D.联美、联共、扶助农工"],"ans":"B","analysis":"1924年1月，中国国民党第一次全国代表大会召开，重新解释三民主义，事实上确立联俄、联共、扶助农工三大政策，标志着第一次国共合作正式形成。","figures":[],"questionImages":[]},{"no":64,"type":"single","q":"以《清明上河图》最为知名的宋代画家是（ ）。","opt":["A.王蒙","B.张择端","C.黄公望","D.倪瓒"],"ans":"B","analysis":"宋代画家以张择端《清明上河图》最为知名。","figures":[],"questionImages":[]},{"no":65,"type":"single","q":"有“黄河之水天上来”之势，属于我国三大瀑布之一的是（ ）。","opt":["A.黄果树瀑布","B.壶口瀑布","C.德天瀑布","D.吊水楼瀑布"],"ans":"B","analysis":"峡谷下段有著名的壶口瀑布，有“黄河之水天上来”之势，是我国三大瀑布之一。","figures":[],"questionImages":[]},{"no":66,"type":"single","q":"中国古代使用时间最长、精确度最高的历法是（ ）。","opt":["A.《甘石星经》","B.《授时历》","C.《太初历》","D.《黄帝历》"],"ans":"B","analysis":"至元代郭守敬又制定《授时历》。《授时历》是中国古代使用时间最长、精确度最高的历法。","figures":[],"questionImages":[]},{"no":67,"type":"single","q":"南唐后主李煜的代表作有（ ）。","opt":["A.《念奴娇·赤壁怀古》","B.《水调歌头·明月几时有》","C.《满江红》","D.《虞美人·春花秋月何时了》"],"ans":"D","analysis":"李煜的代表作有《虞美人·春花秋月何时了》《浪淘沙·帘外雨潺潺》《相见欢·林花谢了春红》《相见欢·无言独上西楼》等。","figures":[],"questionImages":[]},{"no":68,"type":"single","q":"世界上海拔最高的大型湖泊，被称为“天湖”的是（ ）。","opt":["A.纳木错","B.鄱阳湖","C.长白山天池","D.青海湖"],"ans":"A","analysis":"解析 纳木错湖面海拔4718米，为世界上海拔最高的大型湖泊，也是目前中国第三大咸水湖。","figures":[],"questionImages":[]},{"no":69,"type":"single","q":"古代十二时辰中，子时对应的时间是（ ）。","opt":["A.1点-3点","B.21点-23点","C.19点-21点","D.23点-1点"],"ans":"D","analysis":"解析 方法是将一天分为12个时辰，对应十二地支，开始于子时（23—次日1点），结束于亥时（21~23点），2小时为一个时辰。","figures":[],"questionImages":[]},{"no":70,"type":"single","q":"中国共产党第二次全国代表大会举行的时间是（ ）。","opt":["A.1921年7月23日","B.1922年7月16-23日","C.1923年6月12-20日","D.1925年1月11-22日"],"ans":"B","analysis":"1922年7月16~23日，中国共产党第二次全国代表大会在上海举行。","figures":[],"questionImages":[]},{"no":71,"type":"single","q":"宋代五大名窑之首是（ ）。","opt":["A.哥窑","B.定窑","C.汝窑","D.官窑"],"ans":"C","analysis":"汝窑瓷器釉色以天青为贵、粉青为上，天蓝和月白次之。宋代形成汝窑、官窑、哥窑、钧窑、定窑“五大名窑”，五窑中以“汝窑为魁”。26版教材改动说明：汝窑条目26版整体改写——窑址明确为古汝州（今河南宝丰），改写香灰胎、开片、釉色等级（天青为贵、粉青为上，天蓝和月白次之）、宋徽宗时天青瓷烧造约20年等，保留玛瑙为釉及“似玉、非玉、而胜玉”评价；25版“其釉色如雨过天晴，温润古朴”表述不再保留。","figures":[],"questionImages":[]},{"no":72,"type":"single","q":"1271年就任蒙古帝国大汗、改国号为元的是（ ）。","opt":["A.窝阔台","B.蒙哥","C.成吉思汗","D.忽必烈"],"ans":"D","analysis":"1271年，成吉思汗孙子忽必烈就任蒙古帝国大汗，改国号为元，元朝正式建立，定都大都（今北京）。","figures":[],"questionImages":[]},{"no":73,"type":"single","q":"贵州全省最高点、海拔2900.6米的山峰是（ ）。","opt":["A.韭菜坪","B.梵净山","C.雷公山","D.大娄山"],"ans":"A","analysis":"贵州简称“黔”或“贵”，省会贵阳市。全省最高点韭菜坪，海拔2900.6米。","figures":[],"questionImages":[]},{"no":74,"type":"single","q":"被誉为“天路”、结束了西藏没有铁路历史的铁路是（ ）。","opt":["A.川藏铁路","B.青藏铁路","C.滇藏铁路","D.拉林铁路"],"ans":"B","analysis":"被誉为“天路”的青藏铁路的通车结束了西藏没有铁路的历史，它全长1956公里，是世界上海拔最高、在冻土上路程最长的高原铁路。川藏铁路、滇藏铁路、拉林铁路均为进出藏铁路通道，但被誉为“天路”、结束西藏没有铁路历史者为青藏铁路。","figures":[],"questionImages":[]},{"no":75,"type":"single","q":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有（ ）之称。","opt":["A.九州腹地、十省通衢","B.八省通衢、天下之中","C.五方杂处、九州之喉","D.山河表里、四塞之固"],"ans":"A","analysis":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有“九州腹地、十省通衢”之称。","figures":[],"questionImages":[]},{"no":76,"type":"single","q":"四川省境内共有大小河流1419条，被誉为（ ）。","opt":["A.万河之省","B.千水之省","C.水乡泽国","D.鱼米之乡"],"ans":"B","analysis":"四川省境内共有大小河流1419条，被誉为“千水之省”。","figures":[],"questionImages":[]},{"no":77,"type":"single","q":"有“京外名刹之首”美誉的是石家庄的（ ）。","opt":["A.赵州桥","B.秦皇古道","C.隆兴寺","D.苍岩山"],"ans":"C","analysis":"石家庄有被誉为“京外名刹之首”的隆兴寺。赵州桥为现存最早的敞肩石拱桥，秦皇古道为世界最早的古驿道，苍岩山为石家庄名山，但“京外名刹之首”指隆兴寺。","figures":[],"questionImages":[]},{"no":78,"type":"single","q":"下列口岸中，属于我国仅有的铁路、公路、输油气管道三位一体的国家一类口岸的是（ ）。","opt":["A.阿拉山口口岸","B.红其拉甫口岸","C.巴克图口岸","D.伊尔克什坦口岸"],"ans":"A","analysis":"阿拉山口口岸、霍尔果斯口岸是我国仅有的两个铁路、公路、输油气管道三位一体的国家一类口岸。","figures":[],"questionImages":[]},{"no":79,"type":"single","q":"被称为“中国戏曲之乡”的省份是（ ）。","opt":["A.浙江省","B.安徽省","C.江苏省","D.湖北省"],"ans":"B","analysis":"安徽被称为“中国戏曲之乡”，地方戏种现存30余种，影响较大的有黄梅戏、徽剧等。浙江越剧、江苏昆曲、湖北汉剧均为地方戏名称，“中国戏曲之乡”指的是安徽。","figures":[],"questionImages":[]},{"no":80,"type":"single","q":"唐天宝十四年（755年）爆发“安史之乱”，太子李亨进入宁夏，在（ ）登基称帝，史称唐肃宗。","opt":["A.银川","B.中卫","C.固原","D.灵武"],"ans":"D","analysis":"唐天宝十四年（755年）爆发了“安史之乱”，太子李亨进入宁夏，在灵武登基称帝，史称唐肃宗。","figures":[],"questionImages":[]},{"no":81,"type":"single","q":"（ ）基本属于亚热带高原季风型气候，立体气候特点显著，有“一山分四季，十里不同天”之说。","opt":["A.四川","B.广西","C.贵州","D.云南"],"ans":"D","analysis":"云南基本属于亚热带高原季风型气候，但受纬度差异和海拔垂直差异影响，立体气候特点显著，“一山分四季，十里不同天”，并且全省范围内同时具有寒、温、热（包括亚热带）三带气候。有“立体气候”特点的是云南，四川、广西、贵州的气候类型均与此不符。","figures":[],"questionImages":[]},{"no":82,"type":"single","q":"《史记》的作者是（ ）时期的司马迁。","opt":["A.西汉","B.东汉","C.西晋","D.唐朝"],"ans":"A","analysis":"西汉时期司马迁创作《史记》，首次采用“纪”“传”的方式，记叙了从传说中的黄帝到汉武帝时期2000多年的历史，是中国第一部纪传体通史，被鲁迅誉为“史家之绝唱，无韵之离骚”。","figures":[],"questionImages":[]},{"no":83,"type":"single","q":"全国独此一家、因用柳木炭条起线稿再扑抹印制而得名的年画是（ ）。","opt":["A.杨柳青年画","B.高密扑灰年画","C.绵竹年画","D.桃花坞年画"],"ans":"B","analysis":"高密扑灰年画全国独此一家，年画艺人用柳木炭条起线稿，再用画纸在线稿上扑抹印，一稿可扑数张，因有这一招，便有“扑灰”之名。到清末，发展成两个主要的流派：“老抹画”和“红货”。杨柳青年画产于天津，绵竹年画产于四川，桃花坞年画产于江苏苏州，高密扑灰年画为山东独有。","figures":[],"questionImages":[]},{"no":84,"type":"single","q":"中国现存最大的古代祭祀性建筑群是（ ）。","opt":["A.地坛","B.太庙","C.天坛","D.北京孔庙"],"ans":"C","analysis":"天坛位于东城区，是中国现存最大的古代祭祀性建筑群。地坛是明清帝王祭地之所，太庙为皇家祖庙，北京孔庙为祭祀孔子之所，均非最大的古代祭祀性建筑群。","figures":[],"questionImages":[]},{"no":85,"type":"single","q":"西班牙的“国粹”是（ ）。","opt":["A.吉他","B.海鲜饭","C.弗拉门科舞蹈","D.斗牛"],"ans":"D","analysis":"西班牙民风奔放热情，以斗牛、弗拉门戈舞蹈、吉他而闻名。斗牛是西班牙传统的民族文化，也是“国粹”。","figures":[],"questionImages":[]},{"no":86,"type":"single","q":"高达2882米、为河北省全省最高峰的是（ ）。","opt":["A.雾灵山","B.祖山","C.驼梁","D.小五台山"],"ans":"D","analysis":"在燕山和太行山山地中，小五台山高达2882米，为全省最高峰。","figures":[],"questionImages":[]},{"no":87,"type":"single","q":"被称为“世界上最大的四合院”的北京建筑是（ ）。","opt":["A.雍和宫","B.恭王府","C.醇亲王府","D.礼王府"],"ans":"B","analysis":"北京有世界上最大的皇宫——紫禁城、世界上最大的四合院——恭王府。","figures":[],"questionImages":[]},{"no":88,"type":"single","q":"清康熙十二年（1673年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”，满语译音意为（ ）。","opt":["A.牧场","B.平原","C.森林","D.沿江"],"ans":"D","analysis":"清康熙十二年（1673年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”（满语译音“沿江”之意），吉林由此得名。“吉林乌拉”为满语译音，意为“沿江”，非平原、森林、牧场之意。","figures":[],"questionImages":[]},{"no":89,"type":"single","q":"天津市现存最古老的一座建筑群，也是中国北方妈祖文化的研究中心和北方最大的妈祖庙是（ ）。","opt":["A.吕祖堂","B.玉皇阁","C.大悲院","D.天后宫"],"ans":"D","analysis":"天津天后宫是天津市现存最古老的一座建筑群，是中国北方妈祖文化的研究中心和北方最大的妈祖庙。玉皇阁、大悲院、吕祖堂均为天津道教或佛教建筑，与妈祖文化无关。","figures":[],"questionImages":[]},{"no":90,"type":"single","q":"“园林巧于因借”一语出自明代计成的（ ）。","opt":["A.《长物志》","B.《园冶》","C.《闲情偶寄》","D.《说园》"],"ans":"B","analysis":"《园冶》是明末出现的一部总结造园经验的著作。明代计成在《园冶》中指出，“园林巧于因借”。","figures":[],"questionImages":[]},{"no":91,"type":"single","q":"“江水并流而不交汇”的三江并流位于（ ）省。","opt":["A.云南","B.贵州","C.西藏","D.四川"],"ans":"A","analysis":"三江并流指金沙江、澜沧江和怒江这三条发源于青藏高原的大江在云南省境内自北向南并行奔流170多千米，穿越崇山峻岭，形成世界上罕见的“江水并流而不交汇”的奇特自然地理景观。\n\n题源校对：C、D 项据解析版补齐。","figures":[],"questionImages":[]},{"no":92,"type":"single","q":"2024年12月入选联合国教科文组织人类非物质文化遗产代表作名录的是（ ）。","opt":["A.“端午节”","B.“春节——中国人庆祝传统新年的社会实践”","C.“中秋节”","D.“元宵节”"],"ans":"B","analysis":"2024年12月，中国申报的“春节——中国人庆祝传统新年的社会实践”入选联合国教科文组织人类非物质文化遗产代表作名录。“端午节”于2009年入选，“中秋节”“元宵节”未列入该名录。","figures":[],"questionImages":[]},{"no":93,"type":"single","q":"中国最早的农书是西汉晚期成书的（ ）。","opt":["A.《齐民要术》","B.《农书》","C.《农政全书》","D.《汜胜之书》"],"ans":"D","analysis":"解析中国最早的农书是西汉晚期成书的《汜胜之书》，记载黄河流域农业生产经验和耕作技术，包括选种、栽培、收获、贮藏等技术，对农作物“区种法”比较推崇。","figures":[],"questionImages":[]},{"no":94,"type":"single","q":"我国南方流传最广的民间木刻画，采用一版一色水印法的是（ ）。","opt":["A.山东潍坊杨家埠年画","B.苏州桃花坞年画","C.四川绵竹年画","D.天津杨柳青年画"],"ans":"B","analysis":"解析桃花坞年画以门画、中堂、条屏为主要形式，以木版雕刻、一版一色传统水印法印刷，色彩绚丽夺目，构图精巧，形象突出，主次分明，富于装饰性，形成了一种优美清秀、严密工整的独特风格，民间画坛称为“姑苏版”。","figures":[],"questionImages":[]},{"no":95,"type":"single","q":"古代帝王祭日、祭月的地点和时间分别是（ ）。","opt":["A.南郊天坛，冬至日；北郊地坛，夏至日","B.西郊月坛，夏至日；东郊日坛，冬至日","C.东郊日坛，春分日；西郊月坛，秋分日","D.东郊日坛，秋分日；西郊月坛，春分日"],"ans":"C","analysis":"祭日于东郊的日坛，时间在春分日。祭月于西郊的月坛，时间在秋分日。","figures":[],"questionImages":[]},{"no":96,"type":"single","q":"俗称“红教”的藏传佛教教派是（ ）。","opt":["A.萨迦派","B.噶举派","C.格鲁派","D.宁玛派"],"ans":"D","analysis":"宁玛派：因该派僧人穿戴红色袈裟、僧裙、僧帽，俗称红教。","figures":[],"questionImages":[]},{"no":97,"type":"single","q":"相传于农历五月初五投汨罗江殉国的爱国诗人是（ ）。","opt":["A.李白","B.屈原","C.杜甫","D.陆游"],"ans":"B","analysis":"端午节起源说法众多，其中以纪念战国时期楚国诗人屈原说影响最为广泛，相传屈原于农历五月初五投汨罗江殉国。","figures":[],"questionImages":[]},{"no":98,"type":"single","q":"我国现存最早的诗文总集是梁朝昭明太子萧统主编的（ ）。","opt":["A.《文选》","B.《文心雕龙》","C.《乐府诗集》","D.《玉台新咏》"],"ans":"A","analysis":"梁朝昭明太子萧统主编的《文选》，将文学与经、史、子区分开来，选录了前代130位作家500多篇作品，我国现存最早的诗文总集。","figures":[],"questionImages":[]},{"no":99,"type":"single","q":"游客可以体验中、俄、朝三国交界处“一眼望三国、犬吠惊三疆”之意境的吉林景区是（ ）。","opt":["A.图们","B.防川","C.三合","D.南坪"],"ans":"B","analysis":"游客可以体验中、俄、朝三国交界处珲春防川“一眼望三国、犬吠惊三疆”之意境。图们、三合、南坪均为吉林边境口岸或景区，但“一眼望三国、犬吠惊三疆”说的是珲春防川。","figures":[],"questionImages":[]},{"no":100,"type":"single","q":"红茶多以产地命名，其中以（ ）尤为出众。","opt":["A.西湖龙井、太湖碧螺春","B.君山银针、蒙顶黄芽","C.白毫银针、白牡丹","D.安徽祁红、云南滇红"],"ans":"D","analysis":"红茶出现于清朝，用全发酵法制成，红叶红汤、香甜味醇，具有水果香气和醇厚的滋味，还具有耐泡的特点。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","figures":[],"questionImages":[]},{"no":101,"type":"single","q":"有着100多年运营历史，与香港电车、太平山山顶缆车齐名，是维多利亚港著名渡海交通工具的是（ ）。","opt":["A.天星小轮","B.喷射飞航","C.港九小轮","D.愉景湾航运"],"ans":"A","analysis":"有着100多年运营历史的天星小轮是维多利亚港的著名渡海交通工具，它与香港电车、太平山山顶缆车齐名，是拥有百年以上悠久历史的交通工具。喷射飞航、港九小轮、愉景湾航运均为香港海上交通工具，但拥有百年以上历史、与香港电车及太平山山顶缆车齐名者为天星小轮。","figures":[],"questionImages":[]},{"no":102,"type":"single","q":"粉彩瓷因颜色产生（ ）效果而得名。","opt":["A.粉化","B.结晶","C.窑变","D.开片"],"ans":"A","analysis":"解析粉彩瓷在烧好的胎釉上施含砷物的粉底，涂上颜料后用笔洗开，由于砷的乳蚀作用，其颜色产生粉化效果。","figures":[],"questionImages":[]},{"no":103,"type":"single","q":"彩虹袖是（ ）传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之乡”的美誉。","opt":["A.青海藏族","B.循化撒拉族","C.门源回族","D.互助土族"],"ans":"D","analysis":"解析彩虹袖是互助土族传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之乡”的美誉。藏族、撒拉族、回族均为青海世居少数民族，但“彩虹袖”为互助土族传统服饰标志。","figures":[],"questionImages":[]},{"no":104,"type":"single","q":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为（ ）。","opt":["A.三晋","B.三秦","C.三辅","D.三关"],"ans":"B","analysis":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为“三秦”。“三晋”指山西，“三辅”为汉代长安周边行政区，“三关”泛指北方关隘，陕西因项羽分封三秦王而称“三秦”。","figures":[],"questionImages":[]},{"no":105,"type":"single","q":"蒙古族最具代表性的乐器是（ ）。","opt":["A.四胡","B.火不思","C.马头琴","D.潮尔"],"ans":"C","analysis":"马头琴作为蒙古族最具代表性的乐器。四胡、火不思、潮尔均为蒙古族传统乐器，其中最具代表性的是马头琴。","figures":[],"questionImages":[]},{"no":106,"type":"single","q":"被联合国评为“象征20世纪人类征服自然的三大奇迹”之一的是（ ）。","opt":["A.成渝铁路","B.宝成铁路","C.成昆铁路","D.青藏铁路"],"ans":"C","analysis":"1970年7月1日，全长1096公里的成昆铁路竣工运营。它与美国阿波罗宇宙飞船登月活动、苏联第一颗人造卫星一起被联合国评为“象征20世纪人类征服自然的三大奇迹”。","figures":[],"questionImages":[]},{"no":107,"type":"single","q":"距今8000年前的（ ）标志着农耕文化的初步形成，开启了中华民族的文明曙光。","opt":["A.马家窑文化","B.仰韶文化","C.大地湾文化","D.红山文化"],"ans":"C","analysis":"距今8000年前的大地湾文化标志着农耕文化的初步形成，开启了中华民族的文明曙光。马家窑文化、仰韶文化、红山文化均为新石器时代文化，标志农耕文化初步形成、开启中华民族文明曙光的是大地湾文化。","figures":[],"questionImages":[]},{"no":108,"type":"single","q":"“四个与共”的共同体理念属于（ ）的核心内容。","opt":["A.民族团结进步创建","B.社会主义核心价值观","C.新时代爱国主义教育","D.铸牢中华民族共同体意识"],"ans":"D","analysis":"铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，把铸牢中华民族共同体意识作为新时代党的民族工作和民族地区各项工作的主线。","figures":[],"questionImages":[]},{"no":109,"type":"single","q":"道教是土生土长的中国宗教，形成于（ ）。","opt":["A.魏晋","B.隋唐","C.西汉","D.东汉"],"ans":"D","analysis":"道教是土生土长的中国宗教，形成于东汉时期。据《后汉书·襄楷传》记载，东汉顺帝时（125~144年），琅琊人宫崇上其师于吉于曲阳泉水上所得神书，号《太平清领书》，这就是道教最早的经典《太平经》，所传道教称为太平道，后来领导东汉黄巾起义的张角传授的就是这一教派。","figures":[],"questionImages":[]},{"no":110,"type":"single","q":"推动文化与旅游融合，是因为（ ）。","opt":["A.文化是旅游的灵魂，旅游是文化的重要载体","B.文化可以脱离旅游独立实现产业化","C.旅游活动是纯经济行为，与文化无关","D.文旅融合会削弱旅游产业的竞争力"],"ans":"A","analysis":"文化与旅游密不可分、相辅相成，文化是旅游的灵魂，旅游是文化的重要载体。","figures":[],"questionImages":[]},{"no":111,"type":"single","q":"五大连池药泉会（圣水节）在农历五月初五端午节前后举行，其核心内涵是（ ）。","opt":["A.“敬天”“娱人”","B.“祭祖”“祈福”","C.“欢庆”“丰收”","D.“驱邪”“避灾”"],"ans":"A","analysis":"五大连池药泉会（圣水节）为民俗节日，在农历五月初五端午节前后（夏历五月初四至初六3天）举行，是黑龙江省五大连池风景区内的达斡尔族、鄂伦春族、蒙古族、满族和汉族人民以“敬天”“娱人”为内容。五大连池药泉会（圣水节）以“敬天”“娱人”为内容，其余各项表述均非其内涵。","figures":[],"questionImages":[]},{"no":112,"type":"single","q":"中国目前保存最完整的皇家园林是（ ）。","opt":["A.北海公园","B.圆明园","C.承德避暑山庄","D.北京颐和园"],"ans":"D","analysis":"颐和园位于北京市海淀区，是中国目前保存最完整的皇家园林，其前身是“清漪园”。","figures":[],"questionImages":[]},{"no":113,"type":"single","q":"湘赣边界秋收起义爆发的日期是（ ）。","opt":["A.1927年10月27日","B.1927年8月1日","C.1927年9月9日","D.1927年9月29日"],"ans":"C","analysis":"解析以毛泽东为书记的中共湖南省委前敌委员会，将参加起义的各路武装5000余人统编为工农革命军第一师，于9月9日发动湘赣边界秋收起义。","figures":[],"questionImages":[]},{"no":114,"type":"single","q":"澳大利亚的首都是（ ）。","opt":["A.悉尼","B.墨尔本","C.堪培拉","D.布里斯班"],"ans":"C","analysis":"解析堪培拉是澳大利亚的首都，意思是“汇合之地”，1927年联邦政府迁入此地，是个纯粹的政治中心，被誉为“太洋洲的花园城市”。","figures":[],"questionImages":[]},{"no":115,"type":"single","q":"世界上最南端的首都，有“风城”之称的是（ ）。","opt":["A.惠灵顿","B.堪培拉","C.奥克兰","D.基督城"],"ans":"A","analysis":"首都惠灵顿位于北岛的南端，是新西兰第二大城市，三面环山、一面临海，是世界上最南端的首都，有“风城”之称，与悉尼、墨尔本同为大洋洲的文化中心。","figures":[],"questionImages":[]},{"no":116,"type":"single","q":"下列湖泊中，属于构造湖的是（ ）。","opt":["A.滇池","B.镜泊湖","C.草海","D.杭州西湖"],"ans":"A","analysis":"构造湖：由地壳运动产生断裂凹陷经储水而成，如滇池、洱海、日月潭。","figures":[],"questionImages":[]},{"no":117,"type":"single","q":"台湾省汉族人口占96%左右，大多是（ ）的移民，主要少数民族是高山族。","opt":["A.浙江省和江西省","B.广东省和浙江省","C.福建省和江苏省","D.福建省和广东省"],"ans":"D","analysis":"台湾省汉族人口占96%左右，大多是福建省和广东省的移民，主要少数民族是高山族。","figures":[],"questionImages":[]},{"no":118,"type":"single","q":"中国共产党历史上生死攸关的转折点是（ ）。","opt":["A.八七会议","B.遵义会议","C.瓦窑堡会议","D.洛川会议"],"ans":"B","analysis":"遵义会议是党的历史上一个生死攸关的转折点，事实上确立了毛遂同志在党中央和红军的领导地位，开始确立以毛遂同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛遂同志为核心的党的第一代中央领导集体，开启了党独立自主解决中国革命实际问题新阶段，在最危急关头挽救了党、挽救了红军、挽救了中国革命。","figures":[],"questionImages":[]},{"no":119,"type":"single","q":"标志着五言诗成熟的是班固的（ ）。","opt":["A.《咏史诗》","B.《燕歌行》","C.《四愁诗》","D.《古诗十九首》"],"ans":"A","analysis":"班固的《咏史诗》，标志着五言诗的成熟。","figures":[],"questionImages":[]},{"no":120,"type":"single","q":"1885年，清政府划台湾为单一行省，为当时中国第20个行省，首任台湾巡抚是（ ）。","opt":["A.沈葆桢","B.丁日昌","C.刘铭传","D.邵友谦"],"ans":"C","analysis":"1885年，清政府划台湾为单一行省，为当时中国第20个行省，首任台湾巡抚刘铭传。","figures":[],"questionImages":[]},{"no":121,"type":"single","q":"南朝时，中国历史上首位由广东起家成就帝业的皇帝，也是南朝最后一个王朝“陈”的开国皇帝是（ ）。","opt":["A.萧衍","B.刘裕","C.陈霸先","D.赵佗"],"ans":"C","analysis":"南朝时，陈霸先是中国历史上首位由广东起家成就帝业的皇帝。也是南朝最后一个王朝“陈”的开国皇帝。萧衍为南朝梁开国皇帝，刘裕为南朝宋开国皇帝，赵佗为南越国建立者，均非由广东起家成就帝业者。","figures":[],"questionImages":[]},{"no":122,"type":"single","q":"（ ）是黎族独特的乐器。","opt":["A.口弦","B.鼻箫","C.芦笙","D.叮咚"],"ans":"B","analysis":"“竹竿舞”场面欢快热烈，鼻箫是黎族独特的乐器。","figures":[],"questionImages":[]},{"no":123,"type":"single","q":"有“中国情人节”之喻的农历节日是（ ）。","opt":["A.重阳节","B.元宵节","C.七夕节","D.中秋节"],"ans":"C","analysis":"农历七月初七，是牛郎织女鹊桥相会之日，有“中国情人节”之喻。","figures":[],"questionImages":[]},{"no":124,"type":"single","q":"明嘉靖十四年（1535年），（ ）迁至澳门，澳门正式开埠并发展成为重要的对外贸易港口。","opt":["A.广州市舶司","B.泉州市舶司","C.宁波市舶司","D.杭州市舶司"],"ans":"A","analysis":"明嘉靖十四年（1535年），广州市船司迁至澳门，澳门正式开埠并发展成为重要的对外贸易港口。","figures":[],"questionImages":[]},{"no":125,"type":"single","q":"明清科举考试中，乡试又称（ ）。","opt":["A.“殿试”","B.“秋闱”","C.“春闱”","D.“廷试”"],"ans":"B","analysis":"秋天在省城举行，叫“乡试”（又称“秋阅”），各府州的“生员”（或称“庠生”“秀才”）参加，考取者称为“举人”。","figures":[],"questionImages":[]},{"no":126,"type":"single","q":"西周建立后，取代杀人祭祀和殉葬的是（ ）。","opt":["A.木俑","B.石像","C.陶俑","D.纸人"],"ans":"C","analysis":"考古发现商朝有杀人祭祀和杀人殉葬的习俗，西周建立后这种现象才逐步消失，取而代之的是陶俑（人或六畜），体现出对生命的尊重。","figures":[],"questionImages":[]},{"no":127,"type":"single","q":"全国各地流传的“问我祖先在何处，山西洪洞大槐树”之说，与洪洞县（ ）门前的大槐树有关。","opt":["A.广胜寺","B.广济寺","C.洪洞大槐树公园","D.尧庙"],"ans":"B","analysis":"由于各地移民须在洪洞县广济壶门前的大槐树下办理手续后才能远行，因此大槐树成为移民的起点，全国各地流传的“问我祖先在何处，山西洪洞大槐树”的说法即由此而来。","figures":[],"questionImages":[]},{"no":128,"type":"single","q":"北京现存最古老的联拱石桥是（ ）。","opt":["A.宝带桥","B.洛阳桥","C.赵州桥","D.卢沟桥"],"ans":"D","analysis":"卢沟桥位于北京，是北京现存最古老的联拱石桥，“卢沟晓月”是“燕京八景”之一。","figures":[],"questionImages":[]},{"no":129,"type":"single","q":"“世界十绝风筝”之一、取材《白蛇传》的“灵芝”风筝出自（ ）。","opt":["A.广东阳江","B.山东潍坊","C.北京","D.天津"],"ans":"A","analysis":"1990年，在第七届国际风筝会上，阳江市取材于民间传说《白蛇传》扎制而成的“灵芝”风筝，被评为“世界十绝风筝”之一。","figures":[],"questionImages":[]},{"no":130,"type":"single","q":"在大连被称为“海上石林”的是（ ）。","opt":["A.金石滩","B.棒捶岛","C.老虎滩","D.兴城海滨"],"ans":"A","analysis":"金石滩在大连以“满家滩，凉水湾，海参螃蟹成筐搬”而知名，滩上有数亿年前形成的海滨地貌与沉积岩石，被称为“海上石林”，后因这些石头“比金子还要贵重”，故改名为“金石滩”。老虎滩、棒岛、兴城海滨均为辽宁海滨景观，但被称为“海上石林”者为金石滩。","figures":[],"questionImages":[]},{"no":131,"type":"multi","q":"白族的传统节日主要有（ ）。","opt":["A.三月街","B.绕三灵","C.耍海节","D.火把节","E.泼水节"],"ans":"ABCD","analysis":"解析白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。E项错误，泼水节为傣族传统节日，非白族节日。","figures":[],"questionImages":[]},{"no":132,"type":"multi","q":"古代察举制的察举科目有（ ）。","opt":["A.秀才","B.明经","C.孝廉","D.贤良","E.方正"],"ans":"ABCDE","analysis":"本题各项表述均正确。察举制是地方官向中央举荐人才的制度，察举的科目有秀才、明经、孝廉、贤良、方正等。","figures":[],"questionImages":[]},{"no":133,"type":"multi","q":"1959年建成的“北京十大建筑”包括（ ）。","opt":["A.人民大会堂","B.中国人民革命军事博物馆","C.民族文化宫","D.北京火车站","E.国家体育场（鸟巢）"],"ans":"ABCD","analysis":"E项错误，国家体育场（鸟巢）为2008年北京奥运会主体育场，不属于1959年建成的“北京十大建筑”。1959年，为迎接中华人民共和国成立10周年建成的人民大会堂、中国历史博物馆与中国革命博物馆（两馆属同一建筑内，即今中国国家博物馆）、中国人民革命军事博物馆、民族文化宫、民族饭店、钓鱼台国宾馆、华侨大厦（曾拆除，现已重建）、北京火车站、全国农业展览馆和北京工人体育场10项大型建筑工程，被称为“北京十大建筑”。","figures":[],"questionImages":[]},{"no":134,"type":"multi","q":"明清时期，康熙、雍正、乾隆三朝的重大史实有（ ）。","opt":["A.康熙平定“三藩之乱”，统一台湾","B.雍正实行“摊丁入亩”和“改土归流”","C.乾隆平定新疆准噶尔部和大小和卓叛乱","D.乾隆对西藏颁行《钦定藏内善后章程二十九条》","E.雍正签订《尼布楚条约》"],"ans":"ABCD","analysis":"E项错误，《尼布楚条约》是康熙时期与沙俄签订的，不是雍正时期。康熙皇帝平定了平西王吴三桂、平南王尚可喜、靖南王耿精忠的“三藩之乱”，统一了台湾，与沙俄签订《尼布楚条约》，划定了中俄东部边界线，维护了国家主权。雍正皇帝实行“摊丁入亩”，将按人头征收的丁银摊入地税中征收，从此取消了人头税制度，促进了人口增长。","figures":[],"questionImages":[]},{"no":135,"type":"multi","q":"按其麦芽汁的浓度，啤酒可分为（ ）。","opt":["A.低浓度啤酒","B.中浓度啤酒","C.高浓度啤酒","D.无醇啤酒","E.黑啤"],"ans":"ABC","analysis":"D、E项错误，按麦芽汁浓度啤酒只有低、中、高浓度三类，无醇啤酒、黑啤不属于该分类。按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度 6° -8° ，酒精含量 2% 左右）、中浓度啤酒（原麦汁浓度 10° -12° ，酒精含量 3.1%-3.8% ）和高浓度啤酒（原麦汁浓度 14° - 20° ，酒精含量 4.9% - 5.6% ）。","figures":[],"questionImages":[]},{"no":136,"type":"multi","q":"八卦中代表“天、地、雷、风”的是（ ）。","opt":["A.乾","B.坤","C.震","D.巽","E.坎"],"ans":"ABCD","analysis":"乾代表天，坤代表地，震代表雷，巽代表风。","figures":[],"questionImages":[]},{"no":138,"type":"multi","q":"台湾居民送礼禁忌中，忌送的物品有（ ）。","opt":["A.粽子","B.茶叶","C.甜果","D.扇子","E.手帕"],"ans":"ACDE","analysis":"台湾居民送礼禁忌如下：忌送粽子，因为台湾居民之家习惯包粽子。忌送甜果，甜果在台湾指年糕，是过年的常用祭品。忌送手帕，手帕是丧事完毕后主人送给吊丧者的礼物，寓意与死者永别。忌送扇子，台湾有“送扇，无期见”的俗语。B项错误，茶叶不在台湾居民送礼禁忌之列。","figures":[],"questionImages":[]},{"no":139,"type":"multi","q":"关于徐家汇教堂，下列说法正确的有（ ）。","opt":["A.是上海规模最大的哥特式教堂","B.是中国第一座按西方建筑方式建造的天主教教堂","C.现为天主教上海教区主教座堂","D.曾被誉为“远东第一大教堂”","E.是基督教新教教堂"],"ans":"ABCD","analysis":"徐家汇教堂是上海规模最大的哥特式教堂，也是中国第一座按西方建筑方式建造的天主教教堂，现为天主教上海教区主教座堂，曾被誉为“远东第一大教堂”。","figures":[],"questionImages":[]},{"no":140,"type":"multi","q":"广西少数民族舞蹈比较出名的有（ ）。","opt":["A.扁担舞","B.铜鼓舞","C.绣球舞","D.芦笙舞","E.孔雀舞"],"ans":"ABCD","analysis":"广西少数民族舞蹈比较出名的有“扁担舞、铜鼓舞、绣球舞、芦笙舞”等。E项错误，孔雀舞为傣族舞蹈，非广西少数民族舞蹈。","figures":[],"questionImages":[]},{"no":141,"type":"multi","q":"下列关于早期道教的说法，正确的有（ ）。","opt":["A.领导东汉黄巾起义的张角传授的是太平道","B.张陵在蜀中鹤鸣山传播五斗米道","C.太平道和五斗米道即为早期的道教","D.道教因老子宣扬“道”而奉老子为祖师爷","E.早期道教形成于唐朝"],"ans":"ABCD","analysis":"E项错误，道教是土生土长的中国宗教，形成于东汉时期（不是唐朝）。与此同时，在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。太平道教和“五斗米道”即为早期的道教。","figures":[],"questionImages":[]},{"no":142,"type":"multi","q":"我国第一个“五年计划”（1953—1957年）的主持制定者有（ ）。","opt":["A.周恩来","B.陈云","C.李富春","D.邓小平","E.刘少奇"],"ans":"ABC","analysis":"我国第一个“五年计划”（1953—1957年）由周恩来、陈云、李富春主持制定，1955年7月经一届全国人大二次会议审议通过。","figures":[],"questionImages":[]},{"no":143,"type":"multi","q":"下列景区中，属于黑龙江省国家5A级旅游景区的有（ ）。","opt":["A.哈尔滨市太阳岛景区","B.黑河市五大连池景区","C.牡丹江市镜泊湖景区","D.中国雪乡景区","E.大兴安岭地区北极村旅游景区"],"ans":"ABCE","analysis":"黑龙江省国家5A级旅游景区包括：哈尔滨市太阳岛景区、黑河市五大连池景区、牡丹江市镜泊湖景区、伊春市林海奇石景区、大兴安岭地区北极村旅游景区、鸡西市虎头旅游景区、齐齐哈尔市扎龙生态旅游区。D项中国雪乡景区位于牡丹江市海林市，虽为冰雪旅游名片，但为国家4A级旅游景区，并非5A，故排除。","figures":[],"questionImages":[]},{"no":144,"type":"multi","q":"学校开展研学旅行要坚持的原则有（ ）。","opt":["A.教育性","B.实践性","C.安全性","D.公益性","E.营利性"],"ans":"ABCD","analysis":"学校开展研学旅行要坚持教育性、实践性、安全性和公益性原则，把研学旅行纳入教育教学计划，促进其与学校课程有机融合，逐步建立小学阶段以乡土乡情为主、初中阶段以县情市情为主、高中阶段以省情国情为主的课程体系。","figures":[],"questionImages":[]},{"no":145,"type":"multi","q":"景德镇瓷器以（ ）的独特风格声海内外。","opt":["A.“白如玉”","B.“明如镜”","C.“薄如纸”","D.“声如磬”","E.“润如脂”"],"ans":"ABCD","analysis":"E项错误。景德镇瓷器造型优美、品种繁多、装饰丰富、风格独特，以“白如玉、明如镜、薄如纸、声如馨”的独特风格声海内外。\n\n题源校对：D 项采用解析版选项中的“声如磬”。","figures":[],"questionImages":[]},{"no":146,"type":"multi","q":"海南的“吃”有四大特点，这四大特点是指（ ）。","opt":["A.新鲜","B.天然","C.奇特","D.丰富","E.麻辣"],"ans":"ABCD","analysis":"海南的“吃”有四大特点: 新鲜、天然、奇特、丰富。","figures":[],"questionImages":[]},{"no":147,"type":"multi","q":"下列关于除夕食俗的表述，正确的有（ ）。","opt":["A.北方有吃饺子的习俗，寓“更岁交子”之意","B.南方多吃年糕，象征生活步步高","C.家家团聚，吃团圆饭","D.闭门团坐待旦，谓之守岁","E.北方吃饺子，南方也吃饺子"],"ans":"ABCD","analysis":"E项错误，除夕北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象征生活步步高，并非南北方都吃饺子。","figures":[],"questionImages":[]},{"no":148,"type":"multi","q":"下列关于美国的说法，正确的有（ ）。","opt":["A.美国是世界第一大经济体","B.国旗是星条旗，国花是玫瑰花","C.纽约是美国最大的城市，也是联合国总部所在地","D.自由女神像是法国送给美国独立100周年的礼物","E.夏威夷拥有全世界最活跃的火山"],"ans":"ABCDE","analysis":"本题各项表述均正确。美国人口约3.41亿（截至2025年2月），作为世界第一大经济体，其劳动生产率、国内生产总值和对外贸易额均位居世界第一。国旗是星条旗，国花是玫瑰花。旅游景点主要有自由女神像、帝国大厦、时报广场、中央公园、联合国总部大楼、百老汇、华尔街、大都会博物馆等。拥有全世界最活跃的火山，是现代冲浪、草裙舞和夏威夷地方美食的发源地。","figures":[],"questionImages":[]},{"no":149,"type":"multi","q":"列入《急需保护的非物质文化遗产名录》的中国项目有（ ）。","opt":["A.维吾尔族麦西热甫","B.中国水密舱壁帆船制作技艺","C.中国木版活字印刷术","D.赫哲族伊玛堪说唱","E.福建木偶戏传承人培养计划"],"ans":"ABC","analysis":"2010年3项：新疆维吾尔族麦西热甫、中国水密舱壁帆船制作技艺、中国木版活字印刷术。D项错误，赫哲族伊玛堪说唱于2011年列入急需保护名录，2025年已转入人类非物质文化遗产代表作名录；E项错误，福建木偶戏传承人培养计划为优秀保护实践名册项目。","figures":[],"questionImages":[]},{"no":150,"type":"multi","q":"下列关于苏轼的说法，正确的有（ ）。","opt":["A.号“东坡居士”","B.《水调歌头·明月几时有》是其词作名篇","C.《前赤壁赋》是其散文名篇","D.是婉约派的代表人物","E.“竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生”出自其《定风波》"],"ans":"ABCE","analysis":"D项错误，苏轼是豪放派代表人物（与辛弃疾并称），不是婉约派。苏轼（1037～1101年）：字子瞻，号东坡居士，眉山（今四川眉山市）人。宋词流派有以柳永、李清照为代表的婉约派，以苏轼、辛弃疾为代表的豪放派。","figures":[],"questionImages":[]},{"no":151,"type":"multi","q":"陶瓷烧制是河南风物特产的核心名片，其三大传世瑰宝有（ ）。","opt":["A.汝瓷","B.钧瓷","C.唐三彩","D.青花瓷","E.景泰蓝"],"ans":"ABC","analysis":"陶瓷烧制是河南风物特产的核心名片，拥有汝瓷、钧瓷、唐三彩三大传世瑰宝，更有登封窑、当阳峪绞胎瓷等众多特色窑艺。D项错误，青花瓷以江西景德镇为代表；E项错误，景泰蓝为北京传统工艺，均非河南三大传世瑰宝。","figures":[],"questionImages":[]},{"no":152,"type":"multi","q":"我国著名的云海景观有（ ）。","opt":["A.黄山云海","B.庐山云海","C.峨眉云海","D.衡山云海","E.天山云海"],"ans":"ABCD","analysis":"解析E项错误，我国著名的云海景观为黄山云海、庐山云海、峨眉云海、衡山云海，无“天山云海”。","figures":[],"questionImages":[]},{"no":153,"type":"multi","q":"下列关于山西汾酒、竹叶青酒的说法，正确的有（ ）。","opt":["A.汾酒有4000多年的悠久历史，被誉为最早国酒","B.竹叶青酒最早以黄酒加竹叶合酿而成，故名","C.竹叶青酒现以汾酒为基酒，添加砂仁、紫檀、当归、陈皮等十余味名贵药材加工而成","D.汾酒是最早以黄酒加竹叶合酿而成的酒","E.竹叶青酒被誉为最早国酒，国之瑰宝"],"ans":"ABC","analysis":"汾酒有着4000多年的悠久历史，被誉为最早国酒，国之瑰宝。竹叶青酒是汾酒厂生产的另一品牌名酒，最早是以黄酒加竹叶合酿而成，故名，现以汾酒为基酒，添加砂仁，紫檀、当归、陈皮等十余味名贵药材加工而成。D项错误，最早以黄酒加竹叶合酿而成的是竹叶青酒，非汾酒；E项错误，被誉为“最早国酒，国之瑰宝”的是汾酒，均为张冠李戴。","figures":[],"questionImages":[]},{"no":154,"type":"multi","q":"下列属于我国世界文化与自然双重遗产的有（ ）。","opt":["A.泰山","B.黄山","C.峨眉山及乐山大佛","D.庐山","E.九寨沟"],"ans":"ABC","analysis":"世界文化与自然双重遗产4项: 泰山、黄山、峨眉山及乐山大佛、武夷山。D项庐山为世界文化景观, E项九寨沟为世界自然遗产, 均非世界文化与自然双重遗产。","figures":[],"questionImages":[]},{"no":155,"type":"multi","q":"兰州牛肉面的五大特点有（ ）。","opt":["A.一清（汤清）","B.二白（萝卜白）","C.三红（辣子油红）","D.四绿（香菜绿）","E.五黄（面条黄亮）"],"ans":"ABCDE","analysis":"兰州牛肉面有一清（汤清）、二白（萝卜白）、三红（辣子油红）、四绿（香菜绿）、五黄（面条黄亮）五大特点。","figures":[],"questionImages":[]},{"no":156,"type":"multi","q":"下列属于我国著名超级工程之“最”的有（ ）。","opt":["A.“云端上的高速”——雅西高速公路","B.世界最复杂立交桥——重庆黄桶湾立交桥"," function restore(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const s=JSON.parse(raw);
        if(s.version!==2)throw new Error('version');
        for(const q of questions){
            const r=s.records?.[q.no];
            if(!r||!Array.isArray(r.selected))continue;
            const selected=[...new Set(r.selected.filter(v=>q.opt.some(o=>o[0]===v)))];
            if(q.type!=='multi'&&selected.length>1)continue;
            records[q.no]={selected,submitted:r.submitted===true&&selected.length>0};
        }
        wrongSet=new Set((Array.isArray(s.wrong)?s.wrong:[]).filter(n=>byNo.has(n)));
        mode=s.mode==='wrong'?'wrong':'all';
        pool=mode==='wrong'?[...new Set((Array.isArray(s.pool)?s.pool:[]).filter(n=>byNo.has(n)&&wrongSet.has(n)))]:questions.map(q=>q.no);
        if(mode==='wrong'&&!pool.length)pool=[...wrongSet];
        idx=Math.max(0,pool.indexOf(s.currentNo));
    }catch(e){el('storageStatus').textContent='原保存记录无法读取，本次从头开始。';}
}
function questionPoints(item){return item.type==='multi'?1:0.5;}
function scoreSummary(){
 let score=0,max=0,answered=0,count=0;
 for(const item of questions){
  if(!item.ans)continue;
  const points=questionPoints(item);max+=points;count++;
  const record=records[item.no];if(!record?.submitted)continue;
  answered++;
  if(normalized(record.selected)===normalized(item.ans.split('')))score+=points;
 }
 return {score,max,answered,count};
}

    if(!item){el('q').textContent='错题本为空，继续做题后，答错的题会自动加入。';el('answerHint').textContent='点击“全部题目”继续练习。';return;}
    const r=records[item.no]||{selected:[],submitted:false};
    for(const [i,src] of item.questionImages.entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题原题及选项，第'+(i+1)+'部分';img.tabIndex=0;img.onclick=()=>openScan(src);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openScan(src)};el('questionScans').append(img);}
    el('q').textContent='【'+item.no+' · '+({judge:'判断题',single:'单选题',multi:'多选题'}[item.type])+'】'+item.q;
    el('answerHint').textContent=item.type!=='multi'?'选择后立即判断对错并显示解析。':'选好后点击“提交答案”，才会判断对错并显示解析。';
    el('submitBtn').disabled=r.submitted||!r.selected.length;
    for(const o of item.opt){
        const val=o[0],label=document.createElement('label'),input=document.createElement('input');
        label.className='opt';input.type=item.type==='multi'?'checkbox':'radio';input.name='answer';input.value=val;input.checked=r.selected.includes(val);
        if(input.checked)label.classList.add('selected');
        if(r.submitted&&item.ans.includes(val))label.classList.add('correct');
        if(r.submitted&&input.checked&&!item.ans.includes(val))label.classList.add('incorrect');
        input.addEventListener('change',save);label.append(input,document.createTextNode(o));el('optBox').append(label);
    }
    if(r.submitted){
        const ok=normalized(r.selected)===normalized(item.ans.split(''));
        el('ansDiv').style.display='block';el('result').textContent=ok?'✅ 回答正确':'❌ 回答错误';el('result').style.color=ok?'#18733b':'#c23232';
        el('stdAns').textContent=item.opt.filter(o=>item.ans.includes(o[0])).join('；');el('analysisTxt').textContent=item.analysis;
        const box=el('figureBox');box.replaceChildren();
        for(const [i,src] of (item.figures||[]).entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题解析补充图 '+(i+1);img.loading='lazy';img.tabIndex=0;img.onclick=()=>openScan(src);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openScan(src)};box.append(img);}
    }
}
function save(){
    const item=current();if(!item)return;
    records[item.no]={selected:Array.from(el('optBox').querySelectorAll('input:checked'),n=>n.value),submitted:false};
    if(item.type!=='multi')submitAnswer();else{persist();render();}
}
function submitAnswer(){
    const item=current(),r=item&&records[item.no];if(!r?.selected.length)return;
    r.submitted=true;
    if(normalized(r.selected)!==normalized(item.ans.split('')))wrongSet.add(item.no);
    persist();render();
}
function prev(){if(idx>0){idx--;persist();render();}}
function next(){if(idx<pool.length-1){idx++;persist();render();}}
function clearSel(){const item=current();if(!item)return;records[item.no]={selected:[],submitted:false};persist();render();}
function goJump(){
    const n=Number(el('goto').value),pos=pool.indexOf(n);
    if(pos<0){el('answerHint').textContent=mode==='wrong'?'请填写当前错题本中的原题号。':'请输入 1 至 '+questions.length+' 的整数题号。';return;}
    idx=pos;persist();render();
}
function setMode(value){
    const no=current()?.no;mode=value;pool=mode==='wrong'?questions.filter(q=>wrongSet.has(q.no)).map(q=>q.no):questions.map(q=>q.no);
    idx=Math.max(0,pool.indexOf(no));persist();render();
}
function removeWrong(){
    const item=current();if(!item)return;wrongSet.delete(item.no);
    if(mode==='wrong'){pool=pool.filter(n=>n!==item.no);idx=Math.max(0,Math.min(idx,pool.length-1));}
    persist();render();
}
el('goto').addEventListener('keydown',e=>{if(e.key==='Enter')goJump();});

function openScan(src){el('scanLarge').src=src;el('scanDialog').showModal();}
function progressSnapshot(){return {version:2,currentNo:pool[idx]??null,mode,pool:[...pool],records:JSON.parse(JSON.stringify(records)),wrong:[...wrongSet]};}
function backupPayload(){return {format:'guide-exam-progress',backupVersion:1,examId:STORAGE_KEY,exportedAt:new Date().toISOString(),questionCount:questions.length,state:progressSnapshot()};}
function validateBackup(data){
    if(!data||data.format!=='guide-exam-progress'||data.backupVersion!==1)throw new Error('这不是支持的刷题进度文件。');
    if(data.examId!==STORAGE_KEY||data.questionCount!==questions.length)throw new Error('这份进度不属于当前题库，请在对应题库中导入。');
    const s=data.state;
    if(!s||s.version!==2||!['all','wrong'].includes(s.mode)||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.pool)||!Array.isArray(s.wrong))throw new Error('进度文件内容不完整或已损坏。');
    const validNumbers=a=>a.every(n=>Number.isInteger(n)&&byNo.has(n))&&new Set(a).size===a.length;
    if(!validNumbers(s.pool)||!validNumbers(s.wrong))throw new Error('进度文件包含无效题号。');
    if(s.mode==='all'&&(s.pool.length!==questions.length||s.pool.some((n,i)=>n!==questions[i].no)))throw new Error('全部题目的顺序不正确。');
    if(s.mode==='wrong'&&s.pool.some(n=>!s.wrong.includes(n)))throw new Error('错题列表不一致。');
    if(s.pool.length?!s.pool.includes(s.currentNo):s.currentNo!==null)throw new Error('当前题号无效。');
    for(const [no,r] of Object.entries(s.records)){
        const q=byNo.get(Number(no));
        if(!q||String(q.no)!==no||!r||!Array.isArray(r.selected)||typeof r.submitted!=='boolean'||r.selected.some(v=>typeof v!=='string'||!q.opt.some(o=>o[0]===v))||new Set(r.selected).size!==r.selected.length||(q.type!=='multi'&&r.selected.length>1)||(r.submitted&&!r.selected.length))throw new Error('作答记录格式不正确。');
    }
    return JSON.parse(JSON.stringify(s));
}
function exportProgress(){
    try{
        const payload=backupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download="LDD押题第6卷科三科四-做题进度-"+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        el('transferStatus').textContent='已请求下载进度文件。苹果手机请查看 Safari 下载列表或“文件”中的下载项，再把 JSON 文件传到另一设备。';
    }catch(e){el('transferStatus').textContent='导出失败：'+e.message;}
}
function applyBackup(data){
    const s=validateBackup(data);
    // Write successfully before changing the current session, so a storage failure preserves it.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    records={};wrongSet=new Set();idx=0;mode='all';pool=questions.map(q=>q.no);restore();render();
}
async function importProgressFile(event){
    const input=event.target,file=input.files?.[0];if(!file)return;
    try{
        if(file.size>5*1024*1024)throw new Error('文件过大，请选择导出的 JSON 进度文件，不要选择 HTML 题库。');
        const data=JSON.parse((await file.text()).replace(/^\uFEFF/,'')),s=validateBackup(data);
        const answered=Object.values(s.records).filter(r=>r.submitted).length;
        if(!confirm('即将导入：已判分 '+answered+' 题，错题 '+s.wrong.length+' 题。\n这会替换本设备当前题库的进度。建议先导出当前进度备份。\n确定导入吗？')){el('transferStatus').textContent='已取消导入，原进度保留。';return;}
        applyBackup(data);el('transferStatus').textContent='导入成功！已恢复作答、错题及所在题目，后续会继续自动保存到本设备。';
    }catch(e){el('transferStatus').textContent='导入失败，原进度保留：'+e.message;}
    finally{input.value='';}
}
el('progressFile').addEventListener('change',importProgressFile);

restore();render();
</script>
<dialog id="scanDialog" aria-label="原图放大阅读"><button onclick="el('scanDialog').close()">关闭放大图</button><p class="hint">左右滑动查看完整原图，也可使用浏览器缩放。</p><div class="scan-scroll"><img id="scanLarge" alt="放大的原卷图片"></div></dialog>
