<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{max-width:1060px;margin:20px auto;padding:0 16px;background:#f6f8fa;font-size:16px;}
.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 1px 5px #0002;}
.q-title{font-size:17px;font-weight:bold;margin-bottom:16px;line-height:1.6;}
.opt{margin:9px 0;padding:7px;border-radius:5px;cursor:pointer;}
.opt:hover{background:#f2f6fa;}
.opt input{margin-right:7px;transform:scale(1.1);}
.ans-wrap{margin-top:18px;padding:12px;background:#eaf4ff;border-radius:8px;display:none;}
.ans-txt{margin-top:6px;line-height:1.6;color:#222;}
.btns{margin:15px 0;display:flex;gap:8px;flex-wrap:wrap;}
button{padding:8px 14px;border:none;border-radius:7px;background:#2772dd;color:#fff;font-size:15px;cursor:pointer;}
button:active{background:#1f62bd;}
.info{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;color:#333;align-items:center;}
input[type="number"]{padding:7px;width:70px;font-size:15px;border:1px solid #aaa;border-radius:5px;}

.opt{display:block;padding:13px;border:1px solid #dfe5ed;line-height:1.6;}
.opt.selected{border-color:#2772dd;background:#edf4ff;}
.opt.correct{border-color:#219653;background:#eaf8ef;}
.opt.incorrect{border-color:#d64545;background:#fff0f0;}
button:disabled{opacity:.45;cursor:default;}
button.secondary{background:#5b677a;}
.hint{color:#596579;font-size:14px;line-height:1.7;}
#result{font-weight:bold;margin-bottom:8px;}
#storageStatus{margin-top:14px;}
@media(max-width:600px){body{margin:12px auto;padding:0 10px}.card{padding:16px}h2{font-size:21px}.btns button{flex:1;min-width:100px}}

/* iPhone / Android tablet adaptive layout */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;}
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
body{width:100%;max-width:1100px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:20px 18px;padding: max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));line-height:1.65;}
.card{min-width:0;padding:24px;}
h2{font-size:clamp(20px,2.7vw,28px);line-height:1.5;margin:0 0 20px;overflow-wrap:anywhere;}
.info{gap:10px 18px;align-items:center;}
.info>div,.info>span{min-width:0;}
button{min-height:48px;padding:11px 16px;font-size:16px;line-height:1.4;touch-action:manipulation;}
button:focus-visible,input:focus-visible{outline:3px solid #945700;outline-offset:3px;}
button[hidden]{display:none!important;}
input[type="number"]{min-height:48px;width:82px;max-width:100%;font-size:16px;vertical-align:middle;}
input[type="radio"],input[type="checkbox"]{width:21px;height:21px;min-width:21px;margin:3px 10px 0 0;transform:none;vertical-align:top;accent-color:#2772dd;}
.opt{min-height:52px;padding:14px;margin:12px 0;font-size:18px;line-height:1.75;overflow-wrap:anywhere;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.q-title{font-size:20px;line-height:1.85;overflow-wrap:anywhere;}
.ans-wrap{font-size:17px;line-height:1.85;padding:16px;overflow-wrap:anywhere;}
.hint{font-size:15px;overflow-wrap:anywhere;}
.btns{gap:10px;}
.main-actions{position:sticky;bottom:0;z-index:5;margin:20px 0 0;padding:12px 0;background:#fff;border-top:1px solid #dfe5ed;padding-bottom:max(12px,env(safe-area-inset-bottom));}
.main-actions button{flex:1;min-width:110px;}
@media(hover:hover) and (pointer:fine){.opt:hover{box-shadow:0 0 0 1px #2772dd;}}
@media(hover:none){.opt:hover{background:transparent;}.opt.selected:hover{background:#edf4ff;}.opt.correct:hover{background:#eaf8ef;}.opt.incorrect:hover{background:#fff0f0;}}
@media(max-width:599px){
 body{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));}
 .card{padding:16px 12px;border-radius:12px;}
 .info{gap:10px;font-size:15px;}
 .info>div:first-child{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
 .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
 .btns button{min-width:0;width:100%;padding:11px 8px;}
 #removeBtn{grid-column:1 / -1;}
 .q-title{font-size:18px;line-height:1.85;}
 .opt{font-size:17px;padding:13px 10px;}
 .ans-wrap{font-size:16px;}
 .main-actions{gap:8px;}
}
@media(min-width:600px) and (max-width:1199px){
 body{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));}
 .card{padding:28px;}
 .btns button{min-width:140px;}
 .opt{padding:17px 18px;}
}
@media(max-height:500px) and (orientation:landscape){.main-actions{position:static;display:flex;flex-wrap:wrap;}.main-actions button{flex:1;min-width:100px;}}

#analysisTxt{white-space:pre-wrap;}#figureBox img{display:block;max-width:100%;height:auto;margin:18px auto;border:1px solid #dde3ec;border-radius:6px;}
.transfer-panel{margin-top:22px;padding:16px;border:1px solid #dfe5ed;border-radius:10px;background:#f8faff;}.transfer-panel p{margin:8px 0;}.transfer-panel .btns{margin:12px 0;}
</style>

<body>
<div class="card">
    <h2>2026冲刺标准卷二 · 科三科四</h2><p class="hint">雷2 PDF题库完整版 · 判断40题 / 单选90题 / 多选35题 · 电脑、手机、平板通用</p>
    <div class="info">
        <div>题号跳转：<input id="goto" type="number" min="1" max="165" step="1" inputmode="numeric" enterkeyhint="go" aria-label="跳转到原题号"><button onclick="goJump()">跳转</button></div>
        <div>当前：<span id="cur">1</span> / <span id="total">0</span></div>
        <div>✅答对：<span id="r">0</span></div>
        <div>❌答错：<span id="w">0</span></div>
    </div>


    <div class="btns"><button id="allBtn" onclick="setMode('all')">全部题目</button><button id="wrongBtn" onclick="setMode('wrong')">刷错题（0）</button><button id="removeBtn" class="secondary" onclick="removeWrong()">移出错题本</button></div>
    <p class="hint" id="modeHint"></p><p class="hint" id="answerHint" aria-live="polite"></p>
    <div>
        <div class="q-title" id="q"></div>
        <div id="optBox"></div>
        <div class="ans-wrap" id="ansDiv">
            <div id="result" role="status"></div>
            <div><b>参考答案：</b><span id="stdAns"></span></div>
            <div class="ans-txt"><b>解析：</b><span id="analysisTxt"></span></div><div id="figureBox"></div>
        </div>
    </div>
    <div class="btns main-actions" aria-label="答题操作">
        <button id="prevBtn" onclick="prev()">上一题</button>

        <button id="submitBtn" onclick="submitAnswer()">提交答案</button>
        <button onclick="clearSel()">清除选择</button>
    </div>
<section class="transfer-panel" aria-label="进度备份与转移"><b>电脑 / 手机进度转移</b><p class="hint">在做题设备上导出 JSON 文件，传到另一台设备后导入。导入将替换该设备的现有进度，建议先导出备份；这不是自动同步。</p><div class="btns"><button onclick="exportProgress()">导出进度</button><button onclick="el('progressFile').click()">导入进度</button></div><input id="progressFile" type="file" accept=".json,application/json" hidden><p id="transferStatus" class="hint" role="status" aria-live="polite"></p></section>

<script>
// 科三科四：全国导游基础知识 + 地方导游基础知识 押题卷一 1‑165题
const questions = [{"no":1,"type":"judge","q":"春节活动从腊月二十三过小年开始，直到正月十五元宵节结束。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。春节起源于原始社会的腊祭。春节活动从腊月二十三过小年开始，经过除夕、春节，直到正月十五元宵节结束。正月十五为每年第一个望月，称为上元节，也称元宵节，是春节活动的高潮和结束。","figures":[]},{"no":2,"type":"judge","q":"红茶出现于明朝，用全发酵法制成。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“明朝”错误。红茶出现于清朝，用全发酵法制成。制作关键是渥红（发酵）以促进酶活性，使多酚类充分氧化。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","figures":[]},{"no":3,"type":"judge","q":"《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。朱熹著《四书集注》后来成为科举考试标准的范本，答案不能背离朱子的注解。","figures":[]},{"no":4,"type":"judge","q":"明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。明清科举考试制度固定，一般每三年举行一次，每次两轮。发榜时用黄纸书写，故称金榜题名。","figures":[]},{"no":5,"type":"judge","q":"扬州个园园主特别爱荷，园内荷花成林，故取“月映荷成千个字”之句命名。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“爱荷”错误。扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","figures":[]},{"no":6,"type":"judge","q":"《营造法式》是南宋政府颁行的各种建筑工程的“规范”。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“南宋”错误。《营造法式》是北宋政府为了管理宫室、坛庙、官署、府第等建筑工程，于北宋崇宁二年（1103年）颁行的，是各种建筑的设计、结构、用料和施工的“规范”。","figures":[]},{"no":7,"type":"judge","q":"舫是仿造舟船造型的建筑，常建于水际或池中。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。舫是仿造舟船造型的建筑，常建于水际或池中。","figures":[]},{"no":8,"type":"judge","q":"孔子伦理思想可以概括为“仁”和“义”两个字。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“义”错误。孔子伦理思想可以概括为两个字：“仁”和“礼”。","figures":[]},{"no":9,"type":"judge","q":"汉字是记录汉语的符号，属表意文字。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。","figures":[]},{"no":10,"type":"judge","q":"曹丕的《燕歌行》是我国现存最早的文人创作的完整七言诗。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。诗歌代表作《燕歌行》，是我国现存最早的文人创作的完整七言诗，《典论·论文》是我国文学史上第一篇文学批评著作。通篇七言，被认为是我国现存第一首文人创作的七言诗，标志着七言诗的形成。","figures":[]},{"no":11,"type":"judge","q":"《诗经》的表现手法归纳为风、雅、颂。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。《诗经》的表现手法归纳为赋、比、兴。《诗经》按音乐的特点分为风、雅、颂三部分。风是民间歌谣，雅为朝廷诗乐，颂为宗庙祭祀乐歌。","figures":[]},{"no":12,"type":"judge","q":"绍兴加饭酒和龙岩沉缸酒为黄酒。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。黄酒，也称为米酒。绍兴加饭酒古称“山阴甜酒”“越酒”，距今已有2300多年的酿造历史。龙岩沉缸酒的酿法集我国黄酒酿造的各项传统精湛技术于一身。","figures":[]},{"no":13,"type":"judge","q":"中国人民政治协商会议第一届全体会议确定五星红旗为国旗。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。中国人民政治协商会议第一届全体会议确定北平为中华人民共和国首都，改名为北京；决定采用公元纪年；以《义勇军进行曲》为代国歌；国旗为五星红旗。","figures":[]},{"no":14,"type":"judge","q":"蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","figures":[]},{"no":15,"type":"judge","q":"东汉张芝擅今草，唐朝张旭和怀素擅狂草，三人均有“草圣”之誉。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。草书名家有东汉张芝，擅今草，唐朝张旭和怀素，擅狂草，三人均有“草圣”之誉。","figures":[]},{"no":16,"type":"judge","q":"李白和杜甫被誉为诗史上的“双子星座”，杜甫被世人称为“诗仙”。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“诗仙”错误。李白诗歌雄奇峭丽、豪放飘逸，凝聚着盛唐的时代精神，世人称其为“诗仙”。杜甫有“诗圣”之称。杜甫诗歌深有“诗史”之誉。李白和杜甫被誉为诗史上的“双子星座”，合称“李杜”。","figures":[]},{"no":17,"type":"judge","q":"明代徐光启所著的《农政全书》是中国古代最早的农书。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“最早的农书”错误。中国最早的农书是西汉晚期成书的《汜胜之书》。明时，徐光启著《农政全书》，是中国古代农学著作的集大成者。《汜胜之书》《齐民要术》《农书》《农政全书》被誉为中国古代“四大农书”。","figures":[]},{"no":18,"type":"judge","q":"银发旅游者多在国庆、春节黄金周等旅游旺季集中出行，热衷惊险刺激的探险项目。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为淡季出行。银发旅游者多在旅游的淡季出行，具有慢节奏（偏好深度体验而非走马观花）、高安全性（注重医疗保障和无障碍设施）、强社交性（青睐团体活动和代际同游）、重情怀（热衷文化怀旧等主题）、性价比导向等特点。","figures":[]},{"no":19,"type":"judge","q":"道教的早期流派之一“五斗米道”由张角创立。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“张角”错误。在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。领导东汉黄巾起义的张角传授的为太平道。太平道教和“五斗米道”即为早期的道教。","figures":[]},{"no":20,"type":"judge","q":"华山以雄伟著称，主峰玉皇顶海拔1532.7米。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“华山”错误。泰山以雄伟著称。主峰玉皇顶海拔1532.7米。华山壁立千仞，以险峻著称，自古以来就有“华山天下险”“奇险天下第一山”等说法。","figures":[]},{"no":21,"type":"judge","q":"浙江海岸线总长居全国首位，是全国岛屿最多的省份。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。浙江海域面积26万平方千米，海岸线总长6715千米，居全国首位；面积大于500平方米的海岛有2878个，是全国岛屿最多的省份。","figures":[]},{"no":22,"type":"judge","q":"1839年，林则徐虎门销烟成了第一次鸦片战争的导火线。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。1839年虎门销烟成了第一次鸦片战争的导火线；1856年英国借口\"亚罗号\"事件袭击广州城，第二次鸦片战争爆发。","figures":[]},{"no":23,"type":"judge","q":"泼水节是白族的传统节日。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，错在\"白族\"。泼水节是傣族人民送旧迎新的传统节日，又称\"浴佛节\"；白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。","figures":[]},{"no":24,"type":"judge","q":"武汉别称\"江城\"，形似一只自西向东的彩蝶，被誉为中国经济地理的\"心脏\"。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。武汉简称\"汉\"，别称\"江城\"；武汉文化具有浓郁的楚文化特色，是\"高山流水遇知音\"故事的发生地，其汉剧有\"京剧之母\"的美誉。","figures":[]},{"no":25,"type":"judge","q":"民居、祠堂和桥梁被誉为\"徽派古建三绝\"。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"桥梁\"应改为\"牌坊\"。民居、祠堂和牌坊被誉为\"徽派古建三绝\"，粉墙、黛瓦、马头墙是徽派建筑的重要特征。","figures":[]},{"no":26,"type":"judge","q":"佛山卫浴、陶瓷的全国市场占有率位居第一。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。广东经济发展水平稳居全国首位，2025年GDP达14.5847万亿元，连续37年位居全国第一；佛山卫浴、陶瓷的全国市场占有率位居第一。","figures":[]},{"no":27,"type":"judge","q":"龙门石窟始凿于北魏孝文帝时期，被誉为\"中国石刻艺术的最高峰\"。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。龙门石窟是世界文化遗产、中国三大石窟之一，始凿于北魏孝文帝时期，其中奉先寺卢舍那大佛高17.14米，是唐代石刻艺术的巅峰之作。","figures":[]},{"no":28,"type":"judge","q":"山东寿光是国务院命名的\"中国蔬菜之乡\"，是中国最大的蔬菜生产基地和批发市场。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。山东寿光是全国冬暖式蔬菜大棚的发源地，也是中国最大的蔬菜生产基地和批发市场。","figures":[]},{"no":29,"type":"judge","q":"西藏是中国人口最多、密度最大的省区。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，错在\"最多、密度最大\"。西藏是中国人口最少、密度最小的省区；全区面积120.28万平方公里，约占中国总面积的八分之一，仅次于新疆维吾尔自治区。","figures":[]},{"no":30,"type":"judge","q":"1931年11月7日，中华苏维埃共和国在井冈山宣告中国第一个红色中央政权成立。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"井冈山\"应改为\"瑞金\"。1931年11月7日，中华苏维埃共和国在瑞金宣告中国第一个红色中央政权成立；中华苏维埃共和国临时中央政府设在瑞金，故瑞金有\"红都\"之称。·井冈山：中国革命的摇篮；·南昌：人民军队的摇篮；·瑞金：共和国的摇篮，有\"红都\"之称；·安源：工人运动的摇篮。","figures":[]},{"no":31,"type":"judge","q":"道教名山武当山的最高峰是神农顶。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，错在\"武当山\"。最高峰神农顶海拔3105米的是号称\"华中屋脊\"的神农架；武当山是道教名山，著名习俗是\"朝武当\"。","figures":[]},{"no":32,"type":"judge","q":"樟树的四特酒，被周恩来总理赞誉为\"清、香、醇、纯\"，四特酒由此而得名。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。江西中药产业历史悠久，拥有樟树千年南国药都，在中国四大传统中药炮制流派中，江西\"樟帮\"\"建昌帮\"占据其二，在海内外影响深远。","figures":[]},{"no":33,"type":"judge","q":"1927年10月，中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府在广东建立。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。1927年10月，建立了中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府。","figures":[]},{"no":34,"type":"judge","q":"孔庙是世界上规模最大的家族古墓群。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"孔庙\"应改为\"孔林\"。孔庙被誉为\"天下第一庙\"；孔府号称\"天下第一家\"；孔林是世界上规模最大的家族古墓群。注意\"三孔\"各自的誉称不要混淆。","figures":[]},{"no":35,"type":"judge","q":"乐山大佛是世界上现存最高的一尊石刻释迦牟尼坐像。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"释迦牟尼\"应改为\"弥勒佛\"。乐山大佛是世界现存最高的一尊石刻弥勒佛坐像，开凿于唐朝中期开元年间，通高71米，\"山是一尊佛，佛是一座山\"。","figures":[]},{"no":36,"type":"judge","q":"景德镇陶瓷始于唐，拥有2000多年的冶陶史，被誉为\"世界瓷都\"。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"始于唐\"应改为\"始于汉\"。景德镇陶瓷始于汉，拥有2000多年的冶陶史、1000多年的官窑史和600多年的御窑史，被誉为\"世界瓷都\"。","figures":[]},{"no":37,"type":"judge","q":"殷墟出土的甲骨文是中国最早的文字。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"最早的文字\"应改为\"最早的成熟文字\"。甲骨文是中国最早的成熟文字，迄今出土约15万片；殷墟距今3300余年，是中国首个有文献可考、并为甲骨文和考古证实的古代都城遗址，还出土了后母戊鼎等重器。","figures":[]},{"no":38,"type":"judge","q":"云南昆明至老挝万象的中老铁路是中国第一条国际铁路。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，\"中老铁路\"应改为\"滇越铁路\"。云南昆明至越南河内的滇越铁路是中国第一条国际铁路；2021年12月3日，昆明到万象的中老铁路正式通车。","figures":[]},{"no":39,"type":"judge","q":"天津始于隋朝大运河的开通，史称\"三会海口\"，是天津的发祥地。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。天津始于隋朝大运河的开通，史称\"三会海口\"，是天津的发祥地。明永乐二年（1404年）朱棣设立天津卫，天津由此得名。","figures":[]},{"no":40,"type":"judge","q":"截至目前，我国共有85家国家级旅游度假区。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。截至2025年7月，我国共有85家国家级旅游度假区。","figures":[]},{"no":41,"type":"single","q":"紧压茶主要以（ ）为原料，也称边销茶。","opt":["A.白茶或黄茶","B.乌龙茶或花茶","C.普洱茶或铁观音","D.黑茶或红茶或绿茶"],"ans":"D","analysis":"紧压茶主要以黑茶或红茶或绿茶为原料，也称边销茶。再加工茶类有压制成型的紧压茶和鲜花窨制的花茶。花茶出现于宋代，以精制后的茶叶和鲜花为原料，经过窨花工艺制成。\nA项，白茶、黄茶与B项乌龙茶均属六大类毛茶，B项花茶则与紧压茶同属再加工茶类，均非紧压茶原料。\nC项，普洱茶为黑茶名品、铁观音为乌龙茶名品，该组合并非紧压茶原料。","figures":[]},{"no":42,"type":"single","q":"我国第一部文学理论专著是南朝刘勰的（ ）。","opt":["A.《文赋》","B.《诗品》","C.《文心雕龙》","D.《典论·论文》"],"ans":"C","analysis":"刘勰的《文心雕龙》，我国第一部文学理论专著。\nD项，《典论·论文》是我国文学史上第一篇文学批评著作。其作者为曹丕。","figures":[]},{"no":43,"type":"single","q":"中国古代最大的一座帝王陵墓是（ ）。","opt":["A.汉茂陵","B.秦始皇陵","C.唐乾陵","D.明孝陵"],"ans":"B","analysis":"秦始皇陵是中国历史上第一个皇帝嬴政的陵墓，位于陕西省西安市临潼区骊山脚下，是中国古代最大的一座帝王陵墓，也是世界上最大的一座陵墓。被誉为“世界第八大奇迹”。\nA项，汉茂陵是汉武帝刘彻的陵墓，是西汉帝王陵中规模最大的一座，并非中国古代最大的帝王陵墓。CD项，唐乾陵、明孝陵的规模均不及秦始皇陵。","figures":[]},{"no":44,"type":"single","q":"元明清三代汉地佛教的局面是（ ）。","opt":["A.禅宗一枝独秀","B.佛教全面衰退","C.“家家观世音，户户阿弥陀”","D.八大宗派并立"],"ans":"C","analysis":"元明清三代，汉地精英佛教停滞衰退，而大众佛教取得长足发展，出现“家家观世音，户户阿弥陀”的局面。\nA项，禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影响最广泛的宗派，但元明清三代并非禅宗一枝独秀。\nB项，元明清三代停滞衰退的是汉地精英佛教，大众佛教取得长足发展，“全面衰退”说法片面。\nD项，隋唐两代是中国佛教的创造阶段和鼎盛时期，主要宗派并立是隋唐局面，非元明清三代局面。","figures":[]},{"no":45,"type":"single","q":"中国最早的书法作品是商朝的（ ）。","opt":["A.石鼓文","B.甲骨文和金文","C.小篆和隶书","D.楷书和行书"],"ans":"B","analysis":"中国最早的书法作品是商朝甲骨文和金文，分别镌刻在甲骨和青铜器上。秦丞相李斯创制小篆，实现了字体统一。","figures":[]},{"no":46,"type":"single","q":"“建安七子”中成就最高，与曹植并称为“曹王”的是（ ）。","opt":["A.陈琳","B.刘桢","C.孔融","D.王粲"],"ans":"D","analysis":"建安七子成就最高的是王粲，与曹植并称为“曹王”，主要代表作是《七哀诗》和《登楼赋》。ABC项，陈琳、刘桢、孔融均为建安七子成员，但成就最高、与曹植并称“曹王”的是王粲。","figures":[]},{"no":47,"type":"single","q":"世界最大的鸟类公园——裕廊鸟类公园位于（ ）。","opt":["A.泰国曼谷","B.新加坡","C.马来西亚吉隆坡","D.印度尼西亚雅加达"],"ans":"B","analysis":"裕廊鸟类公园是世界最大的鸟类公园。裕廊鸟类公园位于新加坡。","figures":[]},{"no":48,"type":"single","q":"泰山岱庙的天贶殿同北京故宫太和殿、（ ）并称中国古代三大宫殿式建筑。","opt":["A.沈阳故宫崇政殿","B.承德避暑山庄澹泊敬诚殿","C.拉萨布达拉宫红宫","D.曲阜孔庙大成殿"],"ans":"D","analysis":"天贶殿同北京故宫太和殿、曲阜孔庙大成殿并称中国古代三大宫殿式建筑。岱庙旧称“东岳庙”，又叫泰庙，主祀“东岳泰山之神”，也是古代帝王来泰山封禅告祭时居住和举行大典的地方，与北京故宫、山东曲阜三孔、河北承德避暑山庄并称我国四大古建筑群。ABC项，沈阳故宫崇政殿、承德避暑山庄澹泊敬诚殿、拉萨布达拉宫红宫均不在“三大宫殿式建筑”之列。","figures":[]},{"no":49,"type":"single","q":"啤酒按麦芽汁的浓度，可分为（ ）。","opt":["A.红啤、黑啤两类","B.生啤、熟啤两类","C.有醇、无醇两类","D.低浓度、中浓度、高浓度三类"],"ans":"D","analysis":"按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度6°-8°，酒精含量2%左右）、中浓度啤酒（原麦汁浓度10°-12°，酒精含量3.1%-3.8%）和高浓度啤酒（原麦汁浓度14°-20°，酒精含量4.9%-5.6%）。中国最著名的啤酒是青岛啤酒，系山东青岛啤酒厂出品。","figures":[]},{"no":50,"type":"single","q":"中国面积最大的内陆盆地是（ ）。","opt":["A.四川盆地","B.柴达木盆地","C.准噶尔盆地","D.塔里木盆地"],"ans":"D","analysis":"塔里木盆地位于中国新疆南部，是中国面积最大的内陆盆地。盆地北缘的塔里木河是我国最大的内陆河。ABC项，中国四大盆地分别是塔里木盆地、准噶尔盆地、四川盆地和柴达木盆地，其中面积最大的内陆盆地是塔里木盆地。","figures":[]},{"no":51,"type":"single","q":"下列湖泊中，属于河成湖的是（ ）。","opt":["A.月牙泉","B.千岛湖","C.鄱阳湖","D.五大连池"],"ans":"C","analysis":"河成湖是由于河流摆动而形成的湖泊，如鄱阳湖、洞庭湖等。\nA项，月牙泉属风成湖：沙漠中低于潜水面的丘间洼地，经其四周沙丘渗流汇集而成，如敦煌的月牙泉。\nB项，千岛湖属人工湖：由人工修筑的蓄水区域，如千岛湖。\nD项，五大连池属火山堰塞湖。","figures":[]},{"no":52,"type":"single","q":"除夕北方地区有吃饺子的习俗，寓（ ）之意。","opt":["A.“步步高”","B.“团团圆圆”","C.“更岁交子”","D.“年年有余”"],"ans":"C","analysis":"北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象征生活步步高。","figures":[]},{"no":53,"type":"single","q":"恒山悬空寺始建于（ ），距地面高约50米。","opt":["A.东汉","B.北魏","C.唐代","D.宋代"],"ans":"B","analysis":"悬空寺为恒山人文景观之最，始建于北魏，距地面高约50米，其建筑特色可以概括为“奇、悬、巧”三个字。徐霞客称悬空寺为“天下巨观”，三教殿内，释迦牟尼、老子、孔子共居一室，在我国寺庙建筑中别具一格。ACD项，东汉、唐代、宋代均与悬空寺始建年代不符。","figures":[]},{"no":54,"type":"single","q":"下列高原中，被称为“世界屋脊”的是（ ）。","opt":["A.黄土高原","B.青藏高原","C.云贵高原","D.内蒙古高原"],"ans":"B","analysis":"青藏高原是中国最大、世界海拔最高的高原，被称为“世界屋脊”“地球第三极”。","figures":[]},{"no":55,"type":"single","q":"成为埃及的象征、世界八大奇迹之一的是（ ）。","opt":["A.亚历山大灯塔","B.巴比伦空中花园","C.罗德岛太阳神巨像","D.胡夫金字塔和狮身人面像"],"ans":"D","analysis":"金字塔在埃及共发现96座，最大的是开罗郊区吉萨的三座金字塔，是胡夫、哈夫拉和孟考拉祖孙三代的陵墓，其中最有名的是胡夫金字塔和狮身人面像，成为世界八大奇迹之一，也是埃及的象征。卢克索是世界上最大的露天博物馆，有“宫殿之城”的美誉。","figures":[]},{"no":56,"type":"single","q":"伊斯兰教内部的神秘主义派别是（ ）。","opt":["A.逊尼派","B.什叶派","C.哈瓦利吉派","D.苏菲派"],"ans":"D","analysis":"苏菲派是伊斯兰教内部的神秘主义派别。\nA项，逊尼派是伊斯兰教中人数最多的一派，中国穆斯林大多属于逊尼派。\nB项，什叶派是伊斯兰教中人数较少的一派，中国新疆塔吉克族穆斯林属于什叶派。","figures":[]},{"no":57,"type":"single","q":"每年举办“国际风筝节”、被称为“风筝的故乡”的城市是（ ）。","opt":["A.潍坊","B.阳江","C.北京","D.天津"],"ans":"A","analysis":"1984年起，潍坊每年都举办“国际风筝节”。现在潍坊成为世界风筝文化交流的中心，被世界各国人民称为“风筝的故乡”。\nB项，阳江于1993年被国家体委授予“全国风筝之乡”，与“风筝的故乡”所指不同。","figures":[]},{"no":58,"type":"single","q":"若按桥梁的结构及外观形式分，古桥的基本类型不包括（ ）。","opt":["A.立交桥","B.梁桥","C.浮桥","D.索桥"],"ans":"A","analysis":"若以桥梁的结构及外观形式分，主要有梁桥、浮桥、索桥、拱桥4种基本类型。拱桥是古桥中最富有生命力的一种桥型。\nA项立交桥是现代道路交叉工程，不在其列。","figures":[]},{"no":59,"type":"single","q":"张学良、杨虎城扣留蒋介石的“西安事变”发生于（ ）。","opt":["A.1936年12月12日","B.1937年12月12日","C.1936年10月10日","D.1935年12月12日"],"ans":"A","analysis":"1936年12月12日，张学良、杨虎城在西安扣留蒋介石，并向全国通电，提出停止内战、一致对外等八项主张。","figures":[]},{"no":60,"type":"single","q":"蛋壳黑陶高柄杯“黑如漆、亮如镜、薄如纸、硬如瓷”，被考古界誉为（ ）。","opt":["A.“黑陶之王”","B.“四千年前地球文明最精致之制作”","C.“史前陶文化之母”","D.“东方陶魂”"],"ans":"B","analysis":"蛋壳黑陶高柄杯，其“黑如漆、亮如镜、薄如纸、硬如瓷”，堪称史前陶文化高超技艺的典型代表，被考古界誉为“四千年前地球文明最精致之制作”。龙山文化蛋壳黑陶是山东龙山文化特有的标志性陶器，也是我国古代制陶艺术的巅峰之作。","figures":[]},{"no":61,"type":"single","q":"泰国的首都是（ ）。","opt":["A.芭堤雅","B.清迈","C.普吉","D.曼谷"],"ans":"D","analysis":"泰国首都是曼谷。曼谷被誉为“佛教之都”，是“世界佛教联谊会”总部所在地。也是世界上佛寺最多的地方。\nA项，芭堤雅已成为“海滩度假天堂”的代名词，素以阳光、沙滩、海鲜名扬世界；B项，清迈有“北方玫瑰”之称；C项，普吉是泰国著名海岛。","figures":[]},{"no":62,"type":"single","q":"扬州个园的命名与（ ）有关。","opt":["A.竹","B.兰","C.菊","D.梅"],"ans":"A","analysis":"扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","figures":[]},{"no":63,"type":"single","q":"苏州玉雕以“小、巧、灵、精”出彩，其工匠善雕琢（ ）。","opt":["A.大型山子","B.中小件","C.巨型摆件","D.建筑构件"],"ans":"B","analysis":"苏州工匠善雕琢中小件，以“小、巧、灵、精”出彩。苏州玉雕历宋、元、明、清数代，均作为贡品进献皇室。ACD项，大型山子、巨型摆件、建筑构件均非苏州玉雕所长；扬州玉雕尤以“山子雕”及“链子活”技艺独具一格。","figures":[]},{"no":64,"type":"single","q":"佛光是当阳光照在云雾表面，经过（ ）作用形成的一种特殊自然景观。","opt":["A.折射和全反射","B.直射和散射","C.吸收和透射","D.衍射和漫反射"],"ans":"D","analysis":"佛光是当阳光照在云雾表面，经过衍射和漫反射作用形成的一种特殊自然景观。峨眉山佛光出现次数最多，因峨眉山有海拔高、多云雾，且湿度大、风速小等有利条件，故佛光有“峨眉宝光”“金顶祥光”之誉。\nA项，蜃景也称海市或海市蜃楼。蜃景成因是气温在垂直方向剧烈变化，使空气密度在垂向上出现显著差异，从而产生光线折射和全反射现象，折射和全反射是蜃景的成因，而非佛光的成因。BC项，直射和散射、吸收和透射均与佛光成因不符。","figures":[]},{"no":65,"type":"single","q":"采纳董仲舒建议，实行“罢黜百家，独尊儒术”的是（ ）。","opt":["A.汉武帝","B.汉景帝","C.汉高祖","D.汉文帝"],"ans":"A","analysis":"汉武帝时实行“罢黜百家，独尊儒术”。经他改革后的儒学顺应了汉武帝希望加强中央集权的愿望，汉武帝“罢黜百家，独尊儒术”，儒学从此成为中国正统思想。汉武帝派张骞出使西域，开通了陆上丝绸之路。BCD项，汉景帝、汉高祖、汉文帝均非实行“罢黜百家，独尊儒术”的皇帝。","figures":[]},{"no":66,"type":"single","q":"贴春联、挂年画起源于古代的（ ）。","opt":["A.剪纸","B.灯笼","C.桃符","D.门神画"],"ans":"C","analysis":"贴春联、挂年画起源于古代的桃符。","figures":[]},{"no":67,"type":"single","q":"中国现存规模最大、保存最完整的古代城垣是（ ）城墙。","opt":["A.丽江古城","B.南京古城","C.西安古城","D.平遥古城"],"ans":"C","analysis":"西安古城城墙是中国现存规模最大、保存最完整的古代城垣。现存的著名古代城池有江苏南京古城、陕西西安古城、山西平遥古城和云南丽江古城等。\nB项，南京古城聚宝门规模最大，是我国现存最大、最为完整的堡垒瓮城，在城垣建筑史上占有重要地位，但现存规模最大、保存最完整的古代城垣是西安古城城墙。AD项，丽江古城、平遥古城均为现存著名古代城池，但规模与保存完整度不及西安古城城墙。","figures":[]},{"no":68,"type":"single","q":"结束近300年南北分裂局面、定都大兴（今西安）的朝代是（ ）。","opt":["A.北宋","B.西晋","C.隋朝","D.唐朝"],"ans":"C","analysis":"杨坚建立的隋朝，定都大兴（今西安），结束了魏晋南北朝以来300多年南北方长期分裂的局面。创立了三省六部制度和科举制度，修建了以洛阳为中心的大运河，沟通了南北交通，对后代政治制度和经济发展影响巨大。ABD项，北宋、西晋、唐朝均不符合“结束近300年南北分裂局面、定都大兴”的题干表述。","figures":[]},{"no":69,"type":"single","q":"有“匡庐奇秀甲天下”之誉的是（ ）。","opt":["A.黄山","B.庐山","C.雁荡山","D.三清山"],"ans":"B","analysis":"庐山风景秀丽，文化内涵深厚，素有“匡庐奇秀甲天下”之誉。","figures":[]},{"no":70,"type":"single","q":"“两弹一星”中的“两弹”是指（ ）。","opt":["A.核弹、导弹","B.导弹、氢弹","C.原子弹、人造卫星","D.原子弹、氢弹"],"ans":"A","analysis":"“两弹一星”指核弹、导弹、人造卫星。1964年10月16日成功爆炸我国第一颗原子弹；1966年10月27日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合，中国有了可用于实战的核导弹。1967年6月17日，我国第一颗氢弹空爆试验成功；1970年4月24日，我国用长征一号运载火箭成功发射第一颗人造卫星“东方红一号”。BD项，原子弹、氢弹均属核弹范畴；C项，人造卫星是“两弹一星”中的“一星”。","figures":[]},{"no":71,"type":"single","q":"有“沙峰、鸣沙、湖泊、奇泉、古庙”“五奇”之称的是（ ）。","opt":["A.古尔班通古特沙漠","B.巴丹吉林沙漠","C.腾格里沙漠","D.塔克拉玛干沙漠"],"ans":"B","analysis":"巴丹吉林沙漠是中国第三大沙漠，沙峰、鸣沙、湖泊、奇泉、古庙被称为“沙漠五奇”。巴丹吉林沙漠中已探明的湖泊有144个，俗称“沙漠千湖”。ACD项，我国的四大沙漠分别是指塔克拉玛干沙漠、古尔班通古特沙漠、巴丹吉林沙漠、腾格里沙漠，“沙漠五奇”所指为巴丹吉林沙漠。","figures":[]},{"no":72,"type":"single","q":"汉族的语言简称汉语，属（ ）。","opt":["A.印欧语系","B.汉藏语系","C.阿尔泰语系","D.南亚语系"],"ans":"B","analysis":"汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。ACD项，印欧语系、阿尔泰语系、南亚语系均非汉语所属语系。","figures":[]},{"no":73,"type":"single","q":"重阳“九九”与“久久”谐音，有祝愿（ ）的含义。","opt":["A.金榜题名","B.早生贵子","C.长久长寿","D.五谷丰登"],"ans":"C","analysis":"九九重阳，又与“久久”谐音，有祝愿长久长寿的含义，1989年，我国把每年的重阳节定为老人节，成为尊老、爱老、敬老、助老的节日，赋予了传统节日时代的新意。ABD项，金榜题名、早生贵子、五谷丰登均非“九九”与“久久”谐音的寓意。","figures":[]},{"no":74,"type":"single","q":"唐代曾经记载用硫黄、硝石和木炭制造火药的是（ ）。","opt":["A.葛洪","B.孙思邈","C.沈括","D.宋应星"],"ans":"B","analysis":"唐代孙思邈曾经记载用硫黄、硝石和木炭制造火药，唐末火药就开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。\nA项，葛洪是东晋道士；C项，北宋科学家沈括还发现了磁偏角现象；D项，明朝宋应星著《天工开物，外国学者称它为“中国17世纪的工艺百科全书”。三者均非唐代记载制造火药之人。","figures":[]},{"no":75,"type":"single","q":"世界上最大的丹顶鹤繁殖地是（ ）。","opt":["A.四川卧龙自然保护区","B.黑龙江扎龙自然保护区","C.青海湖鸟岛","D.西双版纳野象谷"],"ans":"B","analysis":"黑龙江扎龙主要保护对象为丹顶鹤等珍禽及湿地生态系统。湿地总面积为21万公顷，位居亚洲第一、世界第四，也是世界最大的芦苇湿地，1992年被列入“国际重要湿地名录”。为众多水鸟尤其是丹顶鹤提供了栖息繁殖的优良环境，是世界上最大的丹顶鹤繁殖地。\nA项，卧龙自然保护区以“熊猫之乡”“宝贵的生物基因库”“天然动植物园”享誉中外，以保护大熊猫等珍稀动物为主；C项，青海湖鸟岛是我国重要的鸟类自然保护区。\nD项，西双版纳野象谷以野生亚洲象闻名。","figures":[]},{"no":76,"type":"single","q":"北京香山红叶种植最多的树种是（ ）。","opt":["A.黄栌树","B.火炬树","C.乌桕","D.红枫"],"ans":"A","analysis":"北京香山红叶种植面积最大的黄栌树近10万株。每年的10月中旬到11月上旬是观赏红叶的最好季节。BCD项，火炬树、乌桕、红枫均非香山红叶种植面积最大的树种。","figures":[]},{"no":77,"type":"single","q":"有“中华之魂”盛誉、长城入海的端头部分是（ ）。","opt":["A.老龙头长城","B.嘉峪关","C.居庸关","D.八达岭长城"],"ans":"A","analysis":"老龙头长城是长城入海的端头部分，有“中华之魂”的盛誉。BC项，嘉峪关、居庸关均为长城著名关隘；D项，八达岭长城位于北京西北，是明长城中保存最完好、最具代表性的一段。长城入海的端头部分是老龙头。","figures":[]},{"no":78,"type":"single","q":"研学旅行的主体是（ ）。","opt":["A.家长","B.旅行社","C.学生","D.教师"],"ans":"C","analysis":"学生是研学旅游的主体。研学旅行是学校教育的一部分。研学旅行最核心的属性是教育性。ABD项，家长、旅行社、教师均非研学旅行的主体。","figures":[]},{"no":79,"type":"single","q":"佛教开始传入中国的标志史称（ ）。","opt":["A.“伊存授经”","B.“白马驮经”","C.“法显西行”","D.“永平求法”"],"ans":"A","analysis":"西汉哀帝元寿元年（公元前2年），大月氏王使臣伊存向中国博士弟子景卢口授《浮屠经》，佛教开始传入中国。史称这一佛教初传历史标志为“伊存授经”。","figures":[]},{"no":80,"type":"single","q":"我国“天宫”空间站是通过（ ）系列飞船逐步建成的。","opt":["A.嫦娥","B.神舟","C.天问","D.墨子"],"ans":"B","analysis":"我国载人航天工程通过“神舟”系列飞船建起了天宫空间站，实现了从无人飞行到载人飞行，从一人一天到多人多天，从空间出舱到交会对接，从单船飞行到组合体稳定运行的跨越。\nA项，“嫦娥工程”是我国探月工程；C项，“天问一号”是火星探测器；D项，“墨子号”是量子科学实验卫星。三者均与建设“天宫”空间站无关。","figures":[]},{"no":81,"type":"single","q":"被誉为山水画“南宗鼻祖”，被后世奉为文人画始祖的是（ ）。","opt":["A.倪瓒","B.王维","C.展子虔","D.黄公望"],"ans":"B","analysis":"王维，擅长山水画，被誉为山水画“南宗鼻祖”，又因其画作中往往透出文人士大夫超然、闲适的情怀，“诗中有画，画中有诗”，被后世奉为文人画的始祖，惜无真迹留传下来。\nC项，隋朝展子虔被认为是“唐画之祖”；AD项，倪瓒、黄公望均为元代“元四家”成员。三者均非“南宗鼻祖”、文人画始祖。","figures":[]},{"no":82,"type":"single","q":"江南三大奇石之冠是（ ）。","opt":["A.杭州竹素园绉云峰","B.苏州环秀山庄假山","C.上海豫园玉玲珑","D.苏州留园冠云峰"],"ans":"C","analysis":"太湖石“玉玲珑”为“江南三大奇石”之冠。“江南三大奇石”：上海豫园玉玲珑、苏州留园冠云峰、杭州竹素园绉云峰。","figures":[]},{"no":83,"type":"single","q":"中国现存最大的盔顶建筑是（ ）。","opt":["A.岳阳楼","B.黄鹤楼","C.滕王阁","D.蓬莱阁"],"ans":"A","analysis":"岳阳楼屋顶为四坡盔顶，屋面上凸下凹，为中国现存最大盔顶建筑。岳阳楼自古有“洞庭天下水，岳阳天下楼”之誉，北宋范仲淹脍炙人口的《岳阳楼记》更使岳阳楼著称于世。BCD项，黄鹤楼、滕王阁、蓬莱阁均非中国现存最大盔顶建筑。","figures":[]},{"no":84,"type":"single","q":"1958年通车、后来被改造成中国第一条电气化铁路的是（ ）。","opt":["A.鹰厦铁路","B.成渝铁路","C.宝成铁路","D.成昆铁路"],"ans":"C","analysis":"1958年宝鸡到成都铁路通车，“蜀道难”被突破。这条铁路后来被改造成中国第一条电气化铁路。\nB项，新中国成立后建成的第一条铁路是成渝铁路，全长505公里，连通成都和重庆，1950年开始建设，1952年7月1日建成通车，但并非第一条电气化铁路。AD项，鹰厦铁路、成昆铁路均不符合题干表述；1970年7月1日，全长1096公里的成昆铁路竣工运营。","figures":[]},{"no":85,"type":"single","q":"“海内存知己，天涯若比邻”的作者是（ ）。","opt":["A.王勃","B.杨炯","C.卢照邻","D.骆宾王"],"ans":"A","analysis":"王勃的代表作有《滕王阁序》和《送杜少府之任蜀州》，留下“落霞与孤鹜齐飞，秋水共长天一色”“海内存知己，天涯若比邻”等名句。BCD项，杨炯、卢照邻、骆宾王与王勃并称“初唐四杰”，但“海内存知己，天涯若比邻”出自王勃《送杜少府之任蜀州》。","figures":[]},{"no":86,"type":"single","q":"清代广东“四大园林”中保存原貌最好的是（ ）。","opt":["A.番禺余荫山房","B.佛山梁园","C.顺德清晖园","D.东莞可园"],"ans":"A","analysis":"余荫山房是广东“四大园林”中保存原貌最好的古典园林。清代广东“四大园林”也被称为岭南“四大园林”，分别是顺德清晖园、东莞可园、番禺余荫山房、佛山梁园。BCD项，佛山梁园、顺德清晖园、东莞可园均为广东“四大园林”之一，但保存原貌最好的是番禺余荫山房。","figures":[]},{"no":87,"type":"single","q":"澳门氹仔区新濠天地酒店内最具代表性的舞台剧是（ ）。","opt":["A.《印象·刘三姐》","B.《宋城千古情》","C.《水舞间》","D.《大宋·东京梦华》"],"ans":"C","analysis":"氹仔区的澳门新濠天地酒店内有一个最具代表性的舞台剧——《水舞间》。","figures":[]},{"no":88,"type":"single","q":"藏族人民一年中最重要、最隆重的节日是（ ）。","opt":["A.藏历年","B.雪顿节","C.望果节","D.沐浴节"],"ans":"A","analysis":"藏历年相当于汉族的春节，是藏族人民一年中最重要、最隆重的节日；雪顿节意为\"酸奶盛筵\"，望果节是庆丰收的节日。","figures":[]},{"no":89,"type":"single","q":"四川省第一条高速公路是1995年建成的（ ）。","opt":["A.成雅高速公路","B.成渝高速公路","C.成绵高速公路","D.成乐高速公路"],"ans":"B","analysis":"四川省第一条高速公路是1995年建成的成渝高速公路，里程337.5公里；雅西高速则被称为\"云端上的高速公路\"。","figures":[]},{"no":90,"type":"single","q":"世界现存最高的一尊石刻弥勒佛坐像——乐山大佛，通高（ ）。","opt":["A.48米","B.61米","C.71米","D.88米"],"ans":"C","analysis":"乐山大佛通高71米，位于岷江、青衣江和大渡河三江汇流的凌云山上。","figures":[]},{"no":91,"type":"single","q":"香港香火最旺、也是香港唯一可以举行道教婚礼的宫观是（ ）。","opt":["A.黄大仙祠","B.文武庙","C.天后庙","D.车公庙"],"ans":"A","analysis":"黄大仙祠又名啬色园，是一座宏伟的中国式道教寺庙，是香港香火最旺的地方。","figures":[]},{"no":92,"type":"single","q":"欣赏阿里山日出的最佳地点是（ ）。","opt":["A.日月潭","B.玉山","C.祝山","D.阳明山"],"ans":"C","analysis":"著名的阿里山日出四季出现位置与时间皆不同，祝山是欣赏日出的最佳地点。","figures":[]},{"no":93,"type":"single","q":"壮族地区最负盛名的特产是（ ）。","opt":["A.桂圆、荔枝、菠萝","B.罗汉果、田七、肉桂","C.珍珠、玛瑙、翡翠","D.南珠、三七、蛤蚧"],"ans":"D","analysis":"南珠、三七、蛤蚧是壮族地区最负盛名的特产；博白县是广西桂圆肉的主要产区，素有\"桂圆肉之乡\"的称誉。","figures":[]},{"no":94,"type":"single","q":"郑和第一次下西洋的首航日7月11日被定为（ ）。","opt":["A.中国海洋日","B.中国航海日","C.世界海事日","D.郑和文化节"],"ans":"B","analysis":"郑和是云南昆阳州（今昆明市晋宁区）人，七下西洋完成了人类历史上伟大的壮举，其第一次下西洋的首航日7月11日被定为中国航海日。","figures":[]},{"no":95,"type":"single","q":"我国海拔最高的民用机场是（ ）。","opt":["A.拉萨贡嘎国际机场","B.昌都邦达机场","C.稻城亚丁机场","D.九寨黄龙机场"],"ans":"C","analysis":"稻城亚丁机场海拔4411米，是我国海拔最高的民用机场。西藏机场均为高高原机场，注意区分。","figures":[]},{"no":96,"type":"single","q":"台湾本岛南北最长达394千米，东西最宽为（ ），呈纺锤形。","opt":["A.180千米","B.220千米","C.394千米","D.144千米"],"ans":"D","analysis":"台湾本岛南北最长达394千米，东西最宽为144千米，呈纺锤形；台湾地区陆地总面积3.6万平方千米。","figures":[]},{"no":97,"type":"single","q":"我国面积最大的湿地类型国家级自然保护区是（ ）。","opt":["A.青海省三江源国家级自然保护区","B.四川若尔盖湿地保护区","C.黑龙江扎龙自然保护区","D.内蒙古额尔古纳湿地保护区"],"ans":"A","analysis":"青海省三江源国家级自然保护区是我国面积最大的湿地类型国家级自然保护区。","figures":[]},{"no":98,"type":"single","q":"甘肃地形呈狭长状，最窄处仅（ ）。","opt":["A.15公里","B.25公里","C.50公里","D.80公里"],"ans":"B","analysis":"甘肃地形呈狭长状，东西长1655公里，南北宽530公里，最窄处仅25公里。","figures":[]},{"no":99,"type":"single","q":"中国最长的内陆河是（ ）。","opt":["A.额尔齐斯河","B.伊犁河","C.黑河","D.塔里木河"],"ans":"D","analysis":"中国最长的内陆河——塔里木河，长2100公里；中国最大的沙漠——塔克拉玛干沙漠（33.76万平方公里）；中国最大的内陆淡水湖——博斯腾湖。","figures":[]},{"no":100,"type":"single","q":"全国最大的内河港是（ ）。","opt":["A.重庆果园港","B.武汉阳逻港","C.南京港","D.苏州港"],"ans":"A","analysis":"全国最大的内河港果园港建成投用，2025年全市港口货运量达到2.4亿吨，位居西部第一。","figures":[]},{"no":101,"type":"single","q":"下列瀑布中，被称为\"中国第一瀑\"的是（ ）。","opt":["A.壶口瀑布","B.黄果树瀑布","C.德天瀑布","D.蛟龙瀑布"],"ans":"B","analysis":"黄果树瀑布誉满天下，被称为\"中国第一瀑\"。","figures":[]},{"no":102,"type":"single","q":"成都除\"蓉城\"之外，还有（ ）等别称。","opt":["A.\"山城\"\"雾都\"","B.\"羊城\"\"花城\"","C.\"龟城\"\"锦官城\"","D.\"泉城\"\"面塑之都\""],"ans":"C","analysis":"成都还有\"龟城\"\"锦官城\"\"蓉城\"等别称，被誉为\"雪山下的公园城市\"\"一座来了就不想走的城市\"。","figures":[]},{"no":103,"type":"single","q":"为昆明滇池大观楼题写\"天下第一长联\"、被后人尊称为\"联圣\"的是（ ）。","opt":["A.杨慎","B.袁枚","C.赵藩","D.孙髯翁"],"ans":"D","analysis":"孙髯翁为昆明滇池大观楼题天下第一长联，被后人尊称为联圣。","figures":[]},{"no":104,"type":"single","q":"我国台湾省最大的港口是（ ）。","opt":["A.高雄港","B.基隆港","C.台中港","D.花莲港"],"ans":"A","analysis":"高雄港是台湾省最大的港口、世界第十五大港口；台北桃园国际机场是台湾省最大、最繁忙的机场。","figures":[]},{"no":105,"type":"single","q":"苗族民间最大的祭祀活动是（ ）。","opt":["A.姊妹节","B.祭鼓节","C.芦笙节","D.跳花节"],"ans":"B","analysis":"祭鼓节是苗族民间最大的祭祀活动。苗族主要信仰本民族长期形成的原始宗教，包括自然崇拜、图腾崇拜、祖先崇拜、鬼神崇拜。\nD项跳花节是苗族传统节日，易误选。","figures":[]},{"no":106,"type":"single","q":"香港岛的最高点是（ ），登临的最佳时间为黄昏。","opt":["A.大帽山","B.狮子山","C.太平山","D.嘉顿山"],"ans":"C","analysis":"太平山也称扯旗山，海拔552米，是香港岛的最高点。登太平山的最佳时间是黄昏，既能观赏白天的城市景观，又可静待夜幕低垂时整个城市瞬间变幻的一刻。","figures":[]},{"no":107,"type":"single","q":"\"三亚\"因（ ）得名，是中国最南部的热带滨海旅游城市。","opt":["A.三亚湾","B.三亚山","C.三亚岭","D.三亚河"],"ans":"D","analysis":"\"三亚\"因三亚河（古名临川水）得名；三亚又称\"鹿城\"，享有\"东方夏威夷\"的美誉，是全国较长寿地区（平均寿命超过80岁）。","figures":[]},{"no":108,"type":"single","q":"澳门三大古刹中最古老者是（ ）。","opt":["A.妈阁庙","B.普济禅院","C.莲峰庙","D.妈阁庙和普济禅院并列"],"ans":"A","analysis":"妈阁庙现为澳门三大古刹中最古老者。","figures":[]},{"no":109,"type":"single","q":"黎族最盛大的民间传统节日、也是青年男女自由交往的日子是（ ）。","opt":["A.\"六月六\"","B.\"三月三\"","C.\"盘王节\"","D.\"火把节\""],"ans":"B","analysis":"黎族大多数节日与汉族相同，\"三月三\"是最盛大的民间传统节日，也是青年男女自由交往的日子。\nB项盘王节是瑶族传统节日，D项火把节是彝族传统节日，均易误选。","figures":[]},{"no":110,"type":"single","q":"陕北民歌最常见的形式是（ ）。","opt":["A.花儿","B.山曲","C.信天游","D.爬山调"],"ans":"C","analysis":"陕北民歌以信天游最常见，其曲调悠长高亢、韵律和美，名曲《兰花花》《山丹丹开花红艳艳》几乎家喻户晓。\nA项\"花儿\"是甘青宁新一带回族的民间歌谣，易误选。","figures":[]},{"no":111,"type":"single","q":"青海湖是我国最大的（ ）。","opt":["A.淡水湖","B.人工湖","C.火山口湖","D.内陆咸水湖"],"ans":"D","analysis":"青海湖是我国最大的内陆咸水湖，柴达木盆地以\"聚宝盆\"著称于世。","figures":[]},{"no":112,"type":"single","q":"彝族人民最盛大的节日——火把节的时间是（ ）。","opt":["A.农历六月二十四","B.农历正月十五","C.农历五月十五","D.农历八月十五"],"ans":"A","analysis":"农历六月二十四是彝族人民最盛大的节日——火把节。彝族有自己的语言、文字和历法，崇拜自然和神灵，祭司称为\"毕摩\"。","figures":[]},{"no":113,"type":"single","q":"陕西境内的最高点是（ ）。","opt":["A.五台山","B.小五台山","C.太白山拔仙台","D.神农架神农顶"],"ans":"C","analysis":"陕西境内最高点为太白山拔仙台，海拔3771.2米。","figures":[]},{"no":114,"type":"single","q":"我国台湾省最大、最繁忙的机场是（ ）。","opt":["A.台北松山机场","B.台北桃园国际机场","C.高雄小港机场","D.台中清泉岗机场"],"ans":"B","analysis":"台北桃园国际机场是台湾省最大、最繁忙的机场；高雄港是台湾省最大的港口、世界第十五大港口。","figures":[]},{"no":115,"type":"single","q":"藏族最普遍的礼节是（ ）。","opt":["A.敬酥油茶","B.鞠躬","C.合十礼","D.献哈达"],"ans":"D","analysis":"献哈达是藏族最普遍的礼节，婚丧、节庆、乔迁、拜会尊长、朝拜佛像、送别远行等都有献哈达的习惯。","figures":[]},{"no":116,"type":"single","q":"拥有两千多年养马历史、世界上最大的马场是（ ）。","opt":["A.山丹军马场","B.伊犁昭苏马场","C.呼伦贝尔马场","D.坝上草原马场"],"ans":"A","analysis":"位于张掖山丹县的山丹军马场是世界上最大的马场，拥有两千多年养马历史；甘肃养马历史悠久，自汉至今一直是我国养马业的重地。","figures":[]},{"no":117,"type":"single","q":"世界上最大最古老、保存得最完好的生土建筑城市是（ ）。","opt":["A.楼兰故城遗址","B.交河故城遗址","C.高昌故城","D.北庭故城"],"ans":"B","analysis":"交河故城遗址是世界上最大最古老、保存得最完好的生土建筑城市，唐西域最高军政机构安西都护府最早就设在交河故城。","figures":[]},{"no":118,"type":"single","q":"台湾本岛唯一的热带地区、被称为\"台湾的天涯海角\"的是（ ）。","opt":["A.野柳公园","B.玉山","C.垦丁公园","D.阳明山"],"ans":"C","analysis":"垦丁公园是台湾本岛唯一的热带地区，终年气温和暖，也是台湾省唯一拥有海域和陆地的公园，被称为台湾的天涯海角。\nB项玉山、C项阳明山均为台湾著名山岳，易误选。","figures":[]},{"no":119,"type":"single","q":"被众多游客称为\"此生必驾公路\"和\"最美天山路\"的是（ ）。","opt":["A.独库公路","B.伊昭公路","C.塔里木沙漠公路","D.赛果高速"],"ans":"A","analysis":"自驾独库公路能够感受\"一日历四季，十里不同天\"的独特体验，被众多游客称为\"此生必驾公路\"和\"最美天山路\"。","figures":[]},{"no":120,"type":"single","q":"香港众岛屿中面积最大的岛屿是（ ）。","opt":["A.香港岛","B.南丫岛","C.大屿山","D.青马岛"],"ans":"C","analysis":"香港众岛屿以大屿山面积最大，其次是香港岛；香港岛以南的鸭脷洲则是全球人口最稠密的岛屿之一。","figures":[]},{"no":121,"type":"single","q":"中国第一条国际铁路是（ ）。","opt":["A.成昆铁路","B.中老铁路","C.湘黔铁路","D.滇越铁路"],"ans":"D","analysis":"云南昆明至越南河内的滇越铁路是中国第一条国际铁路。","figures":[]},{"no":122,"type":"single","q":"我国台湾省长期居全球第一位的产业领域是（ ）。","opt":["A.石化产业","B.精密机械","C.晶圆代工产业","D.纺织业"],"ans":"C","analysis":"台湾省拥有全球最密集的半导体产业集群，尤其在晶圆代工产业领域长期居全球第一位，有台积电、日月光、联发科、富士康、华硕等一批企业。","figures":[]},{"no":123,"type":"single","q":"重庆云雾山全年雾日多达（ ）天，堪称\"世界之最\"。","opt":["A.164天","B.240天","C.304天","D.204天"],"ans":"D","analysis":"重庆云雾山全年雾日多达204天，堪称\"世界之最\"。","figures":[]},{"no":124,"type":"single","q":"世界最大的室内卧佛位于甘肃（ ）。","opt":["A.张掖大佛寺","B.武威大佛寺","C.天水大佛寺","D.兰州大佛寺"],"ans":"A","analysis":"张掖大佛寺有世界最大的室内卧佛；\"九色香巴拉\"天堂之地指甘南藏族自治州。","figures":[]},{"no":125,"type":"single","q":"到澳门旅游最理想的季节是（ ）。","opt":["A.春季（3～5月）","B.秋季（9～11月）","C.夏季（6～8月）","D.冬季（12～2月）"],"ans":"B","analysis":"秋季（9～11月）阳光充足、气候温和且湿度较低，是到澳门旅游的最理想的季节。","figures":[]},{"no":126,"type":"single","q":"我国第一条跨国原油管道是（ ）。","opt":["A.中俄原油管道","B.中缅油气管道","C.中哈原油管道","D.中亚天然气管道"],"ans":"C","analysis":"中哈原油管道是我国第一条跨国原油管道，也是连接里海油田到中国内陆的重要能源通道。","figures":[]},{"no":127,"type":"single","q":"宁夏枸杞以（ ）所产为最佳，被列入《中国药典》。","opt":["A.银川","B.固原","C.中卫","D.中宁"],"ans":"D","analysis":"宁夏是枸杞的原产地，是世界上品质最好、种植时间最长的地方，其中又以中宁所产为最佳；中宁枸杞被列入《中国药典》，远销58国。","figures":[]},{"no":128,"type":"single","q":"澳门的区花是（ ）。","opt":["A.莲花","B.紫荆花","C.白玉兰","D.菊花"],"ans":"A","analysis":"澳门的区花是莲花，金莲花广场的大型雕塑\"盛世莲花\"是中央人民政府为庆祝澳门回归而赠送的；紫荆花是香港区花，易误选。","figures":[]},{"no":129,"type":"single","q":"中国第一条采用自主研发的北斗卫星导航系统、设计速度350公里/小时的智能化高速铁路是（ ）。","opt":["A.京沪高铁","B.京张客运专线","C.京津城际","D.京广高铁"],"ans":"B","analysis":"京张客运专线是中国第一条采用自主研发的北斗卫星导航系统、设计速度350公里/小时的智能化高速铁路，也是世界上第一条最高设计速度350公里/小时的高寒、大风沙高速铁路。","figures":[]},{"no":130,"type":"single","q":"国家5A级旅游景区数量最多的省市是（ ）。","opt":["A.福建","B.江苏","C.天津","D.浙江"],"ans":"B","analysis":"江苏省国家5A级旅游景区数量位居全国第一、浙江第二。","figures":[]},{"no":131,"type":"multi","q":"中国古典园林叠山的石材主要有两种，其用途对应正确的有（ ）。","opt":["A.黄石——用于假山的基础部分，称叠脚","B.太湖石——置于假山上部，称收顶","C.黄石——置于假山上部","D.太湖石——用于假山的基础部分","E.两种石材用途相同"],"ans":"AB","analysis":"叠山的石材主要有两种：一是黄石，因其质地坚硬，不易受风雨的侵蚀，用于假山的基础部分，称叠脚。二是太湖石，因其具有皱、瘦、漏、透四大特点，置于假山的上部，供游人玩赏品味，称收顶。CD项把两种石材的用途颠倒了；E项，两种石材的用途并不相同。","figures":[]},{"no":132,"type":"multi","q":"兼香型酒以（ ）为代表。","opt":["A.贵州遵义董酒","B.陕西西凤酒","C.贵州茅台酒","D.山西汾酒","E.桂林三花酒"],"ans":"AB","analysis":"兼香型酒指具有两种以上主体香型的白酒，具有一酒多香的风格，又称为复香型和混合香型酒。以贵州遵义董酒、陕西西凤酒为代表。\nC项，贵州茅台酒是酱香型酒的典型代表；D项，山西杏花村汾酒是清香型酒的代表；E项，桂林三花酒属于米香型酒的代表。","figures":[]},{"no":133,"type":"multi","q":"中国“四大名锦”包括（ ）。","opt":["A.南京云锦","B.四川蜀锦","C.苏州宋锦","D.广西壮锦","E.杭州织锦"],"ans":"ABCD","analysis":"在中国众多锦中，南京云锦、四川蜀锦、苏州宋锦、广西壮锦并称“四大名锦”，分别代表宫廷皇家、汉唐丝路、文人雅士和少数民族四大文化体系。云锦因锦面色彩斑斓、美若云霞而得名，被专家称为“中国古代织锦工艺史上最后一座里程碑”。\nE项，杭州织锦不在“四大名锦”之列。","figures":[]},{"no":134,"type":"multi","q":"我国三大瀑布风景区是（ ）。","opt":["A.黄果树瀑布风景区","B.壶口瀑布风景区","C.吊水楼瀑布风景区","D.德天瀑布风景区","E.诺日朗瀑布风景区"],"ans":"ABC","analysis":"黄果树瀑布风景区、壶口瀑布风景区和吊水楼瀑布风景区是我国的三大瀑布风景区。\nD项，德天瀑布为亚洲第一大跨国瀑布；E项，诺日朗瀑布是大型钙华瀑布，瀑面最宽达300多米，是我国最宽的瀑布，二者均不在三大瀑布风景区之列。","figures":[]},{"no":135,"type":"multi","q":"中国佛教包容的三大体系是（ ）。","opt":["A.北传佛教","B.南传佛教","C.藏传佛教","D.汉传佛教","E.上座部佛教"],"ans":"ABC","analysis":"中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系。可以说，佛教诞生在印度，发展在中国。\nD项，北传佛教亦称汉语系佛教，汉传佛教即北传佛教；E项，南传佛教以小乘佛教（上座部佛教）为主，上座部佛教即南传佛教。","figures":[]},{"no":136,"type":"multi","q":"从2008年起成为全国性法定节日的有（ ）。","opt":["A.七夕节","B.清明节","C.端午节","D.中秋节","E.元宵节"],"ans":"BCD","analysis":"根据国务院令，从2008年1月1日起，除春节外，清明节、端午节、中秋节等传统节日也成为全国性法定节日。AE项，七夕节、元宵节不在2008年起新增的全国性法定节日之列。","figures":[]},{"no":137,"type":"multi","q":"巴金的“爱情三部曲”包括（ ）。","opt":["A.《雾》","B.《雨》","C.《电》","D.《家》","E.《春》"],"ans":"ABC","analysis":"巴金于1929年发表第一部长篇小说《灭亡》，随后有长篇小说“爱情三部曲”（《雾》《雨》《电》）和“激流三部曲”（《家》《春》《秋》）。DE项，《家》《春》属“激流三部曲”，而非“爱情三部曲”。","figures":[]},{"no":138,"type":"multi","q":"汉字发展演变的规律可以概括为（ ）。","opt":["A.笔画的线条化","B.字形的符号化","C.结构的规范化","D.字体的拼音化","E.书写的随意化"],"ans":"ABC","analysis":"汉字发展演变的规律可以概括为以下三个方面：笔画的线条化、字形的符号化、结构的规范化。DE项，“字体的拼音化”“书写的随意化”不在汉字发展演变规律之列。","figures":[]},{"no":139,"type":"multi","q":"下列关于古田会议的表述，正确的有（ ）。","opt":["A.1929年12月28-29日在福建省上杭县古田召开","B.选举毛泽东为新的中共红四军前敌委员会书记","C.根据中央九月来信精神，通过毛泽东起草的古田会议决议","D.确立了思想建党、政治建军的原则","E.是中国共产党历史上生死攸关的转折点"],"ans":"ABCD","analysis":"1929年12月28-29日，红四军党的第九次代表大会在福建省上杭县古田召开，即古田会议。古田会议选举产生了新的中共红四军前敌委员会，毛泽东当选为书记。古田会议根据中央九月来信精神，通过毛泽东起草的古田会议决议，确立了思想建党、政治建军的原则。古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。\nE项，遵义会议是党的历史上一个生死攸关的转折点。","figures":[]},{"no":140,"type":"multi","q":"新石器时代前期母系氏族社会的代表性文化有（ ）。","opt":["A.仰韶文化","B.河姆渡文化","C.龙山文化","D.良渚文化","E.红山文化"],"ans":"AB","analysis":"新石器时代前期——母系氏族社会代表性文化有北方黄河流域的仰韶文化和南方长江流域的河姆渡文化，距今7000-5000年。CD项，新石器时代后期——父系氏族社会代表性文化是北方黄河流域的龙山文化和南方长江流域的良渚文化，属父系氏族社会；E项，红山文化不在母系氏族社会代表性文化之列。","figures":[]},{"no":141,"type":"multi","q":"被称为“化石植物”的有（ ）。","opt":["A.水杉","B.银杉","C.珙桐","D.银杏","E.松树"],"ans":"ABCD","analysis":"水杉、银杉、珙桐、银杏等，被称为“化石植物”。\nE项，松、竹、梅被誉为岁寒三友，松树不在“化石植物”之列。","figures":[]},{"no":142,"type":"multi","q":"巴黎的三大地标是（ ）。","opt":["A.巴黎圣母院","B.凯旋门","C.埃菲尔铁塔","D.卢浮宫","E.凡尔赛宫"],"ans":"ABC","analysis":"巴黎圣母院、凯旋门和埃菲尔铁塔是巴黎的三大地标。埃菲尔铁塔是一座建于1889年的镂空结构铁塔，是世界上第一座钢铁结构的高塔，也是巴黎最高的建筑物，成为巴黎和法国的象征。\nD项，卢浮宫始建于1204年，是法国最大的王宫建筑，也是世界上最大、最古老、最著名的博物馆之一，但不在巴黎三大地标之列；E项，凡尔赛宫也不在三大地标之列。","figures":[]},{"no":143,"type":"multi","q":"春秋战国时期沟通长江与黄河水系的工程有（ ）。","opt":["A.邗沟","B.鸿沟","C.都江堰","D.郑国渠","E.灵渠"],"ans":"AB","analysis":"春秋时期吴开凿邗沟，沟通了长江和淮河；战国时期魏开凿鸿沟，沟通了黄河和淮河。这两大工程打通了长江到黄河的水上交通航道，促进了中国南北方交通的发展，并成为隋代大运河的雏形。CD项，秦在关中修建郑国渠，在蜀郡修建都江堰，主要用于农业灌溉，并非沟通长江与黄河水系的工程；E项，灵渠首次沟通长江（湘江）与珠江（漓江）两大水系，沟通的是长江与珠江水系。","figures":[]},{"no":144,"type":"multi","q":"金沙江下游梯级水电开发工程建成的四座梯级水电站是（ ）。","opt":["A.乌东德","B.白鹤滩","C.溪洛渡","D.向家坝","E.龙羊峡"],"ans":"ABCD","analysis":"金沙江下游梯级水电开发工程共建成乌东德、白鹤滩、溪洛渡、向家坝四座梯级水电站，总装机容量相当于两个三峡工程，是我国西电东送项目的重要支撑。\nE项，龙羊峡水电站位于黄河上游，不在金沙江下游梯级水电站之列。","figures":[]},{"no":145,"type":"multi","q":"从塔的造型看，主要类型有（ ）。","opt":["A.楼阁式塔","B.密檐式塔","C.覆钵式塔","D.金刚宝座塔","E.经幢式塔"],"ans":"ABCD","analysis":"从塔的造型看，主要有楼阁式塔、密檐式塔、覆钵式塔、金刚宝座塔等。楼阁式塔为数众多、历史最久，形式也最为壮观。\nE项，经幢式塔不在塔的主要类型之列。","figures":[]},{"no":146,"type":"multi","q":"关于明清科举考试，下列说法正确的有（ ）。","opt":["A.一般每三年举行一次，每次两轮","B.乡试又称“秋闱”，考取者称为“举人”","C.会试又称“春闱”，由礼部主持","D.殿试排名分三等，称“三甲”","E.一甲前三名分别称状元、榜眼、探花"],"ans":"ABCDE","analysis":"明清科举考试制度固定，一般每三年举行一次，每次两轮。秋天在省城举行，叫“乡试”（又称“秋闱”），各府州的“生员”（或称“庠生”“秀才”）参加，考取者称为“举人”。次年春天在京师举行，叫“会试”（又称“春闱”），由礼部主持，举人才有资格参加考试，考中者称为“贡士”。排名分三等，称“三甲”，一甲取前三名，分别称为“状元”“榜眼”“探花”，赐予“进士及第”称号；二甲和三甲人数较多，分别赐予“进士出身”和“同进士出身”称号。考生如果能够在两轮三次考试中都获得第一名，即“乡试”第一名“解元”“会试”第一名“会元”“殿试”第一名“状元”，史称“连中三元”。","figures":[]},{"no":147,"type":"multi","q":"下列关于新西兰的表述，正确的有（ ）。","opt":["A.“世界边缘的国家”","B.是世界上最大的鹿茸生产国和出口国","C.羊肉、奶制品和粗羊毛的出口值皆为世界第一","D.惠灵顿是世界上最南端的首都","E.基督城是新西兰的“探险之都”"],"ans":"ABCD","analysis":"新西兰，被誉为“世界边缘的国家”。是世界上最年轻的移民国家之一，也是个高度发达的资本主义国家，是世界上最大的鹿茸生产国和出口国，羊肉、奶制品和粗羊毛的出口值皆为世界第一。惠灵顿是世界上最南端的首都，有“风城”之称。\nE项，基督城是英国之外最像英国的城市，也是进入南极的门户；新西兰的“探险之都”是皇后镇。","figures":[]},{"no":148,"type":"multi","q":"天津独乐寺以\"三绝\"享誉中外，这\"三绝\"包括（ ）。","opt":["A.古建","B.泥塑","C.壁画","D.石刻","E.砖雕"],"ans":"ABC","analysis":"独乐寺以古建、泥塑、壁画\"三绝\"享誉中外。\nD项石刻不在\"三绝\"之列。","figures":[]},{"no":149,"type":"multi","q":"下列关于苏州的说法，正确的有（ ）。","opt":["A.拥有两千余年建城史","B.是大运河沿线城市中唯一以古城概念申遗的城市","C.保持着\"水陆并行、河街相邻\"的双棋盘格局","D.有\"人间天堂\"的美誉","E.古称金陵"],"ans":"ABCD","analysis":"本题全部正确。苏州古称姑苏、平江，平江、山塘历史街区分别被评为中国历史文化名街和中国最受欢迎的旅游历史文化名街。","figures":[]},{"no":150,"type":"multi","q":"湖南红色旅游最具代表性的红色研学精品线路有（ ）等。","opt":["A.\"我的韶山行\"","B.\"领袖元帅\"","C.\"不忘初心，传承长征精神\"","D.\"一粒种子改变世界\"","E.\"重走长征路\""],"ans":"ABCD","analysis":"本题全部正确。湖南以\"十步之内，必有芳草\"的红色底蕴，构建起以韶山为核心、红三角为极核的红色旅游格局。","figures":[]},{"no":151,"type":"multi","q":"被称为西藏饮食\"四宝\"的是（ ）。","opt":["A.酥油","B.茶叶","C.糌粑","D.牛羊肉","E.青稞"],"ans":"ABCD","analysis":"本题全部正确。酥油茶是藏族人民不可缺少的饮料，青稞酒度数较低，是喜庆过节所必备。","figures":[]},{"no":152,"type":"multi","q":"黑龙江著名冰雪旅游项目有（ ）。","opt":["A.哈尔滨冰雪大世界游园会","B.牡丹江雪乡","C.漠河北极村冰雪游","D.亚布力滑雪场","E.太阳岛雪博会"],"ans":"ABC","analysis":"著名冰雪旅游项目有哈尔滨冰雪大世界游园会、牡丹江雪乡和漠河北极村冰雪游等。\nD项亚布力滑雪场驰名中外，属滑雪资源（与冰雪大世界、雪乡并称黑龙江\"最早开发利用冰雪资源\"的代表），题目问\"旅游项目\"时以教材列举的\"冰雪大世界、雪乡、漠河北极村冰雪游\"为准确答案；注意亚布力滑雪场位于尚志市，属滑雪区域范畴。","figures":[]},{"no":153,"type":"multi","q":"河南的寻根祭祖盛典有（ ）。","opt":["A.淮阳太昊伏羲祭典","B.新郑黄帝拜祖祭典","C.洛阳牡丹文化节","D.开封菊花文化节","E.开封清明文化节"],"ans":"AB","analysis":"河南有淮阳太昊伏羲祭典、新郑黄帝拜祖祭典等寻根祭祖盛典，体现\"老家河南\"根亲文化。CD项是赏花节庆，不属于祭祖盛典，易误选。","figures":[]},{"no":154,"type":"multi","q":"根据发音谐音，香港人最受欢迎的数字有（ ）。","opt":["A.\"3\"\"8\"（与粤语\"升\"\"发\"谐音）","B.\"6\"\"9\"（与\"禄\"\"久\"谐音）","C.\"4\"","D.\"7\"","E.\"5\""],"ans":"AB","analysis":"\"3\"\"8\"与粤语\"升\"\"发\"谐音，\"6\"\"9\"与\"禄\"\"久\"谐音，最受欢迎；忌讳\"4\"。","figures":[]},{"no":155,"type":"multi","q":"下列省级单位中，（ ）联合申报了世界文化非物质遗产中国桑丝技艺。","opt":["A.浙江省","B.四川省","C.江苏省","D.湖南省","E.福建省"],"ans":"ABC","analysis":"中国传统桑蚕丝技艺由浙江、江苏、四川三省联合申报。","figures":[]},{"no":156,"type":"multi","q":"下列大院中，属于山西晋中大院民俗文化组成部分的有（ ）。","opt":["A.祁县乔家大院","B.祁县渠家大院","C.灵石王家大院","D.太谷三多堂","E.太谷曹家大院"],"ans":"ABCD","analysis":"本题全部正确。因拍摄《大红灯笼高高挂》而闻名的祁县乔家大院，加上祁县渠家大院、灵石王家大院、太谷三多堂等，共同组成山西晋中的大院民俗文化。","figures":[]},{"no":157,"type":"multi","q":"下列关于安徽\"之乡\"称号对应正确的有（ ）。","opt":["A.歙县——枇杷之乡","B.宁国市——山核桃之乡","C.砀山——酥梨之乡","D.祁门——红茶之乡","E.泾县——宣纸之乡"],"ans":"ABCD","analysis":"本题全部正确。歙县有上千年的枇杷种植史；宁国市是\"山核桃之乡\"；砀山是\"酥梨之乡\"；祁门是\"红茶之乡\"。","figures":[]},{"no":158,"type":"multi","q":"广西民族风情旅游不可不看的\"四绝\"是（ ）。","opt":["A.壮族的歌","B.瑶族的舞","C.苗族的节","D.侗族的楼和桥","E.汉族的节"],"ans":"ABCD","analysis":"本题全部正确。\"壮族的歌、瑶族的舞、苗族的节、侗族的楼和桥\"并称广西民族风情旅游\"四绝\"。","figures":[]},{"no":159,"type":"multi","q":"被誉为\"甘肃十大特色美食\"的有（ ）等。","opt":["A.兰州清汤牛肉面","B.羊肉泡馍","C.陇西腊肉","D.静宁烧鸡","E.酿皮子"],"ans":"ABCDE","analysis":"本题全部正确。甘肃十大特色美食还有浆水面、臊子面、手抓羊肉、靖远羊羔肉、藏包等。","figures":[]},{"no":160,"type":"multi","q":"北京地方菜的经典名菜有（ ）。","opt":["A.北京烤鸭","B.涮羊肉","C.老北京烤肉","D.京酱肉丝","E.北京炸酱面"],"ans":"ABCD","analysis":"本题全部正确。北京烤鸭、涮羊肉、老北京烤肉、京酱肉丝是北京地方菜的经典名菜。富华斋饽饽铺、稻香村、百年义利、大顺斋等都是北京的知名食品品牌。\n【原卷提示】参考答案标注为 ABCD，原解析的“本题全部正确”与之不一致。本页面按参考答案 ABCD 判分。","figures":[]},{"no":161,"type":"multi","q":"上海聚焦\"五个中心\"建设，\"五个中心\"是指（ ）。","opt":["A.国际经济中心","B.金融中心","C.贸易中心","D.航运中心","E.科技创新中心"],"ans":"ABCDE","analysis":"本题全部正确。\"五个中心\"即国际经济中心、金融中心、贸易中心、航运中心、科技创新中心。","figures":[]},{"no":162,"type":"multi","q":"下列关于海口的说法，正确的有（ ）。","opt":["A.别称\"椰城\"","B.\"海口\"一名最早出现在宋代","C.是海南省省会","D.已有900多年的历史","E.有\"鹿城\"之称"],"ans":"ABCD","analysis":"海口别称\"椰城，\"海口\"一名最早出现在宋代，已有900多年的历史，是海南省省会。\nE项错误，\"鹿城\"是三亚的别称。","figures":[]},{"no":163,"type":"multi","q":"下列关于福建交通的说法，正确的有（ ）。","opt":["A.所有设区市实现高速铁路环线贯通","B.全国第一个市市通高铁的省份","C.开通全国首条\"冰上丝绸之路\"福州港至欧洲快速航线","D.拥有厦门港、福州港、湄洲湾3个亿吨大港","E.陆地海岸线长度居全国第一"],"ans":"ABCD","analysis":"福建所有设区市实现高速铁路环线贯通，是全国第一个市市通高铁的省份；开通全国首条\"冰上丝绸之路\"福州港经北极至欧洲快速航线；拥有厦门港、福州港、湄洲湾3个亿吨大港。\nE项错误，福建陆地海岸线长度位居全国第二。","figures":[]},{"no":164,"type":"multi","q":"曲阜\"三孔\"是指（ ）。","opt":["A.孔庙","B.孔府","C.孔林","D.孔桥","E.孔桥"],"ans":"ABC","analysis":"曲阜\"三孔\"指孔庙、孔府、孔林，是世界文化遗产。\n【原卷提示】D、E 两项在题目卷和解析卷中均为“孔桥”，本页面按原卷保留。","figures":[]},{"no":165,"type":"multi","q":"下列属于吉林世界遗产的有（ ）。","opt":["A.沈阳故宫","B.长城（吉林段）","C.元上都遗址","D.中国高句丽王城、王陵及贵族墓葬","E.九寨沟"],"ans":"BD","analysis":"吉林文化遗产2项：长城（吉林段）、中国高句丽王城、王陵及贵族墓葬。沈阳故宫位于辽宁，元上都遗址位于内蒙古，九寨沟为四川世界自然遗产。","figures":[]}];


const STORAGE_KEY = 'guide-exam-lei2-ke34-2026-v1';
const byNo = new Map(questions.map(q=>[q.no,q]));
let idx=0, mode='all', pool=questions.map(q=>q.no), records={}, wrongSet=new Set();
const el=id=>document.getElementById(id);
function normalized(values){return [...new Set(values)].sort().join('');}
function current(){return byNo.get(pool[idx]);}
function persist(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,currentNo:pool[idx]??null,mode,pool,records,wrong:[...wrongSet]}));
        el('storageStatus').textContent='已自动保存到本机浏览器。请使用同一浏览器打开此文件；清理浏览器数据会删除记录。';
    }catch(e){el('storageStatus').textContent='浏览器未能保存记录，请检查是否禁用了本地存储。当前页面仍可正常答题。';}
}
function restore(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const s=JSON.parse(raw);
        if(s.version!==2)throw new Error('version');
        for(const q of questions){
            const r=s.records?.[q.no];
            if(!r||!Array.isArray(r.selected))continue;
            const selected=[...new Set(r.selected.filter(v=>q.opt.some(o=>o[0]===v)))];
            if(q.type!=='multi'&&selected.length>1)continue;
            records[q.no]={selected,submitted:r.submitted===true&&selected.length>0};
        }
        wrongSet=new Set((Array.isArray(s.wrong)?s.wrong:[]).filter(n=>byNo.has(n)));
        mode=s.mode==='wrong'?'wrong':'all';
        pool=mode==='wrong'?[...new Set((Array.isArray(s.pool)?s.pool:[]).filter(n=>byNo.has(n)&&wrongSet.has(n)))]:questions.map(q=>q.no);
        if(mode==='wrong'&&!pool.length)pool=[...wrongSet];
        idx=Math.max(0,pool.indexOf(s.currentNo));
    }catch(e){el('storageStatus').textContent='原保存记录无法读取，本次从头开始。';}
}
function render(){
    const item=current();
    let right=0,wrong=0;
    for(const q of questions){const r=records[q.no];if(r?.submitted){normalized(r.selected)===normalized(q.ans.split(''))?right++:wrong++;}}
    el('r').textContent=right;el('w').textContent=wrong;
    el('cur').textContent=pool.length?idx+1:0;el('total').textContent=pool.length;
    el('wrongBtn').textContent='刷错题（'+wrongSet.size+'）';
    el('allBtn').disabled=mode==='all';el('wrongBtn').disabled=mode==='wrong';
    el('modeHint').textContent=(mode==='wrong'?'错题练习':'全部题目')+' · 已判分 '+(right+wrong)+' / '+questions.length+' 题。错题答对仍保留，可手动移出。跳转填写原题号。';
    el('prevBtn').disabled=!pool.length||idx===0;el('nextBtn').disabled=!pool.length||idx===pool.length-1;
    el('removeBtn').disabled=!item||!wrongSet.has(item.no);
    el('optBox').replaceChildren();el('ansDiv').style.display='none';
    el('submitBtn').hidden=!item||item.type!=='multi';
    if(!item){el('q').textContent='错题本为空，继续做题后，答错的题会自动加入。';el('answerHint').textContent='点击“全部题目”继续练习。';return;}
    const r=records[item.no]||{selected:[],submitted:false};
    el('q').textContent='【'+item.no+' · '+({judge:'判断题',single:'单选题',multi:'多选题'}[item.type])+'】'+item.q;
    el('answerHint').textContent=item.type!=='multi'?'选择后立即判断对错并显示解析。':'选好后点击“提交答案”，才会判断对错并显示解析。';
    el('submitBtn').disabled=r.submitted||!r.selected.length;
    for(const o of item.opt){
        const val=o[0],label=document.createElement('label'),input=document.createElement('input');
        label.className='opt';input.type=item.type==='multi'?'checkbox':'radio';input.name='answer';input.value=val;input.checked=r.selected.includes(val);
        if(input.checked)label.classList.add('selected');
        if(r.submitted&&item.ans.includes(val))label.classList.add('correct');
        if(r.submitted&&input.checked&&!item.ans.includes(val))label.classList.add('incorrect');
        input.addEventListener('change',save);label.append(input,document.createTextNode(o));el('optBox').append(label);
    }
    if(r.submitted){
        const ok=normalized(r.selected)===normalized(item.ans.split(''));
        el('ansDiv').style.display='block';el('result').textContent=ok?'✅ 回答正确':'❌ 回答错误';el('result').style.color=ok?'#18733b':'#c23232';
        el('stdAns').textContent=item.opt.filter(o=>item.ans.includes(o[0])).join('；');el('analysisTxt').textContent=item.analysis;
        const box=el('figureBox');box.replaceChildren();
        for(const [i,src] of (item.figures||[]).entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题解析补充图 '+(i+1);img.loading='lazy';box.append(img);}
    }
}
function save(){
    const item=current();if(!item)return;
    records[item.no]={selected:Array.from(el('optBox').querySelectorAll('input:checked'),n=>n.value),submitted:false};
    if(item.type!=='multi')submitAnswer();else{persist();render();}
}
function submitAnswer(){
    const item=current(),r=item&&records[item.no];if(!r?.selected.length)return;
    r.submitted=true;
    if(normalized(r.selected)!==normalized(item.ans.split('')))wrongSet.add(item.no);
    persist();render();
}
function prev(){if(idx>0){idx--;persist();render();}}
function next(){if(idx<pool.length-1){idx++;persist();render();}}
function clearSel(){const item=current();if(!item)return;records[item.no]={selected:[],submitted:false};persist();render();}
function goJump(){
    const n=Number(el('goto').value),pos=pool.indexOf(n);
    if(pos<0){el('answerHint').textContent=mode==='wrong'?'请填写当前错题本中的原题号。':'请输入 1 至 '+questions.length+' 的整数题号。';return;}
    idx=pos;persist();render();
}
function setMode(value){
    const no=current()?.no;mode=value;pool=mode==='wrong'?questions.filter(q=>wrongSet.has(q.no)).map(q=>q.no):questions.map(q=>q.no);
    idx=Math.max(0,pool.indexOf(no));persist();render();
}
function removeWrong(){
    const item=current();if(!item)return;wrongSet.delete(item.no);
    if(mode==='wrong'){pool=pool.filter(n=>n!==item.no);idx=Math.max(0,Math.min(idx,pool.length-1));}
    persist();render();
}
el('goto').addEventListener('keydown',e=>{if(e.key==='Enter')goJump();});

function progressSnapshot(){return {version:2,currentNo:pool[idx]??null,mode,pool:[...pool],records:JSON.parse(JSON.stringify(records)),wrong:[...wrongSet]};}
function backupPayload(){return {format:'guide-exam-progress',backupVersion:1,examId:STORAGE_KEY,exportedAt:new Date().toISOString(),questionCount:questions.length,state:progressSnapshot()};}
function validateBackup(data){
    if(!data||data.format!=='guide-exam-progress'||data.backupVersion!==1)throw new Error('这不是支持的刷题进度文件。');
    if(data.examId!==STORAGE_KEY||data.questionCount!==questions.length)throw new Error('这份进度不属于当前题库，请在对应题库中导入。');
    const s=data.state;
    if(!s||s.version!==2||!['all','wrong'].includes(s.mode)||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.pool)||!Array.isArray(s.wrong))throw new Error('进度文件内容不完整或已损坏。');
    const validNumbers=a=>a.every(n=>Number.isInteger(n)&&byNo.has(n))&&new Set(a).size===a.length;
    if(!validNumbers(s.pool)||!validNumbers(s.wrong))throw new Error('进度文件包含无效题号。');
    if(s.mode==='all'&&(s.pool.length!==questions.length||s.pool.some((n,i)=>n!==questions[i].no)))throw new Error('全部题目的顺序不正确。');
    if(s.mode==='wrong'&&s.pool.some(n=>!s.wrong.includes(n)))throw new Error('错题列表不一致。');
    if(s.pool.length?!s.pool.includes(s.currentNo):s.currentNo!==null)throw new Error('当前题号无效。');
    for(const [no,r] of Object.entries(s.records)){
        const q=byNo.get(Number(no));
        if(!q||String(q.no)!==no||!r||!Array.isArray(r.selected)||typeof r.submitted!=='boolean'||r.selected.some(v=>typeof v!=='string'||!q.opt.some(o=>o[0]===v))||new Set(r.selected).size!==r.selected.length||(q.type!=='multi'&&r.selected.length>1)||(r.submitted&&!r.selected.length))throw new Error('作答记录格式不正确。');
    }
    return JSON.parse(JSON.stringify(s));
}
function exportProgress(){
    try{
        const payload=backupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='雷2科三科四-做题进度-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        el('transferStatus').textContent='已请求下载进度文件。苹果手机请查看 Safari 下载列表或“文件”中的下载项，再把 JSON 文件传到另一设备。';
    }catch(e){el('transferStatus').textContent='导出失败：'+e.message;}
}
function applyBackup(data){
    const s=validateBackup(data);
    // Write successfully before changing the current session, so a storage failure preserves it.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    records={};wrongSet=new Set();idx=0;mode='all';pool=questions.map(q=>q.no);restore();render();
}
async function importProgressFile(event){
    const input=event.target,file=input.files?.[0];if(!file)return;
    try{
        if(file.size>5*1024*1024)throw new Error('文件过大，请选择导出的 JSON 进度文件，不要选择 HTML 题库。');
        const data=JSON.parse((await file.text()).replace(/^\uFEFF/,'')),s=validateBackup(data);
        const answered=Object.values(s.records).filter(r=>r.submitted).length;
        if(!confirm('即将导入：已判分 '+answered+' 题，错题 '+s.wrong.length+' 题。\n这会替换本设备当前题库的进度。建议先导出当前进度备份。\n确定导入吗？')){el('transferStatus').textContent='已取消导入，原进度保留。';return;}
        applyBackup(data);el('transferStatus').textContent='导入成功！已恢复作答、错题及所在题目，后续会继续自动保存到本设备。';
    }catch(e){el('transferStatus').textContent='导入失败，原进度保留：'+e.message;}
    finally{input.value='';}
}
el('progressFile').addEventListener('change',importProgressFile);

restore();render();
</script>
</body>
</html>
