<div class="card">
    <h2>LDD押题第6卷科一科二</h2><p class="hint">判断40题 / 单选90题 / 多选35题 · 电脑、手机、平板通用</p>
    <p class="hint">计分规则：判断、单选每题 0.5 分，多选每题 1 分；错选、少选、多选均不得分。满分 100 分，未提交的多选题暂不计分。</p>
    <div class="info">
        <div><b>得分：<span id="score">0</span> / <span id="scoreMax">100</span> 分</b></div>
        <div>已判分：<span id="gradedCount">0</span> / <span id="gradableCount">165</span></div>
        <div>题号跳转：<input id="goto" type="number" min="1" max="165" step="1" inputmode="numeric" enterkeyhint="go" aria-label="跳转到原题号"><button onclick="goJump()">跳转</button></div>
        <div>当前：<span id="cur">1</span> / <span id="total">0</span></div>
        <div>✅答对：<span id="r">0</span></div>
        <div>❌答错：<span id="w">0</span></div>
    </div>


    <div class="btns"><button id="allBtn" onclick="setMode('all')">全部题目</button><button id="wrongBtn" onclick="setMode('wrong')">刷错题（0）</button><button id="removeBtn" class="secondary" onclick="removeWrong()">移出错题本</button></div>

<script>
// 通用题库数据，由构建器写入。
const questions = [{"no":1,"type":"judge","q":"根据《中华人民共和国宪法》的规定，国家的根本任务是沿着中国特色社会主义道路，集中力量进行社会主义现代化建设。","opt":["A.对","B.错"],"ans":"A","analysis":"宪法序言明确指出国家的根本任务：“国家的根本任务是，沿着中国特色社会主义道路，集中力量进行社会主义现代化建设。”","figures":[],"questionImages":[]},{"no":2,"type":"judge","q":"《旅游法》规定，旅游者的要求履约权指旅游者有权要求旅游经营者按照约定提供产品和服务。","opt":["A.对","B.错"],"ans":"A","analysis":"《旅游法》第9条规定，旅游者有权要求旅游经营者按照约定提供产品和服务。故本题正确。","figures":[],"questionImages":[]},{"no":3,"type":"judge","q":"被撤销的民事法律行为只有被撤销后才没有法律约束力。","opt":["A.对","B.错"],"ans":"B","analysis":"本题表述错误。《民法典》第155条规定，无效的或者被撤销的民事法律行为自始没有法律约束力。","figures":[],"questionImages":[]},{"no":4,"type":"judge","q":"信用修复应当通过全国文化和旅游市场信用管理系统进行。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":5,"type":"judge","q":"违反治安管理行为人自愿向公安机关如实陈述自己的违法行为，承认违法事实，愿意接受处罚的，应当依法从宽处理。","opt":["A.对","B.错"],"ans":"B","analysis":"题干表述错误在“应当”。依据第21条（2025年修订新增），违反治安管理行为人自愿如实陈述违法行为、承认违法事实、愿意接受处罚的，可以依法从宽处理。","figures":[],"questionImages":[]},{"no":6,"type":"judge","q":"根据《旅游安全管理办法》的规定，旅行社组织出境旅游，应当制作安全信息卡，安全信息卡使用中文和英文填写。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应是“中文和目的地官方语言（或者英文）”。","figures":[],"questionImages":[]},{"no":7,"type":"judge","q":"根据《安全生产法》，因生产安全事故受到损害的从业人员，在依法享有工伤保险后，无权依照有关民事法律提出赔偿要求。","opt":["A.对","B.错"],"ans":"B","analysis":"解析根据《安全生产法》第56条规定，因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。因此，该判断题的说法是错误的。","figures":[],"questionImages":[]},{"no":8,"type":"judge","q":"根据《中华人民共和国民用航空法》的规定，托运行李发生损失的，旅客至迟应当自收到托运行李之日起14日内提出异议；货物发生损失的，至迟应当自收到货物之日起7日内提出。","opt":["A.对","B.错"],"ans":"B","analysis":"第142条，托运行李发生损失的，至迟应当自收到托运行李之日起七日内提出；货物发生损失的，至迟应当自收到货物之日起十四日内提出。题干将异议期限颠倒：托运行李损失异议期为收到托运行李之日起7日内，货物损失异议期为收到货物之日起14日内，故错误。","figures":[],"questionImages":[]},{"no":9,"type":"judge","q":"根据《风景名胜区条例》，刻划、涂污、损坏国家保护的文物、名胜古迹，仅适用本条例罚款处罚，不再适用治安管理处罚法。","opt":["A.对","B.错"],"ans":"B","analysis":"《风景名胜区条例》第四十四条：在景物、设施上刻划、涂污或者在风景名胜区内乱扔垃圾的，责令恢复原状或者采取其他补救措施，处50元的罚款；刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，按照治安管理处罚法的有关规定予以处罚；构成犯罪的，依法追究刑事责任。刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，应按照治安管理处罚法的有关规定予以处罚，并非只适用罚款，故判断为错。","figures":[],"questionImages":[]},{"no":10,"type":"judge","q":"珍贵文物中的孤品和易损品，禁止出境展览。","opt":["A.对","B.错"],"ans":"B","analysis":"一级文物中的孤品和易损品，禁止出境展览。可移动文物，分为珍贵文物和一般文物；珍贵文物分为一级文物、二级文物、三级文物。注意：一级文物的是珍贵文物中级别最高的。","figures":[],"questionImages":[]},{"no":11,"type":"judge","q":"根据《出境入境管理法》的规定，弄虚作假骗取签证的，并处5000元以上2万元以下罚款。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误。《出境入境管理法》第73条规定：“弄虚作假骗取签证、停留居留证件等出境入境证件处2000元以上5000元以下罚款；情节严重的，处10以上15日以下拘留，并处5000元以上2万元以下罚款”。因此，题干中“并处5000元以上2万元以下罚款”的表述不准确，该罚款幅度仅适用于“情节严重”的情形，一般情形下应为2000元以上5000元以下罚款。“情节严重”通常指骗取多张证件、组织他人骗取证件、从事非法活动等行为。","figures":[],"questionImages":[]},{"no":12,"type":"judge","q":"人民当家做主是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。","opt":["A.对","B.错"],"ans":"B","analysis":"党的领导是中国特色社会主义最本质的特征，是社会主义法治最根本的保证。","figures":[],"questionImages":[]},{"no":13,"type":"judge","q":"依据习近平法治思想，坚持以人民为中心，强调法治为了国家、依靠政府、造福人民、保护人民。","opt":["A.对","B.错"],"ans":"B","analysis":"坚持以人民为中心。坚持法治为了人民、依靠人民、造福人民、保护人民。题干将“为了人民、依靠人民”偷换为“为了国家、依靠政府”，与原文表述不符，故本题错误。","figures":[],"questionImages":[]},{"no":14,"type":"judge","q":"下半旗时，应当先将国旗升至杆顶，然后降至旗顶与杆顶之间的距离为旗杆全长的三分之一处；降下时从此处缓缓降下。","opt":["A.对","B.错"],"ans":"B","analysis":"下半旗时，应当先将国旗升至杆顶，然后降至旗顶与杆顶之间的距离为旗杆全长的三分之一处；降下时，应当先将国旗升至杆顶，然后再降下。","figures":[],"questionImages":[]},{"no":15,"type":"judge","q":"《英雄烈士保护法》规定，对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为，仅英雄烈士的近亲属可以依法向人民法院提起诉讼。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，错在“仅英雄烈士的近亲属可以依法向人民法院提起诉讼”。《英雄烈士保护法》第25条规定：“对侵害英雄烈士的姓名、肖像、名誉、荣誉的行为，英雄烈士的近亲属可以依法向人民法院提起诉讼。”该条款赋予近亲属直接诉讼权，便于及时维护英烈人格权益。近亲属包括配偶、子女、父母、兄弟姐妹等。若近亲属不提起诉讼，检察机关可依法提起公益诉讼（第25条），形成双重保障。","figures":[],"questionImages":[]},{"no":16,"type":"judge","q":"《旅游强国建设“十五五”规划》提出，增强旅游国际吸引力影响力，要开展双多边旅游交流合作，深化与国际组织合作，健全国家旅游对外推广体系。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。增强旅游国际吸引力影响力还包括加强中国旅游品牌整体设计，深入开展“你好！中国”国家旅游形象推广。","figures":[],"questionImages":[]},{"no":17,"type":"judge","q":"国家统计局初步核算，2025年我国国内生产总值为1401879亿元，按不变价格计算比上年增长5.0%。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。2026年1月19日，国家统计局发布数据：2025年全年国内生产总值1401879亿元，按不变价格计算比上年增长5.0%，经济社会发展主要目标任务圆满实现，“十四五”胜利收官。“十四五”期间，中国经济总量连续跨越110万亿元、120万亿元、130万亿元、140万亿元四个关口。","figures":[],"questionImages":[]},{"no":18,"type":"judge","q":"2026年10月，党的二十届五中全会审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，“十五五”规划建议由党的二十届四中全会审议通过。2026年10月，党的二十届五中全会在北京举行，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。","figures":[],"questionImages":[]},{"no":19,"type":"judge","q":"2026年5月24日，神舟二十三号载人飞船发射取得圆满成功，来自香港的载荷专家黎家盈是我国首位进入太空的香港籍航天员。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。2026年5月24日23时08分，神舟二十三号载人飞船在酒泉卫星发射中心发射成功，飞行乘组由朱杨柱、张志远、黎家盈组成，朱杨柱担任指令长，是我国首位担任指令长的航天飞行工程师。来自香港的黎家盈任载荷专家。黎家盈是我国第四批航天员中首位执行飞行任务的航天员、国家面向港澳地区选拔的首位女性载荷专家，也是我国首位进入太空的香港籍航天员。\n\n题源校对：试卷写作“神舟十三号”，解析题干和正文均为“神舟二十三号”。本页采用解析题干及原答案。","figures":[],"questionImages":[]},{"no":20,"type":"judge","q":"《中华人民共和国国家公园法》于2025年9月12日由十四届全国人大常委会第十七次会议通过，自2025年11月1日起施行。","opt":["A.对","B.错"],"ans":"B","analysis":"本题说法错误，应为“2026年1月1日”。《中华人民共和国国家公园法》由十四届全国人大常委会第十七次会议于2025年9月12日通过，自2026年1月1日起施行，共7章63条。注意区分：《中华人民共和国法治宣传教育法》同为2025年9月12日通过，但自2025年11月1日起施行。","figures":[],"questionImages":[]},{"no":21,"type":"judge","q":"1892年，托马斯·库克发明了旅行支票。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":22,"type":"judge","q":"1999年，《中国公民自费出国旅游管理暂行办法》发布，开启出境旅游，确立旅行社入境、国内、出境三大业务。","opt":["A.对","B.错"],"ans":"B","analysis":"1997年：《中国公民自费出国旅游管理暂行办法》发布，开启出境旅游，确立旅行社入境、国内、出境三大业务。","figures":[],"questionImages":[]},{"no":23,"type":"judge","q":"申请参加导游等级考核的人员，对本人考核结果有异议的，可以自结果发布之日起7个工作日内，通过省级文化和旅游主管部门向国务院文化和旅游主管部门提出复核申请。","opt":["A.对","B.错"],"ans":"B","analysis":"申请参加导游等级考核的人员，对本人考核结果有异议的，可以自结果发布之日起5个工作日内，通过省级文化和旅游主管部门向国务院文化和旅游主管部门提出复核申请。","figures":[],"questionImages":[]},{"no":24,"type":"judge","q":"地陪可以根据旅游者的民族特征、衣着、组团社的徽记、人数等进行分析判断，主动迎接旅游团。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":25,"type":"judge","q":"参观游览活动是旅游产品的核心，也是导游服务工作的中心环节。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":26,"type":"judge","q":"旅游者坚持要求安排行程计划之外的购物活动且影响到原计划的执行时，领队应要求旅游者签订旅行社规定制式的行程变更确认单。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":27,"type":"judge","q":"导游的微笑能够传达出友善之意，是一种通过表情、动作、姿态等无声方式进行语义表达和信息传递的体态语言。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":28,"type":"judge","q":"如果旅行期间遭遇泥石流，要立即攀爬到最近的大树上躲避。","opt":["A.对","B.错"],"ans":"B","analysis":"若遭遇泥石流，可就近选择林木密集地带逃生，但不要攀爬到树上躲避。","figures":[],"questionImages":[]},{"no":29,"type":"judge","q":"“太湖石，又名洞庭石、假山石，因盛产于太湖而得名，以奇特造型著称，其独特个性可提炼为四个字：‘瘦、皱、漏、透’。”这句话体现的是讲解法中的突出重点法。","opt":["A.对","B.错"],"ans":"B","analysis":"“太湖石，又名洞庭石、假山石，因盛产于太湖而得名，以奇特造型著称，其独特个性可提炼为四个字：‘瘦、皱、漏、透’。”这句话是讲解法中的画龙点睛法。","figures":[],"questionImages":[]},{"no":30,"type":"judge","q":"针对老年游客，每天的游览项目不宜过多。尽量选择景点内具有代表性的点位参观，少而精，慢行细看，让老年人有足够的时间欣赏和休息。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":31,"type":"judge","q":"导游工作临近结束时，可借用近因效应。若旅游者游玩期间有不愉快，可借此扭转消极看法；若服务顺利，则可强化效果，吸引回头客。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":32,"type":"judge","q":"领队在游客和相关机构发生纠纷时，应及时处理、正确疏导，引导游客理性维权、化解矛盾。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":33,"type":"judge","q":"对于特殊餐饮要求，无论是旅游合同事先约定，还是旅游者临时提出，导游都应积极想办法落实。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":34,"type":"judge","q":"因不可抗力或旅游经营者已尽合理注意义务仍不能避免的事件，影响旅游行程而需要变更合同时，导游应向旅游者做好解释工作，及时将旅游者的意见反馈给旅行社，并按旅行社的安排执行。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":35,"type":"judge","q":"若在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险。迅速蹲下或坐下，降低身体重心，双手护住头部，保持身体稳定，防止因地面晃动而摔倒受伤。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":36,"type":"judge","q":"被地震压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力，迅速通过喊话、敲击让救援人员听到，尽快脱离险境。","opt":["A.对","B.错"],"ans":"B","analysis":"被压埋人员务必保持心理镇定，坚定自救信念，鼓起勇气和毅力。避免出现睡觉、急躁、哭喊、唱歌或盲目行动等消耗体力的行为，应合理分配体力，尽可能延长生存时间。","figures":[],"questionImages":[]},{"no":37,"type":"judge","q":"入境人员携带外币现钞入境，超过等值10000美元的应当向海关书面申报。","opt":["A.对","B.错"],"ans":"B","analysis":"入境人员携带外币现钞入境，超过等值5000美元的应当向海关书面申报。","figures":[],"questionImages":[]},{"no":38,"type":"judge","q":"国内航班一般在离站前30分钟关闭值机柜台。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":39,"type":"judge","q":"飞机在起飞或者降落时不允许使用充电宝充电，但是飞行平稳时可以充电。","opt":["A.对","B.错"],"ans":"B","analysis":"飞行中使用限制：不得在飞行过程中使用充电宝充电；有启动开关的充电宝：飞行中应始终关闭。","figures":[],"questionImages":[]},{"no":40,"type":"judge","q":"在中国境内，禁止外汇流通、使用、质押，禁止私自买卖外汇，禁止以任何形式进行套汇、炒汇、逃汇。","opt":["A.对","B.错"],"ans":"A","analysis":"本题说法正确。","figures":[],"questionImages":[]},{"no":41,"type":"single","q":"2026年美加墨世界杯决赛中，夺得冠军的是（）。","opt":["A.阿根廷队","B.英格兰队","C.西班牙队","D.法国队"],"ans":"C","analysis":"当地时间2026年7月19日，在美加墨世界杯决赛中，西班牙队凭借费兰·托雷斯在加时赛的进球，以1：0战胜卫冕冠军阿根廷队，时隔16年第二次夺得世界杯冠军。西班牙队本届赛事仅失一球，创造世界杯冠军球队单届最少失球纪录；英格兰队在季军战中击败法国队获得季军。","figures":[],"questionImages":[]},{"no":42,"type":"single","q":"根据《中华人民共和国宪法》的规定，我国的根本制度是（）。","opt":["A.人民代表大会制度","B.社会主义制度","C.民族区域自治制度","D.基层群众自治制度"],"ans":"B","analysis":"宪法第1条规定“社会主义制度是中华人民共和国的根本制度”，社会主义制度是宪法在我国制度体系中确定的最。A项错误，人民代表大会制度是我国的根本政治制度，处于制度层级第二层；C项错误，民族区域自治制度属于基本政治制度；D项错误，基层群众自治制度属于基本政治制度。","figures":[],"questionImages":[]},{"no":43,"type":"single","q":"根据《中华人民共和国宪法》的规定，国有经济（全民所有制经济）在国民经济中的地位是（）。","opt":["A.主导力量","B.基础","C.主体","D.重要组成部分"],"ans":"A","analysis":"国有经济（全民所有制）是国民经济中的主导力量，国家保障国有经济的巩固和发展（第7条）。B项错误，我国经济制度的基础是生产资料的社会主义公有制，不是国有经济；C项错误，宪法规定“公有制为主体”，是指公有制经济整体为主体，并非国有经济为主体；D项错误，“重要组成部分”是宪法对非公有制经济的定位，国有经济的定位是国民经济的主导力量。","figures":[],"questionImages":[]},{"no":44,"type":"single","q":"根据《中华人民共和国宪法》的规定，行使国家立法权的机关是（）。","opt":["A.全国人民代表大会及其常务委员会","B.国务院","C.最高人民法院","D.地方各级人民代表大会"],"ans":"A","analysis":"全国人民代表大会及其常务委员会行使国家立法权（第58条）。选项辨析：B项错误，国务院是最高国家行政机关，可制定行政法规但不享有国家立法权；C项错误，最高人民法院是审判机关，不享有国家立法权；D项错误，地方各级人民代表大会是地方国家权力机关，不享有国家立法权，国家立法权由全国人民代表大会及其常务委员会行使。","figures":[],"questionImages":[]},{"no":45,"type":"single","q":"景区、住宿经营者将其部分经营项目或者场地交由他人从事住宿、餐饮、购物、游览、娱乐、旅游交通等经营的，对实际经营者的经营行为给旅游者造成的损害（）。","opt":["A.可以不承担法律责任","B.可以承担次要责任","C.应当承担补充责任","D.应当承担连带责任"],"ans":"D","analysis":"《中华人民共和国旅游法》第54条规定，景区、住宿经营者将其部分经营项目或者场地交由他人从事住宿、餐饮、购物、游览、娱乐、旅游交通等经营的，应当对实际经营者的经营行为给旅游者造成的损害承担连带责任。","figures":[],"questionImages":[]},{"no":46,"type":"single","q":"旅游者王某参加某旅行社组织的旅游活动，在旅游行程结束前要求解除合同。下列关于合同解除后退款的说法中，正确的是（）。","opt":["A.王某单方解除合同，无权要求旅行社退款","B.王某有权要求旅行社退还未参加行程的所有款项","C.组团社可以在扣除必要费用后，将余款退还给王某","D.组团社应当在扣除必要费用后，将余款退还给王某"],"ans":"D","analysis":"《旅游法》第65条规定，旅游行程结束前，旅游者解除合同的，组团社应当在扣除必要的费用后，将余款退还旅游者。","figures":[],"questionImages":[]},{"no":47,"type":"single","q":"关于监护人的职责，下列说法正确的是（）。","opt":["A.监护人可以按照自己的意愿处分被监护人的财产","B.监护人无需考虑被监护人的真实意愿即可做出决定","C.监护人应当按照最有利于被监护人的原则履行监护职责","D.监护人只需在被监护人需要时履行监护职责"],"ans":"C","analysis":"《民法典》第35条规定，监护人应当按照最有利于被监护人的原则履行监护职责。监护人除为维护被监护人利益外，不得处分被监护人的财产。\n\n题源校对：解析版漏列试卷的 C 项。本页保留试卷完整选项，C 项内容与解析正文一致。","figures":[],"questionImages":[]},{"no":48,"type":"single","q":"在参观某景区时，杨某在检票口与游客孙某发生口角，随团导游及景区检票人员没有发现并及时阻止，随着争吵升级，杨某殴打孙某。下列关于对孙某侵权责任承担的表述，正确的是（）。","opt":["A.杨某对孙某承担侵权责任，景区不承担责任","B.杨某对孙某承担侵权责任，旅行社不承担责任","C.杨某和景区对孙某承担连带赔偿责任","D.杨某对孙某承担侵权责任，景区、旅行社承担相应的补充责任"],"ans":"D","analysis":"法释（2010）13号第7条第2款规定，因第三人的行为造成旅游者人身损害、财产损失，由第三人承担责任；旅游经营者、旅游辅助服务者未尽安全保障义务，旅游者请求其承担相应补充责任的，人民法院应予支持。所以，此处杨某对孙某承担侵权责任，景区未尽到安全保障义务，需要承担对应的补充责任。如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员，其侵权责任还是要由管理人、组织者或者雇主承担。本题中，导游未尽到安全保障义务，需要由委派他的旅行社承担替代责任。","figures":[],"questionImages":[]},{"no":49,"type":"single","q":"根据《民法典》的规定，当事人就迟延履行约定违约金的，违约方支付违约金后，（）履行债务。","opt":["A.可以","B.还应当","C.无须","D.视实际情况"],"ans":"B","analysis":"《民法典》规定，当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。","figures":[],"questionImages":[]},{"no":50,"type":"single","q":"根据《民法典》相关规定，侵害他人财产的，财产损失按照（）的市场价格或者其他方式计算。","opt":["A.侵权人所在地","B.侵权人主张赔偿时","C.损失发生时","D.侵害行为的发生地"],"ans":"C","analysis":"《民法典》第1184条，侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。","figures":[],"questionImages":[]},{"no":51,"type":"single","q":"根据《民法典》相关规定，以下关于用人责任的说法中正确的是（）。","opt":["A.劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任","B.用人单位的工作人员因执行工作任务造成他人损害的，由工作人员承担侵权责任","C.个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由提供劳务一方承担侵权责任","D.提供劳务一方因劳务受到损害的，由接受劳务的一方承担赔偿责任"],"ans":"A","analysis":"《民法典》第1191条规定，用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任。劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；劳务派遣单位有过错的，承担相应的责任。宝典补充：《民法典》第1192条规定，个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任。提供劳务一方因劳务受到损害的，根据双方各自的过错承担相应的责任。","figures":[],"questionImages":[]},{"no":52,"type":"single","q":"《宪法》规定，（）是实现中国共产党领导的多党合作和政治协商制度的重要机构，是我国政治生活中发扬人民民主、联系人民群众的一种重要形式。","opt":["A.全国人民代表大会","B.中央政治局","C.人民政协","D.各级人民代表大会"],"ans":"C","analysis":"人民政协是实现中国共产党领导的多党合作和政治协商制度的重要机构，是我国政治生活中发扬人民民主，联系人民群众的一种重要形式。","figures":[],"questionImages":[]},{"no":53,"type":"single","q":"（）是有广泛代表性的统一战线组织。","opt":["A.人民代表大会制度","B.政治协商制度","C.中国人民政治协商会议","D.工农联盟"],"ans":"C","analysis":"中国人民政治协商会议是有广泛代表性的统一战线组织。","figures":[],"questionImages":[]},{"no":54,"type":"single","q":"悬挂的国徽由国家指定的企业统一制作，其直径的通用尺度为（）。","opt":["A.120厘米；100厘米；60厘米","B.100厘米；80厘米；60厘米","C.80厘米；60厘米；30厘米","D.120厘米；60厘米；30厘米"],"ans":"B","analysis":"悬挂的国徽由国家指定的企业统一制作，其直径的通用尺度为下列三种：100厘米；80厘米；60厘米。","figures":[],"questionImages":[]},{"no":55,"type":"single","q":"《中华人民共和国宪法》规定，公民的通信自由和通信秘密受法律的保护。除因国家安全或者追查刑事犯罪的需要，由公安机关或者（）依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","opt":["A.检察机关","B.监察机关","C.审判机关","D.国家安全机关"],"ans":"A","analysis":"《宪法》第40条，中华人民共和国公民的通信自由和通信秘密受法律的保护。除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","figures":[],"questionImages":[]},{"no":56,"type":"single","q":"《旅行社条例》规定，旅行社在经营活动中应当遵循自愿、平等、公平、（）的原则，提高服务质量，维护旅游者合法权益。","opt":["A.合法","B.公正","C.合理","D.诚信"],"ans":"D","analysis":"依据《旅行社条例》第4条规定，旅行社在经营活动中应当遵循自愿、平等、公平、诚信的原则，提高服务质量，维护旅游者的合法权益。","figures":[],"questionImages":[]},{"no":57,"type":"single","q":"依据《旅行社条例实施细则》，旅行社为组织旅游者出境旅游委派的领队，应当具有（）年以上旅行社业务经营、管理或者导游等相关从业经历。","opt":["A.1","B.2","C.3","D.5"],"ans":"B","analysis":"根据《旅行社条例实施细则》第31条规定，导游从事领队业务应当具有大专以上学历；取得相关语言水平测试等级证书或通过外语语种导游资格考试，但为赴港澳台地区旅游委派的领队除外；具有两年以上旅行社业务经营、管理或者导游等相关从业经历。","figures":[],"questionImages":[]},{"no":58,"type":"single","q":"在线旅游经营者未在全国旅游监管服务平台填报包价旅游合同有关信息的，由县级以上文化和旅游主管部门责令改正，给予警告；拒不改正的，处（）罚款。","opt":["A.10万元以下","B.5万元以下","C.3万元以下","D.1万元以下"],"ans":"D","analysis":"《在线旅游经营服务管理暂行规定》第35条规定，违反本规定第16条规定，未在全国旅游监管服务平台填报包价旅游合同有关信息的，由县级以上文化和旅游主管部门责令改正，给予警告；拒不改正的，处1万元以下罚款。","figures":[],"questionImages":[]},{"no":59,"type":"single","q":"根据《旅游法》《旅行社条例》的规定，以下关于旅行社义务的说法正确的是（）。","opt":["A.按旅游者要求提供服务","B.按市场规则收取旅游费用","C.提供的服务符合人身、财产安全需要","D.旅行社、导游人员、领队人员不得改变旅游合同"],"ans":"C","analysis":"旅行社的义务有：(1) 提供真实可靠的信息；(2) 按约定提供服务；(3) 提供的服务符合人身、财产安全需要；(4) 按规定收取旅游费用；(5) 聘用合格的导游和领队；(6) 旅行社应当与旅游者签订合同；(7) 旅行社、导游人员、领队人员不得擅自改变旅游合同。","figures":[],"questionImages":[]},{"no":60,"type":"single","q":"根据《导游管理办法》的规定，导游执业许可申请人隐瞒有关情况或者提供虚假材料申请取得导游人员资格证、导游证的，申请人在（）内不得再次申请该导游执业许可。","opt":["A.1年","B.2年","C.3年","D.5年"],"ans":"A","analysis":"《导游管理办法》第34条，导游执业许可申请人隐瞒有关情况或者提供虚假材料申请取得导游人员资格证、导游证，申请人在1年内不得再次申请该导游执业许可。","figures":[],"questionImages":[]},{"no":61,"type":"single","q":"依据《旅游法》的规定，导游在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的，处（）罚款，并暂扣或者吊销导游证。","opt":["A.处1000元以上3万元以下","B.处2000元以上2万元以下","C.处2000元以上1万元以下","D.处1000元以上1万元以下"],"ans":"B","analysis":"根据《旅游法》第100条规定，旅行社违反本法规定，有下列行为之一的，由旅游主管部门责令改正，处3万元以上30万元以下罚款，并责令停业整顿；造成旅游者滞留等严重后果的，吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处2000元以上2万元以下罚款，并暂扣或者吊销导游证：（一）在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的；（二）拒绝履行合同的；（三）未征得旅游者书面同意，委托其他旅行社履行包价旅游合同的。故B项正确。","figures":[],"questionImages":[]},{"no":62,"type":"single","q":"根据《导游人员管理条例》的规定，关于导游人员享有的权利，以下说法错误的是（）。","opt":["A.人身权利和自由。即导游人员进行导游活动时，人身自由不受非法限制和剥夺，人格尊严不受侵犯，名誉不受损害的权利","B.导游人员享有的调整或变更接待计划权利","C.起诉权。即导游人员对旅游行政行为不服时，依法享有向上一级行政管理机关申请复议权利，享有向人民法院提起诉讼的权利","D.定期接受培训的权利"],"ans":"D","analysis":"本题要求选出“说法错误”的选项。导游人员的法定权利包括：人身权、劳动报酬权、履行职务权、调整或变更接待计划权、申请复议权和起诉权。而“定期接受培训”是《导游人员管理条例》第11条规定的法定义务，非权利。因此，D项将“义务”误述为“权利”，是错误说法，为正确答案。A项正确：准确描述了《导游人员管理条例》第10条规定的“人身权”内容，包括人身自由、人格尊严、名誉保护。B项正确：依据《导游人员管理条例》第13条，导游在危及人身安全的紧急情形下，经多数游客同意并报告旅行社，可调整或变更计划，此为法定权利。C项正确：表述虽将“申请复议权”和“起诉权”合并为“起诉权”，但内容无误。导游对行政处罚不服，既可向上一级旅游主管部门申请复议，也可向人民法院提起诉讼。D项错误：《导游人员管理条例》第11条规定：“导游人员应当不断提高自身业务素质和职业技能。”《导游管理办法》也要求导游参加培训。这属于必须履行的义务，而非“可以主张的权利”。","figures":[],"questionImages":[]},{"no":63,"type":"single","q":"导游孙某进行导游活动时未佩戴导游证，根据《导游管理办法》的规定，他应当受到旅游行政部门的（）。","opt":["A.警告；拒不改正的，处500元以下的罚款","B.责令改正；拒不改正的，处500元以下的罚款","C.警告；拒不改正的，处1000元以下的罚款","D.责令改正；拒不改正的，处1000元以下的罚款"],"ans":"B","analysis":"根据《导游管理办法》第19条及第35条规定，导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件，如违反规定，由旅游行政部门责令改正；拒不改正的，处500元以下的罚款。因此，B项“责令改正；拒不改正的，处500元以下的罚款”完全符合法规，为正确选项。","figures":[],"questionImages":[]},{"no":64,"type":"single","q":"当经营者提供商品或者服务有欺诈行为时，根据《消费者权益保护法》的规定，以下说法正确的是（）。","opt":["A.双方通过协商确定增加赔偿的金额","B.增加赔偿的金额为消费者购买商品的价款3倍","C.增加赔偿的金额不足1000元的，为1000元","D.增加赔偿的金额为消费者接受服务的费用的10倍"],"ans":"B","analysis":"《消费者权益保护法》第55条规定，经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的3倍；增加赔偿的金额不足500元的，为500元。法律另有规定的，依照其规定。","figures":[],"questionImages":[]},{"no":65,"type":"single","q":"依据《治安管理处罚法》的规定，扰乱公共场所秩序，尚未造成严重后果的，处（）。","opt":["A.警告或者500元以下罚款","B.5日以上10日以下拘留","C.10日以上15日以下拘留，可以并处2000元以下罚款","D.5日以上10日以下拘留，可以并处1000元以下罚款"],"ans":"A","analysis":"依据第26条，一般扰乱秩序行为处警告或者500元以下罚款。A项正确：一般情节处警告或者500元以下罚款。B项错误：5日以上10日以下拘留是情节较重的处罚档次。C项错误：10日以上15日以下拘留并处2000元以下罚款是聚众实施时对首要分子的处罚。D项错误：可以并处1000元以下罚款附随于情节较重档次，不属于一般情节。","figures":[],"questionImages":[]},{"no":66,"type":"single","q":"某旅行社在提供组团旅游服务时有欺诈旅游者的行为，那么该旅行社应当按照旅游者的要求增加赔偿其受到的损失，增加赔偿的金额为旅游者支付旅游服务费用的（）。","opt":["A.1倍","B.2倍","C.3倍","D.10倍"],"ans":"C","analysis":"《消费者权益保护法》第55条规定，经营者提供商品或者服务有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的3倍；增加赔偿的金额不足500元的，为500元。","figures":[],"questionImages":[]},{"no":67,"type":"single","q":"根据《旅游投诉处理办法》的规定，旅游投诉由旅游经营者住所地、（）或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。","opt":["A.合同成立地","B.合同履行地","C.合同变更地","D.合同签订地"],"ans":"D","analysis":"《旅游投诉管理办法》第5条规定，“旅游投诉由旅游经营者住所地、旅游合同签订地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。需要立即制止、纠正旅游经营者的损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。”需要即时制止、纠正的情形以旅游纠纷发生地管辖，便于快速处置，防止损害扩大。","figures":[],"questionImages":[]},{"no":68,"type":"single","q":"根据《旅游投诉处理办法》第14条的规定，旅游投诉处理机构接到投诉，应当在（）以内决定是否受理。","opt":["A.60日","B.2个工作日","C.60个工作日","D.5个工作日"],"ans":"B","analysis":"《旅游投诉处理办法》第14条规定：“旅游投诉处理机构接到投诉，应当在二个工作日以内决定是否受理：（一）投诉符合本办法规定的，予以受理；（二）投诉不符合本办法规定的，以口头、书面或者其他适当方式告知投诉人不予受理的理由；根据投诉内容能够确定其他解决纠纷途径的，一并告知投诉人。”","figures":[],"questionImages":[]},{"no":69,"type":"single","q":"（）应当为受理的投诉制作档案并妥善保管相关资料。","opt":["A.当地文化和旅游主管部门","B.旅游投诉处理机构","C.当地人民政府","D.被投诉人所在地文化和旅游主管部门"],"ans":"B","analysis":"《旅游投诉处理办法》第二十七条旅游投诉处理机构应当使用统一规范的旅游投诉处理信息系统，为受理的投诉制作档案并妥善保管相关资料，按照规定公开投诉相关信息。A项错误：当地文化和旅游主管部门不等同于旅游投诉处理机构，该项义务主体是旅游投诉处理机构。B项正确：旅游投诉处理机构应当为受理的投诉制作档案并妥善保管相关资料。C项错误：当地人民政府不承担旅游投诉档案保管的职责。D项错误：档案保管义务由受理投诉的旅游投诉处理机构承担，并非被投诉人所在地文化和旅游主管部门。","figures":[],"questionImages":[]},{"no":70,"type":"single","q":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游者可以请求旅行社进行违约赔偿的情形是（）。","opt":["A.游客王女士因旅行社代办的签证信息有误，无法成行","B.因暴雨天气飞机延误，游客张先生未能前往旅游目的地","C.因旅游目的地突发地震灾害，甲旅行社经全体游客同意后提前中断旅游行程","D.赵女士在旅游行程开始前单方面解除旅游合同"],"ans":"A","analysis":"旅游经营者因过错致其代办的手续、证件存在瑕疵，或者未尽妥善保管义务而遗失、毁损，旅游者请求旅游经营者补办或者协助补办相关手续、证件并承担相应费用的，人民法院应予支持。因上述行为影响旅游行程，旅游者请求旅游经营者退还尚未发生的费用、赔偿损失的，人民法院应予支持。此处因为旅行社的过错导致无法成行，旅行社应当承担违约赔偿。故“游客王女士因旅行社代办的签证信息有误，无法成行”选项正确。其余三个选项属于“旅行社应该在扣除必要的费用后，将余款退还给旅游者”，无需承担违约责任。","figures":[],"questionImages":[]},{"no":71,"type":"single","q":"根据《旅游投诉处理办法》的规定，下列情形予以受理的是（）。","opt":["A.超过旅游合同履行期限届满之日90日提出投诉的","B.认为导游员所属旅游经营者违反合同约定，侵害自身合法权益的","C.因同行游客的责任致使投诉人人身受到损害的","D.人民法院已经受理的"],"ans":"B","analysis":"《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：（一）投诉人与投诉事项有直接利害关系；（二）有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列情形之一的，不予受理：（一）不属于旅游投诉处理机构管辖范围的；（二）超过旅游合同履行期限届满之日九十日的；（三）人民法院、仲裁机构、其他行政管理部门、消费者组织或者人民调解组织等机构已经受理或者处理的；（四）旅游投诉处理机构已经作出处理，且没有新情况、新理由的；（五）不符合本办法第九条规定的受理条件的；（六）本办法规定情形之外的经济纠纷、劳动人事纠纷等其他纠纷。A项错误：超过旅游合同履行期限届满之日90日，属于法条明确规定的不予受理情形。B项正确：导游履行职务行为对应的责任由旅游经营者承担，投诉旅游经营者违约侵害权益，符合受理条件，应当受理。C项错误：同行游客不属于旅游经营者，该纠纷不属于旅游投诉受理范围，不予受理。D项错误：人民法院已经受理的案件，属于法定不予受理情形。","figures":[],"questionImages":[]},{"no":72,"type":"single","q":"自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列应急处置措施（）。","opt":["A.迅速控制危险源","B.对特定区域内的燃料、燃气、电力、水的供应进行控制","C.封锁有关场所、道路，查验现场人员的身份证件","D.对特定区域内的建筑物、交通工具等进行控制"],"ans":"A","analysis":"其余三项属于社会安全事件的应急处置措施。","figures":[],"questionImages":[]},{"no":73,"type":"single","q":"可以预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，（）应当根据有关法律、行政法规和国务院规定的权限和程序，发布相应级别的警报。","opt":["A.国务院有关行政部门","B.市级以上地方各级人民政府","C.县级以上地方各级人民政府","D.所在地人民政府"],"ans":"C","analysis":"《突发事件应对法》第43条规定，可以预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，县级以上地方各级人民政府应当根据有关法律、行政法规和国务院规定的权限和程序，发布相应级别的警报。","figures":[],"questionImages":[]},{"no":74,"type":"single","q":"《旅行社责任保险管理办法》规定，旅行社责任保险的保险期间为（）。","opt":["A.1年","B.2年","C.3年","D.5年"],"ans":"A","analysis":"旅行社责任保险的保险期限为1年。即旅行社投保责任险后，在1年的保险期限内，如果发生投保范围内的赔偿责任，由承保的保险公司承担赔偿责任。","figures":[],"questionImages":[]},{"no":75,"type":"single","q":"大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到（）以上的活动。","opt":["A.500人","B.1000人","C.1500人","D.2000人"],"ans":"B","analysis":"根据《大型群众性活动安全管理条例》，大型群众性活动，是指法人或者其他组织面向社会公众举办的每场次预计参加人数达到1000人以上的活动。","figures":[],"questionImages":[]},{"no":76,"type":"single","q":"根据《铁路法》的规定，因铁路运输企业的责任造成旅客不能按车票载明的日期、车次乘车的，铁路运输企业应当按照旅客的要求，（）或者安排改乘到达相同目的站的其他列车。","opt":["A.退还票款差价","B.退还未发生票款","C.退还部分票款","D.退还全部票款"],"ans":"D","analysis":"《铁路法》第12条规定，铁路运输企业应当保证旅客按车票载明的日期、车次乘车，并到达目的站。因铁路运输企业的责任造成旅客不能按车票载明的日期、车次乘车的，铁路运输企业应当按照旅客的要求，退还全部票款或者安排改乘到达相同目的站的其他列车。","figures":[],"questionImages":[]},{"no":77,"type":"single","q":"根据《出境入境管理法》的规定，持用伪造的出境入境证件出境入境的，（）","opt":["A.处1000元以上5000元以下罚款","B.处2000元以上5000元以下罚款","C.处1000元以上1万元以下罚款","D.处2000元以上1万元以下罚款"],"ans":"A","analysis":"《出境入境管理法》第71条规定，有下列行为之一的，处1000元以上5000元以下罚款；情节严重的，处5日以上10日以下拘留，可以并处2000元以上1万元以下罚款：（1）持用伪造、变造、骗取的出境入境证件出境入境；（2）冒用他人出境入境证件出境入境；（3）逃避出境入境边防检查；（4）以其他方式非法出境入境。","figures":[],"questionImages":[]},{"no":78,"type":"single","q":"国家对食品生产经营实行许可制度，食品生产经营许可的有效期为（）。","opt":["A.1年","B.2年","C.3年","D.5年"],"ans":"D","analysis":"《食品安全法实施条例》第15条规定，食品生产经营许可的有效期为5年。","figures":[],"questionImages":[]},{"no":79,"type":"single","q":"根据《风景名胜区条例》第四十一条，在风景名胜区内从事禁止范围以外的建设活动，未经风景名胜区管理机构审核的，责令停止建设、限期拆除，对单位处（）的罚款。","opt":["A.2万元以上5万元以下","B.10万元以上20万元以下","C.20万元以上50万元以下","D.50万元以上100万元以下"],"ans":"C","analysis":"《风景名胜区条例》第四十一条：在风景名胜区内从事禁止范围以外的建设活动，未经风景名胜区管理机构审核的，责令停止建设、限期拆除，对个人处2万元以上5万元以下的罚款，对单位处20万元以上50万元以下的罚款。A选项：2万元以上5万元以下，是对个人的罚款标准，故错误。B、D选项：均不符合法条规定，故错误。C选项：20万元以上50万元以下，符合法条规定，故正确。","figures":[],"questionImages":[]},{"no":80,"type":"single","q":"根据《文物保护法》的规定，文物收藏单位无法通过（）方式取得文物。","opt":["A.购买","B.接受捐赠","C.考古挖掘","D.依法交换"],"ans":"C","analysis":"《文物保护法》第37条规定，文物收藏单位可以通过下列方式取得文物：（1）购买；（2）接受捐赠；（3）依法交换；（4）法律、行政法规规定的其他方式。","figures":[],"questionImages":[]},{"no":81,"type":"single","q":"依据《中华人民共和国非物质文化遗产法》，开发利用非物质文化遗产代表性项目的，应当支持代表性传承人开展传承活动，保护属于该项目组成部分的（）。","opt":["A.实物","B.场所","C.实物和场所","D.实物或者场所"],"ans":"C","analysis":"开发利用非物质文化遗产代表性项目的，应当支持代表性传承人开展传承遗产生产性活动，保护属于该项目组成部分的实物和场所。","figures":[],"questionImages":[]},{"no":82,"type":"single","q":"中国共产党第二十届中央委员会第三次全体会议的主要议题是（）。","opt":["A.关于推进农村改革发展若干重大问题的决定","B.关于进一步全面深化改革、推进中国式现代化的决定","C.关于全面深化改革若干重大问题的决定","D.关于深化党和国家机构改革的决定"],"ans":"B","analysis":"2024年7月18日，习近平在党的二十届三中全会第二次全体会议上发表了重要讲话，会议分析了当前形势和任务，并审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","figures":[],"questionImages":[]},{"no":83,"type":"single","q":"依据习近平文化思想，把（）在意识形态领域指导地位确立为根本制度。","opt":["A.社会主义核心价值观","B.马克思主义","C.中国优秀传统文化","D.全过程人民民主"],"ans":"B","analysis":"文档原文：习近平文化思想包括坚持党的文化领导权、推动物质文明和精神文明协调发展、把马克思主义在意识形态领域指导地位确立为根本制度、坚持以人民为中心的工作导向、保护历史文化遗产、构建中国话语和中国叙事体系、促进人类文明交流互鉴等重要内容。A项错误，社会主义核心价值观属于“七个着力”中培育和践行的对象，并非确立为意识形态领域根本制度的对象，故A错误。B项正确，把马克思主义在意识形态领域指导地位确立为根本制度，是习近平文化思想的重要内容，故B正确。C项错误，中国优秀传统文化强调创造性转化和创新性发展，不属于确立为意识形态领域根本制度的对象，故C错误。D项错误，全过程人民民主不属于文化思想中确立为意识形态领域根本制度的内容，故D错误。","figures":[],"questionImages":[]},{"no":84,"type":"single","q":"学校除假期外，（）举行一次升旗仪式。","opt":["A.每天","B.每周","C.每月","D.每季度"],"ans":"B","analysis":"北京天安门广场每日举行升旗仪式。学校除假期外，每周举行一次升旗仪式。","figures":[],"questionImages":[]},{"no":85,"type":"single","q":"我国国徽图案中的齿轮和谷穗象征（）领导下的工农联盟。","opt":["A.工人阶级","B.农民阶级","C.无产阶级","D.知识分子"],"ans":"A","analysis":"我国国徽图案中的齿轮和谷穗象征工人阶级领导下的工农联盟。","figures":[],"questionImages":[]},{"no":86,"type":"single","q":"《关于推动在线旅游市场高质量发展的意见》提到的主线是（）。","opt":["A.推动数字经济发展","B.深化供给侧结构性改革","C.扩大市场需求","D.加强政府监管"],"ans":"B","analysis":"坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大精神，贯彻落实党中央关于加快建设网络强国、数字中国决策部署，立足新发展阶段，贯彻新发展理念，构建新发展格局，以推动高质量发展为主题，以深化供给侧结构性改革为主线，以满足人民日益增长的美好生活需要为根本目的……。","figures":[],"questionImages":[]},{"no":87,"type":"single","q":"1980年，（）成立。","opt":["A.厦门华侨旅行社","B.中国国际旅行社","C.中国旅行社","D.中国青年旅行社"],"ans":"D","analysis":"1980年：中国青年旅行社总社成立。","figures":[],"questionImages":[]},{"no":88,"type":"single","q":"（）年，全国旅游工作会议提出深化导游管理体制改革，推动导游管理从“行政化、非流动、封闭式”向“市场化、自由化、法治化”转变。","opt":["A.2009年","B.2013年","C.2016年","D.2018年"],"ans":"C","analysis":"2016年1月，全国旅游工作会议提出深化导游管理体制改革，推动导游管理从“行政化、非流动、封闭式”向“市场化、自由化、法治化”转变。","figures":[],"questionImages":[]},{"no":89,"type":"single","q":"（）是旅行社形象的标志。","opt":["A.计调服务","B.导游服务","C.司机服务","D.组团社服务"],"ans":"B","analysis":"导游服务是旅行社形象的标志。","figures":[],"questionImages":[]},{"no":90,"type":"single","q":"导游带团可以了解不同国家和地区的文化差异，促进不同文化的交流融合，这是导游服务特点中（）的体现。","opt":["A.工作独立性强","B.脑体高度结合","C.客观情况复杂","D.文化交流频繁"],"ans":"D","analysis":"文化交流频繁：导游可了解不同国家和地区的文化差异；拓宽自身文化视野；促进不同的文化交流融合。","figures":[],"questionImages":[]},{"no":91,"type":"single","q":"下列选项中，对导游考试资格描述错误的一项是（）。","opt":["A.中华人民共和国公民","B.具有初级中学、中等专业学校或以上学历","C.身体健康","D.具有适应导游需要的基本知识和语言表达能力"],"ans":"B","analysis":"具有高级中学、中等专业学校或以上学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游资格考试。","figures":[],"questionImages":[]},{"no":92,"type":"single","q":"关于中级导游晋升高级导游的条件，描述正确的是（）。","opt":["A.应具有大学本科以上学历","B.2年内未因侵害旅游者合法权益受到罚款以上处罚","C.取得上一个导游等级满3年","D.国家旅游局每年组织一次中级升高级考试"],"ans":"B","analysis":"中高级导游：申请参加中级、高级导游等级考核的，应具有大学专科以上学历，取得上一个导游等级满2年，2年内在全国旅游监管服务平台的带团记录不少于25次或90天；2年内未因侵害旅游者合法权益受到罚款以上处罚，未被认定为文化和旅游市场失信主体；中级、高级导游等级考核，原则上采取笔试形式，每2年开展一次；根据需要，可增加面试形式。","figures":[],"questionImages":[]},{"no":93,"type":"single","q":"下列选项中，（）不是导游的技术能力。","opt":["A.事故处理能力","B.语言能力","C.接待操作能力","D.信息技术运用能力"],"ans":"A","analysis":"导游的技术能力：语言能力；接待操作能力；信息技术运用能力。","figures":[],"questionImages":[]},{"no":94,"type":"single","q":"“爱国、敬业、诚信、友善”是（）。","opt":["A.国家层面的价值目标","B.社会层面的价值取向","C.个人层面的价值准则","D.中华传统的价值凝练"],"ans":"C","analysis":"党的十八大提出，倡导富强、民主、文明、和谐（国家层面的价值目标），倡导自由、平等、公正、法治（社会层面的价值取向），倡导爱国、敬业、诚信、友善（公民个人层面的价值准则），积极培育和践行社会主义核心价值观。","figures":[],"questionImages":[]},{"no":95,"type":"single","q":"下列选项中，（）不是地陪导游致欢迎词的内容。","opt":["A.问候语，向旅游者问好","B.介绍自己和旅行社、旅游车司机","C.诚恳征求旅游者对本次旅游服务的意见和建议","D.预祝旅游活动愉快顺利"],"ans":"C","analysis":"欢迎词一般包括以下内容：- 问候语：向旅游者问好。- 欢迎语：对旅游者的到来表示欢迎。- 介绍语：介绍自己和旅行社、旅游车司机。- 愿望语：表达提供优质服务的态度和希望支持合作的愿望等。- 祝福语：预祝旅游活动愉快顺利。","figures":[],"questionImages":[]},{"no":96,"type":"single","q":"当入境领队（全陪）手中的旅行计划与地陪的接待计划有部分出入时，地陪导游应该（）。","opt":["A.联系组团社，查明原因","B.若是地接社的责任，地陪应实事求是地说明情况","C.如果是组团社责任，要向客人说明不是地接社责任","D.坚持以手中的接团计划为准，进行执行"],"ans":"B","analysis":"入境领队（全陪）手中的旅行计划与地陪的接待计划有部分出入时：查明原因：及时报告旅行社，查明原因，分清责任；道歉说明：若是地接社的责任，地陪应实事求是地说明情况，并向入境领队（全陪）和全体旅游者赔礼道歉。","figures":[],"questionImages":[]},{"no":97,"type":"single","q":"下列选项中，对地陪导游带领游客抵达景区后、进入景区前的服务，描述错误的是（）。","opt":["A.下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号","B.若景点下车和上车地点不同，特别提醒上车地点","C.下车前，讲清停留时间、集合时间和地点","D.下车后，引导旅游者至景点示意图前，讲解游览线路，交代注意事项"],"ans":"C","analysis":"（1）车辆信息：抵达景点后，下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号、停车地点和开车时间；（2）特殊地点：若景点下车和上车地点不同，特别提醒上车地点。（3）示意图前讲解：下车后，引导旅游者至景点示意图前，讲解游览线路，交代注意事项，强调人身财产安全、预防走失，讲清停留时间、集合时间和地点。","figures":[],"questionImages":[]},{"no":98,"type":"single","q":"乘坐出境航班，地陪导游要提前（）小时抵达机场。","opt":["A.4","B.3","C.2","D.1"],"ans":"B","analysis":"乘出境航班提前3小时；乘国内航班提前2小时；乘火车、轮船提前1小时。","figures":[],"questionImages":[]},{"no":99,"type":"single","q":"地陪导游送火车游客，应该在（）后离开。","opt":["A.隔离区","B.火车站台","C.火车启动","D.火车站停车场"],"ans":"A","analysis":"当旅游者进入安检口或隔离区时，地陪应与旅游者热情告别，并祝愿他们一路平安。旅游团进入安检区后，地陪方可离开。","figures":[],"questionImages":[]},{"no":100,"type":"single","q":"外国旅游者在中国旅游期间，不能使用的支付方式是（）。","opt":["A.人民币现金","B.微信","C.支付宝","D.本国货币"],"ans":"D","analysis":"说明支付方式：向入境旅游者说明在中国可使用现金、数字人民币、VISA、微信、支付宝等多种支付方式。","figures":[],"questionImages":[]},{"no":101,"type":"single","q":"“漓江的水真静啊，静得让你感觉不到它在流动；漓江的水真清啊，清得可以看见江底的沙石；漓江的水真绿啊，绿得仿佛那是一块无瑕的翡翠。”这段话用了修辞手法中的（）。","opt":["A.夸张","B.比拟","C.比喻","D.排比"],"ans":"D","analysis":"排比可以用来表达对某一事物的热烈赞美。连续的排比句式强化了导游语言的力量，抒发了强烈的赞美之情，让人听后顿感心旷神怡，也会忍不住由衷地发出赞叹。","figures":[],"questionImages":[]},{"no":102,"type":"single","q":"“各位嘉宾，大家现在已经抵达了我们祖国的心脏——北京”，这句话采用的是（）。","opt":["A.暗喻","B.明喻","C.借喻","D.隐喻"],"ans":"A","analysis":"直接把一种事物当作另一种事物来描述，使比喻更加含蓄且富有深意。例如：“各位嘉宾，大家现在已经抵达了我们祖国的心脏——北京”，北京的重要地位在这番话中一目了然。","figures":[],"questionImages":[]},{"no":103,"type":"single","q":"表达兴奋、号召、激动、惊叹、疑问等情绪的语调是（）。","opt":["A.高升调","B.低降调","C.平直调","D.曲折调"],"ans":"A","analysis":"高升调：适用于表达兴奋、号召、激动、惊叹、疑问等情绪。句子开头音调低，句尾显著升高。例如“看，流星出现在夜空啦！”（传达兴奋、激动之情）。","figures":[],"questionImages":[]},{"no":104,"type":"single","q":"导游讲话时，目光似看非看地望向全体旅游者，营造“我心有你”的氛围，这是导游采用了（）的目光语。","opt":["A.环视法","B.前视法","C.点视法","D.虚视法"],"ans":"D","analysis":"虚视法：导游讲话时，目光似看非看地望向全体旅游者，营造“我心有你”的氛围。目的是让全体旅游者都感觉导游在关注自己。","figures":[],"questionImages":[]},{"no":105,"type":"single","q":"“苏州被称为‘东方的威尼斯’”运用了（）。","opt":["A.同类相似类比","B.同类相异类比","C.异类相似类比","D.异类相异类比"],"ans":"C","analysis":"将相似的两个事物或现象进行比较，便于旅游者理解。举例：苏州是著名的江南水乡，老城内至今保持着“水陆并行、河街相邻”的双棋盘格局，被意大利旅行家马可·波罗称为“东方的威尼斯”。","figures":[],"questionImages":[]},{"no":106,"type":"single","q":"清河坊街区作为杭州目前唯一保存较完好的旧街区，身上凝聚了杭州最具代表性的历史文化、商业文化、建筑文化及市井文化。这是突出重点法中的（）应用。","opt":["A.突出独特之处","B.突出有代表性部分","C.突出旅游者感兴趣的内容","D.突出“最”“第一”"],"ans":"B","analysis":"在讲解城市或景点全貌后，可侧重讲解其中富有代表性的内容。","figures":[],"questionImages":[]},{"no":107,"type":"single","q":"导游能够允许旅游者自由活动的情形是（）","opt":["A.城市旅游期间要求全天不跟团活动","B.游湖时单独划小船","C.傍晚时分，单独骑车去郊区游玩","D.去不对外开放的地区、机构参观游览"],"ans":"A","analysis":"其余三项均为不可允许的选项。应劝阻旅游者自由活动的几种情况：1. 旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误机（车、船）。2. 身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3. 单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4. 游河（湖、海）时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5. 要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","figures":[],"questionImages":[]},{"no":108,"type":"single","q":"开始登机后，导游提醒旅游者有序排队，导游（）登机。","opt":["A.第一个","B.排在客人中间","C.比较靠前的位置","D.最后一个"],"ans":"D","analysis":"开始登机后，提醒旅游者有序排队，确认全体人员登机后，导游最后登机。","figures":[],"questionImages":[]},{"no":109,"type":"single","q":"下列选项中，导游引导游客理性消费错误的一项是（）。","opt":["A.提醒旅游者思考是否真正需要，避免因冲动购买无用商品，减少浪费","B.鼓励旅游者购买真正喜欢的物品","C.鼓励游客多多选购当地特色产品","D.购买大件物品时，要确认商品是否提供“包修、包换、包退”服务，并索取发票等凭证"],"ans":"C","analysis":"导游作为旅游者的朋友和向导，有责任引导其理性消费。可建议旅游者遵循以下原则：“实用”原则：必要时提醒旅游者在购买前思考是否真正需要，避免因冲动购买不实用商品，减少浪费。“喜欢”原则：鼓励旅游者购买真正喜欢的物品，能承载旅游者个人的情感与记忆，也值得购买。“保障”原则：提醒旅游者“货比三家”和确认“三包商品”。特别是购买大件物品时，要确认商品是否提供“包修、包换、包退”服务，并索取发票等凭证，妥善保存。通过以上方法，导游可在帮助旅游者享受购物乐趣的同时，引导其做出明智的消费决策。","figures":[],"questionImages":[]},{"no":110,"type":"single","q":"世界上第一本旅游指南《利物浦之行手册》诞生于（）年。","opt":["A.1841","B.1845","C.1846","D.1865"],"ans":"B","analysis":"1845年，世界上第一本旅游指南《利物浦之行手册》诞生。\n\n题源校对：书名采用解析版的“利物浦之行手册”。","figures":[],"questionImages":[]},{"no":111,"type":"single","q":"游客要求退换商品，导游操作正确的一项是（）。","opt":["A.立即陪同旅游者前往购买地点","B.站在游客一边，积极与商家退货和赔偿问题","C.若商店拒绝退赔，导游应及时联系当地市场管理部门、旅游管理部门或消费者协会等相关部门","D.若商家出售残次品，导游要积极维护游客利益，解决问题"],"ans":"D","analysis":"当旅游者在计划内购物店或自由活动期间所购买的商品出现质量问题，如存在残次品或假货等情况时，他们会要求导游协助进行退换货：必要时，陪同旅游者前往购买地点，协助其办理退赔手续，积极维护旅游者的合法权益，努力为旅游者解决问题。","figures":[],"questionImages":[]},{"no":112,"type":"single","q":"如果全团统一要求增加计划外的娱乐活动，导游操作正确的是（）。","opt":["A.立即按照要求增加","B.让旅游者通知组团社","C.如接待社无法调换，要向旅游者做好耐心解释工作","D.积极做出承诺帮助更换"],"ans":"C","analysis":"与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。","figures":[],"questionImages":[]},{"no":113,"type":"single","q":"下列自由活动要求中，导游应当劝阻的是（）。","opt":["A.在海边玩时，游客要到海水浴场游泳","B.游客要单独骑自行车去人生地不熟、车水马龙的街头游玩","C.游三峡时，游客提出要乘坐大型游轮饱览两岸风光","D.游客执意要去大型娱乐场所活动"],"ans":"B","analysis":"1. 旅游团计划去另一地游览或即将离开本地时：劝阻旅游者不要自由活动，特别是需要较长时间的活动，如不要到热闹的地方购物，以避免误（车、船）。2. 身处治安不理想、复杂、混乱的地方时：劝阻旅游者外出活动，更不要单独活动，但必须实事求是地说明情况。3. 单独骑自行车去人生地不熟、车水马龙的街头游玩时：不宜让旅游者单独前往。4. 游河（湖、海）时提出划小船或在非游泳区游泳时：不能答应，也不能置旅游团于不顾而陪少数人去划船、游泳。5. 要求去不对外开放的地区、机构参观游览时：进行劝阻，不得答应相应要求。","figures":[],"questionImages":[]},{"no":114,"type":"single","q":"旅游者提出要求自费品尝风味餐，导游操作正确的是（）。","opt":["A.全团或大多数旅游者要求品尝风味餐的处理，应予以婉拒","B.如果是个人提出品尝风味餐，一般情况下导游需要陪同前往","C.若是个别旅游者想要品尝风味餐，请其自理，无需帮助","D.导游需告知游客风味餐一旦预订后若取消，须赔偿餐厅的相关损"],"ans":"D","analysis":"1. 如果是全团或大多数旅游者提出计划外品尝风味餐的要求，导游应予以协助；可由旅行社出面，也可由游客自行与有关餐厅联系订餐，风味餐订妥后旅游者又不想去时，导游应耐心劝说他们在约定时间前往餐厅，并说明若不去用餐，须赔偿餐厅的相关损失；2. 若是个别旅游者想要品尝风味餐，导游可协助联系餐馆，告知其风味餐费用，自理，原餐费根据旅游合同约定处理，通常导游不陪同前往，但要提醒旅游者注意人身和财物安全。","figures":[],"questionImages":[]},{"no":115,"type":"single","q":"经多方努力仍发生误机（车、船）事故时，导游操作正确的是（）。","opt":["A.自己摘除责任并跟客人解释清楚","B.导游听从客人意见，按照客人的意见处理","C.若下一站继续游览，及时通知并调整日程","D.与航空公司联络，让航空公司给出意见"],"ans":"C","analysis":"（1）稳定旅游者情绪，导游设法转移旅游者注意力，提供周到服务以稳定情绪；（2）做好协调工作，导游执行旅行社处理意见并通报旅游者，同时反馈旅游者意见给旅行社，直至找到新方案；（3）做好对下一站的通知，若下一站继续游览，及时通知并调整日程；若下一站返程，提醒旅游者联系家人告知情况，让家人放心。","figures":[],"questionImages":[]},{"no":116,"type":"single","q":"（）是重症中暑的表现。","opt":["A.头晕、耳鸣、口渴、多汗、无力","B.体温升至38℃以上","C.面色苍白、恶心、呕吐、呼吸浅快","D.昏迷、四肢抽搐"],"ans":"D","analysis":"中暑是在烈日或高温环境下，人体热量散发不及时，体温调节功能障碍引发的急性疾病。轻症中暑表现为头晕、耳鸣、口渴、多汗、无力，体温升至38℃以上时，还会面色苍白、恶心、呕吐、呼吸浅快；重症中暑甚至昏迷、四肢抽搐，严重可致多器官功能衰竭。","figures":[],"questionImages":[]},{"no":117,"type":"single","q":"在预防治安事故的发生过程中，导游操作存在失误的是（）。","opt":["A.应随时提醒旅游者加强个人安全防护","B.应提醒司机在接待旅游者期间不带无关人员上车","C.熟悉当地情况且安全意识较强，应尽量多与旅游者在一起","D.遇到不明身份人员拦车时不轻易停车或开门，导游熟悉的人可以"],"ans":"D","analysis":"1. 做好旅游者安全教育：旅游过程中，导游应随时提醒旅游者加强个人安全防护，如随身携带贵重物品、不在人群密集处暴露财物、夜晚避免独自出行、不轻信陌生人求助等；2. 提醒司机做好安全配合：导游应提醒司机在接待旅游者期间不带无关人员上车，遇到不明身份人员拦；3. 多与旅游者在一起：车时不轻易停车或开门，车上无人时关好车窗、锁好车门导游熟悉当地情况且安全意识较强，应尽量多与旅游者在一起，及时关注并提醒他们注意人身与财产安全，同时利于完成旅游接待任务。","figures":[],"questionImages":[]},{"no":118,"type":"single","q":"食物中毒的典型特征不包括（）。","opt":["A.食物中毒潜伏期短、发病快","B.恶心、呕吐、腹泻、腹痛","C.常集体发病","D.需要及时抢救，但是不会有生命危险"],"ans":"D","analysis":"食物中毒潜伏期短、发病快，典型症状为恶心、呕吐、腹泻、腹痛，且常集体发病，严重者若抢救不及时会有生命危险。因此，导游在服务过程中应注重预防，并掌握基本处理技能。","figures":[],"questionImages":[]},{"no":119,"type":"single","q":"雨中行车时，导游操作正确的是（）。","opt":["A.导游可提醒司机注意控制车速，紧跟大车，使其为之挡风雨","B.遇到路面积水较深时快速通过，避免车辆涉水熄火","C.当车辆在低洼处熄火时，全体人员在车上停留，不要下车","D.带领游客迅速转移至安全地带，靠边等待救援"],"ans":"D","analysis":"（1）控制车速与保持车距导游可提醒司机注意控制车速，适当增大与前车的车距，保持安全制动距离，确保行车安全；（2）绕行积水路段遇到路面积水较深时应尽量绕行，避免车辆涉水熄火，减少车辆故障和危险情况的发生；（3）车辆熄火后的应急措施当车辆在低洼处熄火时，全体人员不要在车上停留，要立即下车，迅速转移至安全地带，靠边等待救援，切不可在车内逗留，以免水位持续上升造成生命危险。","figures":[],"questionImages":[]},{"no":120,"type":"single","q":"关于禁止出入境物品的描述，错误的一项是（）。","opt":["A.各种武器、仿真武器、弹药及爆炸物品","B.录音带、录像带、激光视盘、计算机存储介质及其物品","C.鸦片、吗啡、海洛因、大麻以及其他能使人成瘾的麻醉品","D.带有危险性病菌、害虫及其他有害生物的动物、植物及其产品"],"ans":"B","analysis":"禁止出入境物品的：各种武器、仿真武器、弹药及爆炸物品；对中国政治、经济、文化、道德有害的印刷品、胶卷、照片、唱片、影片、录音带、录像带、激光视盘、计算机存储介质及其物品；鸦片、吗啡、海洛因、大麻以及其他能使人成瘾的麻醉品；带有危险性病菌、害虫及其他有害生物的动物、植物及其产品。","figures":[],"questionImages":[]},{"no":121,"type":"single","q":"关于安全检查的内容，表述正确的一项是（）。","opt":["A.高级外交人员可以免检","B.安全检查通过安全门使用磁性探测检查、红外线透视，但不能搜身","C.携带贵重物品、植入心脏起搏器需要在公开场所进行安检","D.有殴打辱骂民航安检员妨碍民航安检工作的行为，移交公安机关处理"],"ans":"D","analysis":"无论外交人员、政府官员还是普通旅客，不分男女、国籍和等级，均须接受安全检查；安全检查通常采用通过安全门使用磁性探测检查、红外线透视、搜身、开箱检查等方式对旅游者进行检查；携带贵重物品、植入心脏起搏器或身患残疾等情况的旅客可要求在非公开场所进行安检；旅客若逃避安全检查，或有殴打辱骂民航安检员以及其他妨碍民航安检工作正常开展、扰乱民航安检工作现场秩序的行为，也将移交公安机关处理。","figures":[],"questionImages":[]},{"no":122,"type":"single","q":"短期多次往返港澳的旅客，携带免税制品的表述正确的是（）。","opt":["A.不准免税带进酒","B.雪茄50支","C.烟丝500克","D.香烟200支"],"ans":"A","analysis":"短期多次往返港澳旅客（当天或短期内多次往返）；香烟40支或雪茄5支或烟丝40克；不准免税带进酒。","figures":[],"questionImages":[]},{"no":123,"type":"single","q":"关于国航普通托运行李单件重量与尺寸的限制，下列表述正确的是（）。","opt":["A.行李重不小于1千克","B.行李重不超30千克","C.三边之和不小于60厘米，含滑轮/把手","D.三边之和不超200厘米，含滑轮/把手"],"ans":"C","analysis":"单件标准：每件普通托运行李重不小于2千克、不超32千克，三边之和不小于60厘米、不超203厘米，含滑轮/把手，超出则不可托运。","figures":[],"questionImages":[]},{"no":124,"type":"single","q":"旅客购买了200元的动车票，在开车前3小时办理退票，需要支付的退票费为（）。","opt":["A.10元","B.20元","C.40元","D.100元"],"ans":"C","analysis":"开车前8天（含8天）以上退票的，不收退票费；开车前48小时以上的，按票价5%计；开车前24-48小时的，按票价10%计；不足24小时的按票价20%计。","figures":[],"questionImages":[]},{"no":125,"type":"single","q":"车次前冠有K字母的列车是（）。","opt":["A.快速旅客列车","B.高速铁路列车","C.城际铁路列车","D.直达铁路列车"],"ans":"A","analysis":"K字头 快速旅客列车。","figures":[],"questionImages":[]},{"no":126,"type":"single","q":"发现火情后，导游首先（）。","opt":["A.拨打119报警","B.组织旅游者撤离","C.引导游客自救","D.通知饭店前台"],"ans":"A","analysis":"发现火情后，导游应迅速拨打119报警，同时简明扼要地将情况上报旅行社。","figures":[],"questionImages":[]},{"no":127,"type":"single","q":"世界主要城市中，与北京处于同一时区的是（）。","opt":["A.开罗","B.马尼拉","C.纽约","D.悉尼"],"ans":"B","analysis":"开罗比北京晚6个小时，马尼拉与中国在同一个时区，纽约比中国晚13个小时，悉尼比中国早2个小时。","figures":[],"questionImages":[]},{"no":128,"type":"single","q":"今天的气温是0摄氏度，相当于（）华氏度。","opt":["A.32华氏度","B.100华氏度","C.210华氏度","D.60华氏度"],"ans":"A","analysis":"华氏度 = 摄氏度 × 9÷5 + 32，根据公式，0摄氏度为32华氏度。","figures":[],"questionImages":[]},{"no":129,"type":"single","q":"下列长度换算公式，正确的是（）。","opt":["A.1千米＝1.853海里","B.1米＝3尺","C.1英尺＝1.094尺","D.1尺＝2.734码"],"ans":"B","analysis":"1海里=1.853千米；1尺=1.094英尺；1码=2.734尺。","figures":[],"questionImages":[]},{"no":130,"type":"single","q":"下列选项中，关于旅游保险报案与索赔的描述，错误的是（）。","opt":["A.游客意外事故发生后，应迅速向保险公司报案","B.游客若需转回本地医院治疗，让救治医院出具书面转院报告即可","C.在导游协助下收集医院诊断证明、化验单据","D.妥善保存相关单据，以备处理赔偿所用"],"ans":"B","analysis":"1. 及时报案：游客意外事故发生后，应迅速向保险公司报案。2. 收集并保存证据：可在导游协助下收集医院诊断证明、化验单据、意外事故证明等证据，并妥善保存。3. 转院需保险公司同意：游客意外住院后，若需转回本地医院治疗，要事先取得保险公司同意，并让救治医院出具书面转院报告。","figures":[],"questionImages":[]},{"no":131,"type":"multi","q":"《宪法》规定，任何公民，非经（），不受逮捕。","opt":["A.人民检察院批准，并由公安机关执行","B.人民检察院决定，并由公安机关执行","C.人民法院决定，并由公安机关执行","D.人民法院批准，并由公安机关执行","E.监察机关批准，并由公安机关执行"],"ans":"ABC","analysis":"任何公民，非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕。","figures":[],"questionImages":[]},{"no":132,"type":"multi","q":"根据《中华人民共和国宪法》的规定，下列自然资源中只能归国家所有的有（）。","opt":["A.矿藏","B.水流","C.森林","D.荒地","E.滩涂"],"ans":"AB","analysis":"矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源，属于国家所有（即全民所有）；法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外（第9条）。矿藏、水流只能归国家所有。C项错误，法律规定属于集体所有的森林除外，森林并非只能归国家所有；D项错误，法律规定属于集体所有的荒地除外；E项错误，法律规定属于集体所有的滩涂除外。矿藏、水流只能归国家所有。\n\n题源校对：D、E 项据解析版补齐。","figures":[],"questionImages":[]},{"no":133,"type":"multi","q":"《旅游法》规定，县级以上人民政府旅游主管部门有权对下列事项中的（）实施监督检查。","opt":["A.经营旅行社业务以及从事导游、领队服务是否取得经营、执业许可","B.景区是否超出承载量接待旅游者","C.导游和领队等旅游从业人员的服务行为","D.旅行社的经营行为","E.法律法规、行业组织规定的其他事项"],"ans":"ACD","analysis":"《旅游法》第85条规定，县级以上人民政府旅游主管部门有权对下列事项实施监督检查：（1）经营旅行社业务以及从事导游、领队服务是否取得经营、执业许可；（2）旅行社的经营行为；（3）导游和领队等旅游从业人员的服务行为；（4）法律、法规规定的其他事项。","figures":[],"questionImages":[]},{"no":134,"type":"multi","q":"《旅游法》规定，旅游者购买、接受旅游服务时，应当履行的义务包括（）。","opt":["A.如实告知与旅游活动相关的个人健康信息","B.不得损害当地居民的合法权益","C.遵守旅游活动中的安全警示规定","D.保障旅游经营者和旅游从业人员的合法权益","E.文明旅游"],"ans":"ABCE","analysis":"《旅游法》第15条规定，旅游者购买、接受旅游服务时，应当向旅游经营者如实告知与旅游活动相关的个人健康信息，遵守旅游活动中的安全警示规定。“保障旅游经营者和旅游从业人员的合法权益”错误，《旅游法》规定不得损害旅游经营者和旅游从业人员的合法权益，而不是“保障”。","figures":[],"questionImages":[]},{"no":135,"type":"multi","q":"下列属于无效的民事法律行为的是（）。","opt":["A.违背公序良俗的民事法律行为","B.违反法律的强制性规定的民事法律行为","C.违反行政法规的强制性规定的民事法律行为","D.行为人与相对人恶意串通，损害他人合法权益的民事法律行为","E.因第三人胁迫，当事人在违背真实意思的情况下实施的民事法律行为"],"ans":"ABCD","analysis":"“因第三人胁迫……”属于可撤销民事法律行为。《民法典》第148条，一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销。","figures":[],"questionImages":[]},{"no":136,"type":"multi","q":"根据《民法典》的规定，以下关于机动车交通事故责任的说法中，正确的是（）。","opt":["A.非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当免除其赔偿责任","B.因租赁机动车发生交通事故造成损害，属于该机动车一方责任的，由机动车使用人承担赔偿责任","C.盗窃、抢劫的机动车发生交通事故造成损害的，由保险公司在机动车强制保险责任限额范围内先行赔偿，有权向机动车所有人追偿","D.机动车驾驶人发生交通事故后逃逸，该机动车参加强制保险的，由保险公司在机动车强制保险责任限额范围内予以赔偿","E.机动车不明，需要支付被侵权人人身伤亡的抢救、丧葬等费用的，由道路交通事故社会救助基金支付"],"ans":"BD","analysis":"《民法典》第1217条，非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当减轻其赔偿责任；选项错在“免除”。盗窃、抢劫或者抢夺的机动车发生交通事故造成损害的，由盗窃人、抢劫人或者抢夺人承担赔偿责任；选项错在“机动车所有人”。机动车不明、该机动车未参加强制保险或者抢救费用超过机动车强制保险责任限额，需要支付被侵权人人身伤亡的抢救、丧葬等费用的，由道路交通事故社会救助基金垫付。选项错在“支付”。","figures":[],"questionImages":[]},{"no":137,"type":"multi","q":"甲旅行社导游张某带领旅游团游览某景区时，由于人满为患，旅游者李某被行人王某撞伤。经查，张某未提醒旅游者注意行走安全。下列关于李某受伤处理的说法中，正确的有（）。","opt":["A.张某应当对李某承担侵权责任","B.张某对李某的赔偿责任由甲旅行社替代承担","C.甲旅行社与王某对李某承担连带赔偿责任","D.甲旅行社应当对李某承担补充赔偿责任","E.王某应当对李某承担侵权责任"],"ans":"BDE","analysis":"《民法典》第1198条第2款规定，因第三人的行为造成他人损害的，由第三人承担侵权责任；经营者、管理者或者组织者未尽到安全保障义务的，承担相应的补充责任。如果违反安全保障义务的具体行为人是公共场所管理人或者群众性活动组织者的工作人员或者雇员，其侵权责任还是要由管理人、组织者或者雇主承担。","figures":[],"questionImages":[]},{"no":138,"type":"multi","q":"甲旅行社未取得旅游者同意，将旅游业务委托给乙旅行社。对此，关于旅游主管部门对甲旅行社进行行政处罚的说法中，正确的是（）。","opt":["A.责令改正","B.没收违法所得","C.处2万元以上10万元以下的罚款","D.情节严重的，责令停业整顿1个月至3个月","E.造成严重后果的，吊销旅行社业务经营许可证"],"ans":"AE","analysis":"《旅游法》第100条规定，旅行社违反本法规定，有下列行为之一的，由旅游主管部门责令改正，处三万元以上三十万元以下罚款，并责令停业整顿；造成旅游者滞留等严重后果的，吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处二千元以上二万元以下罚款，并暂扣或者吊销导游证：（一）在旅游行程中擅自变更旅游行程安排，严重损害旅游者权益的；（二）拒绝履行合同的；（三）未征得旅游者书面同意，委托其他旅行社履行包价旅游合同的。","figures":[],"questionImages":[]},{"no":139,"type":"multi","q":"根据《导游管理办法》的规定，有下列（）情形之一的，所在地旅游主管部门应当撤销导游证。","opt":["A.对不具备申请资格的申请人核发导游证的","B.申请人以欺骗、贿赂等不正当手段取得导游证的","C.导游证依法被吊销的","D.对不符合法定条件的申请人核发导游证的","E.导游与旅行社订立的劳动合同解除后超过三个月没有签订新的劳动合同的"],"ans":"ABD","analysis":"有下列情形之一的，所在地旅游主管部门应当撤销导游证：对不具备申请资格或者不符合法定条件的申请人核发导游证的；申请人以欺骗、贿赂等不正当手段取得导游证的；依法可以撤销导游证的其他情形。“导游证依法被吊销的”和“导游与旅行社……”两项属于导游证被注销的情形。\n\n题源校对：A 项据解析版补齐。","figures":[],"questionImages":[]},{"no":140,"type":"multi","q":"在旅游行业组织注册并申请导游证的人员，应当向所在地旅游行业组织提交的材料包括（）。","opt":["A.身份证","B.身体健康证明","C.注册申请","D.导游人员资格证","E.本人近期照片"],"ans":"ACDE","analysis":"《导游管理办法》第8条规定，在旅游行业组织注册并申请取得导游证的人员，应当向所在地旅游行业组织提交下列材料：身份证、导游人员资格证、本人近期照片和注册申请。","figures":[],"questionImages":[]},{"no":141,"type":"multi","q":"根据《治安管理处罚法》关于责任年龄的规定，下列说法正确的有（）。","opt":["A.不满14周岁的人违反治安管理的，不予处罚，但是应当责令其监护人严加管教","B.已满14周岁不满18周岁的人违反治安管理的，从轻或者减轻处罚","C.已满14周岁不满16周岁的人违反治安管理的，均不执行行政拘留处罚","D.已满14周岁不满16周岁的人，情节较严重，应当执行行政拘留处罚","E.不满14周岁的人违反治安管理的，应当给予警告处罚"],"ans":"AB","analysis":"A项正确：不满14周岁的人违反治安管理的，不予处罚，责令监护人严加管教（第12条）。B项正确：已满14周岁不满18周岁的人违反治安管理的，从轻或者减轻处罚（第12条）。C项错误：已满14周岁不满16周岁属于原则上不执行行政拘留的群体，只有情节严重、影响恶劣或者1年内2次以上违反治安管理的才可以执行（第23条）。D项错误：“情节较严重”错误，是“情节严重”。E项错误：不满14周岁不予任何治安管理处罚，不适用警告。","figures":[],"questionImages":[]},{"no":142,"type":"multi","q":"根据《旅游法》第92条的规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决（）。","opt":["A.双方协商","B.向消费者协会、旅游投诉受理机构或者有关调解组织申请调解","C.向旅游行政管理部门投诉","D.根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁","E.向人民法院提起诉讼"],"ans":"ABDE","analysis":"《旅游法》第92条规定：“旅游者与旅游经营者发生纠纷，可以通过下列途径解决：（一）双方协商；（二）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（三）根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（四）向人民法院提起诉讼。”C项错误，向旅游行政管理部门投诉，不属于《旅游法》规定的纠纷解决途径。","figures":[],"questionImages":[]},{"no":143,"type":"multi","q":"根据《旅游安全管理办法》，旅游突发事件根据其（），分为特别重大、重大、较大和一般四级。","opt":["A.已经造成的影响","B.诱因","C.可控性","D.性质","E.危害程度"],"ans":"CDE","analysis":"《旅游安全管理办法》第39条第2款规定，旅游突发事件按照其性质、危害程度、可控性以及造成或可能造成的社会影响等因素，划分为特别重大、重大、较大和一般四个等级。诱因（B）不是分级依据，故不选。A选项错在“已经造成”，正确说法还包括“可能造成”。","figures":[],"questionImages":[]},{"no":144,"type":"multi","q":"根据《食品安全法》的规定，以下关于食品召回的表述正确的是（）。","opt":["A.国务院食品安全监督管理部门建立食品召回制度","B.食品生产者发现其生产的食品不符合食品安全标准的，应当立即停止生产","C.食品生产者发现其生产的食品可能危害人体健康的，应召回已经上市销售的食品","D.食品生产者召回食品的，应通知相关生产经营者和消费者","E.食品生产者召回食品的，应记录召回和通知情况"],"ans":"BDE","analysis":"《食品安全法》第63条，国家建立食品召回制度，故“国务院食品安全监督管理部门建立食品召回制度”错误。“食品生产者发现其生产的食品可能危害人体健康的，应召回已经上市销售的食品”错误，是有“证据证明可能危害人体健康”。","figures":[],"questionImages":[]},{"no":145,"type":"multi","q":"深化党和国家机构改革的指导思想包括（）。","opt":["A.以习近平新时代中国特色社会主义思想为指导","B.以加强党中央集中统一领导为统领","C.以推进国家治理体系和治理能力现代化为导向","D.以提升部门自主权限为改革导向","E.以激发地方自主能动性作为改革统领"],"ans":"ABC","analysis":"答案选ABC。深化党和国家机构改革必须以习近平新时代中国特色社会主义思想为指导，以加强党中央集中统一领导为统领，以推进国家治理体系和治理能力现代化为导向。D项机构改革坚持优化协同高效，目标是理顺权责关系，而不是以提升部门自主权限作为改革导向，防范部门本位。E项激发地方自主能动性是改革需要兼顾的重要方面，但改革的统领是加强党中央集中统一领导，并非地方自主能动性。","figures":[],"questionImages":[]},{"no":146,"type":"multi","q":"“十五五”时期经济社会发展的主要目标包括（）。","opt":["A.高质量发展取得显著成效","B.科技自立自强水平大幅提高","C.进一步全面深化改革取得新突破","D.社会文明程度明显提升","E.人民生活基本实现现代化"],"ans":"ABCD","analysis":"答案选ABCD。“十五五”时期主要目标包括高质量发展取得显著成效、科技自立自强水平大幅提高、进一步全面深化改革取得新突破、社会文明程度明显提升等。E项原文是人民生活品质不断提高，“人民生活基本实现现代化”不是十五五目标，属于2035远景目标相关表述。","figures":[],"questionImages":[]},{"no":147,"type":"multi","q":"《英烈法》规定，英雄烈士纪念设施保护单位应当健全服务和管理工作规范，方便瞻仰、悼念英雄烈士，保持英雄烈士纪念设施庄严、肃穆、清净的环境和氛围。任何组织和个人（）。","opt":["A.不得侵占英雄烈士纪念设施保护范围内的土地","B.不得破坏英雄烈士纪念设施","C.不得污损英雄烈士纪念设施","D.不得侵占英雄烈士纪念设施保护范围内的设施","E.不得在英雄烈士纪念设施保护范围内从事相关活动"],"ans":"ABCD","analysis":"“相关活动”错误，任何组织和个人不得在英雄烈士纪念设施保护范围内从事有损纪念英雄烈士环境和氛围的活动，不得侵占英雄烈士纪念设施保护范围内的土地和设施，不得破坏、污损英雄烈士纪念设施。","figures":[],"questionImages":[]},{"no":148,"type":"multi","q":"导游服务的作用有（）。","opt":["A.纽带作用","B.标志作用","C.销售作用","D.反馈作用","E.扩散作用"],"ans":"ABDE","analysis":"导游服务的作用：纽带作用；标志作用；反馈作用；扩散作用。","figures":[],"questionImages":[]},{"no":149,"type":"multi","q":"在日常交往中，导游通常遵循的原则有（）。","opt":["A.平等原则","B.诚信原则","C.宽容原则","D.互惠原则","E.默认原则"],"ans":"ABC","analysis":"导游通常遵循以下原则：平等原则；互尊原则；诚信原则；宽容原则；适度原则；随俗原则。","figures":[],"questionImages":[]},{"no":150,"type":"multi","q":"地陪导游的送行服务内容有（）。","opt":["A.致欢送词","B.及时归还证件","C.提前到达机场（车站、码头）","D.协助办理离站手续","E.安排好结算事宜"],"ans":"ACDE","analysis":"送行服务：致欢送词；提前到达机场（车站、码头）；提醒注意事项；协助办理离站手续；送别旅游者；安排好结算事宜。","figures":[],"questionImages":[]},{"no":151,"type":"multi","q":"地陪导游向游客介绍特色旅游商品时，应该（）。","opt":["A.向旅游团清晰说明购物场所的停留时间以及购物过程中的注意事项","B.介绍本地商品的特色及选购方法，突出商品实用性、收藏性、装饰性","C.引导其观察、引导其选购，帮助决定是否购买，充分发挥旅游购物参谋的作用","D.入境旅游者购买中药或中药制成品时，应推荐其信誉良好的大型药店","E.若商店以次充好地陪应及时向商店负责人反映问题，维护旅游者权益"],"ans":"ABDE","analysis":"在旅游者购物过程中，地陪应向旅游团清晰说明购物场所的停留时间以及购物过程中的相关注意事项，并详细介绍本地商品的特色及选购方法，重点突出商品的实用性、收藏性、装饰性、纪念性等特点，为旅游者提供客观、真实的购物参考，引导其自主观察、自由选购，自行决定是否购买，充分发挥旅游购物参谋的作用；当入境旅游者购买特殊商品（如中药或中药制成品）时，应推荐其前往质量可靠、信誉良好的大型药店，并明确告知我国海关关于药品携带出境的限额规定若发现商店存在不按质论价、以次充好、销售伪劣商品或未提供标准服务等行为，地陪应及时向商店负责人反映问题，以维护旅游者权益。","figures":[],"questionImages":[]},{"no":152,"type":"multi","q":"接待入境旅游者的全陪导游，应该向游客说明的内容包括（）。","opt":["A.介绍旅游行程的主要内容、中国概况","B.说明外币兑换手续，并提示相关注意事项","C.关于宗教活动应当在宗教活动场所进行等相关法律法规规定","D.说明中国海关的有关规定，介绍办理出境手续的程序","E.可以购买我国的中药材，如麝香、虎骨等特色产品"],"ans":"ABCD","analysis":"1. 介绍旅游行程的主要内容、中国概况，说明外币兑换手续，并提示相关注意事项，包括中国关于宗教活动应当在宗教活动场所进行等相关法律法规规定、旅游行程安全、文明旅游、风俗习惯、购物退税等。2. 说明中国海关的有关规定，介绍办理出境手续的程序，包括行李托运的要求等，必要时可协助旅游者办理离境通关手续。麝香、蟾酥、虎骨、犀牛角、牛黄等不准出境。","figures":[],"questionImages":[]},{"no":153,"type":"multi","q":"领队引领游客乘坐公共交通工具时，应该（）。","opt":["A.将文明旅游的规范要求向游客进行说明和提醒","B.应提醒游客遵守和配合乘务人员指示，保障交通工具安全有序运行","C.应提醒游客乘坐交通工具的安全规范和基本礼仪，遵守秩序，尊重他人","D.不长时间占用通道或卫生间，不强行更换座位","E.避免不文雅的举止，但是可以频繁索要免费餐饮"],"ans":"ABCD","analysis":"将文明旅游的规范要求向游客进行说明和提醒；应提醒游客遵守和配合乘务人员指示，保障交通工具安全有序运行；应提醒游客乘坐交通工具的安全规范和基本礼仪，遵守秩序，尊重他人；不长时间占用通道或卫生间，不强行更换座位。避免不文雅的举止，不无限制索要免费餐饮等。","figures":[],"questionImages":[]},{"no":154,"type":"multi","q":"导游在带团过程中，要提醒旅游者（），从而预防火灾事故发生。","opt":["A.不在密闭空间内抽烟，不乱扔烟头","B.不携带易燃、易爆物品","C.不在房间内玩火","D.认真观察所在楼层的安全通道位置及安全转移路线","E.正确佩戴防火面罩"],"ans":"ABCD","analysis":"导游应提醒旅游者：不在密闭空间内抽烟，不乱扔烟头；不携带易燃、易爆物品；不在房间内玩火等。导游需向旅游者说明熟悉酒店安全通道位置的重要性，并提醒大家进入客房后，认真观察所在楼层的安全通道位置及安全转移路线。","figures":[],"questionImages":[]},{"no":155,"type":"multi","q":"提升导游的交谈技巧，可以从（）方面努力。","opt":["A.开头宜寒暄","B.宜多多分享","C.内容宜健康","D.说话宜真诚","E.宜把握谈话过程"],"ans":"ACDE","analysis":"开头宜寒暄；说话宜真诚；内容宜健康；宜多听少说；宜把握谈话过程。","figures":[],"questionImages":[]},{"no":156,"type":"multi","q":"导游接待政务团时，应该做好的工作有（）。","opt":["A.导游的仪容仪表应端庄得体","B.导游在重要政务接待中应严格按要求执行，每个环节都符合政务接待标准","C.政务团的讲解要求“多”“细”。","D.导游应遵循“三不说”原则：不多说、不错说、不乱说","E.需严格执行保密纪律，遵守保密规定"],"ans":"ABDE","analysis":"导游的仪容仪表应端庄得体；导游在重要政务接待中应严格按要求执行，确保每个环节都符合政务接待标准；讲解是政务接待中导游的主要任务。政务团的讲解要求“精”“要”；导游应遵循“三不说”原则：不多说、不错说、不乱说；参与政务接待时，需严格执行保密纪律，遵守保密规定。","figures":[],"questionImages":[]},{"no":157,"type":"multi","q":"旅游行程中游客要求更换或者增加旅游项目，导游操作正确的是（）。","opt":["A.计划内的游览项目，一般应该不折不扣地按计划进行","B.全团统一提出更换时，请示接待社计调部门，计调同意即可更换","C.个别游客提出更换，导游尽力配合协助更换","D.若要求增加游览项目，时间允许时，请示接待社并积极协助","E.若要求增加游览项目，协调好相关事宜，陪同前往，做好游览项目的讲解"],"ans":"ADE","analysis":"（一）旅游者要求更换或取消计划内的游览项目：凡是计划内的游览项目，一般应该不折不扣地按计划进行。全团统一提出时：请示接待社计调部门，请其与组团社联系，组团社同意后方可更换或取消。个别游客提出时：向游客耐心解释，不能随意更换。（二）旅游者要求增加游览项目：时间允许时：请示接待社并积极协助，与接待社有关部门联系请其报价，将对外报价报给旅游者。旅游者认可报价时：协调处理好增加的游览费用事宜，并陪同前往，做好增加游览项目的讲解等工作。","figures":[],"questionImages":[]},{"no":158,"type":"multi","q":"为了避免漏接事故的发生，导游应该（）。","opt":["A.熟悉旅游接待计划安排","B.核实接机（车、船）的准确信息","C.准时到达迎接地点","D.保持通信联系畅通","E.必要时携带备用手机，防止突发故障无法及时与旅行社、旅游者取得联系"],"ans":"ABDE","analysis":"1. 熟悉旅游接待计划安排，导游领取计划书后，应迅速了解旅游者抵达的班（轮）次、出发及抵达时间、准确的到达地点等信息。对于飞机航班，还可借助手机软件关注航班动态；2. 核实接机（车、船）的准确信息，导游应在旅游者出发当天，在其航班或列车、班轮出发前，再次与旅游者核实班（轮）次、抵达的具体机场（车站、码头）、抵达时间、人数等信息，确保无误；3. 提前到达迎接地点，导游应提前与司机商定出发时间，无论是一同出发还是各自抵达迎接点，均需预留充足的交通时间，并提前半小时到达；4. 保持通信联系畅通，导游应确保手机开机，流量与话费充足，以满足与旅游者的基本联系需求。必要时可携带备用手机，以防手机突发故障或丢失而无法及时与旅行社、旅游者取得联系。\n\n题源校对：两版题干措辞不同，五个选项一致。本页采用试卷题干。","figures":[],"questionImages":[]},{"no":159,"type":"multi","q":"为了避免游客丢失物品，导游应该采取以下措施：（）。","opt":["A.在旅游参观各环节，导游提醒旅游者检查随身物品","B.离店、下车时提醒带好物件，在人多场所注意保管贵重物品","C.提供行李服务时，每次清点行李件数","D.旅游者证件由全陪或领队统一保管","E.司机离开且车上无人时，导游提醒其锁好车窗门"],"ans":"ABCE","analysis":"1. 多做提醒工作：在旅游参观各环节，导游提醒旅游者检查随身物品。离店、下车时提醒带好物件，在人多场所注意保管贵重物品；2. 做好证件与行李的清点交接：提供行李服务时，每次清点行李件数。旅游活动中，需用旅游者证件时，由全陪或领队统一收取，用毕立即如数归还并当面清点；3. 提醒司机及时锁好车门车窗：旅游客车是旅游者的“移动的家”，一些随身物件常放车上。司机离开且车上无人时，导游提醒其锁好车窗门。","figures":[],"questionImages":[]},{"no":160,"type":"multi","q":"为了尽量避免发生旅游行程变更，导游应该（）。","opt":["A.地陪在接触旅游者时第一时间与其核对行程，确保信息一致","B.存在极端天气可能时，导游要自己调整行程，但整体行程不做变更","C.在接团前查询团队旅游期间沿途的大致天气情况","D.地陪按照计划书提前与供应商进行确认，保障各项预订安排准确无误","E.若道路拥堵严重，重新规划出行线路，避开堵车"],"ans":"ACDE","analysis":"地陪在接触旅游者时第一时间与其核对行程，确保信息一致；存在极端天气可能时，提早关注、提前预防，经旅游者同意后微调参观顺序避开天气影响，但整体行程不做变更；在接团前查询团队旅游期间沿途的大致天气情况；地陪按照计划书提前与供应商进行确认，保障各项预订安排准确无误；若道路拥堵严重，重新规划出行线路，避开堵车。","figures":[],"questionImages":[]},{"no":161,"type":"multi","q":"为了避免发生交通事故，导游应该（）。","opt":["A.督促旅游汽车承运人严格执行车辆出车检查制度","B.旅游汽车驾驶员应具备相关资质，做到不超载、超速、疲劳驾驶","C.对于连续驾驶超过3小时或超过300公里，应停下来休息20分钟","D.旅游汽车首排正座应设置导游专座，以保障导游的人身安全","E.每车应配备一部“游客安全乘车温馨提示”宣传片"],"ans":"ABDE","analysis":"（1）旅游营运车辆应符合《旅游客车设施与服务规范》（GB/T26359）的要求，具备旅游包车营运资质，安全检验合格，并满足旅游行程运输需求。（2）督促旅游汽车承运人严格执行车辆出车检查制度，落实旅游车辆班组日检、部门周检、公司月检。检查时应使用安全检查表并签名，对发现的问题立即处理；无法立即处理的，应及时报告；如严重或多次违反采购协议安全条款，应及时停用。（3）旅游汽车驾驶员应具备相关资质，确保行车安全，做到不超载、超速、疲劳驾驶、酒后驾车，且出发前不使用影响驾驶安全的违禁药物。对于连续驾驶超过4小时或连续行程超过400公里的旅游线路，旅行社应安排驾驶员中途休息或增配一名驾驶员。（4）旅游汽车首排正座应设置导游/领队专座，以保障导游领队的人身安全。（5）每车应配备一部“游客安全乘车温馨提示”宣传片，每座配置一份《游客乘车安全须知》。","figures":[],"questionImages":[]},{"no":162,"type":"multi","q":"为防止溺水事故发生，导游应提醒旅游者做到“五不玩水”，具体包括（）。","opt":["A.不在身体不舒服时玩水","B.不在饥饿或过饱时玩水","C.不独自一人玩水","D.不去情况不明或禁止的水域玩水","E.不逞强跳水或潜水"],"ans":"ABCDE","analysis":"本题说法全部正确。五不玩水：不在身体不舒服时玩水，不在饥饿或过饱时玩水，不独自一人玩水，不去情况不明或禁止的水域玩水，不逞强跳水或潜水。","figures":[],"questionImages":[]},{"no":163,"type":"multi","q":"若在野外活动时遭遇雷电，导游应该（）。","opt":["A.带领游客迅速回到旅游客车躲避","B.劝告大家尽量避免使用手机，以免增加吸引雷电的风险","C.打开汽车门窗，保持内部通风状态","D.不宜选择孤立小屋、大树下、电线杆旁及高坡避雨","E.如果多人在一起，彼此之间尽可能靠在一起"],"ans":"ABD","analysis":"带领游客迅速回到旅游客车躲避；劝告大家尽量避免使用手机，以免增加吸引雷电的风险；不宜选择孤立小屋、大树下、电线杆旁及高坡避雨；务必关好汽车门窗，保持内部封闭状态，防止雷电通过车体或空气传播袭击车内人员；如果多人在一起，彼此之间应保持数米的距离，降低群体雷击风险。","figures":[],"questionImages":[]},{"no":164,"type":"multi","q":"下列物品中，属于列车上禁止随身携带但可以托运的有（）。","opt":["A.管制器具","B.菜刀","C.复合弓等非机械弓箭类器材","D.消防灭火枪","E.手提包"],"ans":"BCD","analysis":"（1）禁止托运与携带；枪支、子弹类（含主要零部件），爆炸物品类，管制器具，易燃易爆物品，毒害品，腐蚀性物品，放射性物品，感染性物质，其他危害列车运行安全的物品，法律、行政法规、规章规定的其他禁止携带、运输的物品。（2）禁止随身携带但可托运：菜刀/水果刀/剪刀/美工刀/雕刻刀/裁纸刀等，反曲弓/复合弓等非机械弓箭类器材，消防灭火枪。","figures":[],"questionImages":[]},{"no":165,"type":"multi","q":"关于沙漠旅游，导游告知游客的内容包括（）。","opt":["A.携带高能量、耐储存食品","B.穿着透气厚重的长袖长裤，避免晒伤","C.带好防沙面罩、护目镜","D.可单独行动，但是要保持与团队联系","E.专业沙漠徒步鞋"],"ans":"ACE","analysis":"携带高能量、耐储存食品；透气轻便长袖长裤（减少皮肤暴露）；带好防沙面罩、护目镜；旅游者不可单独行动，保持团队联系和互相照顾；专业沙漠徒步鞋。","figures":[],"questionImages":[]}];


const STORAGE_KEY = "guide-exam-ldd6-ke12-2026-v1";
const byNo = new Map(questions.map(q=>[q.no,q]));
let idx=0, mode='all', pool=questions.map(q=>q.no), records={}, wrongSet=new Set();
const el=id=>document.getElementById(id);
function normalized(values){return [...new Set(values)].sort().join('');}
function current(){return byNo.get(pool[idx]);}
function persist(){
    try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,currentNo:pool[idx]??null,mode,pool,records,wrong:[...wrongSet]}));
        el('storageStatus').textContent='已自动保存到本机浏览器。请使用同一浏览器打开此文件；清理浏览器数据会删除记录。';
    }catch(e){el('storageStatus').textContent='浏览器未能保存记录，请检查是否禁用了本地存储。当前页面仍可正常答题。';}
}
function restore(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw)return;
        const s=JSON.parse(raw);
        if(s.version!==2)throw new Error('version');
        for(const q of questions){
            const r=s.records?.[q.no];
            if(!r||!Array.isArray(r.selected))continue;
            const selected=[...new Set(r.selected.filter(v=>q.opt.some(o=>o[0]===v)))];
            if(q.type!=='multi'&&selected.length>1)continue;
            records[q.no]={selected,submitted:r.submitted===true&&selected.length>0};
        }
        wrongSet=new Set((Array.isArray(s.wrong)?s.wrong:[]).filter(n=>byNo.has(n)));
        mode=s.mode==='wrong'?'wrong':'all';
        pool=mode==='wrong'?[...new Set((Array.isArray(s.pool)?s.pool:[]).filter(n=>byNo.has(n)&&wrongSet.has(n)))]:questions.map(q=>q.no);
        if(mode==='wrong'&&!pool.length)pool=[...wrongSet];
        idx=Math.max(0,pool.indexOf(s.currentNo));
    }catch(e){el('storageStatus').textContent='原保存记录无法读取，本次从头开始。';}
}
function questionPoints(item){return item.type==='multi'?1:0.5;}
function scoreSummary(){
 let score=0,max=0,answered=0,count=0;
 for(const item of questions){
  if(!item.ans)continue;
  const points=questionPoints(item);max+=points;count++;
  const record=records[item.no];if(!record?.submitted)continue;
  answered++;
  if(normalized(record.selected)===normalized(item.ans.split('')))score+=points;
 }
 return {score,max,answered,count};
}
function render(){
    const summary=scoreSummary();
    el('score').textContent=summary.score;el('scoreMax').textContent=summary.max;
    el('gradedCount').textContent=summary.answered;el('gradableCount').textContent=summary.count;
    const item=current();
    let right=0,wrong=0;
    for(const q of questions){const r=records[q.no];if(r?.submitted){normalized(r.selected)===normalized(q.ans.split(''))?right++:wrong++;}}
    el('r').textContent=right;el('w').textContent=wrong;
    el('cur').textContent=pool.length?idx+1:0;el('total').textContent=pool.length;
    el('wrongBtn').textContent='刷错题（'+wrongSet.size+'）';
    el('allBtn').disabled=mode==='all';el('wrongBtn').disabled=mode==='wrong';
    el('modeHint').textContent=(mode==='wrong'?'错题练习':'全部题目')+' · 已判分 '+(right+wrong)+' / '+questions.length+' 题。错题答对仍保留，可手动移出。跳转填写原题号。';
    el('prevBtn').disabled=!pool.length||idx===0;el('nextBtn').disabled=!pool.length||idx===pool.length-1;
    el('removeBtn').disabled=!item||!wrongSet.has(item.no);
    el('optBox').replaceChildren();el('questionScans').replaceChildren();el('ansDiv').style.display='none';
    el('submitBtn').hidden=!item||item.type!=='multi';
    if(!item){el('q').textContent='错题本为空，继续做题后，答错的题会自动加入。';el('answerHint').textContent='点击“全部题目”继续练习。';return;}
    const r=records[item.no]||{selected:[],submitted:false};
    for(const [i,src] of item.questionImages.entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题原题及选项，第'+(i+1)+'部分';img.tabIndex=0;img.onclick=()=>openScan(src);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openScan(src)};el('questionScans').append(img);}
    el('q').textContent='【'+item.no+' · '+({judge:'判断题',single:'单选题',multi:'多选题'}[item.type])+'】'+item.q;
    el('answerHint').textContent=item.type!=='multi'?'选择后立即判断对错并显示解析。':'选好后点击“提交答案”，才会判断对错并显示解析。';
    el('submitBtn').disabled=r.submitted||!r.selected.length;
    for(const o of item.opt){
        const val=o[0],label=document.createElement('label'),input=document.createElement('input');
        label.className='opt';input.type=item.type==='multi'?'checkbox':'radio';input.name='answer';input.value=val;input.checked=r.selected.includes(val);
        if(input.checked)label.classList.add('selected');
        if(r.submitted&&item.ans.includes(val))label.classList.add('correct');
        if(r.submitted&&input.checked&&!item.ans.includes(val))label.classList.add('incorrect');
        input.addEventListener('change',save);label.append(input,document.createTextNode(o));el('optBox').append(label);
    }
    if(r.submitted){
        const ok=normalized(r.selected)===normalized(item.ans.split(''));
        el('ansDiv').style.display='block';el('result').textContent=ok?'✅ 回答正确':'❌ 回答错误';el('result').style.color=ok?'#18733b':'#c23232';
        el('stdAns').textContent=item.opt.filter(o=>item.ans.includes(o[0])).join('；');el('analysisTxt').textContent=item.analysis;
        const box=el('figureBox');box.replaceChildren();
        for(const [i,src] of (item.figures||[]).entries()){const img=document.createElement('img');img.src=src;img.alt='第'+item.no+'题解析补充图 '+(i+1);img.loading='lazy';img.tabIndex=0;img.onclick=()=>openScan(src);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openScan(src)};box.append(img);}
    }
}
function save(){
    const item=current();if(!item)return;
    records[item.no]={selected:Array.from(el('optBox').querySelectorAll('input:checked'),n=>n.value),submitted:false};
    if(item.type!=='multi')submitAnswer();else{persist();render();}
}
function submitAnswer(){
    const item=current(),r=item&&records[item.no];if(!r?.selected.length)return;
    r.submitted=true;
    if(normalized(r.selected)!==normalized(item.ans.split('')))wrongSet.add(item.no);
    persist();render();
}
function prev(){if(idx>0){idx--;persist();render();}}
function next(){if(idx<pool.length-1){idx++;persist();render();}}
function clearSel(){const item=current();if(!item)return;records[item.no]={selected:[],submitted:false};persist();render();}
function goJump(){
    const n=Number(el('goto').value),pos=pool.indexOf(n);
    if(pos<0){el('answerHint').textContent=mode==='wrong'?'请填写当前错题本中的原题号。':'请输入 1 至 '+questions.length+' 的整数题号。';return;}
    idx=pos;persist();render();
}
function setMode(value){
    const no=current()?.no;mode=value;pool=mode==='wrong'?questions.filter(q=>wrongSet.has(q.no)).map(q=>q.no):questions.map(q=>q.no);
    idx=Math.max(0,pool.indexOf(no));persist();render();
}
function removeWrong(){
    const item=current();if(!item)return;wrongSet.delete(item.no);
    if(mode==='wrong'){pool=pool.filter(n=>n!==item.no);idx=Math.max(0,Math.min(idx,pool.length-1));}
    persist();render();
}
el('goto').addEventListener('keydown',e=>{if(e.key==='Enter')goJump();});

function openScan(src){el('scanLarge').src=src;el('scanDialog').showModal();}
function progressSnapshot(){return {version:2,currentNo:pool[idx]??null,mode,pool:[...pool],records:JSON.parse(JSON.stringify(records)),wrong:[...wrongSet]};}
function backupPayload(){return {format:'guide-exam-progress',backupVersion:1,examId:STORAGE_KEY,exportedAt:new Date().toISOString(),questionCount:questions.length,state:progressSnapshot()};}
function validateBackup(data){
    if(!data||data.format!=='guide-exam-progress'||data.backupVersion!==1)throw new Error('这不是支持的刷题进度文件。');
    if(data.examId!==STORAGE_KEY||data.questionCount!==questions.length)throw new Error('这份进度不属于当前题库，请在对应题库中导入。');
    const s=data.state;
    if(!s||s.version!==2||!['all','wrong'].includes(s.mode)||!s.records||typeof s.records!=='object'||Array.isArray(s.records)||!Array.isArray(s.pool)||!Array.isArray(s.wrong))throw new Error('进度文件内容不完整或已损坏。');
    const validNumbers=a=>a.every(n=>Number.isInteger(n)&&byNo.has(n))&&new Set(a).size===a.length;
    if(!validNumbers(s.pool)||!validNumbers(s.wrong))throw new Error('进度文件包含无效题号。');
    if(s.mode==='all'&&(s.pool.length!==questions.length||s.pool.some((n,i)=>n!==questions[i].no)))throw new Error('全部题目的顺序不正确。');
    if(s.mode==='wrong'&&s.pool.some(n=>!s.wrong.includes(n)))throw new Error('错题列表不一致。');
    if(s.pool.length?!s.pool.includes(s.currentNo):s.currentNo!==null)throw new Error('当前题号无效。');
    for(const [no,r] of Object.entries(s.records)){
        const q=byNo.get(Number(no));
        if(!q||String(q.no)!==no||!r||!Array.isArray(r.selected)||typeof r.submitted!=='boolean'||r.selected.some(v=>typeof v!=='string'||!q.opt.some(o=>o[0]===v))||new Set(r.selected).size!==r.selected.length||(q.type!=='multi'&&r.selected.length>1)||(r.submitted&&!r.selected.length))throw new Error('作答记录格式不正确。');
    }
    return JSON.parse(JSON.stringify(s));
}
function exportProgress(){
    try{
        const payload=backupPayload(),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download="LDD押题第6卷科一科二-做题进度-"+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        el('transferStatus').textContent='已请求下载进度文件。苹果手机请查看 Safari 下载列表或“文件”中的下载项，再把 JSON 文件传到另一设备。';
    }catch(e){el('transferStatus').textContent='导出失败：'+e.message;}
}
function applyBackup(data){
    const s=validateBackup(data);
    // Write successfully before changing the current session, so a storage failure preserves it.
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    records={};wrongSet=new Set();idx=0;mode='all';pool=questions.map(q=>q.no);restore();render();
}
async function importProgressFile(event){
    const input=event.target,file=input.files?.[0];if(!file)return;
    try{
        if(file.size>5*1024*1024)throw new Error('文件过大，请选择导出的 JSON 进度文件，不要选择 HTML 题库。');
        const data=JSON.parse((await file.text()).replace(/^\uFEFF/,'')),s=validateBackup(data);
        const answered=Object.values(s.records).filter(r=>r.submitted).length;
        if(!confirm('即将导入：已判分 '+answered+' 题，错题 '+s.wrong.length+' 题。\n这会替换本设备当前题库的进度。建议先导出当前进度备份。\n确定导入吗？')){el('transferStatus').textContent='已取消导入，原进度保留。';return;}
        applyBackup(data);el('transferStatus').textContent='导入成功！已恢复作答、错题及所在题目，后续会继续自动保存到本设备。';
    }catch(e){el('transferStatus').textContent='导入失败，原进度保留：'+e.message;}
    finally{input.value='';}
}
el('progressFile').addEventListener('change',importProgressFile);

restore();render();
</script>
<dialog id="scanDialog" aria-label="原图放大阅读"><button onclick="el('scanDialog').close()">关闭放大图</button><p class="hint">左右滑动查看完整原图，也可使用浏览器缩放。</p><div class="scan-scroll"><img id="scanLarge" alt="放大的原卷图片"></div></dialog>
</body>
